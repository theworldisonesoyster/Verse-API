<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse API Reference</title>
<style>
:root{--bg:#1c1c1c;--panel:#212121;--panel2:#282828;--fg:#e2e2e2;--dim:#96989e;--acc:#3d3d3d;--acc2:#c9c9c9;--line:#3a3a3a;
--s:#ef4444;--a:#f97316;--b:#eab308;--c:#ffffff}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;font:15px/1.65 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#app{display:grid;grid-template-columns:330px minmax(0,1fr);height:100vh}
#side,#main{min-height:0}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#side header{padding:14px 14px 10px}
#side h1{font-size:15px;margin:0 0 10px}
#search{width:100%;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;outline:none}
#grades{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gbtn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);width:34px;height:34px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;user-select:none}
.gbtn.on{background:var(--acc);border-color:#8a8a8a;color:#fff}
#tree{flex:1 1 0;min-height:0;overflow:auto;overflow-x:hidden;padding:8px 6px 30px}
#tree ul{list-style:none;margin:0;padding-left:14px}
#tree>ul{padding-left:6px}
#tree li{margin:1px 0}
#tree li.d>span.t{font-weight:600;cursor:pointer;display:block;padding:3px 8px;border-radius:6px}
#tree li.d>span.t::before{content:"▾ ";color:var(--dim)}
#tree li.d.closed>span.t::before{content:"▸ "}
#tree li.d.closed>ul{display:none}
#tree li.d>span.t:hover{background:var(--panel2)}
#tree a{color:var(--fg);text-decoration:none;display:block;padding:3px 8px;border-radius:6px;cursor:pointer}
#tree a:hover{background:var(--panel2)}
#tree a.cur{background:#3d3d3d;color:#fff}
#tree a .g{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
#tree a .g.gS{background:var(--s)}#tree a .g.gA{background:var(--a)}#tree a .g.gB{background:var(--b)}#tree a .g.gC{background:var(--c)}
.pend{color:var(--dim);font-size:11px;margin-left:5px}
#main{overflow:auto;position:relative;min-height:0}
#content{max-width:900px;margin:0 auto;padding:34px 40px 90px}
#content h1{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:10px}
#content h2{font-size:20px;margin-top:34px}
#content code{background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:13px;font-family:Consolas,monospace}
#content pre{background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:10px;overflow:auto}
#content pre code{border:none;background:none;padding:0;font-size:13.5px;line-height:1.55}
#content blockquote{margin:0;padding:6px 14px;border-left:3px solid var(--acc);color:var(--dim);background:var(--panel2);border-radius:0 8px 8px 0}
#content table{border-collapse:collapse;margin:14px 0;width:100%}
#content th,#content td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:14px}
#content th{background:#3d3d3d;color:#f0f0f0;border-color:var(--line)}
#content a{color:var(--acc2);text-decoration:none}
#content a:hover{text-decoration:underline}
#nav{position:fixed;bottom:0;left:330px;right:0;display:flex;justify-content:space-between;padding:10px 40px;background:linear-gradient(transparent,var(--bg) 40%)}
#nav a{color:var(--acc2);cursor:pointer;background:var(--panel2);border:1px solid var(--line);padding:6px 14px;border-radius:8px}
.gbadge{display:inline-block;padding:0 9px;border-radius:12px;font-size:13px;line-height:20px;color:#fff;vertical-align:3px;margin-left:4px}
.gbadge.gS{background:var(--s)}.gbadge.gA{background:var(--a)}.gbadge.gB{background:var(--b);color:#1b1b1b}.gbadge.gC{background:var(--c);color:#1b1b1b}
.pending-box{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--dim);margin:20px 0;text-align:center}
@media(max-width:900px){#app{grid-template-columns:1fr}#side{display:none}#nav{left:0}}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header><h1>Verse API Reference</h1><input id="search" placeholder="搜索 API 名称…"></header>
    <div id="grades"></div>
    <nav id="tree"></nav>
  </div>
  <div id="main"><article id="content"></article></div>
</div>

<script id="md-data" type="application/json">{"Intro.md": "# Verse API Reference\n\n基于 [Epic 官方 Verse API Reference](https://dev.epicgames.com/documentation/fortnite/verse-api) 生成（快照版本：API 42.10）。\n", "00_语言基础/_overview.md": "---\nname: 语言基础（补充）\nslug: (补充)语言基础\nurl: \nkind: module\nmodule: /语言基础\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# 语言基础\n\n> 官网 API Reference 只收录模块/类/函数，**语言内建类型与表达式没有独立页面**（array、map、option、failure 机制等都散在语言文档里）。为补齐学习链路，本章以\"补充\"形式撰写，页首一律标注，与官网镜像内容明确区分。\n\n## 页面一览\n\n| 页面 | 一句话 | 级别 |\n|---|---|---|\n| [array——数组](array.md) | 有序集合 `T[]`，索引可失败 | 🟦 S |\n| [map——映射](map.md) | 键值集合 `[K]V`，weak_map 全局变量 | 🟦 S |\n| [option——可选值](option.md) | 可能没有值：`?T`、空值写作 `false` | 🟦 S |\n| [可失败表达式与failure](failure.md) | Verse 的核心错误处理哲学 | 🟦 S |\n| [string——字符串](string.md) | 插值 `{}`、Join、与 []char 转换 | 🟩 A |\n| [数值类型 int/float/rational](int.md) | 整除可失败、rational 防浮点误差 | 🟩 A |\n| [logic与void](logic_void.md) | 真/假值与无返回 | 🟨 B |\n| [元组与子类型](tuple_subtype.md) | 打包多值、where 约束 | 🟨 B |\n\n## 相关页面\n\n- [Verse.org 总览](../01_Verse.org/_overview.md)\n- [Intro 首页](../Intro.md)\n", "00_语言基础/int.md": "---\nname: 数值类型 int/float/rational\nslug: (补充)语言基础.int\nurl:\nkind: class\nmodule: /语言基础\ngrade: A\ndepth: brief\nstatus: done\n---\n\n# 数值类型 int / float / rational <A>\n\n> Verse 的三种数值类型；属于 Verse 语言内建。\n\n## 这是什么\n\n| 类型 | 写法 | 用途 | 注意 |\n|---|---|---|---|\n| `int` | `42` | 计数、索引、分数 | 除法 `/` 是**可失败**的整除（除数为 0 失败）；取模用 `Mod` |\n| `float` | `3.14`、`1.0e-3` | 时间、坐标、比例 | 与 int 不隐式互转；`Int[]`/`Float[]` 显式转换且可失败 |\n| `rational` | `Rational(1, 3)` | 精确分数（音频/节拍场景） | 避免浮点误差，音乐类玩法可用 |\n\n## 最小示例\n\n```verse\nHalf := 1.0 / 2.0              # 0.5\nQ := Quotient(7, 2)            # 3（整数商）\nR := Mod(7, 2)                 # 1（余数）\nF := Float[3] or 0.0           # int→float 可失败转换 + 兜底\n```\n\n## 常见坑\n\n- `7 / 2` 是整数除法（=3）；想得 3.5 要写 `7.0 / 2.0`。\n- float 精度有限，节拍累加建议用 rational 或\"目标时刻 + GetSimulationElapsedTime\"比较。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n- [Verse 数学函数族](../01_Verse.org/010_Verse/_overview.md)\n", "00_语言基础/map.md": "---\nname: map——映射\nslug: (补充)语言基础.map\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\n---\n\n# map——映射 <S>\n\n> 映射是\"键 → 值\"的内建关联容器，属于 Verse 语言内建。\n> 类型写作 `[K]V`（如 `[string]int`），字面量写作 `map{\"a\" => 1, \"b\" => 2}`。\n\n## 这是什么\n\n映射按**键**存取值，就像字典。三个要点：\n\n1. **取值可失败**：`M[K]` 在键不存在时失败，必须放在失败上下文里。\n2. **不可变**：和数组一样，\"修改\"是生成新映射再 `set` 回去；`ConcatenateMaps` 可合并。\n3. **键需可比较**：常用 int/string/player 等作键；配合 `weak_map` 可以用对象当键（见 session 页的全局变量模式）。\n\n## 最小示例\n\n```verse\nScores:[string]int = map{\"Anna\" => 3, \"Ben\" => 7}\n\nAddPoint(Name:string):void =\n    Old := Scores[Name] or 0                     # 不存在则 0\n    if (set Scores = ConcatenateMaps(Scores, map{Name => Old + 1})) {}\n    # 单键更新也可以直接: if (set Scores[Name] = Old + 1) {}\n\nLookup(Name:string):string =\n    \"{Name} 的分数: {Scores[Name] or 0}\"\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `M[K]` | 取键对应的值 | 缺键失败 |\n| `M[K] = V` | （在 `set` 中）设置/更新键 | — |\n| `ConcatenateMaps(A, B)` | 合并两个映射（B 优先） | 否 |\n| `for (K -> V : M)` | 遍历键值对 | — |\n| `weak_map[K, V]` | 键为\"弱引用对象\"的映射（可存 player/session 等） | — |\n\n## 何时用 / 何时不用\n\n- 用：按 ID/名字/玩家查数据——记分板、配置表、`weak_map[player]` 状态。\n- 不用：只需顺序遍历的集合用数组；需要\"每回合清空的全局表\"配 session 用。\n\n## 常见坑\n\n- `set M[K] = V` 对不存在的键是**新增**还是失败取决于写法——统一用 `or 默认值` 先读后写的模式最稳。\n- 遍历顺序不保证与你插入的顺序一致。\n\n## 相关页面\n\n- [array——数组](array.md)\n- [session](../01_Verse.org/100_Simulation/session.md) —— weak_map 全局变量标准用法\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/logic_void.md": "---\nname: logic与void\nslug: (补充)语言基础.logic_void\nurl:\nkind: class\nmodule: /语言基础\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# logic 与 void <B>\n\n> 两个基础类型：logic 是\"真/假\"，void 是\"无返回值\"；官网 API Reference 无单设页面。\n\n## 这是什么\n\n- `logic`：只有 `true` / `false`。注意它**与失败上下文不同**——`logic` 是值，失败是\"路不通\"。API 里很多状态查询返回 logic（如 `IsCrouching()`），而\"可失败查询\"（`IsCrouching[]`）走失败分支，两者别混。\n- `void`：函数不返回值时的返回类型，如 `Sleep(1.0):void`。\n\n## 最小示例\n\n```verse\nIsReady:logic = true\nif (IsReady?):      # logic 可用 ? 转为可失败判断\n    Print(\"ready\")\n```\n\n## 常见坑\n\n- `logic` 参与失败上下文要写 `If?`；直接 `if (IsReady)` 不合法。\n- \"返回 logic 的函数\"与\"`<decides>` 可失败函数\"在 API 页签名一眼可辨：后者带 `<decides>`。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/tuple_subtype.md": "---\nname: 元组与子类型\nslug: (补充)语言基础.tuple_subtype\nurl:\nkind: class\nmodule: /语言基础\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# 元组与子类型 <B>\n\n> 元组把几个值打包成一个；子类型 `subtype` 描述\"某类型的子集\"。官网 API Reference 无单设页面。\n\n## 这是什么\n\n- **元组**：`(A, B)` 类型写作 `tuple(A, B)`，事件载荷常见（如 fort_character 的蹲起事件回传 `(角色, 是否蹲)`）。\n- **子类型**：`where` 子句约束类型参数，如 `t:comparable` 表示\"任何可比较类型\"——这是泛型 API（Min/Max、event(t)）的基础。\n\n## 最小示例\n\n```verse\nPair := (1, \"one\")                  # tuple(int, string)\nN:int = Pair(0)                     # 按位置取分量\nM := event(tuple(agent, logic))     # 元组作事件载荷\n```\n\n## 常见坑\n\n- 元组按位置而非名字取值，分量多时可读性骤降——三个以上考虑 class。\n\n## 相关页面\n\n- [event(t)](../01_Verse.org/010_Verse/event_t_.md)\n", "00_语言基础/failure.md": "---\nname: 可失败表达式与failure\nslug: (补充)语言基础.failure\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\n---\n\n# 可失败表达式与 failure <S>\n\n> Verse 用\"失败\"代替\"异常/空指针\"：任何操作都可能成功或失败，失败不崩溃，只是\"这条路不通\"。\n> 官网各 API 页签名中的 `<decides>` 即为此机制。\n\n## 这是什么\n\n这是 Verse 最独特、最重要的机制。带 `<decides>` 效果的函数/运算符是\"可失败\"的：调用它**必须**处在\"失败上下文\"里。失败上下文里的表达式从上到下尝试，**任何一个失败，整块代码跳过**（不是报错），程序继续走后面的路。\n\n常见的失败上下文写法：\n\n| 写法 | 说明 |\n|---|---|\n| `if (Expr)` | 表达式成功 → 执行块内代码；失败 → else/跳过 |\n| `for (X : Arr)` | 遍历也算失败上下文 |\n| `F[]` | 用 `[]` 调用可失败函数（无参 failable） |\n| `A and B`, `not A` | 逻辑组合，短路求值 |\n| `X := Expr` | 定义语句本身可失败（Expr 失败则不定义） |\n\n## 最小示例\n\n```verse\nScore(Name:string):void =\n    if:\n        P := Players[Name]        # 1. 查到玩家才继续\n        S := Scores[P]            # 2. 有分数才继续（任意一步失败 → 整块跳过）\n        S > 10                    # 3. 条件判断也是可失败表达式\n    then:\n        Print(\"{Name} 是高手\")\n\n# 多个初始化挤一行也行：\nif (A := Arr[0], B := Map[A] or 0, B > 0) { Print(\"ok\") }\n```\n\n## 与\"错误处理\"的思维差异\n\n- 传统语言：先写快乐路径，再 try/catch 兜底。\n- Verse：把\"可能失败\"写进类型里（`<decides>`），调用方**被迫**处理失败——要么分支，要么 `or 默认值`，要么继续往上失败。编译器保证你漏不掉。\n\n## 常用模式\n\n| 模式 | 写法 |\n|---|---|\n| 取值兜底 | `V := M[K] or 默认` |\n| agent 转 player | `if (P := player[Agent]) {…}` |\n| 链式安全取值 | `if (C := Obj.GetComponent[], P := C.Position[]) {…}` |\n| 断言已知安全 | 确定不会失败时可用 `X:calc` 上下文断言（慎用，失败会中断程序） |\n\n## 何时用 / 何时不用\n\n- 用：一切可能不成立的读取/查询/比较。\n- 不用：不要为了\"绕开失败\"而把逻辑写成嵌套 if 泥球——善用 `or 默认值` 与提前返回。\n\n## 常见坑\n\n- 可失败函数用 `()` 调用会编译错误，无参 failable 必须写 `[]`（如 `GetTeam[]`）。\n- 失败上下文里 `set` 变量后若整块失败，**回滚**该块内的修改（事务性）——这正是 `<decides>` 的设计，注意副作用函数别放进失败块。\n\n## 相关页面\n\n- [option——可选值](option.md)\n- [array——数组](array.md)\n- [operator'=](../01_Verse.org/010_Verse/operatorequals.md) —— 最常见的可失败运算符\n", "00_语言基础/string.md": "---\nname: string——字符串\nslug: (补充)语言基础.string\nurl:\nkind: class\nmodule: /语言基础\ngrade: A\ndepth: full\nstatus: done\n---\n\n# string——字符串 <A>\n\n> 字符串是 UTF-8 文本的内建类型；属于 Verse 语言内建。\n\n## 这是什么\n\n双引号字面量 `\"...\"` 即字符串。要点：\n\n- **插值**：`\"分数: {Score}\"` 花括号内嵌任意表达式，是最常用输出手段。\n- **连接**：`A + B` 拼接；重复拼接考虑 `Join`。\n- 与 `[]char`（字符数组）互转：`ToUtf8[]`/`FromUtf8[]` 是可失败转换（官方 Print 的参数类型就是 `[]char`）。\n\n## 最小示例\n\n```verse\nName:string = \"世界\"\nMsg := \"你好, {Name}! {1 + 2}\"      # 你好, 世界! 3\nJoined := Join(array{\"a\", \"b\", \"c\"}, \"-\")   # a-b-c（Join 在 /Verse.org/Verse）\n```\n\n## 何时用 / 何时不用\n\n- 用：日志、UI 文案（正式 UI 文案用 [message](../01_Verse.org/010_Verse/message.md) 做本地化）。\n- 不用：大量拼接/高频修改的文本——每次拼接都生成新串。\n\n## 常见坑\n\n- 插值只认 `{表达式}`；想输出字面花括号需转义写法。\n- 中文等多字节字符按\"字符\"而非\"字节\"处理时，注意与 `[]char` 转换的可失败性。\n\n## 相关页面\n\n- [Print](../01_Verse.org/010_Verse/print.md)\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/array.md": "---\nname: array——数组\nslug: (补充)语言基础.array\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\n---\n\n# array——数组 <S>\n\n> 数组是 Verse 内建的有序集合类型，属于 Verse 语言内建。\n> 类型写作 `T[]`（如 `int[]`），字面量写作 `array{1, 2, 3}`。\n\n## 这是什么\n\n数组存放一组**同类型、有序**的值。三个要点：\n\n1. **不可变长度**：Verse 数组创建后长度固定，没有 `Add`/`Remove`；\"增删\"靠生成新数组（`Arr + array{X}`、`Arr.RemoveLast[]` 等可失败操作）。\n2. **索引可失败**：`Arr[I]` 在 I 越界时**失败**而不是崩溃——必须放在失败上下文里用。\n3. **值类型拷贝语义**：赋值/传参是拷贝，修改副本不影响原数组。\n\n## 最小示例\n\n```verse\nArr:int[] := array{10, 20, 30}          # 定义\nFirst:int = Arr[0]                      # 已知不越界时可这样断言\nfor (I := 0..Arr.Length - 1, V := Arr[I]):   # 安全遍历（带索引）\n    Print(\"{I} = {V}\")\nfor (V : Arr):                          # 不需要索引时更简洁\n    Print(\"{V}\")\nBigger:int[] = Arr + array{40}          # 新数组 = 旧 + 追加\nMaybe := Arr[5] or -1                   # 越界兜底：失败时给默认值\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `Arr[I]` | 取第 I 个元素（0 起） | 越界则失败 |\n| `Arr.Length` | 元素个数 | 否 |\n| `A + B` | 两个数组连接成新数组 | 否 |\n| `Arr.RemoveLast[]` | 去掉末尾元素的新数组（failable，`[]` 调用） | 空数组失败 |\n| `for (V : Arr)` | 遍历 | — |\n\n## 何时用 / 何时不用\n\n- 用：固定一批同类对象（所有玩家、所有生成点、一串节拍时间）。\n- 不用：需要频繁增删的动态集合——考虑 `map` 或重新设计为\"每帧重建数组\"。\n\n## 常见坑\n\n- **越界是失败不是错误**：`Arr[Arr.Length]` 永远失败，配合 `or 默认值` 或 `if` 处理。\n- 数组没有\"原地修改\"，`set Arr += array{X}` 实际是整体替换变量。\n- `Arr[0]` 在失败上下文之外会编译报错，别图省事裸写。\n\n## 相关页面\n\n- [map——映射](map.md)\n- [可失败表达式与failure](failure.md)\n- [option——可选值](option.md)\n", "00_语言基础/option.md": "---\nname: option——可选值\nslug: (补充)语言基础.option\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\n---\n\n# option——可选值 <S>\n\n> option 表示\"可能有一个值，也可能没有\"，属于 Verse 语言内建。\n> 类型写作 `?T`（如 `?int`），有值字面量 `option{7}`，空值 `false`。\n\n## 这是什么\n\n`?T` 解决\"这个值可能不存在\"的问题——比返回 -1 之类的哨兵值干净得多。它和失败上下文深度绑定：**取出 option 里的值本身就是一个可失败操作**（`Opt?`），于是\"有值就继续、没值就走别路\"成了一行代码。\n\n## 最小示例\n\n```verse\nvar Nickname:?string = option{\"Alice\"}\nset Nickname = false            # 清空\n\nShow():void =\n    if (Name := Nickname?):     # 有值 → Name 是 string；无值 → 走 else\n        Print(\"昵称 {Name}\")\n    else:\n        Print(\"没有昵称\")\n\nDefault():string =\n    Nickname? or \"无名氏\"        # 取值失败给默认\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `Opt?` | 取出值 | 空则失败 |\n| `Opt? or 默认` | 取值失败用默认 | 否 |\n| `option{V}` / `false` | 构造有值/空 | — |\n| `Opt = 值判断` | `if (Opt = option{7})` 比较 | 可失败 |\n\n## 何时用 / 何时不用\n\n- 用：查询可能无结果（map 里没有、玩家没设置昵称）；API 返回\"可能空\"的字段。\n- 不用：值一定存在时别用 option，多一层失败上下文徒增噪音。\n\n## 常见坑\n\n- `?T` 的空值写作 `false`，不是 `null`/`none`——第一次见非常反直觉，记住即可。\n- `Opt?` 之后变量类型是 `T`（脱掉了 `?`），可以直接当普通值用。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n- [array——数组](array.md)\n", "01_Verse.org/_overview.md": "---\nname: Verse.org\nslug: versedotorg\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg\nkind: module\nmodule: /Verse.org\ngrade: S\ndepth: brief\nstatus: placeholder\n---\n\n# Verse.org <S>\n\n<!-- 待生成 -->\n", "01_Verse.org/010_Verse/_overview.md": "---\nname: Verse module\nslug: versedotorg/verse\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse\nkind: module\nmodule: /versedotorg\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Verse module <B>\n\nVerse 语言核心模块：运算符、数学函数、字符串/诊断/结果类型、事件接口与时间函数。\n\n## Classes and Structs\n\n| Name | Description |\n|---|---|\n| [diagnostic](diagnostic.md) | 不透明的诊断消息，只出现在诊断日志中。其格式可能随时变化且无法被 Verse 代码检查。 |\n| [locale](locale.md) | 用于 message 本地化的区域设置。 |\n| [message](message.md) | 可本地化的文本消息。 |\n\n## Interfaces\n\n| Name | Description |\n|---|---|\n| [cancelable](cancelable.md) | 由可取消操作实现：持有它即可取消对应的进行中操作。 |\n| [disposable](disposable.md) | 由实例生命周期有限（可释放）的类实现。 |\n| [enableable](enableable.md) | 由实例可被启用/禁用的类实现。 |\n| [invalidatable](invalidatable.md) | 由实例可能随时失效的类实现。 |\n| [showable](showable.md) | 由实例可改变可见性的类实现。 |\n\n## Functions\n\n| Name | Description |\n|---|---|\n| [Print](print.md) | 把 Message 写入专用 Print 日志，并在客户端屏幕以 Color 显示 Duration 秒。 |\n| [Print](print-1.md) | Print 的 message（可本地化文本）重载。 |\n| [Print](print-2.md) | Print 的 diagnostic（诊断）重载。 |\n| [event](event.md) | 参数化构造：按载荷类型 t 创建可重复触发的事件。 |\n| [event](event-1.md) | event 的无载荷构造重载。 |\n| [listenable](listenable.md) | 参数化接口构造：组合 awaitable 与 subscribable（持续订阅广播）。 |\n| [listenable](listenable-1.md) | listenable 的无参数构造重载。 |\n| [operator'='](operatorequals.md) | 可失败的相等比较：相等则成功并返回左值。 |\n| [result](result.md) | 由「可为成功或失败的操作」的结果类实现。 |\n| [MakeSuccess](makesuccess.md) | 构造一个表示成功的 result 实例。 |\n| [MakeError](makeerror.md) | 构造一个携带错误信息的失败 result 实例。 |\n| [ToDiagnostic](todiagnostic.md) | 把任意 Verse 值转换成不透明的诊断消息。 |\n| [Err](err.md) | 以错误消息 Message 立即中止 Verse 运行时。 |\n| [signalable](signalable.md) | 带载荷、可被触发（signal）的事件实现的参数化接口。 |\n| [subscribable](subscribable.md) | 带载荷、可被订阅（Subscribe 持续接收）的事件实现的参数化接口。 |\n| [subscribable](subscribable-1.md) | 无载荷、可被订阅的事件实现的参数化接口。 |\n| [Localize](localize.md) | 按当前区域设置本地化 Message，生成字符串。 |\n| [Concatenate](concatenate.md) | 把嵌套数组压平：按顺序连接 Arr 里每个子数组的元素，返回一个新数组。 |\n| [Join](join.md) | 用 Separator 把 Element 数组拼接成一个 message（可本地化文本）。 |\n| [Join](join-1.md) | 用 Separator 把 Element 数组拼接成一个字符串。 |\n| [ConcatenateMaps](concatenatemaps.md) | 合并两个映射（M2 同键覆盖 M1）。 |\n| [GetSecondsSinceEpoch](getsecondssinceepoch.md) | 返回自 1970 年 1 月 1 日 UTC 起的秒数（Unix 时间戳），忽略闰秒。 |\n| [Abs](abs.md) | 返回 Value 的绝对值（int 版本）。 |\n| [Abs](abs-1.md) | 返回 Value 的绝对值（float 版本）。 |\n| [Ceil](ceil.md) | 返回大于等于 Val 的最小 int（向上取整，rational 输入版本）。 |\n| [Ceil](ceil-1.md) | 返回大于等于 Val 的最小 int（向上取整，float 输入版本）。非有限值时失败。 |\n| [Floor](floor.md) | 返回小于等于 Val 的最大 int（向下取整，rational 输入版本）。 |\n| [Floor](floor-1.md) | 返回小于等于 Val 的最大 int（向下取整，float 输入版本）。非有限值时失败。 |\n| [Round](round.md) | 返回 Val 四舍五入到最近整数的 int；小数部分恰为 0.5 时取最近的偶数（IEEE-754 默认舍入）。非有限值时失败。 |\n| [Int](int.md) | 返回等于 Val 去掉小数部分的 int（向零取整）。 |\n| [Clamp](clamp.md) | 把 Val 限制在 A 与 B 之间（int 版本；健壮处理 A、B 顺序）。 |\n| [Clamp](clamp-1.md) | 把 Val 限制在 A 与 B 之间（float 版本；健壮处理 A、B 顺序）。 |\n| [Min](min.md) | 返回 X 和 Y 中的较小值（int 版本）。 |\n| [Min](min-1.md) | 返回 X 和 Y 中的较小值；任一为 NaN 时返回 NaN（float 版本）。 |\n| [Max](max.md) | 返回 X 和 Y 中的较大值（int 版本）。 |\n| [Max](max-1.md) | 返回 X 和 Y 中的较大值；任一为 NaN 时返回 NaN（float 版本）。 |\n| [ToString](tostring.md) | 把 Val（float）转成字符串表示。 |\n| [ToString](tostring-1.md) | 把 Val（char）转成可打印的字符串表示。 |\n| [ToString](tostring-2.md) | 把 String 原样返回（string 的 ToString 重载）。 |\n| [ToString](tostring-3.md) | 把单个 Character（char）转成字符串。 |\n| [operator'?'](operatorquestionmark.md) | logic 查询：Value 为 true 则成功，为 false 则失败——logic 接入失败上下文的标准写法。 |\n| [operator'?'](operatorquestionmark-1.md) | option 取值：Value 有值则成功并返回该值，为空则失败。 |\n| [operator'<>'](operatorlessgreater.md) | 不相等比较：Lhs 与 Rhs 不相等则成功，相等则失败。与 [operator'=](operatorequals.md) 语义相反。 |\n| [prefix'-'](prefixminus.md) | 整数取负（一元 -）。 |\n| [prefix'-'](prefixminus-1.md) | 浮点取负（一元 -）。 |\n| [operator'+'](operatorplus.md) | 整数加法。 |\n| [operator'+'](operatorplus-1.md) | 浮点加法。 |\n| [operator'+'](operatorplus-2.md) | 数组拼接：返回 Lhs 与 Rhs 元素顺序连接的新数组。 |\n| [operator'+'](operatorplus-3.md) | 集合并集：返回包含 InSetL 与 InSetR 全部元素的新集合。 |\n| [operator'+'](operatorplus-4.md) | 拼接两个诊断消息。 |\n| [operator'+'](operatorplus-5.md) | 诊断消息与普通字符串拼接，结果为诊断消息。 |\n| [operator'+'](operatorplus-6.md) | 普通字符串与诊断消息拼接，结果为诊断消息。 |\n| [operator'-'](operatorminus.md) | 整数减法。 |\n| [operator'-'](operatorminus-1.md) | 浮点减法。 |\n| [operator'*'](operatorstar.md) | 整数乘法。 |\n| [operator'*'](operatorstar-1.md) | 浮点乘法。 |\n| [operator'*'](operatorstar-2.md) | int 与 float 相乘，结果为 float。 |\n| [operator'*'](operatorstar-3.md) | float 与 int 相乘，结果为 float。 |\n| [operator'/'](operatorslash.md) | 整数除法：返回 rational；除数为 0 时失败。 |\n| [operator'/'](operatorslash-1.md) | 浮点除法（除数为 0 结果为 Inf/NaN，不失败）。 |\n| [operator'+='](operatorplusequals.md) | 整数累加：等价于 set Lhs = Lhs + Rhs。 |\n| [operator'+='](operatorplusequals-1.md) | 浮点累加。 |\n| [operator'+='](operatorplusequals-2.md) | 数组累加：把 Rhs 的元素追加进 Lhs 数组。 |\n| [operator'-='](operatorminusequals.md) | 整数累减。 |\n| [operator'-='](operatorminusequals-1.md) | 浮点累减。 |\n| [operator'*='](operatorstarequals.md) | 整数累乘。 |\n| [operator'*='](operatorstarequals-1.md) | 浮点累乘。 |\n| [operator'>'](operatorgreater.md) | 整数大于比较（可失败）。 |\n| [operator'>'](operatorgreater-1.md) | 浮点大于比较（可失败）。 |\n| [operator'>='](operatorgreaterequals.md) | 整数大于等于比较（可失败）。 |\n| [operator'>='](operatorgreaterequals-1.md) | 浮点大于等于比较（可失败）。 |\n| [operator'<'](operatorless.md) | 整数小于比较（可失败）。 |\n| [operator'<'](operatorless-1.md) | 浮点小于比较（可失败）。 |\n| [operator'<='](operatorlessequals.md) | 整数小于等于比较（可失败）。 |\n| [operator'<='](operatorlessequals-1.md) | 浮点小于等于比较（可失败）。 |\n| [operator'()'](operator.md) | 数组按索引取元素：越界则失败。 |\n| [operator'()'](operator_-1.md) | 数组按索引取元素重载（u 元素类型版本）。 |\n| [operator'()'](operator_-2.md) | 映射按键取值：键不存在则失败。 |\n| [operator'()'](operator_-3.md) | 映射按键取值重载。 |\n| [operator'()'](operator_-4.md) | 映射按键取值重载。 |\n| [weak_map](weak_map.md) | 构造「键为弱引用对象」的映射类型（如以 player/session 为键的全局状态表）。 |\n| [FitsInPlayerMap](fitsinplayermap.md) | 判断该类型是否能用作 player 映射的键（涉及持久化限制）。 |\n| [classifiable_subset](classifiable_subset.md) | 构造可分类子集容器。 |\n| [MakeClassifiableSubset](makeclassifiablesubset.md) | 构造包含 InElements 的 classifiable_subset。 |\n| [BitAnd](bitand.md) | 按位与。 |\n| [BitOr](bitor.md) | 按位或。 |\n| [BitXor](bitxor.md) | 按位异或。 |\n| [BitNot](bitnot.md) | 按位取反。 |\n| [Sqrt](sqrt.md) | 返回 X 的平方根；X < 0.0 时返回 NaN。 |\n| [Sin](sin.md) | 返回 X 的正弦（X 为弧度）。 |\n| [Cos](cos.md) | 返回 X 的余弦（X 为弧度）。 |\n| [Tan](tan.md) | 返回 X 的正切（X 为弧度）。 |\n| [ArcSin](arcsin.md) | 返回 X 的反正弦（弧度）。 |\n| [ArcCos](arccos.md) | 返回 X 的反余弦（弧度）。 |\n| [ArcTan](arctan.md) | 返回 X 的反正切（弧度）。 |\n| [ArcTan](arctan-1.md) | 返回原点到点 (X, Y) 连线与 X 轴的夹角（弧度）。 |\n| [Sinh](sinh.md) | 返回 X 的双曲正弦。 |\n| [Cosh](cosh.md) | 返回 X 的双曲余弦。 |\n| [Tanh](tanh.md) | 返回 X 的双曲正切。 |\n| [ArSinh](arsinh.md) | 返回 X 的反双曲正弦（X 有限时）。 |\n| [ArCosh](arcosh.md) | 返回 X 的反双曲余弦（X ≥ 1.0 时）。 |\n| [ArTanh](artanh.md) | 返回 X 的反双曲正切（X 有限时）。 |\n| [Pow](pow.md) | 返回 A 的 B 次幂。 |\n| [Quotient](quotient.md) | 返回欧几里得除法 X/Y 的商。 |\n| [Mod](mod.md) | 返回欧几里得除法 X/Y 的余数。 |\n| [Exp](exp.md) | 返回 e 的 X 次幂（自然指数）。 |\n| [Ln](ln.md) | 返回 X 的自然对数。 |\n| [Log](log.md) | 返回 X 的以 B 为底对数。 |\n| [Lerp](lerp.md) | 在 From（t=0）与 To（t=1）之间线性插值/外推。 |\n| [Sgn](sgn.md) | 返回 Val 的符号：正数 1、零 0、负数 -1（int 版本）。 |\n| [Sgn](sgn-1.md) | 返回 Val 的符号（float 版本）。 |\n| [IsAlmostEqual](isalmostequal.md) | 若 Val1 与 Val2 的差在 AbsoluteTolerance 内则成功（浮点比较专用）。 |\n\n## Data\n\n| Name | Description |\n|---|---|\n| [Inf](inf.md) | 浮点正无穷常量（IEEE 754 Inf）。 |\n| [NaN](nan.md) | 浮点非数常量（IEEE 754 NaN），表示无效的浮点运算结果。 |\n| [PiFloat](pifloat.md) | 浮点圆周率 π 常量。 |\n\n## Submodules\n\n| Name | Description |\n|---|---|\n| [Easing](010_Easing/_overview.md) | 缓动插值函数族（Linear/Ease/EaseIn/EaseOut/EaseInOut/CubicBezier）。 |\n", "01_Verse.org/010_Verse/classifiable_subset_element_type.md": "---\nname: classifiable_subset(element_type)\nslug: versedotorg/verse/classifiable_subset/classifiable_subset(element_type)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/classifiable_subset/classifiable_subset(element_type)\nkind: class\nmodule: /Verse.org/verse/classifiable_subset\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# classifiable_subset(element_type) class <C>\n\nclassifiable_subset 是容纳一组元素、可按标签层级评估分类的容器。\n", "01_Verse.org/010_Verse/diagnostic.md": "---\nname: diagnostic\nslug: versedotorg/verse/diagnostic\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/diagnostic\nkind: class\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# diagnostic class <B>\n\n> An opaque diagnostic message that only shows up in diagnostic logs. The format of the diagnostic may change at any time without warning and may not be inspected by Verse code.\n> 不透明的诊断消息，只出现在诊断日志中。其格式可能随时变化且无法被 Verse 代码检查。\n\n`using { /Verse.org/Verse }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/010_Verse/event_t.md": "---\nname: event(t)\nslug: versedotorg/verse/event/event(t)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event/event(t)\nkind: class\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# event(t) class <S>\n\n> A recurring, successively signaled parametric event with a payload allowing a simple mechanism to coordinate between concurrent tasks.\n> 可重复、按次序触发的参数化事件，带有载荷，为并发任务之间的协调提供简单机制。\n\n`using { /Verse.org/Verse }`\n\n## Exposed Interfaces\n\nThis class exposes the following interfaces:（此类暴露以下接口：）\n\n| Name | Description |\n|---|---|\n| signalable(payload) | 带载荷、可被触发（signal）的事件所实现的参数化接口。可与 awaitable、subscribable 配合使用（参见 listenable）。 |\n| awaitable(payload) | 带载荷、可被等待（await）的事件所实现的参数化接口。与 signalable 配对。 |\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| Await | 挂起当前任务，直到另一个任务调用 Signal。若在 Signal 的调用过程中调用 Await，任务仍会挂起，并等到**下一次** Signal 调用时恢复。 |\n| Signal | 并发恢复在此次 Signal 之前被 Await 挂起的任务。任务按挂起的先后顺序恢复；每个任务会尽可能执行直到遇到阻塞调用，随即把控制权交给下一个被挂起的任务。 |\n\n## Attributes, Specifiers, and Effects\n\n`event(t:any)<public> := class<concrete>(subscribable(t), signalable(t))` —— 标签：public / concrete，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Verse.org/Simulation }\n\nCounter := class:\n    Tick:event(int) = event(int){}   # int 载荷事件\n\n    Run()<suspends>:void =\n        N := Tick.Await()            # 挂起等待，Signal 一到即恢复\n        Print(\"收到 {N}\")\n\n    Bump():void =\n        Tick.Signal(1)\n```\n\n## 补充说明\n\n- `Await` 只等**下一次** Signal：信号发出时若无等待者，载荷不会被记住（先有等待者，后有 Signal）。\n- 类内声明事件字段要带构造：`Tick:event(int) = event(int){}`；构造函数见 [event function](event.md)。\n- 与设备/系统交互用 [listenable function](listenable.md)（订阅模型），自建 event 用于脚本内部的即时协调。\n", "01_Verse.org/010_Verse/locale.md": "---\nname: locale\nslug: versedotorg/verse/locale\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/locale\nkind: class\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# locale struct <B>\n\n> Used for message localization.\n> 用于 message 本地化的区域设置。\n\n`using { /Verse.org/Verse }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/010_Verse/message.md": "---\nname: message\nslug: versedotorg/verse/message\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/message\nkind: class\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# message class <B>\n\n> A localizable text message.\n> 可本地化的文本消息。\n\n`using { /Verse.org/Verse }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/010_Verse/modifier_stack_t.md": "---\nname: modifier_stack(t)\nslug: versedotorg/verse/modifier_stack/modifier_stack(t)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/modifier_stack/modifier_stack(t)\nkind: class\nmodule: /Verse.org/verse/modifier_stack\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# modifier_stack(t) class <C>\n\n修饰符栈：按顺序应用修饰符。\n", "01_Verse.org/010_Verse/cancelable.md": "---\nname: cancelable\nslug: versedotorg/verse/cancelable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/cancelable\nkind: interface\nmodule: /Verse.org/Verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n> Implemented by classes that allow users to cancel an operation. For example, calling subscribable.Subscribe with a callback returns a cancelable object. Calling Cancel on the return object unsubscribes the callback.\n> 由「允许用户取消操作」的类实现。例如调用 subscribable.Subscribe 传回调时会返回一个 cancelable 对象；对该对象调用 Cancel 即可取消订阅回调。\n\n`using { /Verse.org/Verse }`\n\n## Members\n\nThis interface has functions, but no data members.（此接口只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| Cancel | 阻止该操作当前或未来的任何工作完成（即取消）。 |\n\n## 补充说明\n\n- 典型来源：`Subscribe` 的返回值——留着它即可随时退订事件。\n- 相关页面：[subscribable function](subscribable.md)、[listenable function](listenable.md)。\n", "01_Verse.org/010_Verse/disposable.md": "---\nname: disposable\nslug: versedotorg/verse/disposable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/disposable\nkind: interface\nmodule: /Verse.org/Verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n> Implemented by classes whose instances have limited lifetimes.\n> 由「实例生命周期有限」的类实现。\n\n`using { /Verse.org/Verse }`\n\n## Members\n\nThis interface has functions, but no data members.（此接口只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| Dispose | 清理并释放此对象。 |\n\n## 补充说明\n\n- 对象被 Dispose 后不可再使用；长生命周期脚本持有此类对象时注意及时释放。\n", "01_Verse.org/010_Verse/enableable.md": "---\nname: enableable\nslug: versedotorg/verse/enableable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/enableable\nkind: interface\nmodule: /Verse.org/Verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n> Implemented by classes whose instances can be enabled and disabled.\n> 由「实例可被启用/禁用」的类实现。\n\n`using { /Verse.org/Verse }`\n\n## Members\n\nThis interface has functions, but no data members.（此接口只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| Enable | 启用此对象。 |\n| Disable | 禁用此对象。 |\n| IsEnabled | 对象处于启用状态则成功，禁用则失败。 |\n\n## 补充说明\n\n- IsEnabled 是可失败断言（`<decides>`），要写在失败上下文里。\n", "01_Verse.org/010_Verse/invalidatable.md": "---\nname: invalidatable\nslug: versedotorg/verse/invalidatable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/invalidatable\nkind: interface\nmodule: /Verse.org/Verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n> Implemented by classes whose instances can become invalid at runtime.\n> 由「实例可能在运行时失效」的类实现。\n\n`using { /Verse.org/Verse }`\n\n## Exposed Interfaces\n\nThis interface exposes the following interfaces:（此接口暴露以下接口：）\n\n| Name | Description |\n|---|---|\n| disposable | 由实例生命周期有限的类实现。 |\n\n## Members\n\nThis interface has functions, but no data members.（此接口只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| IsValid | 若此对象仍然有效则成功。 |\n\n## 补充说明\n\n- 引用可能失效的对象（如已退出的玩家相关对象）时，先 IsValid[] 再用。\n", "01_Verse.org/010_Verse/showable.md": "---\nname: showable\nslug: versedotorg/verse/showable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/showable\nkind: interface\nmodule: /Verse.org/Verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n> Implemented by classes whose instances can change visibility to be shown or hidden.\n> 由「实例可切换显示/隐藏」的类实现。\n\n`using { /Verse.org/Verse }`\n\n## Members\n\nThis interface has data members, but no functions.（此接口只有数据成员，没有函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| Show | ?logic | 设置此值以隐藏或显示该对象（true 显示 / false 隐藏）。 |\n\n## 补充说明\n\n- `?logic` 赋值写法：`if (set Obj.Show = true) {}`。\n\n", "01_Verse.org/010_Verse/operatorequals.md": "---\nname: operator'='\nslug: versedotorg/verse/operatorequals\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorequals\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# operator'=' function <S>\n\n（本页官网无导语描述；`=` 是可失败的相等比较运算符——相等则成功并返回左值，不相等则失败。）\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'='(Lhs:t, Rhs:comparable where t:comparable)<decides>:t\n```\n\n## Parameters\n\noperator'=' takes the following parameters:（operator'=' 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Lhs | t | 左操作数。 |\n| Rhs | comparable | 右操作数。 |\n| t | comparable | 操作数的公共类型，须满足 comparable 约束。 |\n\n## Attributes, Specifiers, and Effects\n\n`operator'='(Lhs:t, Rhs:comparable where t:comparable)<decides>:t` —— 标签：decides，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nCheck(HP:int):void =\n    if (HP = 0):                 # 相等判断接入失败上下文\n        Print(\"角色倒下\")\n    if (Best := HP = 100):       # 相等时 Best 被绑定为 HP 的值\n        Print(\"满血 {Best}\")\n```\n\n## 补充说明\n\n- Verse 中 `=` 判断、`:=` 定义、`set X =` 赋值三者各司其职；`<decides>` 使比较可失败——这是它与多数语言 `==` 的本质差异。\n- 不等比较见 [operator'&lt;&gt; function](operatorlessgreater.md)；失败机制见 [可失败表达式与failure](../../00_语言基础/failure.md)。\n", "01_Verse.org/010_Verse/operatorlessgreater.md": "---\nname: operator'<>'\nslug: versedotorg/verse/operatorlessgreater\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorlessgreater\nkind: function\nmodule: /Verse.org/verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# operator'<>' function <S>\n\n不相等比较：Lhs 与 Rhs 不相等则成功，相等则失败。与 [operator'=](operatorequals.md) 语义相反。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'<>'(Lhs:t, Rhs:comparable where t:comparable)<decides>:t\n```\n\n## Parameters\n\noperator'<>' 接受以下参数：\n| Name | Type | Description |\n| Lhs | t |  |\n| Rhs | comparable |  |\n| t | comparable |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/prefixminus.md": "---\nname: prefix'-'\nslug: versedotorg/verse/prefixminus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/prefixminus\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# prefix'-' function <B>\n\n整数取负（一元 -）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nprefix'-'(Value:int):int\n```\n\n## Parameters\n\nprefix'-' 接受以下参数：\n| Name | Type | Description |\n| Value | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorplus.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'+' function <B>\n\n整数加法。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'+'(Lhs:int, Rhs:int):int\n```\n\n## Parameters\n\noperator'+' 接受以下参数：\n| Name | Type | Description |\n| Lhs | int |  |\n| Rhs | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorminus.md": "---\nname: operator'-'\nslug: versedotorg/verse/operatorminus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorminus\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'-' function <B>\n\n整数减法。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'-'(Lhs:int, Rhs:int):int\n```\n\n## Parameters\n\noperator'-' 接受以下参数：\n| Name | Type | Description |\n| Lhs | int |  |\n| Rhs | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorstar.md": "---\nname: operator'*'\nslug: versedotorg/verse/operatorstar\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorstar\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'*' function <B>\n\n整数乘法。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'*'(Lhs:int, Rhs:int):int\n```\n\n## Parameters\n\noperator'*' 接受以下参数：\n| Name | Type | Description |\n| Lhs | int |  |\n| Rhs | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorslash.md": "---\nname: operator'/'\nslug: versedotorg/verse/operatorslash\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorslash\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'/' function <B>\n\n整数除法：返回 rational；除数为 0 时失败。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'/'(Lhs:int, Rhs:int)<decides>:rational\n```\n\n## Parameters\n\noperator'/' 接受以下参数：\n| Name | Type | Description |\n| Lhs | int |  |\n| Rhs | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorplusequals.md": "---\nname: operator'+='\nslug: versedotorg/verse/operatorplusequals\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplusequals\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'+=' function <B>\n\n整数累加：等价于 set Lhs = Lhs + Rhs。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'+='(Lhs:int, Rhs:int)<transacts><predicts>:int\n```\n\n## Parameters\n\noperator'+=' 接受以下参数：\n| Name | Type | Description |\n| Lhs | int |  |\n| Rhs | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorminusequals.md": "---\nname: operator'-='\nslug: versedotorg/verse/operatorminusequals\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorminusequals\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'-=' function <B>\n\n整数累减。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'-='(Lhs:int, Rhs:int)<transacts><predicts>:int\n```\n\n## Parameters\n\noperator'-=' 接受以下参数：\n| Name | Type | Description |\n| Lhs | int |  |\n| Rhs | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorstarequals.md": "---\nname: operator'*='\nslug: versedotorg/verse/operatorstarequals\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorstarequals\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'*=' function <B>\n\n整数累乘。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'*='(Lhs:int, Rhs:int)<transacts><predicts>:int\n```\n\n## Parameters\n\noperator'*=' 接受以下参数：\n| Name | Type | Description |\n| Lhs | int |  |\n| Rhs | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/abs.md": "---\nname: Abs\nslug: versedotorg/verse/abs\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/abs\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Abs function <A>\n\n返回 Value 的绝对值（int 版本）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nAbs(Value:int):int\n```\n\n## Parameters\n\nAbs 接受以下参数：\n| Name | Type | Description |\n| Value | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nN := Abs(-3)   # 3\n```\n", "01_Verse.org/010_Verse/bitand.md": "---\nname: BitAnd\nslu kind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'+' function <B>\n\n数组拼接：返回 Lhs 与 Rhs 元素顺序连接的新数组。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'+'(Lhs:[]t, Rhs:[]t where t:any):[]t\n```\n\n## Parameters\n\noperator'+' 接受以下参数：\n| Name | Type | Description |\n| Lhs | []t |  |\n| Rhs | []t |  |\n| t | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorplusequals-2.md": "---\nname: operator'+='\nslug: versedotorg/verse/operatorplusequals-2\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplusequals-2\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'+=' function <B>\n\n数组累加：把 Rhs 的元素追加进 Lhs 数组。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'+='(Lhs:[]t, Rhs:[]t where t:any)<transacts><predicts>:[]t\n```\n\n## Parameters\n\noperator'+=' 接受以下参数：\n| Name | Type | Description |\n| Lhs | []t |  |\n| Rhs | []t |  |\n| t | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operator.md": "---\nname: operator'()'\nslug: versedotorg/verse/operator()\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operator()\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'()' function <B>\n\n数组按索引取元素：越界则失败。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'()'(Array:[]t, Index:int where t:any)<decides>:t\n```\n\n## Parameters\n\noperator'()' 接受以下参数：\n| Name | Type | Description |\n| Array | []t |  |\n| Index | int |  |\n| t | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operator_-1.md": "---\nname: operator'()'\nslug: versedotorg/verse/operator()-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operator()-1\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'()' function <B>\n\n数组按索引取元素重载（u 元素类型版本）。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'()'(Array:[]u, Index:int where t:any, u:any)<decides><reads>:u\n```\n\n## Parameters\n\noperator'()' 接受以下参数：\n| Name | Type | Description |\n| Array | []u |  |\n| Index | int |  |\n| t | any |  |\n| u | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operator_-2.md": "---\nname: operator'()'\nslug: versedotorg/verse/operator()-2\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operator()-2\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'()' function <B>\n\n映射按键取值：键不存在则失败。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'()'(Map:[t]v, Key:t where t:comparable, u:any, v:any)<decides><reads>:v\n```\n\n## Parameters\n\noperator'()' 接受以下参数：\n| Name | Type | Description |\n| Map | [t]v |  |\n| Key | t |  |\n| t | comparable |  |\n| u | any |  |\n| v | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/concatenatemaps.md": "---\nname: ConcatenateMaps\nslug: versedotorg/verse/concatenatemaps\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/concatenatemaps\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# ConcatenateMaps function <B>\n\n合并两个映射（M2 同键覆盖 M1）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nConcatenateMaps(Lhs:[t]u, Rhs:[t]u where t:comparable, u:any):[t]u\n```\n\n## Parameters\n\nConcatenateMaps 接受以下参数：\n| Name | Type | Description |\n| Lhs | [t]u |  |\n| Rhs | [t]u |  |\n| t | comparable |  |\n| u | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operator_-3.md": "---\nname: operator'()'\nslug: versedotorg/verse/operator()-3\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operator()-3\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'()' function <B>\n\n映射按键取值重载。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'()'(Map:[t]u, Key:t where t:comparable, u:any)<decides>:u\n```\n\n## Parameters\n\noperator'()' 接受以下参数：\n| Name | Type | Description |\n| Map | [t]u |  |\n| Key | t |  |\n| t | comparable |  |\n| u | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operator_-4.md": "---\nname: operator'()'\nslug: versedotorg/verse/operator()-4\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operator()-4\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'()' function <B>\n\n映射按键取值重载。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'()'(Map:[t]v, Key:t where t:comparable, u:any, v:any)<decides><reads>:v\n```\n\n## Parameters\n\noperator'()' 接受以下参数：\n| Name | Type | Description |\n| Map | [t]v |  |\n| Key | t |  |\n| t | comparable |  |\n| u | any |  |\n| v | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/weak_map.md": "---\nname: weak_map\nslug: versedotorg/verse/weak_map\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/weak_map\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# weak_map function <B>\n\n构造「键为弱引用对象」的映射类型（如以 player/session 为键的全局状态表）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nweak_map(t:comparable, v:any):[]\n```\n\n## Parameters\n\nweak_map 接受以下参数：\n| Name | Type | Description |\n| t | comparable |  |\n| v | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorquestionmark-1.md": "---\nname: operator'?'\nslug: versedotorg/verse/operatorquestionmark-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorquestionmark-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# operator'?' function <A>\n\noption 取值：Value 有值则成功并返回该值，为空则失败。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'?'(Value:?t where t:any)<decides>:t\n```\n\n## Parameters\n\noperator'?' 接受以下参数：\n| Name | Type | Description |\n| Value | ?t |  |\n| t | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nOpt:?int = option{7}\nif (V := Opt?):\n    Print(\"{V}\")\n```\n", "01_Verse.org/010_Verse/fitsinplayermap.md": "---\nname: FitsInPlayerMap\nslug: versedotorg/verse/fitsinplayermap\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/fitsinplayermap\nkind: function\nmodule: /Verse.org/verse\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# FitsInPlayerMap function <C>\n\n判断该类型是否能用作 player 映射的键（涉及持久化限制）。\n", "01_Verse.org/010_Verse/print.md": "---\nname: Print\nslug: versedotorg/verse/print\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Print function <S>\n\n> Writes Message to a dedicated Print log while displaying it in Color on the client screen for Duration seconds. By default, Color is NamedColors.White and Duration is 2.0 seconds.\n> 把 Message 写入专用的 Print 日志，同时在客户端屏幕上以 Color 颜色显示 Duration 秒。默认 Color 为 NamedColors.White（白色），Duration 为 2.0 秒。\n\n`using { /Verse.org/Verse }`\n\n```verse\nPrint<public><native>(Message:[]char, Duration:float, Color:color)<transacts>:void\n```\n\n## Parameters\n\nPrint takes the following parameters:（Print 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Message | []char | 要输出的消息（字符数组；字符串字面量可直接传入）。 |\n| Duration | float | 在屏幕上显示的秒数。 |\n| Color | color | 显示颜色，默认 NamedColors.White。 |\n\n## Attributes, Specifiers, and Effects\n\n`Print<public><native>(Message:[]char, Duration:float, Color:color)<transacts>` —— 标签：public / native / transacts，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Verse.org/Colors }\nusing { /Verse.org/Colors/NamedColors }\n\nScore := 42\nPrint(\"分数: {Score}\")                                    # 白色显示 2 秒\nPrint(\"出错了!\", Duration := 5.0, Color := NamedColors.Red)  # 红色显示 5 秒\n```\n\n## 补充说明\n\n- Print 输出进专用 Print 日志（UEFN 内查看），是调试与学习的主力工具；面向玩家的正式文案请用 UI/message 体系。\n- 另有两个重载：[Print (message 重载)](print-1.md)、[Print (diagnostic 重载)](print-2.md)。\n", "01_Verse.org/010_Verse/print-1.md": "---\nname: Print (message 重载)\nslug: versedotorg/verse/print-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Print function（message 重载）<S>\n\n> Writes Message to a dedicated Print log while displaying it in Color on the client screen for Duration seconds. By default, Color is NamedColors.White and Duration is 2.0 seconds.\n> 把 Message 写入专用的 Print 日志，同时在客户端屏幕上以 Color 颜色显示 Duration 秒。默认 Color 为 NamedColors.White，Duration 为 2.0 秒。本重载的 Message 为 message（可本地化文本）类型。\n\n`using { /Verse.org/Verse }`\n\n```verse\nPrint<public><native>(Message:message, Duration:float, Color:color)<transacts>:void\n```\n\n## Parameters\n\nPrint takes the following parameters:（Print 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Message | message | 要输出的可本地化文本。 |\n| Duration | float | 在屏幕上显示的秒数。 |\n| Color | color | 显示颜色，默认 NamedColors.White。 |\n\n## Attributes, Specifiers, and Effects\n\n`Print<public><native>(Message:message, Duration:float, Color:color)<transacts>` —— 标签：public / native / transacts，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nGreeting:message = Localize(\"hello.key\", [\"Name\"], array[\"World\"])\nPrint(Greeting)\n```\n\n## 补充说明\n\n- 与 [Print function](print.md) 行为一致，区别是接受 message 对象；相关类型见 [message class](message.md)。\n", "01_Verse.org/010_Verse/print-2.md": "---\nname: Print (diagnostic 重载)\nslug: versedotorg/verse/print-2\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print-2\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Print function（diagnostic 重载）<S>\n\n> Writes Message to a dedicated Print log while displaying it in Color on the client screen for Duration seconds. By default, Color is NamedColors.White and Duration is 2.0 seconds.\n> 把 Message 写入专用的 Print 日志，同时在客户端屏幕上以 Color 颜色显示 Duration 秒。默认 Color 为 NamedColors.White，Duration 为 2.0 秒。本重载的 Message 为 diagnostic（诊断）类型。\n\n`using { /Verse.org/Verse }`\n\n```verse\nPrint<public>(Message:diagnostic, Duration:float, Color:color)<transacts>:void\n```\n\n## Parameters\n\nPrint takes the following parameters:（Print 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Message | diagnostic | 要输出的诊断对象。 |\n| Duration | float | 在屏幕上显示的秒数。 |\n| Color | color | 显示颜色，默认 NamedColors.White。 |\n\n## Attributes, Specifiers, and Effects\n\n`Print<public>(Message:diagnostic, Duration:float, Color:color)<transacts>` —— 标签：public / transacts，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nPrint(ToDiagnostic(\"检查点到达\"))\n```\n\n## 补充说明\n\n- 日常调试用 [Print function](print.md) 主重载即可；diagnostic 相关见 [diagnostic class](diagnostic.md)。\n", "01_Verse.org/010_Verse/concatenate.md": "---\nname: Concatenate\nslug: versedotorg/verse/concatenate\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/concatenate\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Concatenate function <A>\n\n> Makes a flattened array by concatenating the elements of Arrays.\n> 把嵌套数组压平：按顺序连接 Arr 里每个子数组的元素，返回一个新数组。\n\n`using { /Verse.org/Verse }`\n\n```verse\nConcatenate<public>(Arrays:[][]t where t:any):[]t\n```\n\n## Parameters\n\nConcatenate 接受以下参数：\n| Name | Type | Description |\n| Arrays | [][]t |  |\n| t | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nFlat:int[] = Concatenate(array{array{1,2}, array{3}})   # {1, 2, 3}\n```\n", "01_Verse.org/010_Verse/classifiable_subset.md": "---\nname: classifiable_subset\nslug: versedotorg/verse/classifiable_subset\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/classifiable_subset\nkind: function\nmodule: /Verse.org/verse\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# classifiable_subset function <C>\n\n构造可分类子集容器。\n", "01_Verse.org/010_Verse/makeclassifiablesubset.md": "---\nname: MakeClassifiableSubset\nslug: versedotorg/verse/makeclassifiablesubset\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/makeclassifiablesubset\nkind: function\nmodule: /Verse.org/verse\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# MakeClassifiableSubset function <C>\n\n构造包含 InElements 的 classifiable_subset。\n", "01_Verse.org/010_Verse/operatorplus-3.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-3\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-3\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'+' function <B>\n\n> Returns a new set that is the union of all elements in InSetL set and InSetR.\n> 集合并集：返回包含 InSetL 与 InSetR 全部元素的新集合。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'+'<public><native>(InSetL:classifiable_subset(element_type), InSetR:classifiable_subset(element_type) where t:any)<transacts>:classifiable_subset(element_type)\n```\n\n## Parameters\n\noperator'+' 接受以下参数：\n| Name | Type | Description |\n| InSetL | classifiable_subset(element_type) |  |\n| InSetR | classifiable_subset(element_type) |  |\n| t | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorplus-4.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-4\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-4\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'+' function <B>\n\n> Concatenates two diagnostic messages.\n> 拼接两个诊断消息。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'+'<public>(Lhs:diagnostic, Rhs:diagnostic):diagnostic\n```\n\n## Parameters\n\noperator'+' 接受以下参数：\n| Name | Type | Description |\n| Lhs | diagnostic |  |\n| Rhs | diagnostic |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorplus-5.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-5\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-5\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'+' function <B>\n\n> Concatenates a diagnostic message with a normal string, yielding a diagnostic message.\n> 诊断消息与普通字符串拼接，结果为诊断消息。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'+'<public>(Lhs:diagnostic, Rhs:[]char):diagnostic\n```\n\n## Parameters\n\noperator'+' 接受以下参数：\n| Name | Type | Description |\n| Lhs | diagnostic |  |\n| Rhs | []char |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/operatorplus-6.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-6\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-6\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# operator'+' function <B>\n\n> Concatenates a normal string with a diagnostic message, yielding a diagnostic message.\n> 普通字符串与诊断消息拼接，结果为诊断消息。\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'+'<public>(Lhs:[]char, Rhs:diagnostic):diagnostic\n```\n\n## Parameters\n\noperator'+' 接受以下参数：\n| Name | Type | Description |\n| Lhs | []char |  |\n| Rhs | diagnostic |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/todiagnostic.md": "---\nname: ToDiagnostic\nslug: versedotorg/verse/todiagnostic\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/todiagnostic\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# ToDiagnostic function <B>\n\n> Converts any Verse value into an opaque diagnostic message.\n> 把任意 Verse 值转换成不透明的诊断消息。\n\n`using { /Verse.org/Verse }`\n\n```verse\nToDiagnostic<public><native>(Value:any):diagnostic\n```\n\n## Parameters\n\nToDiagnostic 接受以下参数：\n| Name | Type | Description |\n| Value | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/err.md": "---\nname: Err\nslug: versedotorg/verse/err\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/err\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Err function <B>\n\n> Halts the Verse runtime with error Message.\n> 以错误消息 Message 立即中止 Verse 运行时。\n\n`using { /Verse.org/Verse }`\n\n```verse\nErr<public><native>(Message:[]char):false\n```\n\n## Parameters\n\nErr 接受以下参数：\n| Name | Type | Description |\n| Message | []char |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/event.md": "---\nname: event\nslug: versedotorg/verse/event\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# event function <S>\n\n> A recurring, successively signaled parametric event with a payload allowing a simple mechanism to coordinate between concurrent tasks.\n> 可重复、按次序触发的参数化事件，带有载荷，为并发任务之间的协调提供简单机制。\n\n`using { /Verse.org/Verse }`\n\n```verse\nevent<public>(t:any):event(t)\n```\n\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n（此函数是参数化类型：它返回的是类或接口，而不是值或对象实例。）\n\n## Parameters\n\nevent takes the following parameters:（event 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| t | any | 事件载荷的类型。 |\n\n### Generated Class\n\nevent returns the parametric class `event(t)`.（event 返回参数化类 event(t)。）\n\n## Attributes, Specifiers, and Effects\n\n`event<public>(t:any):event(t)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nGate:event(logic) = event(logic){}   # 生成 logic 载荷的 event(t) 实例\n```\n\n## 补充说明\n\n- 本页是构造函数；Signal/Await 的行为见 [event(t) class](event_t.md)。\n- 无载荷构造重载见 [event function（无载荷）](event-1.md)。\n", "01_Verse.org/010_Verse/event-1.md": "---\nname: event\nslug: versedotorg/verse/event-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# event function（无载荷）<S>\n\n> A recurring, successively signaled event allowing a simple mechanism to coordinate between concurrent tasks.\n> 可重复、按次序触发的事件，为并发任务之间的协调提供简单机制（本重载不带构造参数，载荷类型由上下文推断）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nevent<public>():event(t)\n```\n\n## Parameters\n\nevent does not take any parameters.（event 不接受任何参数。）\n\n## Attributes, Specifiers, and Effects\n\n`event<public>():event(t)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Verse.org/Simulation }\n\nKickoff:event() = event(){}\n\nWaitAndGo()<suspends>:void =\n    Kickoff.Await()      # 不关心载荷，只等信号\n    Print(\"GO!\")\n```\n\n## 补充说明\n\n- Signal/Await 的行为见 [event(t) class](event_t.md)；带载荷的构造见 [event function](event.md)。\n", "01_Verse.org/010_Verse/ceil-1.md": "---\nname: Ceil\nslug: versedotorg/verse/ceil-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/ceil-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Ceil function <A>\n\n> Returns the smallest int that is greater than or equal to Val. Fails if not IsFinite(Val).\n> 返回大于等于 Val 的最小 int（向上取整，float 输入版本）。非有限值时失败。\n\n`using { /Verse.org/Verse }`\n\n```verse\nCeil<public><native>(Val:float):int\n```\n\n## Parameters\n\nCeil 接受以下参数：\n| Name | Type | Description |\n| Val | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nN := Ceil(1.2)   # 2\n```\n", "01_Verse.org/010_Verse/floor-1.md": "---\nname: Floor\nslug: versedotorg/verse/floor-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/floor-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Floor function <A>\n\n> Returns the largest int that is less than or equal to Val. Fails if not IsFinite(Val).\n> 返回小于等于 Val 的最大 int（向下取整，float 输入版本）。非有限值时失败。\n\n`using { /Verse.org/Verse }`\n\n```verse\nFloor<public><native>(Val:float):int\n```\n\n## Parameters\n\nFloor 接受以下参数：\n| Name | Type | Description |\n| Val | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nN := Floor(1.8)   # 1\n```\n", "01_Verse.org/010_Verse/round.md": "---\nname: Round\nslug: versedotorg/verse/round\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/round\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Round function <A>\n\n> Returns Val rounded to the nearest int. When the fractional part of Val is 0.5, rounds to the nearest even int (per the IEEE-754 default rounding mode). Fails if not IsFinite(Val).\n> 返回 Val 四舍五入到最近整数的 int；小数部分恰为 0.5 时取最近的偶数（IEEE-754 默认舍入）。非有限值时失败。\n\n`using { /Verse.org/Verse }`\n\n```verse\nRound<public><native>(Val:float):int\n```\n\n## Parameters\n\nRound 接受以下参数：\n| Name | Type | Description |\n| Val | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nN := Round(1.5)   # 2（取偶）\n```\n", "01_Verse.org/010_Verse/int.md": "---\nname: Int\nslug: versedotorg/verse/int\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/int\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Int function <A>\n\n> Returns the int that equals Val without the fractional part. Fails if not IsFinite(val).\n> 返回等于 Val 去掉小数部分的 int（向零取整）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nInt<public><native>(Val:float):int\n```\n\n## Parameters\n\nInt 接受以下参数：\n| Name | Type | Description |\n| Val | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nN := Int(2.9)   # 2\n```\n", "01_Verse.org/010_Verse/tostring.md": "---\nname: ToString\nslug: versedotorg/verse/tostring\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/tostring\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# ToString function <A>\n\n> Makes a string representation of Val.\n> 把 Val（float）转成字符串表示。\n\n`using { /Verse.org/Verse }`\n\n```verse\nToString<public><native>(Val:float):[]char\n```\n\n## Parameters\n\nToString 接受以下参数：\n| Name | Type | Description |\n| Val | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nS := ToString(3.14)\n```\n", "01_Verse.org/010_Verse/getsecondssinceepoch.md": "---\nname: GetSecondsSinceEpoch\nslug: versedotorg/verse/getsecondssinceepoch\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/getsecondssinceepoch\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# GetSecondsSinceEpoch function <B>\n\n> Returns the number of seconds since January 1, 1970 UTC, ignoring leap seconds. I.e, this function implements Unix time. This function always returns the same value within the same transaction.\n> 返回自 1970 年 1 月 1 日 UTC 起的秒数（Unix 时间戳），忽略闰秒。\n\n`using { /Verse.org/Verse }`\n\n```verse\nGetSecondsSinceEpoch<public><native>():float\n```\n\n## Parameters\n\nGetSecondsSinceEpoch 不接受任何参数。\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/tostring-1.md": "---\nname: ToString\nslug: versedotorg/verse/tostring-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/tostring-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# ToString function <A>\n\n> Makes a printable string representation of Val.\n> 把 Val（char）转成可打印的字符串表示。\n\n`using { /Verse.org/Verse }`\n\n```verse\nToString<public><native>(Val:int):[]char\n```\n\n## Parameters\n\nToString 接受以下参数：\n| Name | Type | Description |\n| Val | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/listenable.md": "---\nname: listenable\nslug: versedotorg/verse/listenable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/listenable\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# listenable function <S>\n\n> A parametric interface combining awaitable and subscribable.\n> 参数化**接口**：组合了 awaitable（可等待）与 subscribable（可订阅）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nlistenable<public>(payload:any):listenable(payload)\n```\n\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n（此函数是参数化类型：它返回的是类或接口，而不是值或对象实例。）\n\n## Parameters\n\nlistenable takes the following parameters:（listenable 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| payload | any | 订阅回调接收的载荷类型。 |\n\n### Generated Interface\n\nlistenable returns the parametric interface `listenable(payload)`.（listenable 返回参数化接口 listenable(payload)。）\n\n## Attributes, Specifiers, and Effects\n\n`listenable<public>(payload:any):listenable(payload)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Fortnite.com/Devices }\n\n# 订阅按钮设备的交互事件（设备事件都是现成的 listenable）\nMyDevice := class(creative_device):\n\n    @editable\n    MyButton : button_device = button_device{}\n\n    OnBegin<override>()<suspends>:void =\n        MyButton.InteractedWithEvent.Subscribe(OnButtonPressed)\n\n    OnButtonPressed(Agent:agent):void =\n        Print(\"按钮被按下\")\n```\n\n## 补充说明\n\n- listenable 与 [event(t) class](event_t.md) 的分工：listenable 面向\"持续广播、多方订阅\"（设备事件、玩家进出），event 面向\"脚本内部一次性等待\"。\n- 订阅回调是类成员函数；订阅时机通常在 OnBegin 中完成，避免漏事件。\n", "01_Verse.org/010_Verse/listenable-1.md": "---\nname: listenable\nslug: versedotorg/verse/listenable-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/listenable-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# listenable function（无载荷）<S>\n\n> A parameterless interface combining awaitable and subscribable.\n> 无参数接口：组合了 awaitable（可等待）与 subscribable（可订阅），载荷类型由上下文推断。\n\n`using { /Verse.org/Verse }`\n\n```verse\nlistenable<public>():listenable(payload)\n```\n\n## Parameters\n\nlistenable does not take any parameters.（listenable 不接受任何参数。）\n\n## Attributes, Specifiers, and Effects\n\n`listenable<public>():listenable(payload)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nPing:listenable() = listenable(){}\n```\n\n## 补充说明\n\n- 用法与 [listenable function](listenable.md) 完全一致，仅构造写法不同。\n", "01_Verse.org/010_Verse/localize.md": "---\nname: Localize\nslug: versedotorg/verse/localize\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/localize\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Localize function <B>\n\n> Makes a string by localizing Message based on the current locale.\n> 按当前区域设置本地化 Message，生成字符串。\n\n`using { /Verse.org/Verse }`\n\n```verse\nLocalize<public><native>(Message:message):[]char\n```\n\n## Parameters\n\nLocalize 接受以下参数：\n| Name | Type | Description |\n| Message | message |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/join.md": "---\nname: Join\nslug: versedotorg/verse/join\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/join\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Join function <A>\n\n> Makes a message by concatenating Separator between the elements of Messages.\n> 用 Separator 把 Element 数组拼接成一个 message（可本地化文本）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nJoin<public><native>(Messages:[]message, Separator:message)<transacts>:message\n```\n\n## Parameters\n\nJoin 接受以下参数：\n| Name | Type | Description |\n| Messages | []message |  |\n| Separator | message |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nM := Join(array{\"a\", \"b\"}, \"-\")   # a-b\n```\n", "01_Verse.org/010_Verse/clamp.md": "---\nname: Clamp\nslug: versedotorg/verse/clamp\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/clamp\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Clamp function <A>\n\n> Constrains the value of Val between A and B. Robustly handles different argument orderings. Returns the median of Val, A, and B, such that comparisons with NaN operate as if NaN > +Inf.\n> 把 Val 限制在 A 与 B 之间（int 版本；健壮处理 A、B 顺序）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nClamp<public>(Val:float, A:float, B:float):float\n```\n\n## Parameters\n\nClamp 接受以下参数：\n| Name | Type | Description |\n| Val | float |  |\n| A | float |  |\n| B | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nN := Clamp(V, 0, 10)\n```\n", "01_Verse.org/010_Verse/clamp-1.md": "---\nname: Clamp\nslug: versedotorg/verse/clamp-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/clamp-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Clamp function <A>\n\n> Constrains the value of Val between A and B. Robustly handles different argument orderings. Returns the median of Val, A, and B.\n> 把 Val 限制在 A 与 B 之间（float 版本；健壮处理 A、B 顺序）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nClamp<public><native>(Val:int, A:int, B:int):int\n```\n\n## Parameters\n\nClamp 接受以下参数：\n| Name | Type | Description |\n| Val | int |  |\n| A | int |  |\n| B | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nF := Clamp(V, 0.0, 1.0)\n```\n", "01_Verse.org/010_Verse/min.md": "---\nname: Min\nslug: versedotorg/verse/min\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/min\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Min function <A>\n\n> Returns the minimum of X and Y.\n> 返回 X 和 Y 中的较小值（int 版本）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nMin<public>(X:int, Y:int):int\n```\n\n## Parameters\n\nMin 接受以下参数：\n| Name | Type | Description |\n| X | int |  |\n| Y | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nN := Min(3, 7)   # 3\n```\n", "01_Verse.org/010_Verse/max.md": "---\nname: Max\nslug: versedotorg/verse/max\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/max\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Max function <A>\n\n> Returns the maximum of X and Y.\n> 返回 X 和 Y 中的较大值（int 版本）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nMax<public>(X:int, Y:int):int\n```\n\n## Parameters\n\nMax 接受以下参数：\n| Name | Type | Description |\n| X | int |  |\n| Y | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nN := Max(3, 7)   # 7\n```\n", "01_Verse.org/010_Verse/min-1.md": "---\nname: Min\nslug: versedotorg/verse/min-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/min-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Min function <A>\n\n> Returns the minimum of X and Y unless either are NaN. Returns NaN if either X or Y are NaN.\n> 返回 X 和 Y 中的较小值；任一为 NaN 时返回 NaN（float 版本）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nMin<public>(X:float, Y:float):float\n```\n\n## Parameters\n\nMin 接受以下参数：\n| Name | Type | Description |\n| X | float |  |\n| Y | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nF := Min(0.5, 1.5)   # 0.5\n```\n", "01_Verse.org/010_Verse/max-1.md": "---\nname: Max\nslug: versedotorg/verse/max-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/max-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Max function <A>\n\n> Returns the maximum of X and Y unless either are NaN. Returns NaN if either X or Y are NaN.\n> 返回 X 和 Y 中的较大值；任一为 NaN 时返回 NaN（float 版本）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nMax<public>(X:float, Y:float):float\n```\n\n## Parameters\n\nMax 接受以下参数：\n| Name | Type | Description |\n| X | float |  |\n| Y | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nF := Max(0.5, 1.5)   # 1.5\n```\n", "01_Verse.org/010_Verse/sqrt.md": "---\nname: Sqrt\nslug: versedotorg/verse/sqrt\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/sqrt\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\ns <native>(X:int, Y:int):int\n```\n\n## Parameters\n\nQuotient 接受以下参数：\n| Name | Type | Description |\n| X | int |  |\n| Y | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/mod.md": "---\nname: Mod\nslug: versedotorg/verse/mod\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/mod\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Mod function <B>\n\n> Returns the remainder of X/Y as defined by Euclidean division, i.e.:\n> - Mod[X,Y] = X - Quotient(X/Y)*Y\n> - 0 <= Mod[X,Y] < Abs(Y) Fails if Y=0.\n> 返回欧几里得除法 X/Y 的余数。\n\n`using { /Verse.org/Verse }`\n\n```verse\nMod<public><native>(X:int, Y:int):int\n```\n\n## Parameters\n\nMod 接受以下参数：\n| Name | Type | Description |\n| X | int |  |\n| Y | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/exp.md": "---\nname: Exp\nslug: versedotorg/verse/exp\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/exp\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Exp function <B>\n\n> Returns the natural exponent of X.\n> 返回 e 的 X 次幂（自然指数）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nExp<public><native>(X:float):float\n```\n\n## Parameters\n\nExp 接受以下参数：\n| Name | Type | Description |\n| X | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/ln.md": "---\nname: Ln\nslug: versedotorg/verse/ln\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/ln\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Ln function <B>\n\n> Returns the natural logarithm of X.\n> 返回 X 的自然对数。\n\n`using { /Verse.org/Verse }`\n\n```verse\nLn<public><native>(X:float):float\n```\n\n## Parameters\n\nLn 接受以下参数：\n| Name | Type | Description |\n| X | float |  |\n
