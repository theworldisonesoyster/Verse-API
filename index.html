ameters\n\nSgn 接受以下参数：\n| Name | Type | Description |\n| Val | int |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/sgn-1.md": "---\nname: Sgn\nslug: versedotorg/verse/sgn-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/sgn-1\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Sgn function <B>\n\n> Returns the sign of Val:\n> - 1.0 if Val > 0.0\n> - 0.0 if Val = 0.0\n> - -1.0 if Val < 0.0\n> - NaN if Val = NaN\n> 返回 Val 的符号（float 版本）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nSgn<public>(Val:float):float\n```\n\n## Parameters\n\nSgn 接受以下参数：\n| Name | Type | Description |\n| Val | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/isalmostequal.md": "---\nname: IsAlmostEqual\nslug: versedotorg/verse/isalmostequal\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/isalmostequal\nkind: function\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# IsAlmostEqual function <B>\n\n> Succeeds if Val1 and Val2 are within AbsoluteTolerance of each other.\n> 若 Val1 与 Val2 的差在 AbsoluteTolerance 内则成功（浮点比较专用）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nIsAlmostEqual<public>(Val1:float, Val2:float, AbsoluteTolerance:float):void\n```\n\n## Parameters\n\nIsAlmostEqual 接受以下参数：\n| Name | Type | Description |\n| Val1 | float |  |\n| Val2 | float |  |\n| AbsoluteTolerance | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/result.md": "---\nname: result\nslug: versedotorg/verse/result\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/result\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# result function <A>\n\n> Implemented by classes that provide a result for an operation, which can fail or be successful\n> 由「可为成功或失败的操作」的结果类实现。\n\n`using { /Verse.org/Verse }`\n\n```verse\nresult<public>(success_type:any, error_type:any):result(success_type,error_type)\n```\n\n```verse\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n```\n\n## Parameters\n\nresult 接受以下参数：\n| Name | Type | Description |\n| success_type | any |  |\n| error_type | any |  |\n\n### Generated Interface\nresult 返回参数化接口 result(success_type,error_type)。\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nR := MakeError(\"存档失败\")\nif (E := result[Error, string][R]):\n    Print(\"失败原因: {E}\")\n```\n", "01_Verse.org/010_Verse/makesuccess.md": "---\nname: MakeSuccess\nslug: versedotorg/verse/makesuccess\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/makesuccess\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# MakeSuccess function <A>\n\n构造一个表示成功的 result 实例。\n\n`using { /Verse.org/Verse }`\n\n```verse\nMakeSuccess<public>(Result:success_type where success_type:any):result(success_type,error_type)\n```\n\n## Parameters\n\nMakeSuccess 接受以下参数：\n| Name | Type | Description |\n| Result | success_type |  |\n| success_type | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nOK:result[string, string] = MakeSuccess(\"done\")\n```\n", "01_Verse.org/010_Verse/makeerror.md": "---\nname: MakeError\nslug: versedotorg/verse/makeerror\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/makeerror\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# MakeError function <A>\n\n构造一个携带错误信息的失败 result 实例。\n\n`using { /Verse.org/Verse }`\n\n```verse\nMakeError<public>(Result:error_type where error_type:any):result(success_type,error_type)\n```\n\n## Parameters\n\nMakeError 接受以下参数：\n| Name | Type | Description |\n| Result | error_type |  |\n| error_type | any |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nBad:result[string, string] = MakeError(\"oops\")\n```\n", "01_Verse.org/010_Verse/signalable.md": "---\nname: signalable\nslug: versedotorg/verse/signalable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/signalable\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# signalable function <A>\n\n> A parametric interface implemented by events with a payload that can be signaled. Can be used with awaitable, subscribable, or both (see: listenable).\n> 带载荷、可被触发（signal）的事件实现的参数化接口。\n\n`using { /Verse.org/Verse }`\n\n```verse\nsignalable<public>(payload:any):signalable(payload)\n```\n\n```verse\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n```\n\n## Parameters\n\nsignalable 接受以下参数：\n| Name | Type | Description |\n| payload | any |  |\n\n### Generated Interface\nsignalable 返回参数化接口 signalable(payload)。\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/join-1.md": "---\nname: Join\nslug: versedotorg/verse/join-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/join-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# Join function <A>\n\n> Makes a string by concatenating Separator between the elements of Strings.\n> 用 Separator 把 Element 数组拼接成一个字符串。\n\n`using { /Verse.org/Verse }`\n\n```verse\nJoin<public><native>(Strings:[][]char, Separator:[]char):[]char\n```\n\n## Parameters\n\nJoin 接受以下参数：\n| Name | Type | Description |\n| Strings | [][]char |  |\n| Separator | []char |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nS := Join(array{\"a\", \"b\", \"c\"}, \"-\")   # a-b-c\n```\n", "01_Verse.org/010_Verse/tostring-2.md": "---\nname: ToString\nslug: versedotorg/verse/tostring-2\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/tostring-2\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# ToString function <A>\n\n> Returns String without modification.\n> 把 String 原样返回（string 的 ToString 重载）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nToString<public>(String:[]char):[]char\n```\n\n## Parameters\n\nToString 接受以下参数：\n| Name | Type | Description |\n| String | []char |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/tostring-3.md": "---\nname: ToString\nslug: versedotorg/verse/tostring-3\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/tostring-3\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# ToString function <A>\n\n> Makes a string from Character.\n> 把单个 Character（char）转成字符串。\n\n`using { /Verse.org/Verse }`\n\n```verse\nToString<public><native>(Character:char):[]char\n```\n\n## Parameters\n\nToString 接受以下参数：\n| Name | Type | Description |\n| Character | char |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/subscribable.md": "---\nname: subscribable\nslug: versedotorg/verse/subscribable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/subscribable\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# subscribable function <A>\n\n> A parametric interface implemented by events with a payload that can be subscribed to. Matched with signalable.\n> 带载荷、可被订阅（Subscribe 持续接收）的事件实现的参数化接口。\n\n`using { /Verse.org/Verse }`\n\n```verse\nsubscribable<public>(t:any):subscribable(t)\n```\n\n```verse\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n```\n\n## Parameters\n\nsubscribable 接受以下参数：\n| Name | Type | Description |\n| t | any |  |\n\n### Generated Interface\nsubscribable 返回参数化接口 subscribable(t)。\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n\n## 示例\n\n```verse\nE:event(int) = event(int){}\nE.Subscribe(Handler)   # Handler 为类成员函数\n```\n", "01_Verse.org/010_Verse/subscribable-1.md": "---\nname: subscribable\nslug: versedotorg/verse/subscribable-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/subscribable-1\nkind: function\nmodule: /Verse.org/verse\ngrade: A\ndepth: full\nstatus: done\n---\n\n# subscribable function <A>\n\n> A parameterless interface implemented by events that can be subscribed to.\n> 无载荷、可被订阅的事件实现的参数化接口。\n\n`using { /Verse.org/Verse }`\n\n```verse\nsubscribable<public>():subscribable(t)\n```\n\n## Parameters\n\nsubscribable 不接受任何参数。\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/inf.md": "---\nname: Inf\nslug: versedotorg/verse/inf\nurl: \nkind: data\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Inf <B>\n\n浮点正无穷常量（IEEE 754 Inf）。\n\n`/Verse.org/Verse`\n", "01_Verse.org/010_Verse/nan.md": "---\nname: NaN\nslug: versedotorg/verse/nan\nurl: \nkind: data\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# NaN <B>\n\n浮点非数常量（IEEE 754 NaN），表示无效的浮点运算结果。\n\n`/Verse.org/Verse`\n", "01_Verse.org/010_Verse/pifloat.md": "---\nname: PiFloat\nslug: versedotorg/verse/pifloat\nurl: \nkind: data\nmodule: /Verse.org/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# PiFloat <B>\n\n浮点圆周率 π 常量。\n\n`/Verse.org/Verse`\n", "01_Verse.org/010_Verse/010_Easing/_overview.md": "---\nname: Easing module\nslug: versedotorg/verse/easing\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse\nkind: module\nmodule: /versedotorg/verse\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Easing module <B>\n\n缓动插值函数族：为动画/关键帧运动提供速度曲线。\n\n## Functions\n\n| Name | Description |\n|---|---|\n| [Linear](linear.md) | 线性插值函数：动画匀速运动。 |\n| [CubicBezier](cubicbezier.md) | 构造三次贝塞尔插值函数。 |\n| [Ease](ease.md) | 缓动插值：起步慢、加速、结尾再减速（结尾略慢于开始）。 |\n| [EaseIn](easein.md) | 缓入插值：起步慢，逐渐加速。 |\n| [EaseOut](easeout.md) | 缓出插值：起步快，逐渐减速。 |\n| [EaseInOut](easeinout.md) | 缓入缓出插值：起步慢、中间快、结尾慢。 |\n\n## Submodules\n\n| Name | Description |\n|---|---|\n| [Easing](010_Easing/_overview.md) | 缓动插值函数族（Linear/Ease/EaseIn/EaseOut/EaseInOut/CubicBezier）。 |\n", "01_Verse.org/010_Verse/010_Easing/cubicbezier.md": "---\nname: CubicBezier\nslug: versedotorg/verse/easing/cubicbezier\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/easing/cubicbezier\nkind: function\nmodule: /Verse.org/verse/easing\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# CubicBezier function <B>\n\n> Make a cubic bezier interpolation function.\n> 构造三次贝塞尔插值函数。\n\n`using { /Verse.org/Verse/Easing }`\n\n```verse\nCubicBezier<public><native>(X1:float, Y1:float, X2:float, Y2:float):(float):float\n```\n\n## Parameters\n\nCubicBezier 接受以下参数：\n| Name | Type | Description |\n| X1 | float |  |\n| Y1 | float |  |\n| X2 | float |  |\n| Y2 | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/010_Easing/linear.md": "---\nname: Linear\nslug: versedotorg/verse/easing/linear\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/easing/linear\nkind: function\nmodule: /Verse.org/verse/easing\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Linear function <B>\n\n> Linear interpolation function. Linear animations move at a constant speed.\n> 线性插值函数：动画匀速运动。\n\n`using { /Verse.org/Verse/Easing }`\n\n```verse\nLinear<public><native_callable>(Value:float):float\n```\n\n## Parameters\n\nLinear 接受以下参数：\n| Name | Type | Description |\n| Value | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/010_Easing/ease.md": "---\nname: Ease\nslug: versedotorg/verse/easing/ease\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/easing/ease\nkind: function\nmodule: /Verse.org/verse/easing\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Ease function <B>\n\n> Ease interpolation function. Ease animations start slowly, speed up, then end slowly. The speed of the animation is slightly slower at the end than the start.\n> 缓动插值：起步慢、加速、结尾再减速（结尾略慢于开始）。\n\n`using { /Verse.org/Verse/Easing }`\n\n```verse\nEase<public><native_callable>(Value:float):float\n```\n\n## Parameters\n\nEase 接受以下参数：\n| Name | Type | Description |\n| Value | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/010_Easing/easein.md": "---\nname: EaseIn\nslug: versedotorg/verse/easing/easein\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/easing/easein\nkind: function\nmodule: /Verse.org/verse/easing\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# EaseIn function <B>\n\n> Ease-in interpolation function. EaseIn animations start slow, then speed up towards the end.\n> 缓入插值：起步慢，逐渐加速。\n\n`using { /Verse.org/Verse/Easing }`\n\n```verse\nEaseIn<public><native_callable>(Value:float):float\n```\n\n## Parameters\n\nEaseIn 接受以下参数：\n| Name | Type | Description |\n| Value | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/010_Easing/easeout.md": "---\nname: EaseOut\nslug: versedotorg/verse/easing/easeout\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/easing/easeout\nkind: function\nmodule: /Verse.org/verse/easing\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# EaseOut function <B>\n\n> Ease-out interpolation function. EaseOut animations start fast, then slow down towards the end.\n> 缓出插值：起步快，逐渐减速。\n\n`using { /Verse.org/Verse/Easing }`\n\n```verse\nEaseOut<public><native_callable>(Value:float):float\n```\n\n## Parameters\n\nEaseOut 接受以下参数：\n| Name | Type | Description |\n| Value | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/010_Verse/010_Easing/easeinout.md": "---\nname: EaseInOut\nslug: versedotorg/verse/easing/easeinout\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/easing/easeinout\nkind: function\nmodule: /Verse.org/verse/easing\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# EaseInOut function <B>\n\n> Ease-in-out interpolation function. EaseInOut animations are similar to Ease but the start and end animation speed is symmetric.\n> 缓入缓出插值：起步慢、中间快、结尾慢。\n\n`using { /Verse.org/Verse/Easing }`\n\n```verse\nEaseInOut<public><native_callable>(Value:float):float\n```\n\n## Parameters\n\nEaseInOut 接受以下参数：\n| Name | Type | Description |\n| Value | float |  |\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/020_Native/_overview.md": "---\nname: Native\nslug: versedotorg/native\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/native\nkind: module\nmodule: /Verse.org\ngrade: C\ndepth: brief\nstatus: done\n---\n\n# Native module <C>\n\n> This module is currently empty; it does not have submodules or content of its own.\n> 官方标注：此模块当前为空，没有子模块或自有内容。\n", "01_Verse.org/030_Chat/_overview.md": "---\nname: Chat module\nslug: versedotorg/chat\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/chat\nkind: module\nmodule: /versedotorg\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Chat module <B>\n\n语音/文本聊天频道管理：创建频道、指定成员权限、处理加/退频道错误。\n\n## Classes and Structs\n\n| Name | Description |\n|---|---|\n| [add_channel_error](add_channel_error.md) | 通过 AddChatChannel 添加频道失败时返回的错误。 |\n| [remove_channel_error](remove_channel_error.md) | 通过 RemoveChatChannel 移除频道失败时返回的错误。 |\n\n## Interfaces\n\n| Name | Description |\n|---|---|\n| [has_voice_member_info](has_voice_member_info.md) | 用于为 voice_channel 指定权限等设置的接口（如是否可发言）。 |\n\n## Functions\n\n| Name | Description |\n|---|---|\n| [chat_channel](chat_channel.md) | 参数化构造：按 member_info 类型创建文本聊天频道。 |\n| [voice_channel](voice_channel.md) | 参数化构造：创建语音频道。语音频道定义一组可通过语音交流的代理；一个代理可同时属于多个频道，频道最多容纳 80 名成员，参与者也可能因家长控制/用户设置被限制语音。 |\n", "01_Verse.org/030_Chat/chat_channel_member_info.md": "---\nname: chat_channel(member_info)\nslug: versedotorg/chat/chat_channel/chat_channel(member_info)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/chat/chat_channel/chat_channel(member_info)\nkind: class\nmodule: /Verse.org/chat/chat_channel\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# chat_channel(member_info) class <B>\n\n文本聊天频道：以 member_info 参数化的频道类。\n\n`using { /Verse.org/Chat }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Name | message |  |\n| Group | unknown |  |\n", "01_Verse.org/030_Chat/voice_channel_member_info.md": "---\nname: voice_channel(member_info)\nslug: versedotorg/chat/voice_channel/voice_channel(member_info)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/chat/voice_channel/voice_channel(member_info)\nkind: class\nmodule: /Verse.org/chat/voice_channel\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# voice_channel(member_info) class <B>\n\n> A voice_channel defines a group of agents who can communicate via voice chat. An agent can be a member of more than one voice_channel.Voice channels can accommodate 80 members of the channel's Group. Agents beyond this limit are not included in the chat.A chat participant in a voice_channel may be restricted from voice chat based on parental controls and/or user settings.\n> 语音频道：定义一组可通过语音交流的代理（agent）。一个代理可同时属于多个语音频道；频道最多容纳 80 名成员，超出者不被纳入聊天。频道参与者也可能因家长控制或用户设置而被限制语音。\n\n`using { /Verse.org/Chat }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| chat_channel(member_info) |  |\n\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Group | unknown |  |\n| Name | message |  |\n", "01_Verse.org/030_Chat/add_channel_error.md": "---\nname: add_channel_error\nslug: versedotorg/chat/add_channel_error\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/chat/add_channel_error\nkind: class\nmodule: /Verse.org/chat\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# add_channel_error class <C>\n\n通过 AddChatChannel 添加频道失败时返回的错误。\n", "01_Verse.org/030_Chat/remove_channel_error.md": "---\nname: remove_channel_error\nslug: versedotorg/chat/remove_channel_error\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/chat/remove_channel_error\nkind: class\nmodule: /Verse.org/chat\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# remove_channel_error class <C>\n\n通过 RemoveChatChannel 移除频道失败时返回的错误。\n", "01_Verse.org/030_Chat/has_voice_member_info.md": "---\nname: has_voice_member_info\nslug: versedotorg/chat/has_voice_member_info\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/chat/has_voice_member_info\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: done\n---\n\n> Used to specify permissions and other settings for a voice_channel.\n> 用于为 voice_channel 指定权限等设置的接口。\n\n`using { /Verse.org/Chat }`\n\n## Exposed Interfaces\n\nThis interface exposes the following interfaces:（此接口暴露以下接口：）\n\n| Name | Description |\n|---|---|\n| member_info_interface | 定义「可作为代理组成员信息」的接口。 |\n\n## Members\n\nThis interface has data members, but no functions.（此接口只有数据成员，没有函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| CanBroadcast | ?logic | 决定参与者能否向频道发送语音消息。为 true 时，参与者仍能听到正在发言的成员，并在社交面板中看到相关用户。 |\n\n## 补充说明\n\n- 实现 [member_info_interface interface](member_info_interface.md) 后即可同时用于代理组与语音频道。\n", "01_Verse.org/030_Chat/chat_channel.md": "---\nname: chat_channel\nslug: versedotorg/chat/chat_channel\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/chat/chat_channel\nkind: function\nmodule: /Verse.org/chat\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# chat_channel function <B>\n\n参数化构造：按 member_info 类型创建文本聊天频道。\n\n`using { /Verse.org/Chat }`\n\n```verse\nchat_channel<public>(member_info:member_info_interface):chat_channel(member_info)\n```\n\n```verse\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n```\n\n## Parameters\n\nchat_channel 接受以下参数：\n| Name | Type | Description |\n| member_info | member_info_interface |  |\n\n### Generated Class\nchat_channel 返回参数化类 chat_channel(member_info)。\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/030_Chat/voice_channel.md": "---\nname: voice_channel\nslug: versedotorg/chat/voice_channel\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/chat/voice_channel\nkind: function\nmodule: /Verse.org/chat\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# voice_channel function <B>\n\n> A voice_channel defines a group of agents who can communicate via voice chat. An agent can be a member of more than one voice_channel.Voice channels can accommodate 80 members of the channel's Group. Agents beyond this limit are not included in the chat.A chat participant in a voice_channel may be restricted from voice chat based on parental controls and/or user settings.\n> 参数化构造：创建语音频道。语音频道定义一组可通过语音交流的代理；一个代理可同时属于多个频道，频道最多容纳 80 名成员，参与者也可能因家长控制/用户设置被限制语音。\n\n`using { /Verse.org/Chat }`\n\n```verse\nvoice_channel<public>(member_info:has_voice_member_info):voice_channel(member_info)\n```\n\n```verse\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n```\n\n## Parameters\n\nvoice_channel 接受以下参数：\n| Name | Type | Description |\n| member_info | has_voice_member_info |  |\n\n### Generated Class\nvoice_channel 返回参数化类 voice_channel(member_info)。\n\n_（Attributes/Specifiers/Effects 公共说明见《Specifiers 与 Effects 对照》，此处不重复官网公共表格）_\n", "01_Verse.org/040_SceneGraph/_overview.md": "---\nname: SceneGraph module\nslug: versedotorg/scenegraph\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph\nkind: module\nmodule: /versedotorg\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# SceneGraph module <S>\n\nSceneGraph 是「实体＋组件」的下一代场景对象模型：entity 是节点，行为与数据挂在 component 上，transform_component 决定位置，辅以相机、灯光、碰撞、交互、骨骼动画等组件族。\n\n## Classes and Structs\n\n| Name | Description |\n|---|---|\n| [basic_interactable_component](basic_interactable_component.md) | 具有可组合特性集的交互组件。 |\n| [interactable_component](interactable_component.md) | 用于处理通用交互。 |\n| [interactable_cooldown](interactable_cooldown.md) | 设置交互后的冷却。 |\n| [interactable_cooldown_per_agent](interactable_cooldown_per_agent.md) | 按代理分别设置交互冷却。 |\n| [interactable_duration](interactable_duration.md) | 设置一次交互的持续时长。 |\n| [interactable_success_limit](interactable_success_limit.md) | 设置可成功交互的次数上限。 |\n| [camera_body](camera_body.md) | 相机机身设置，如传感器/胶片、快门速度等。 |\n| [camera_component](camera_component.md) | 表示相机的物理机身、镜头及其他电影摄影属性：传感器尺寸、宽高比锁定/约束、焦距、对焦距离、位置等。 |\n| [camera_director_component](camera_director_component.md) | 负责在活动相机变化时选择相机并进行混合；还可在不同相机之间共享全局设置（如后期处理设置）。 |\n| [camera_lens](camera_lens.md) | 相机镜头设置。 |\n| [camera_modifier_stack](camera_modifier_stack.md) | 相机状态的修饰符栈。 |\n| [camera_modifier](camera_modifier.md) | 可修改相机状态的对象的基类。 |\n| [camera_state](camera_state.md) | 相机的当前状态。 |\n| [camera_transition](camera_transition.md) | 控制相机模式之间如何过渡。 |\n| [camera_mode_blend](camera_mode_blend.md) | 两种相机模式之间的可配置混合。 |\n| [camera_mode_blend_pop](camera_mode_blend_pop.md) | 瞬间切换（snap）到目标模式。 |\n| [camera_mode_blend_linear](camera_mode_blend_linear.md) | 相机模式之间的线性混合。 |\n| [camera_mode_blend_smoothstep](camera_mode_blend_smoothstep.md) | 使用 smoothstep 函数在两种相机模式之间混合。 |\n| [camera_mode_blend_smootherstep](camera_mode_blend_smootherstep.md) | 使用 smootherstep 函数在两种相机模式之间混合。 |\n| [camera_mode_blend_orbit](camera_mode_blend_orbit.md) | 两种相机模式之间的可配置混合（orbit 轨道变体）。 |\n| [orthographic_camera_component](orthographic_camera_component.md) | 简单的正交相机。 |\n| [perspective_camera_component](perspective_camera_component.md) | 简单的透视相机。 |\n| [physical_camera_component](physical_camera_component.md) | 基于物理的相机：以更接近真实物理相机的方式决定取景属性。 |\n| [skeletal_animation](skeletal_animation.md) | 骨架的修饰符：用骨骼动画驱动网格变形。 |\n| [play_skeletal_animation_result](play_skeletal_animation_result.md) | 播放骨骼动画的结果。 |\n| [skeleton](skeleton.md) | 骨架（skeleton）是骨骼与骨骼组/链（sets/chains）的集合。 |\n| [capsule_light_component](capsule_light_component.md) | 胶囊灯：从指定半径与长度的胶囊形光源向场景四周发光；半径与长度为 0 时等效于点光源。 |\n| [directional_light_component](directional_light_component.md) | 方向光：模拟来自无限远处的光源，投射的阴影相互平行。 |\n| [light_component](light_component.md) | SceneGraph 中灯光组件的基类。依赖：实体上的 transform_component 决定灯的位置。 |\n| [rect_light_component](rect_light_component.md) | 矩形面光灯：从指定宽高的矩形平面向场景发光，可用于模拟各类面光源。 |\n| [sphere_light_component](sphere_light_component.md) | 球形灯：从指定半径的球形光源向四周发光；半径为 0 时为点光源。 |\n| [spot_light_component](spot_light_component.md) | 聚光灯：从单点按锥形发光；锥形由内锥角（InnerConeAngleDegrees）与外锥角（OuterConeAngleDegrees）定义。 |\n| [collision_channel](collision_channel.md) | 碰撞通道：每个体积都在其 collision_profile 中带有碰撞通道，用于决定两个体积如何交互。 |\n| [collision_profile](collision_profile.md) | 碰撞轮廓：决定体积在 Overlap 查询、Sweep 查询与物理模拟中如何与其他体积交互。 |\n| [overlap_hit](overlap_hit.md) | Overlap 查询的结果：SourceVolumes 中任一体积与其他体积的每个相交各产生一个 overlap_hit。见 entity.FindOverlapHits()。 |\n| [sweep_hit](sweep_hit.md) | Sweep 查询的结果：每个相交产生一个 sweep_hit。见 entity.FindSweepHits()。 |\n| [collision_volume](collision_volume.md) | 碰撞体积：表示网格的碰撞形状，可被 Overlap/Sweep 查询检测，并在物理模拟中产生碰撞。 |\n| [collision_element](collision_element.md) | 由单一体积＋单一 collision_profile 与 collision_material 构成的碰撞体积基类，覆盖大多数体积类型。 |\n| [collision_capsule](collision_capsule.md) | 沿 Z 轴对齐的碰撞胶囊体。 |\n| [collision_sphere](collision_sphere.md) | 碰撞球体。 |\n| [collision_point](collision_point.md) | 碰撞点。 |\n| [collision_box](collision_box.md) | 轴对齐碰撞盒。 |\n| [particle_system_component](particle_system_component.md) | 在实体位置生成 particle_system；组件在场景中期间粒子系统持续模拟。依赖：实体上的 transform_component。 |\n| [sound_component](sound_component.md) | 在实体位置播放音效的组件。 |\n| [mesh_component](mesh_component.md) | 在实体位置渲染网格。网格是一组多边形，可用于表现世界中的形状，如植被、地形装饰、建筑与道具等。 |\n| [possessable_component](possessable_component.md) | 标记可被代理（agent）附身（possess）的实体。 |\n| [entity_prefab](entity_prefab.md) | 编辑器定义的预制体（prefab）的引用类型；只有生成的 digest 代码才应引用此类型。 |\n| [icon_component](icon_component.md) | 保存实体图标的组件。 |\n| [entity_origin](entity_origin.md) | 为实体提供替代原点（默认为 transform_component）的类。 |\n| [float_range](float_range.md) | 带最小值与最大值的范围；值要落在范围内须满足 min ≤ max。 |\n| [execution_listenable](execution_listenable.md) | 订阅或等待组件 TickEvents 各阶段的 DeltaTime 回调。 |\n| [rarity](rarity.md) | 稀有度：供玩法与表现系统对事物进行分类与分级。 |\n| [common_rarity](common_rarity.md) | 稀有度：常见（Common）。 |\n| [uncommon_rarity](uncommon_rarity.md) | 稀有度：非常见（Uncommon）。 |\n| [rare_rarity](rare_rarity.md) | 稀有度：稀有（Rare）。 |\n| [epic_rarity](epic_rarity.md) | 稀有度：史诗（Epic）。 |\n| [legendary_rarity](legendary_rarity.md) | 稀有度：传说（Legendary）。 |\n| [rarity_component](rarity_component.md) | 标注实体稀有度的组件。 |\n| [stackable_component](stackable_component.md) | 挂到实体后，允许其与具有兼容组件的其他实体合并（堆叠）的组件。 |\n| [change_stack_size_result](change_stack_size_result.md) | 更改堆叠数量的结果。 |\n| [change_max_stack_size_result](change_max_stack_size_result.md) | 更改最大堆叠数量的结果。 |\n| [basic_stackable_component](basic_stackable_component.md) | 基础堆叠组件。 |\n\n## Interfaces\n\n| Name | Description |\n|---|---|\n| [has_camera_modifier](has_camera_modifier.md) | 拥有相机修饰符栈的类实现的接口。 |\n| [easeable](easeable.md) | 用于触发缓动行为的接口。 |\n| [scene_event](scene_event.md) | 可通过场景图发送的事件。 |\n| [origin](origin.md) | 为实体提供替代原点的接口（默认原点为其父实体），见 transform_component。 |\n| [has_merge_rules](has_merge_rules.md) | 想参与实体可合并性检查的组件实现的「合并规则」接口。 |\n\n## Enumerations\n\n| Name | Description |\n|---|---|\n| [camera_projection_mode](camera_projection_mode.md) | 相机投影模式（正交/透视等）。 |\n| [camera_transition_initial_orientation](camera_transition_initial_orientation.md) | 控制相机模式过渡时的初始朝向。 |\n| [collision_interaction](collision_interaction.md) | 指定一对碰撞体积应如何交互，见 collision_profile。 |\n| [entity_streaming_policy](entity_streaming_policy.md) | 实体的客户端流送模式。 |\n| [children_streaming_policy](children_streaming_policy.md) | 子实体的客户端流送模式。 |\n\n| GlobalModifierPosition 〔无独立页面〕 | （无独立页面）全局修饰符位置常量。 |\n| VisualModifierPosition 〔无独立页面〕 | （无独立页面）视觉修饰符位置常量。 |\n", "01_Verse.org/040_SceneGraph/easing_function.md": "---\nname: easing_function\nslug: versedotorg/scenegraph/keyframedmovement/easing_function\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/easing_function\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# easing_function class <B>\n\n> Base class for an animation easing function.\n> 动画缓动函数的基类。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Members\n\n只有函数，没有数据成员。\n\n### Functions\n| Function Name | Description |\n| Evaluate |  |\n", "01_Verse.org/040_SceneGraph/stationary.md": "---\nname: stationary\nslug: versedotorg/scenegraph/collisionchannels/stationary\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collisionchannels/stationary\nkind: class\nmodule: /Verse.org/scenegraph/collisionchannels\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# stationary class <B>\n\n碰撞通道：静态（stationary）物体。\n\n`using { /Verse.org/SceneGraph/CollisionChannels }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| collision_channel | 每个体积都在其 collision_profile 中带有碰撞通道，用于决定两个体积如何交互，见 collision_profile。 |\n\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/cubic_bezier_easing_function.md": "---\nname: cubic_bezier_easing_function\nslug: versedotorg/scenegraph/keyframedmovement/cubic_bezier_easing_function\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/cubic_bezier_easing_function\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# cubic_bezier_easing_function class <B>\n\n> Cubic bezier easing function. See CubicBezierEasingFunctions for some basic easing values.\n> 三次贝塞尔缓动函数，基础缓动值参见 CubicBezierEasingFunctions。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| easing_function | 动画缓动函数的基类。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| X0 | float |  |\n| X1 | float |  |\n| Y0 | float |  |\n| Y1 | float |  |\n\n### Functions\n| Function Name | Description |\n| Evaluate |  |\n| Evaluate |  |\n", "01_Verse.org/040_SceneGraph/dynamic.md": "---\nname: dynamic\nslug: versedotorg/scenegraph/collisionchannels/dynamic\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collisionchannels/dynamic\nkind: class\nmodule: /Verse.org/scenegraph/collisionchannels\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# dynamic class <B>\n\n碰撞通道：动态（dynamic）物体。\n\n`using { /Verse.org/SceneGraph/CollisionChannels }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| collision_channel | 每个体积都在其 collision_profile 中带有碰撞通道，用于决定两个体积如何交互，见 collision_profile。 |\n\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/avatar.md": "---\nname: avatar\nslug: versedotorg/scenegraph/collisionchannels/avatar\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collisionchannels/avatar\nkind: class\nmodule: /Verse.org/scenegraph/collisionchannels\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# avatar class <B>\n\n碰撞通道：角色（avatar，玩家角色）。\n\n`using { /Verse.org/SceneGraph/CollisionChannels }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| collision_channel | 每个体积都在其 collision_profile 中带有碰撞通道，用于决定两个体积如何交互，见 collision_profile。 |\n\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/linear_easing_function.md": "---\nname: linear_easing_function\nslug: versedotorg/scenegraph/keyframedmovement/linear_easing_function\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/linear_easing_function\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# linear_easing_function class <B>\n\n> Linear animations move at a constant speed.\n> 线性缓动：动画匀速运动。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| easing_function | 动画缓动函数的基类。 |\n| cubic_bezier_easing_function | 三次贝塞尔缓动函数。基础缓动值参见 CubicBezierEasingFunctions。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| X0 | float |  |\n| X0 | float |  |\n| X1 | float |  |\n| X1 | float |  |\n| Y0 | float |  |\n| Y0 | float |  |\n| Y1 | float |  |\n| Y1 | float |  |\n\n### Functions\n| Function Name | Description |\n| Evaluate |  |\n| Evaluate |  |\n", "01_Verse.org/040_SceneGraph/basic_interactable_component.md": "---\nname: basic_interactable_component\nslug: versedotorg/scenegraph/basic_interactable_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/basic_interactable_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: A\ndepth: full\nstatus: done\n---\n\n# basic_interactable_component class <A>\n\n> An interactable component with a composable feature set.\n> 具有可组合特性集的交互组件。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| interactable_component | 用于处理通用交互。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| CanceledEvent | unknown | 交互在成功完成前被中断时触发；载荷为此前交互的代理。interactable_component 本身不可取消，此事件供子类在合适时机触发。 |\n| CanInteractMessage | ?message | CanInteract 成功时显示的消息。 |\n| CannotInteractMessage | ?message | CanInteract 失败时显示的消息。 |\n| Cooldown | ?interactable_cooldown | 冷却在成功交互后开始计时；作用于该组件上的所有交互尝试（全局冷却）。 |\n| CooldownPerAgent | ?interactable_cooldown_per_agent | 冷却在成功交互后开始计时；仅作用于成功者的后续交互尝试（按代理冷却）。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| InteractableDuration | ?interactable_duration | 带时长的交互要等时长走完才算成功；期间可被取消，不保证成功。 |\n| InteractingAgents | ?[]agent | 当前正在与此可交互物交互的代理。 |\n| StartedEvent | unknown | 成功交互开始时触发；载荷为交互代理。InteractDuration ≤ 0 时本事件与 InteractSucceededEvent 相同。 |\n| SucceededEvent | unknown | 交互成功完成时触发；载荷为此前交互的代理。InteractDuration ≤ 0 时本事件与 InteractStartedEvent 相同。 |\n| SuccessLimit | ?interactable_success_limit | 成功次数上限：达到指定成功次数后阻止新的交互。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| Cancel | 尝试取消一次交互；给定代理当前未在交互则失败。 |\n| CanInteract | 返回指定代理当前能否交互。 |\n| Disable | 禁用与该组件的交互。禁用后不显示交互提示。 |\n| Enable | 启用与该组件的交互。 |\n| GetRemainingCooldownDurationAffectingAgent | 获取给定代理的剩余冷却：返回共享冷却与按代理冷却中较大者的剩余秒数；同一事务内多次调用返回相同值。 |\n| InteractMessage |  |\n| InteractMessage | 返回适合展示给玩家、说明当前交互状态的消息。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| OnStarted | 当 CanInteract 通过后由 Start 调用以开始交互；重写它可实现自定义交互行为。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| SignalCancelEvent | 触发 CanceledEvent 事件。 |\n| SignalStartEvent | 触发 StartedEvent 事件。 |\n| SignalSucceedEvent | 触发 SucceededEvent 事件。 |\n| Start | 尝试开始交互；代理未通过 CanInteract 则失败。 |\n| Succeed | 尝试使交互成功。开始交互后经过 InteractDuration 也会自动成功；给定代理当前未在交互则失败。 |\n", "01_Verse.org/040_SceneGraph/ease_cubic_bezier_easing_function.md": "---\nname: ease_cubic_bezier_easing_function\nslug: versedotorg/scenegraph/keyframedmovement/ease_cubic_bezier_easing_function\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/ease_cubic_bezier_easing_function\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# ease_cubic_bezier_easing_function class <B>\n\n> Ease animations start slowly, speed up, then end slowly. The speed of the animation is slightly slower at the end than the start.\n> 缓动：起步慢、加速、结尾减速（结尾略慢于开始）。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| easing_function | 动画缓动函数的基类。 |\n| cubic_bezier_easing_function | 三次贝塞尔缓动函数。基础缓动值参见 CubicBezierEasingFunctions。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| X0 | float |  |\n| X0 | float |  |\n| X1 | float |  |\n| X1 | float |  |\n| Y0 | float |  |\n| Y0 | float |  |\n| Y1 | float |  |\n| Y1 | float |  |\n\n### Functions\n| Function Name | Description |\n| Evaluate |  |\n| Evaluate |  |\n", "01_Verse.org/040_SceneGraph/visibility.md": "---\nname: vi 用与该组件的交互。 |\n| InteractMessage | 返回适合展示给玩家、说明当前交互状态的消息。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| OnStarted | 当 CanInteract 通过后由 Start 调用以开始交互；重写它可实现自定义交互行为。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| SignalCancelEvent | 触发 CanceledEvent 事件。 |\n| SignalStartEvent | 触发 StartedEvent 事件。 |\n| SignalSucceedEvent | 触发 SucceededEvent 事件。 |\n| Start | 尝试开始交互；代理未通过 CanInteract 则失败。 |\n", "01_Verse.org/040_SceneGraph/ease_out_cubic_bezier_easing_function.md": "---\nname: ease_out_cubic_bezier_easing_function\nslug: versedotorg/scenegraph/keyframedmovement/ease_out_cubic_bezier_easing_function\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/ease_out_cubic_bezier_easing_function\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# ease_out_cubic_bezier_easing_function class <B>\n\n> EaseOut animations start fast, then slow down towards the end.\n> 缓出：起步快，逐渐减速。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| easing_function | 动画缓动函数的基类。 |\n| cubic_bezier_easing_function | 三次贝塞尔缓动函数。基础缓动值参见 CubicBezierEasingFunctions。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| X0 | float |  |\n| X0 | float |  |\n| X1 | float |  |\n| X1 | float |  |\n| Y0 | float |  |\n| Y0 | float |  |\n| Y1 | float |  |\n| Y1 | float |  |\n\n### Functions\n| Function Name | Description |\n| Evaluate |  |\n| Evaluate |  |\n", "01_Verse.org/040_SceneGraph/interactable_cooldown.md": "---\nname: interactable_cooldown\nslug: versedotorg/scenegraph/interactable_cooldown\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/interactable_cooldown\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# interactable_cooldown class <B>\n\n> Used to set a cooldown when interacted.\n> 设置交互后的冷却。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Duration | ?float | 成功交互后、任何人都可再次发起交互之前所需的秒数。仅在 duration > 0.0 时生效；修改它不影响 RemainingDuration。组件开始冷却时，其上的所有其他交互都会被取消。 |\n| RemainingDuration | ?float | 此组件上可再次发起新交互前的剩余冷却秒数。 |\n| ExpiredEvent | unknown | 共享冷却到期时触发的事件。 |\n", "01_Verse.org/040_SceneGraph/physics.md": "---\nname: physics\nslug: versedotorg/scenegraph/collisionchannels/physics\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collisionchannels/physics\nkind: class\nmodule: /Verse.org/scenegraph/collisionchannels\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# physics class <B>\n\n碰撞通道：物理（physics）。\n\n`using { /Verse.org/SceneGraph/CollisionChannels }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| collision_channel | 每个体积都在其 collision_profile 中带有碰撞通道，用于决定两个体积如何交互，见 collision_profile。 |\n\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/ease_in_out_cubic_bezier_easing_function.md": "---\nname: ease_in_out_cubic_bezier_easing_function\nslug: versedotorg/scenegraph/keyframedmovement/ease_in_out_cubic_bezier_easing_function\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/ease_in_out_cubic_bezier_easing_function\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# ease_in_out_cubic_bezier_easing_function class <B>\n\n> EaseInOut animations are similar to Ease but the start and end animation speed is symmetric.\n> 缓入缓出：类似 Ease，但首尾速度对称。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| easing_function | 动画缓动函数的基类。 |\n| cubic_bezier_easing_function | 三次贝塞尔缓动函数。基础缓动值参见 CubicBezierEasingFunctions。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| X0 | float |  |\n| X0 | float |  |\n| X1 | float |  |\n| X1 | float |  |\n| Y0 | float |  |\n| Y0 | float |  |\n| Y1 | float |  |\n| Y1 | float |  |\n\n### Functions\n| Function Name | Description |\n| Evaluate |  |\n| Evaluate |  |\n", "01_Verse.org/040_SceneGraph/interactable_cooldown_per_agent.md": "---\nname: interactable_cooldown_per_agent\nslug: versedotorg/scenegraph/interactable_cooldown_per_agent\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/interactable_cooldown_per_agent\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# interactable_cooldown_per_agent class <B>\n\n> Used to set a cooldown per agent when interacted.\n> 按代理分别设置交互冷却。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Duration | ?float | 成功交互后、发起交互的代理可再次发起交互之前所需的秒数。仅在 duration > 0.0 时生效；修改不影响 RemainingPerAgentCooldownDuration。当可同时交互人数有限时，此属性给其他代理留出交互时间。 |\n| RemainingDuration | ?[agent]float | 特定代理在此组件上可再次发起交互前的剩余冷却秒数。 |\n| ExpiredEvent | unknown | 按代理的冷却到期时触发；载荷为此前受冷却影响的代理。 |\n", "01_Verse.org/040_SceneGraph/interactable_duration.md": "---\nname: interactable_duration\nslug: versedotorg/scenegraph/interactable_duration\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/interactable_duration\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# interactable_duration class <B>\n\n> Used to set an interaction duration.\n> 设置一次交互的持续时长。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| InteractDuration | ?float | 代理需与对象持续交互这么多秒才能完成一次交互；≤0.0 表示立即成功。若在交互进行中设置，新值将用于下一次交互，剩余时长按「新值减去已用时间」更新；差值 ≤0 则立即结束。 |\n| MaxSimultaneousInteractors | ??int | 可同时交互的最大人数；false 表示不限。表示有多少代理可同时处于交互中。若改成小于当前活跃交互数的值，已有交互不取消，但不会开始新交互。 |\n\n### Functions\n| Function Name | Description |\n| GetRemainingInteractDurationForAgent | 返回某代理本次交互的剩余秒数；该代理未在交互则失败。同一事务内多次调用返回相同值。 |\n| SetRemainingInteractDurationForAgent | 设置某代理本次交互的剩余秒数；该代理未在交互则失败。 |\n", "01_Verse.org/040_SceneGraph/keyframed_movement_playback_mode.md": "---\nname: keyframed_movement_playback_mode\nslug: versedotorg/scenegraph/keyframedmovement/keyframed_movement_playback_mode\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/keyframed_movement_playback_mode\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# keyframed_movement_playback_mode class <B>\n\n> Controls how the animation plays back.\n> 控制动画的播放方式。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/interactable_success_limit.md": "---\nname: interactable_success_limit\nslug: versedotorg/scenegraph/interactable_success_limit\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/interactable_success_limit\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# interactable_success_limit class <B>\n\n> Used to set a limit of times to interact.\n> 设置可成功交互的次数上限。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| MaxSuccessfulInteractions | ??int | 此组件可被成功交互的次数；false 表示不限。达到 MaxSuccessfulInteractions 后所有活跃交互被取消，组件无法再被交互。 |\n| SuccessfulInteractionCount | ?int | 此组件已成功交互的次数。 |\n\n### Functions\n| Function Name | Description |\n| ClearSuccessfulInteractionCount | 重置成功交互次数计数。 |\n", "01_Verse.org/040_SceneGraph/oneshot_keyframed_movement_playback_mode.md": "---\nname: oneshot_keyframed_movement_playback_mode\nslug: versedotorg/scenegraph/keyframedmovement/oneshot_keyframed_movement_playback_mode\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/oneshot_keyframed_movement_playback_mode\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# oneshot_keyframed_movement_playback_mode class <B>\n\n> Play once and stop.\n> 播放一次后停止。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| keyframed_movement_playback_mode | 控制动画的播放方式。 |\n\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/camera_body.md": "---\nname: camera_body\nslug: versedotorg/scenegraph/camera_body\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/camera_body\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# camera_body class <B>\n\n> Camera body settings, e.g. sensor/film settings, shutter speed, etc\n> 相机机身设置，如传感器/胶片、快门速度等。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| SensorWidthMillimeters | float | 相机传感器宽度（毫米）。 |\n| SensorHeightMillimeters | float | 相机传感器高度（毫米）。 |\n| SensorHorizontalOffsetMillimeters | float | 相机传感器的水平偏移。 |\n| SensorVerticalOffsetMillimeters | float | 相机传感器的垂直偏移。 |\n| ISO | float | 相机对光的感光度。 |\n| ShutterSpeed | float | 相机快门速度。 |\n", "01_Verse.org/040_SceneGraph/loop_keyframed_movement_playback_mode.md": "---\nname: loop_keyframed_movement_playback_mode\nslug: versedotorg/scenegraph/keyframedmovement/loop_keyframed_movement_playback_mode\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/loop_keyframed_movement_playback_mode\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# loop_keyframed_movement_playback_mode class <B>\n\n> Play once and repeat indefinitely.\n> 播放一次后无限重复。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| keyframed_movement_playback_mode | 控制动画的播放方式。 |\n\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/camera_component.md": "---\nname: camera_component\nslug: versedotorg/scenegraph/camera_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/camera_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: A\ndepth: full\nstatus: done\n---\n\n# camera_component class <A>\n\n> Represents the physical body, lens of the camera and other cinematographic qualities, such as sensor size, aspect ratio lock/constraint, focal length, focus distance, post-process settings, etc.\n> 表示相机的物理机身、镜头及其他电影摄影属性：传感器尺寸、宽高比锁定/约束、焦距、对焦距离、位置等。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n\n\n## Exposed Interfaces\n\n此\u0001 暴露以下接口：\n| Name | Description |\n| has_camera_modifier | 拥有相机修饰符栈的类实现的接口。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| FarClippingPlaneDistance | ?float | 可选覆盖远裁剪面距离；值为 Inf 时使用默认设置。 |\n| NearClippingPlaneDistance | ?float | 可选覆盖近裁剪面距离；值 ≤ 0.0 时使用默认设置。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| GetEnterTransition | 获取进入此相机模式、过渡到指定相机模式时所用的过渡。 |\n| GetExitTransition | 获取退出此相机模式、过渡到目标相机模式时所用的过渡。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/pingpong_keyframed_movement_playback_mode.md": "---\nname: pingpong_keyframed_movement_playback_mode\nslug: versedotorg/scenegraph/keyframedmovement/pingpong_keyframed_movement_playback_mode\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/pingpong_keyframed_movement_playback_mode\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# pingpong_keyframed_movement_playback_mode class <B>\n\n> Play continuously reversing direction at each end.\n> 连续播放，在两端反向往复。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| keyframed_movement_playback_mode | 控制动画的播放方式。 |\n\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/camera_director_component.md": "---\nname: camera_director_component\nslug: versedotorg/scenegraph/camera_director_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/camera_director_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# camera_director_component class <B>\n\n> Responsible for selecting a camera and blending when the active camera changes. Also allows global settings to be shared between different cameras (such as post process settings) and modifications to the final blended camera state, such as camera shakes\n> 负责在活动相机变化时选择相机并进行混合；还可在不同相机之间共享全局设置（如后期处理设置）。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| camera_component | 表示相机的物理机身、镜头及其他电影摄影属性（传感器尺寸、宽高比锁定、焦距、对焦距离、位置等）。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| FarClippingPlaneDistance | ?float | 可选覆盖远裁剪面距离；值为 Inf 时使用默认设置。 |\n| NearClippingPlaneDistance | ?float | 可选覆盖近裁剪面距离；值 ≤ 0.0 时使用默认设置。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Descrip 播放使用的缓动函数。 |\n", "01_Verse.org/040_SceneGraph/camera_lens.md": "---\nname: camera_lens\nslug: versedotorg/scenegraph/camera_lens\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/camera_lens\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# camera_lens class <B>\n\n> Camera lens settings\n> 相机镜头设置。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| FocalLengthMillimeters | float | 镜头焦距（毫米）。 |\n| FStop | float | 镜头光圈（FStop）。 |\n| SqueezeFactor | float | 变形（anamorphic）镜头的挤压系数。 |\n| BladeCount | int | 光圈叶片数。 |\n", "01_Verse.org/040_SceneGraph/keyframed_movement_component.md": "---\nname: keyframed_movement_component\nslug: versedotorg/scenegraph/keyframedmovement/keyframed_movement_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/keyframedmovement/keyframed_movement_component\nkind: class\nmodule: /Verse.org/scenegraph/keyframedmovement\ngrade: A\ndepth: full\nstatus: done\n---\n\n# keyframed_movement_component class <A>\n\n> Provides teleportation and simple keyframe-based animation for an entity. Animations play back in the Pre-Physics tick phase. When animating an entity with a parent_constraint, animation will be relative to the parent entity.\n> 为实体提供传送与基于关键帧的简单动画；动画在物理前置（Pre-Physics）tick 阶段播放。\n\n`using { /Verse.org/SceneGraph/KeyframedMovement }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Duration | ??float | 获取此关键帧动画将花费的秒数；无固定时长时（如循环动画）失败。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| FinishedEvent | unknown | 获取动画结束时触发的事件；动画时长无限则失败。 |\n| KeyframeReachedEvent | unknown | 到达任一关键帧时触发。载荷：（关键帧序号:int, 是否反向:logic）。 |\n| PausedEvent | unknown | 获取动画暂停时触发的事件。 |\n| PlayedEvent | unknown | 获取动画开始或恢复播放时触发的事件。 |\n| StoppedEvent | unknown | 获取动画停止时触发的事件。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| HasValidAnimation | 是否存在可播放的有效关键帧集？ |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsPaused | 动画是否已暂停？ |\n| IsPlaying | 动画是否正在播放？ |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| Pause | 暂停运动；之后调用 Play() 会从暂停处继续。 |\n| Play | 开始或恢复播放。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| SetKeyframes | 停止进行中的动画，设置动画路径并以其当前变换为基准重定基；调用 Play() 前不会开始播放。 |\n| Stop | 停止并把变换重置到初始状态；之后调用 Play() 将从头开始动画。 |\n| Stop | 停止并把变换重置到初始状态；之后调用 Play() 将从头开始动画。 |\n", "01_Verse.org/040_SceneGraph/camera_modifier_stack.md": "---\nname: camera_modifier_stack\nslug: versedotorg/scenegraph/camera_modifier_stack\nurl: https://dev.epicgames.com/documentation/fortnite/verse-a imulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/perspective_camera_component.md": "---\nname: perspective_camera_component\nslug: versedotorg/scenegraph/perspective_camera_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/perspective_camera_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# perspective_camera_component class <B>\n\n> Simple perspective camera.\n> 简单的透视相机。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| camera_component | 表示相机的物理机身、镜头及其他电影摄影属性（传感器尺寸、宽高比锁定、焦距、对焦距离、位置等）。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| FarClippingPlaneDistance | ?float | 可选覆盖远裁剪面距离；值为 Inf 时使用默认设置。 |\n| FieldOfViewDegrees | ?float | 水平视场角（度），按 16:9 宽高比指定；再据此计算显示器真实宽高比下的有效水平视场角。例如屏幕是超宽屏（常见的 21:9 或 32:9），实际视场会更宽——即 Hor+ 视野缩放法，通常被认为是超宽屏的最佳方案。 |\n| NearClippingPlaneDistance | ?float | 可选覆盖近裁剪面距离；值 ≤ 0.0 时使用默认设置。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| GetEnterTransition | 获取进入此相机模式、过渡到指定相机模式时所用的过渡。 |\n| GetExitTransition | 获取退出此相机模式、过渡到目标相机模式时所用的过渡。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/physical_camera_component.md": "---\nname: physical_camera_component\nslug: versedotorg/scenegraph/physical_camera_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/physical_camera_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# physical_camera_component class <B>\n\n> Camera that is physically based, determining its view properties in a manner more consistent with a physical camera\n> 基于物理的相机：以更接近真实物理相机的方式决定取景属性。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| camera_component | 表示相机的物理机身、镜头及其他电影摄影属性（传感器尺寸、宽高比锁定、焦距、对焦距离、位置等）。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Body | ?camera_body | 相机机
