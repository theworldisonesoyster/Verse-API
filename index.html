<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse API Reference</title>
<style>
:root{--bg:#1c1c1c;--panel:#212121;--panel2:#282828;--fg:#e2e2e2;--dim:#96989e;--acc:#422439;--acc2:#c795b3;--line:#3a3a3a;
--s:#422439;--a:#37c98b;--b:#e8c34a;--c:#6b7280}
*{box-sizing:border-box}body{margin:0;font:15px/1.65 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#app{display:grid;grid-template-columns:330px 1fr;height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#side header{padding:14px 14px 10px}
#side h1{font-size:15px;margin:0 0 10px}
#search{width:100%;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;outline:none}
#grades{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gbtn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:4px 10px;border-radius:20px;font-size:12.5px;user-select:none}
.gbtn.on{background:var(--acc);border-color:#7a4a67;color:#fff}
#tree{flex:1;overflow:auto;padding:8px 6px 30px}
#tree ul{list-style:none;margin:0;padding-left:14px}
#tree>ul{padding-left:6px}
#tree li{margin:1px 0}
#tree li.d>span.t{font-weight:600;cursor:pointer;display:block;padding:3px 8px;border-radius:6px}
#tree li.d>span.t::before{content:"▾ ";color:var(--dim)}
#tree li.d.closed>span.t::before{content:"▸ "}
#tree li.d.closed>ul{display:none}
#tree li.d>span.t:hover{background:var(--panel2)}
#tree a{color:var(--fg);text-decoration:none;display:block;padding:3px 8px;border-radius:6px;cursor:pointer}
#tree a:hover{background:var(--panel2)}
#tree a.cur{background:var(--acc);color:#fff}
#tree a .g{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
.gS{background:var(--s)}.gA{background:var(--a)}.gB{background:var(--b)}.gC{background:var(--c)}
.pend{color:var(--dim);font-size:11px;margin-left:5px}
#main{overflow:auto;position:relative}
#content{max-width:900px;margin:0 auto;padding:34px 40px 90px}
#content h1{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:10px}
#content h2{font-size:20px;margin-top:34px}
#content code{background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:13px;font-family:Consolas,monospace}
#content pre{background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:10px;overflow:auto}
#content pre code{border:none;background:none;padding:0;font-size:13.5px;line-height:1.55}
#content blockquote{margin:0;padding:6px 14px;border-left:3px solid var(--acc);color:var(--dim);background:var(--panel2);border-radius:0 8px 8px 0}
#content table{border-collapse:collapse;margin:14px 0;width:100%}
#content th,#content td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:14px}
#content th{background:var(--acc);color:#f2e7ee;border-color:var(--line)}
#content a{color:var(--acc2);text-decoration:none}
#content a:hover{text-decoration:underline}
#nav{position:fixed;bottom:0;left:330px;right:0;display:flex;justify-content:space-between;padding:10px 40px;background:linear-gradient(transparent,var(--bg) 40%)}
#nav a{color:var(--acc2);cursor:pointer;background:var(--panel2);border:1px solid #5a3a4e;padding:6px 14px;border-radius:8px}
.pending-box{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--dim);margin:20px 0;text-align:center}
@media(max-width:900px){#app{grid-template-columns:1fr}#side{display:none}#nav{left:0}}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header><h1>Verse API Reference</h1><input id="search" placeholder="搜索 API 名称…"></header>
    <div id="grades"></div>
    <nav id="tree"></nav>
  </div>
  <div id="main"><article id="content"></article></div>
</div>
<div id="nav"><a id="prev">← 上一页</a><a id="next">下一页 →</a></div>

<script id="md-data" type="application/json">{"Intro.md": "# Verse API Reference\n\n> **本资料库（Verse API Reference）基于 [Epic 官方 Verse API Reference](https://dev.epicgames.com/documentation/fortnite/verse-api) 生成**（快照版本：API 42.10，抓取日期 2026-09-13），在官网结构之上增加了中文注解、示例代码与 S/A/B/C 重要程度分级。\n\n## 这是什么\n\n学习 Epic Games 的 Verse 语言时，官方 API 文档是英文的、按字母序排列、缺少\"该不该学\"的指引。本资料库按官网原本的 **模块层级与页面顺序** 重新组织，并为每个 API 提供：\n\n- 🇨🇳 **中文注解**——翻译官方描述，补充\"这是什么/何时用/常见坑\"\n- 💻 **可运行示例**——每个重要 API 配最小可用代码\n- 🎚️ **重要程度分级**——S 核心 / A 常用 / B 进阶 / C 参考，多选过滤见下方\"分级索引\"\n\n## 收录范围\n\n| 顶层模块 | 收录情况 |\n|---|---|\n| Verse.org | **全部 16 个子模块**（语言核心＋SceneGraph＋Simulation 等） |\n| UnrealEngine.com | **全部 11 个子模块**（含 Temporary 下的 UI/Curves/Diagnostics/SpatialMath） |\n| Fortnite.com | 精选 **5 个**：AI、Animation、Characters、Vehicles、UI（依据\"可能迁移至 UE6\"判断）；Devices 提供**纯索引页** |\n\n收录判断依据与逐模块说明见 [使用说明](使用说明.md)。\n\n## 分级与索引\n\n| 徽标 | 级别 | 说明 | 快速入口 |\n|---|---|---|---|\n| 🟦 | S 核心 | 几乎每个项目必用 | [S 级索引](90_分级索引/S索引.md) |\n| 🟩 | A 常用 | 多数项目会用 | [A 级索引](90_分级索引/A索引.md) |\n| 🟨 | B 进阶 | 特定场景使用 | [B 级索引](90_分级索引/B索引.md) |\n| ⬜ | C 参考 | 极少用、按需查询 | [C 级索引](90_分级索引/C索引.md) |\n\n## 在线浏览\n\n- **GitBook（推荐阅读）**：本仓库导入 GitBook 后在线查看，左侧边栏即完整层级。\n- **交互式页面**：仓库内的 `index.html` 是单文件交互版（双击本地即可打开，或部署到 GitHub Pages），支持**左侧层级树＋分级多选过滤＋搜索**。\n- **官方原文对照**：每个页面的 frontmatter 都有 `url` 字段指向官网原始页面。\n\n## 生成与维护\n\n结构清单见 [MANIFEST](MANIFEST.md)，写作规范见 [STYLE_GUIDE](STYLE_GUIDE.md)，各模块生成进度见 [PROGRESS](PROGRESS.md)。所有页面基于 `sources/` 目录中保存的官方页面快照生成，避免臆造 API。\n", "00_语言基础/_overview.md": "---\nname: 语言基础（补充）\nslug: (补充)语言基础\nurl: \nkind: module\nmodule: /语言基础\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# 语言基础\n\n> 官网 API Reference 只收录模块/类/函数，**语言内建类型与表达式没有独立页面**（array、map、option、failure 机制等都散在语言文档里）。为补齐学习链路，本章以\"补充\"形式撰写，页首一律标注，与官网镜像内容明确区分。\n\n## 页面一览\n\n| 页面 | 一句话 | 级别 |\n|---|---|---|\n| [array——数组](array.md) | 有序集合 `T[]`，索引可失败 | 🟦 S |\n| [map——映射](map.md) | 键值集合 `[K]V`，weak_map 全局变量 | 🟦 S |\n| [option——可选值](option.md) | 可能没有值：`?T`、空值写作 `false` | 🟦 S |\n| [可失败表达式与failure](failure.md) | Verse 的核心错误处理哲学 | 🟦 S |\n| [string——字符串](string.md) | 插值 `{}`、Join、与 []char 转换 | 🟩 A |\n| [数值类型 int/float/rational](int.md) | 整除可失败、rational 防浮点误差 | 🟩 A |\n| [logic与void](logic_void.md) | 真/假值与无返回 | 🟨 B |\n| [元组与子类型](tuple_subtype.md) | 打包多值、where 约束 | 🟨 B |\n\n## 相关页面\n\n- [Verse.org 总览](../01_Verse.org/_overview.md)\n- [Intro 首页](../Intro.md)\n", "00_语言基础/map.md": "---\nname: map——映射\nslug: (补充)语言基础.map\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\n---\n\n# map——映射 🟦【S级·核心】\n\n> 映射是\"键 → 值\"的内建关联容器，属于 Verse 语言内建。\n> 类型写作 `[K]V`（如 `[string]int`），字面量写作 `map{\"a\" => 1, \"b\" => 2}`。\n\n## 这是什么\n\n映射按**键**存取值，就像字典。三个要点：\n\n1. **取值可失败**：`M[K]` 在键不存在时失败，必须放在失败上下文里。\n2. **不可变**：和数组一样，\"修改\"是生成新映射再 `set` 回去；`ConcatenateMaps` 可合并。\n3. **键需可比较**：常用 int/string/player 等作键；配合 `weak_map` 可以用对象当键（见 session 页的全局变量模式）。\n\n## 最小示例\n\n```verse\nScores:[string]int = map{\"Anna\" => 3, \"Ben\" => 7}\n\nAddPoint(Name:string):void =\n    Old := Scores[Name] or 0                     # 不存在则 0\n    if (set Scores = ConcatenateMaps(Scores, map{Name => Old + 1})) {}\n    # 单键更新也可以直接: if (set Scores[Name] = Old + 1) {}\n\nLookup(Name:string):string =\n    \"{Name} 的分数: {Scores[Name] or 0}\"\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `M[K]` | 取键对应的值 | 缺键失败 |\n| `M[K] = V` | （在 `set` 中）设置/更新键 | — |\n| `ConcatenateMaps(A, B)` | 合并两个映射（B 优先） | 否 |\n| `for (K -> V : M)` | 遍历键值对 | — |\n| `weak_map[K, V]` | 键为\"弱引用对象\"的映射（可存 player/session 等） | — |\n\n## 何时用 / 何时不用\n\n- 用：按 ID/名字/玩家查数据——记分板、配置表、`weak_map[player]` 状态。\n- 不用：只需顺序遍历的集合用数组；需要\"每回合清空的全局表\"配 session 用。\n\n## 常见坑\n\n- `set M[K] = V` 对不存在的键是**新增**还是失败取决于写法——统一用 `or 默认值` 先读后写的模式最稳。\n- 遍历顺序不保证与你插入的顺序一致。\n\n## 相关页面\n\n- [array——数组](array.md)\n- [session](../01_Verse.org/100_Simulation/session.md) —— weak_map 全局变量标准用法\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/failure.md": "---\nname: 可失败表达式与failure\nslug: (补充)语言基础.failure\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\n---\n\n# 可失败表达式与 failure 🟦【S级·核心】\n\n> Verse 用\"失败\"代替\"异常/空指针\"：任何操作都可能成功或失败，失败不崩溃，只是\"这条路不通\"。\n> 官网各 API 页签名中的 `<decides>` 即为此机制。\n\n## 这是什么\n\n这是 Verse 最独特、最重要的机制。带 `<decides>` 效果的函数/运算符是\"可失败\"的：调用它**必须**处在\"失败上下文\"里。失败上下文里的表达式从上到下尝试，**任何一个失败，整块代码跳过**（不是报错），程序继续走后面的路。\n\n常见的失败上下文写法：\n\n| 写法 | 说明 |\n|---|---|\n| `if (Expr)` | 表达式成功 → 执行块内代码；失败 → else/跳过 |\n| `for (X : Arr)` | 遍历也算失败上下文 |\n| `F[]` | 用 `[]` 调用可失败函数（无参 failable） |\n| `A and B`, `not A` | 逻辑组合，短路求值 |\n| `X := Expr` | 定义语句本身可失败（Expr 失败则不定义） |\n\n## 最小示例\n\n```verse\nScore(Name:string):void =\n    if:\n        P := Players[Name]        # 1. 查到玩家才继续\n        S := Scores[P]            # 2. 有分数才继续（任意一步失败 → 整块跳过）\n        S > 10                    # 3. 条件判断也是可失败表达式\n    then:\n        Print(\"{Name} 是高手\")\n\n# 多个初始化挤一行也行：\nif (A := Arr[0], B := Map[A] or 0, B > 0) { Print(\"ok\") }\n```\n\n## 与\"错误处理\"的思维差异\n\n- 传统语言：先写快乐路径，再 try/catch 兜底。\n- Verse：把\"可能失败\"写进类型里（`<decides>`），调用方**被迫**处理失败——要么分支，要么 `or 默认值`，要么继续往上失败。编译器保证你漏不掉。\n\n## 常用模式\n\n| 模式 | 写法 |\n|---|---|\n| 取值兜底 | `V := M[K] or 默认` |\n| agent 转 player | `if (P := player[Agent]) {…}` |\n| 链式安全取值 | `if (C := Obj.GetComponent[], P := C.Position[]) {…}` |\n| 断言已知安全 | 确定不会失败时可用 `X:calc` 上下文断言（慎用，失败会中断程序） |\n\n## 何时用 / 何时不用\n\n- 用：一切可能不成立的读取/查询/比较。\n- 不用：不要为了\"绕开失败\"而把逻辑写成嵌套 if 泥球——善用 `or 默认值` 与提前返回。\n\n## 常见坑\n\n- 可失败函数用 `()` 调用会编译错误，无参 failable 必须写 `[]`（如 `GetTeam[]`）。\n- 失败上下文里 `set` 变量后若整块失败，**回滚**该块内的修改（事务性）——这正是 `<decides>` 的设计，注意副作用函数别放进失败块。\n\n## 相关页面\n\n- [option——可选值](option.md)\n- [array——数组](array.md)\n- [operator'=](../01_Verse.org/010_Verse/operatorequals.md) —— 最常见的可失败运算符\n", "00_语言基础/option.md": "---\nname: option——可选值\nslug: (补充)语言基础.option\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\n---\n\n# option——可选值 🟦【S级·核心】\n\n> option 表示\"可能有一个值，也可能没有\"，属于 Verse 语言内建。\n> 类型写作 `?T`（如 `?int`），有值字面量 `option{7}`，空值 `false`。\n\n## 这是什么\n\n`?T` 解决\"这个值可能不存在\"的问题——比返回 -1 之类的哨兵值干净得多。它和失败上下文深度绑定：**取出 option 里的值本身就是一个可失败操作**（`Opt?`），于是\"有值就继续、没值就走别路\"成了一行代码。\n\n## 最小示例\n\n```verse\nvar Nickname:?string = option{\"Alice\"}\nset Nickname = false            # 清空\n\nShow():void =\n    if (Name := Nickname?):     # 有值 → Name 是 string；无值 → 走 else\n        Print(\"昵称 {Name}\")\n    else:\n        Print(\"没有昵称\")\n\nDefault():string =\n    Nickname? or \"无名氏\"        # 取值失败给默认\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `Opt?` | 取出值 | 空则失败 |\n| `Opt? or 默认` | 取值失败用默认 | 否 |\n| `option{V}` / `false` | 构造有值/空 | — |\n| `Opt = 值判断` | `if (Opt = option{7})` 比较 | 可失败 |\n\n## 何时用 / 何时不用\n\n- 用：查询可能无结果（map 里没有、玩家没设置昵称）；API 返回\"可能空\"的字段。\n- 不用：值一定存在时别用 option，多一层失败上下文徒增噪音。\n\n## 常见坑\n\n- `?T` 的空值写作 `false`，不是 `null`/`none`——第一次见非常反直觉，记住即可。\n- `Opt?` 之后变量类型是 `T`（脱掉了 `?`），可以直接当普通值用。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n- [array——数组](array.md)\n", "00_语言基础/array.md": "---\nname: array——数组\nslug: (补充)语言基础.array\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\n---\n\n# array——数组 🟦【S级·核心】\n\n> 数组是 Verse 内建的有序集合类型，属于 Verse 语言内建。\n> 类型写作 `T[]`（如 `int[]`），字面量写作 `array{1, 2, 3}`。\n\n## 这是什么\n\n数组存放一组**同类型、有序**的值。三个要点：\n\n1. **不可变长度**：Verse 数组创建后长度固定，没有 `Add`/`Remove`；\"增删\"靠生成新数组（`Arr + array{X}`、`Arr.RemoveLast[]` 等可失败操作）。\n2. **索引可失败**：`Arr[I]` 在 I 越界时**失败**而不是崩溃——必须放在失败上下文里用。\n3. **值类型拷贝语义**：赋值/传参是拷贝，修改副本不影响原数组。\n\n## 最小示例\n\n```verse\nArr:int[] := array{10, 20, 30}          # 定义\nFirst:int = Arr[0]                      # 已知不越界时可这样断言\nfor (I := 0..Arr.Length - 1, V := Arr[I]):   # 安全遍历（带索引）\n    Print(\"{I} = {V}\")\nfor (V : Arr):                          # 不需要索引时更简洁\n    Print(\"{V}\")\nBigger:int[] = Arr + array{40}          # 新数组 = 旧 + 追加\nMaybe := Arr[5] or -1                   # 越界兜底：失败时给默认值\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `Arr[I]` | 取第 I 个元素（0 起） | 越界则失败 |\n| `Arr.Length` | 元素个数 | 否 |\n| `A + B` | 两个数组连接成新数组 | 否 |\n| `Arr.RemoveLast[]` | 去掉末尾元素的新数组（failable，`[]` 调用） | 空数组失败 |\n| `for (V : Arr)` | 遍历 | — |\n\n## 何时用 / 何时不用\n\n- 用：固定一批同类对象（所有玩家、所有生成点、一串节拍时间）。\n- 不用：需要频繁增删的动态集合——考虑 `map` 或重新设计为\"每帧重建数组\"。\n\n## 常见坑\n\n- **越界是失败不是错误**：`Arr[Arr.Length]` 永远失败，配合 `or 默认值` 或 `if` 处理。\n- 数组没有\"原地修改\"，`set Arr += array{X}` 实际是整体替换变量。\n- `Arr[0]` 在失败上下文之外会编译报错，别图省事裸写。\n\n## 相关页面\n\n- [map——映射](map.md)\n- [可失败表达式与failure](failure.md)\n- [option——可选值](option.md)\n", "00_语言基础/string.md": "---\nname: string——字符串\nslug: (补充)语言基础.string\nurl:\nkind: class\nmodule: /语言基础\ngrade: A\ndepth: full\nstatus: done\n---\n\n# string——字符串 🟩【A级·常用】\n\n> 字符串是 UTF-8 文本的内建类型；属于 Verse 语言内建。\n\n## 这是什么\n\n双引号字面量 `\"...\"` 即字符串。要点：\n\n- **插值**：`\"分数: {Score}\"` 花括号内嵌任意表达式，是最常用输出手段。\n- **连接**：`A + B` 拼接；重复拼接考虑 `Join`。\n- 与 `[]char`（字符数组）互转：`ToUtf8[]`/`FromUtf8[]` 是可失败转换（官方 Print 的参数类型就是 `[]char`）。\n\n## 最小示例\n\n```verse\nName:string = \"世界\"\nMsg := \"你好, {Name}! {1 + 2}\"      # 你好, 世界! 3\nJoined := Join(array{\"a\", \"b\", \"c\"}, \"-\")   # a-b-c（Join 在 /Verse.org/Verse）\n```\n\n## 何时用 / 何时不用\n\n- 用：日志、UI 文案（正式 UI 文案用 [message](../01_Verse.org/010_Verse/message.md) 做本地化）。\n- 不用：大量拼接/高频修改的文本——每次拼接都生成新串。\n\n## 常见坑\n\n- 插值只认 `{表达式}`；想输出字面花括号需转义写法。\n- 中文等多字节字符按\"字符\"而非\"字节\"处理时，注意与 `[]char` 转换的可失败性。\n\n## 相关页面\n\n- [Print](../01_Verse.org/010_Verse/print.md)\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/logic_void.md": "---\nname: logic与void\nslug: (补充)语言基础.logic_void\nurl:\nkind: class\nmodule: /语言基础\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# logic 与 void 🟨【B级·进阶】\n\n> 两个基础类型：logic 是\"真/假\"，void 是\"无返回值\"；官网 API Reference 无单设页面。\n\n## 这是什么\n\n- `logic`：只有 `true` / `false`。注意它**与失败上下文不同**——`logic` 是值，失败是\"路不通\"。API 里很多状态查询返回 logic（如 `IsCrouching()`），而\"可失败查询\"（`IsCrouching[]`）走失败分支，两者别混。\n- `void`：函数不返回值时的返回类型，如 `Sleep(1.0):void`。\n\n## 最小示例\n\n```verse\nIsReady:logic = true\nif (IsReady?):      # logic 可用 ? 转为可失败判断\n    Print(\"ready\")\n```\n\n## 常见坑\n\n- `logic` 参与失败上下文要写 `If?`；直接 `if (IsReady)` 不合法。\n- \"返回 logic 的函数\"与\"`<decides>` 可失败函数\"在 API 页签名一眼可辨：后者带 `<decides>`。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/tuple_subtype.md": "---\nname: 元组与子类型\nslug: (补充)语言基础.tuple_subtype\nurl:\nkind: class\nmodule: /语言基础\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# 元组与子类型 🟨【B级·进阶】\n\n> 元组把几个值打包成一个；子类型 `subtype` 描述\"某类型的子集\"。官网 API Reference 无单设页面。\n\n## 这是什么\n\n- **元组**：`(A, B)` 类型写作 `tuple(A, B)`，事件载荷常见（如 fort_character 的蹲起事件回传 `(角色, 是否蹲)`）。\n- **子类型**：`where` 子句约束类型参数，如 `t:comparable` 表示\"任何可比较类型\"——这是泛型 API（Min/Max、event(t)）的基础。\n\n## 最小示例\n\n```verse\nPair := (1, \"one\")                  # tuple(int, string)\nN:int = Pair(0)                     # 按位置取分量\nM := event(tuple(agent, logic))     # 元组作事件载荷\n```\n\n## 常见坑\n\n- 元组按位置而非名字取值，分量多时可读性骤降——三个以上考虑 class。\n\n## 相关页面\n\n- [event(t)](../01_Verse.org/010_Verse/event_t_.md)\n", "00_语言基础/int.md": "---\nname: 数值类型 int/float/rational\nslug: (补充)语言基础.int\nurl:\nkind: class\nmodule: /语言基础\ngrade: A\ndepth: brief\nstatus: done\n---\n\n# 数值类型 int / float / rational 🟩【A级·常用】\n\n> Verse 的三种数值类型；属于 Verse 语言内建。\n\n## 这是什么\n\n| 类型 | 写法 | 用途 | 注意 |\n|---|---|---|---|\n| `int` | `42` | 计数、索引、分数 | 除法 `/` 是**可失败**的整除（除数为 0 失败）；取模用 `Mod` |\n| `float` | `3.14`、`1.0e-3` | 时间、坐标、比例 | 与 int 不隐式互转；`Int[]`/`Float[]` 显式转换且可失败 |\n| `rational` | `Rational(1, 3)` | 精确分数（音频/节拍场景） | 避免浮点误差，音乐类玩法可用 |\n\n## 最小示例\n\n```verse\nHalf := 1.0 / 2.0              # 0.5\nQ := Quotient(7, 2)            # 3（整数商）\nR := Mod(7, 2)                 # 1（余数）\nF := Float[3] or 0.0           # int→float 可失败转换 + 兜底\n```\n\n## 常见坑\n\n- `7 / 2` 是整数除法（=3）；想得 3.5 要写 `7.0 / 2.0`。\n- float 精度有限，节拍累加建议用 rational 或\"目标时刻 + GetSimulationElapsedTime\"比较。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n- [Verse 数学函数族](../01_Verse.org/010_Verse/_overview.md)\n", "01_Verse.org/_overview.md": "---\nname: Verse.org\nslug: versedotorg\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg\nkind: module\nmodule: /Verse.org\ngrade: S\ndepth: brief\nstatus: placeholder\n---\n\n# Verse.org 🟦【S级·核心】\n\n<!-- 待生成 -->\n", "01_Verse.org/010_Verse/_overview.md": "---\nname: Verse\nslug: versedotorg/verse\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse\nkind: module\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Verse 🟨【B级·进阶】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "01_Verse.org/010_Verse/classifiable_subset_element_type.md": "---\nname: classifiable_subset(element_type)\nslug: versedotorg/verse/classifiable_subset/classifiable_subset(element_type)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/classifiable_subset/classifiable_subset(element_type)\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# classifiable_subset(element_type) ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/classifiable_subset/classifiable_subset(element_type).html -->\n", "01_Verse.org/010_Verse/diagnostic.md": "---\nname: diagnostic\nslug: versedotorg/verse/diagnostic\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/diagnostic\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# diagnostic 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/diagnostic.html -->\n", "01_Verse.org/010_Verse/event_t.md": "---\nname: event(t)\nslug: versedotorg/verse/event/event(t)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event/event(t)\nkind: class\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# event(t) class 🟦【S级·核心】\n\n> A recurring, successively signaled parametric event with a payload allowing a simple mechanism to coordinate between concurrent tasks.\n> 可重复、按次序触发的参数化事件，带有载荷，为并发任务之间的协调提供简单机制。\n\n`using { /Verse.org/Verse }`\n\n## Exposed Interfaces\n\nThis class exposes the following interfaces:（此类暴露以下接口：）\n\n| Name | Description |\n|---|---|\n| signalable(payload) | 带载荷、可被触发（signal）的事件所实现的参数化接口。可与 awaitable、subscribable 配合使用（参见 listenable）。 |\n| awaitable(payload) | 带载荷、可被等待（await）的事件所实现的参数化接口。与 signalable 配对。 |\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| Await | 挂起当前任务，直到另一个任务调用 Signal。若在 Signal 的调用过程中调用 Await，任务仍会挂起，并等到**下一次** Signal 调用时恢复。 |\n| Signal | 并发恢复在此次 Signal 之前被 Await 挂起的任务。任务按挂起的先后顺序恢复；每个任务会尽可能执行直到遇到阻塞调用，随即把控制权交给下一个被挂起的任务。 |\n\n## Attributes, Specifiers, and Effects\n\n`event(t:any)<public> := class<concrete>(subscribable(t), signalable(t))` —— 标签：public / concrete，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Verse.org/Simulation }\n\nCounter := class:\n    Tick:event(int) = event(int){}   # int 载荷事件\n\n    Run()<suspends>:void =\n        N := Tick.Await()            # 挂起等待，Signal 一到即恢复\n        Print(\"收到 {N}\")\n\n    Bump():void =\n        Tick.Signal(1)\n```\n\n## 补充说明\n\n- `Await` 只等**下一次** Signal：信号发出时若无等待者，载荷不会被记住（先有等待者，后有 Signal）。\n- 类内声明事件字段要带构造：`Tick:event(int) = event(int){}`；构造函数见 [event function](event.md)。\n- 与设备/系统交互用 [listenable function](listenable.md)（订阅模型），自建 event 用于脚本内部的即时协调。\n", "01_Verse.org/010_Verse/locale.md": "---\nname: locale\nslug: versedotorg/verse/locale\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/locale\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# locale 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/locale.html -->\n", "01_Verse.org/010_Verse/message.md": "---\nname: message\nslug: versedotorg/verse/message\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/message\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# message 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/message.html -->\n", "01_Verse.org/010_Verse/modifier_stack_t.md": "---\nname: modifier_stack(t)\nslug: versedotorg/verse/modifier_stack/modifier_stack(t)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/modifier_stack/modifier_stack(t)\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# modifier_stack(t) ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/modifier_stack/modifier_stack(t).html -->\n", "01_Verse.org/010_Verse/cancelable.md": "---\nname: cancelable\nslug: versedotorg/verse/cancelable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/cancelable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# cancelable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/cancelable.html -->\n", "01_Verse.org/010_Verse/disposable.md": "---\nname: disposable\nslug: versedotorg/verse/disposable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/disposable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# disposable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/disposable.html -->\n", "01_Verse.org/010_Verse/enableable.md": "---\nname: enableable\nslug: versedotorg/verse/enableable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/enableable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# enableable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/enableable.html -->\n", "01_Verse.org/010_Verse/invalidatable.md": "---\nname: invalidatable\nslug: versedotorg/verse/invalidatable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/invalidatable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# invalidatable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/invalidatable.html -->\n", "01_Verse.org/010_Verse/showable.md": "---\nname: showable\nslug: versedotorg/verse/showable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/showable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# showable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/showable.html -->\n", "01_Verse.org/010_Verse/operatorequals.md": "---\nname: operator'='\nslug: versedotorg/verse/operatorequals\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorequals\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# operator'=' function 🟦【S级·核心】\n\n（本页官网无导语描述；`=` 是可失败的相等比较运算符——相等则成功并返回左值，不相等则失败。）\n\n`using { /Verse.org/Verse }`\n\n```verse\noperator'='(Lhs:t, Rhs:comparable where t:comparable)<decides>:t\n```\n\n## Parameters\n\noperator'=' takes the following parameters:（operator'=' 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Lhs | t | 左操作数。 |\n| Rhs | comparable | 右操作数。 |\n| t | comparable | 操作数的公共类型，须满足 comparable 约束。 |\n\n## Attributes, Specifiers, and Effects\n\n`operator'='(Lhs:t, Rhs:comparable where t:comparable)<decides>:t` —— 标签：decides，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nCheck(HP:int):void =\n    if (HP = 0):                 # 相等判断接入失败上下文\n        Print(\"角色倒下\")\n    if (Best := HP = 100):       # 相等时 Best 被绑定为 HP 的值\n        Print(\"满血 {Best}\")\n```\n\n## 补充说明\n\n- Verse 中 `=` 判断、`:=` 定义、`set X =` 赋值三者各司其职；`<decides>` 使比较可失败——这是它与多数语言 `==` 的本质差异。\n- 不等比较见 [operator'&lt;&gt; function](operatorlessgreater.md)；失败机制见 [可失败表达式与failure](../../00_语言基础/failure.md)。\n", "01_Verse.org/010_Verse/operatorlessgreater.md": "---\nname: operator'<>'\nslug: versedotorg/verse/operatorlessgreater\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorlessgreater\nkind: function\nmodule: /Verse.org\ngrade: S\ndepth: full\nstatus: placeholder\n---\n\n# operator'<>' 🟦【S级·核心】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorlessgreater.html -->\n", "01_Verse.org/010_Verse/prefixminus.md": "---\nname: prefix'-'\nslug: versedotorg/verse/prefixminus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/prefixminus\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# prefix'-' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/prefixminus.html -->\n", "01_Verse.org/010_Verse/operatorplus.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus.html -->\n", "01_Verse.org/010_Verse/operatorminus.md": "---\nname: operator'-'\nslug: versedotorg/verse/operatorminus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorminus\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'-' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorminus.html -->\n", "01_Verse.org/010_Verse/operatorstar.md": "---\nname: operator'*'\nslug: versedotorg/verse/operatorstar\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorstar\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'*' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorstar.html -->\n", "01_Verse.org/010_Verse/operatorslash.md": "---\nname: operator'/'\nslug: versedotorg/verse/operatorslash\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorslash\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'/' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorslash.html -->\n", "01_Verse.org/010_Verse/operatorplusequals.md": "---\nname: operator'+='\nslug: versedotorg/verse/operato ml -->\n", "01_Verse.org/010_Verse/concatenatemaps.md": "---\nname: ConcatenateMaps\nslug: versedotorg/verse/concatenatemaps\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/concatenatemaps\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# ConcatenateMaps 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/concatenatemaps.html -->\n", "01_Verse.org/010_Verse/operator_-3.md": "---\nname: operator'()'\nslug: versedotorg/verse/operator()-3\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operator()-3\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'()' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operator()-3.html -->\n", "01_Verse.org/010_Verse/operator_-4.md": "---\nname: operator'()'\nslug: versedotorg/verse/operator()-4\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operator()-4\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'()' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operator()-4.html -->\n", "01_Verse.org/010_Verse/weak_map.md": "---\nname: weak_map\nslug: versedotorg/verse/weak_map\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/weak_map\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# weak_map 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/weak_map.html -->\n", "01_Verse.org/010_Verse/operatorquestionmark-1.md": "---\nname: operator'?'\nslug: versedotorg/verse/operatorquestionmark-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorquestionmark-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# operator'?' 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorquestionmark-1.html -->\n", "01_Verse.org/010_Verse/fitsinplayermap.md": "---\nname: FitsInPlayerMap\nslug: versedotorg/verse/fitsinplayermap\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/fitsinplayermap\nkind: function\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# FitsInPlayerMap ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/fitsinplayermap.html -->\n", "01_Verse.org/010_Verse/print.md": "---\nname: Print\nslug: versedotorg/verse/print\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Print function 🟦【S级·核心】\n\n> Writes Message to a dedicated Print log while displaying it in Color on the client screen for Duration seconds. By default, Color is NamedColors.White and Duration is 2.0 seconds.\n> 把 Message 写入专用的 Print 日志，同时在客户端屏幕上以 Color 颜色显示 Duration 秒。默认 Color 为 NamedColors.White（白色），Duration 为 2.0 秒。\n\n`using { /Verse.org/Verse }`\n\n```verse\nPrint<public><native>(Message:[]char, Duration:float, Color:color)<transacts>:void\n```\n\n## Parameters\n\nPrint takes the following parameters:（Print 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Message | []char | 要输出的消息（字符数组；字符串字面量可直接传入）。 |\n| Duration | float | 在屏幕上显示的秒数。 |\n| Color | color | 显示颜色，默认 NamedColors.White。 |\n\n## Attributes, Specifiers, and Effects\n\n`Print<public><native>(Message:[]char, Duration:float, Color:color)<transacts>` —— 标签：public / native / transacts，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Verse.org/Colors }\nusing { /Verse.org/Colors/NamedColors }\n\nScore := 42\nPrint(\"分数: {Score}\")                                    # 白色显示 2 秒\nPrint(\"出错了!\", Duration := 5.0, Color := NamedColors.Red)  # 红色显示 5 秒\n```\n\n## 补充说明\n\n- Print 输出进专用 Print 日志（UEFN 内查看），是调试与学习的主力工具；面向玩家的正式文案请用 UI/message 体系。\n- 另有两个重载：[Print (message 重载)](print-1.md)、[Print (diagnostic 重载)](print-2.md)。\n", "01_Verse.org/010_Verse/print-1.md": "---\nname: Print (message 重载)\nslug: versedotorg/verse/print-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Print function（message 重载）🟦【S级·核心】\n\n> Writes Message to a dedicated Print log while displaying it in Color on the client screen for Duration seconds. By default, Color is NamedColors.White and Duration is 2.0 seconds.\n> 把 Message 写入专用的 Print 日志，同时在客户端屏幕上以 Color 颜色显示 Duration 秒。默认 Color 为 NamedColors.White，Duration 为 2.0 秒。本重载的 Message 为 message（可本地化文本）类型。\n\n`using { /Verse.org/Verse }`\n\n```verse\nPrint<public><native>(Message:message, Duration:float, Color:color)<transacts>:void\n```\n\n## Parameters\n\nPrint takes the following parameters:（Print 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Message | message | 要输出的可本地化文本。 |\n| Duration | float | 在屏幕上显示的秒数。 |\n| Color | color | 显示颜色，默认 NamedColors.White。 |\n\n## Attributes, Specifiers, and Effects\n\n`Print<public><native>(Message:message, Duration:float, Color:color)<transacts>` —— 标签：public / native / transacts，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nGreeting:message = Localize(\"hello.key\", [\"Name\"], array[\"World\"])\nPrint(Greeting)\n```\n\n## 补充说明\n\n- 与 [Print function](print.md) 行为一致，区别是接受 message 对象；相关类型见 [message class](message.md)。\n", "01_Verse.org/010_Verse/print-2.md": "---\nname: Print (diagnostic 重载)\nslug: versedotorg/verse/print-2\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print-2\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Print function（diagnostic 重载）🟦【S级·核心】\n\n> Writes Message to a dedicated Print log while displaying it in Color on the client screen for Duration seconds. By default, Color is NamedColors.White and Duration is 2.0 seconds.\n> 把 Message 写入专用的 Print 日志，同时在客户端屏幕上以 Color 颜色显示 Duration 秒。默认 Color 为 NamedColors.White，Duration 为 2.0 秒。本重载的 Message 为 diagnostic（诊断）类型。\n\n`using { /Verse.org/Verse }`\n\n```verse\nPrint<public>(Message:diagnostic, Duration:float, Color:color)<transacts>:void\n```\n\n## Parameters\n\nPrint takes the following parameters:（Print 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Message | diagnostic | 要输出的诊断对象。 |\n| Duration | float | 在屏幕上显示的秒数。 |\n| Color | color | 显示颜色，默认 NamedColors.White。 |\n\n## Attributes, Specifiers, and Effects\n\n`Print<public>(Message:diagnostic, Duration:float, Color:color)<transacts>` —— 标签：public / transacts，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nPrint(ToDiagnostic(\"检查点到达\"))\n```\n\n## 补充说明\n\n- 日常调试用 [Print function](print.md) 主重载即可；diagnostic 相关见 [diagnostic class](diagnostic.md)。\n", "01_Verse.org/010_Verse/concatenate.md": "---\nname: Concatenate\nslug: versedotorg/verse/concatenate\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/concatenate\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Concatenate 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/concatenate.html -->\n", "01_Verse.org/010_Verse/classifiable_subset.md": "---\nname: classifiable_subset\nslug: versedotorg/verse/classifiable_subset\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/classifiable_subset\nkind: function\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# classifiable_subset ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/classifiable_subset.html -->\n", "01_Verse.org/010_Verse/makeclassifiablesubset.md": "---\nname: MakeClassifiableSubset\nslug: versedotorg/verse/makeclassifiablesubset\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/makeclassifiablesubset\nkind: function\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# MakeClassifiableSubset ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/makeclassifiablesubset.html -->\n", "01_Verse.org/010_Verse/operatorplus-3.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-3\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-3\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus-3.html -->\n", "01_Verse.org/010_Verse/operatorplus-4.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-4\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-4\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus-4.html -->\n", "01_Verse.org/010_Verse/operatorplus-5.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-5\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-5\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus-5.html -->\n", "01_Verse.org/010_Verse/operatorplus-6.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-6\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-6\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus-6.html -->\n", "01_Verse.org/010_Verse/todiagnostic.md": "---\nname: ToDiagnostic\nslug: versedotorg/verse/todiagnostic\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/todiagnostic\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# ToDiagnostic 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/todiagnostic.html -->\n", "01_Verse.org/010_Verse/err.md": "---\nname: Err\nslug: versedotorg/verse/err\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/err\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Err 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/err.html -->\n", "01_Verse.org/010_Verse/event.md": "---\nname: event\nslug: versedotorg/verse/event\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# event function 🟦【S级·核心】\n\n> A recurring, successively signaled parametric event with a payload allowing a simple mechanism to coordinate between concurrent tasks.\n> 可重复、按次序触发的参数化事件，带有载荷，为并发任务之间的协调提供简单机制。\n\n`using { /Verse.org/Verse }`\n\n```verse\nevent<public>(t:any):event(t)\n```\n\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n（此函数是参数化类型：它返回的是类或接口，而不是值或对象实例。）\n\n## Parameters\n\nevent takes the following parameters:（event 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| t | any | 事件载荷的类型。 |\n\n### Generated Class\n\nevent returns the parametric class `event(t)`.（event 返回参数化类 event(t)。）\n\n## Attributes, Specifiers, and Effects\n\n`event<public>(t:any):event(t)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nGate:event(logic) = event(logic){}   # 生成 logic 载荷的 event(t) 实例\n```\n\n## 补充说明\n\n- 本页是构造函数；Signal/Await 的行为见 [event(t) class](event_t.md)。\n- 无载荷构造重载见 [event function（无载荷）](event-1.md)。\n", "01_Verse.org/010_Verse/event-1.md": "---\nname: event\nslug: versedotorg/verse/event-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# event function（无载荷）🟦【S级·核心】\n\n> A recurring, successively signaled event allowing a simple mechanism to coordinate between concurrent tasks.\n> 可重复、按次序触发的事件，为并发任务之间的协调提供简单机制（本重载不带构造参数，载荷类型由上下文推断）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nevent<public>():event(t)\n```\n\n## Parameters\n\nevent does not take any parameters.（event 不接受任何参数。）\n\n## Attributes, Specifiers, and Effects\n\n`event<public>():event(t)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Verse.org/Simulation }\n\nKickoff:event() = event(){}\n\nWaitAndGo()<suspends>:void =\n    Kickoff.Await()      # 不关心载荷，只等信号\n    Print(\"GO!\")\n```\n\n## 补充说明\n\n- Signal/Await 的行为见 [event(t) class](event_t.md)；带载荷的构造见 [event function](event.md)。\n", "01_Verse.org/010_Verse/ceil-1.md": "---\nname: Ceil\nslug: versedotorg/verse/ceil-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/ceil-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Ceil 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/ceil-1.html -->\n", "01_Verse.org/010_Verse/floor-1.md": "---\nname: Floor\nslug: versedotorg/verse/floor-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/floor-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Floor 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/floor-1.html -->\n", "01_Verse.org/010_Verse/round.md": "---\nname: Round\nslug: versedotorg/verse/round\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/round\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Round 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/round.html -->\n", "01_Verse.org/010_Verse/int.md": "---\nname: Int\nslug: versedotorg/verse/int\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/int\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Int 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/int.html -->\n", "01_Verse.org/010_Verse/tostring.md": "---\nname: ToString\nslug: versedotorg/verse/tostring\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/tostring\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# ToString 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/tostring.html -->\n", "01_Verse.org/010_Verse/getsecondssinceepoch.md": "---\nname: GetSecondsSinceEpoch\nslug: versedotorg/verse/getsecondssinceepoch\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/getsecondssinceepoch\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# GetSecondsSinceEpoch 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/getsecondssinceepoch.html -->\n", "01_Verse.org/010_Verse/tostring-1.md": "---\nname: ToString\nslug: versedotorg/verse/tostring-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/tostring-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# ToString 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/tostring-1.html -->\n", "01_Verse.org/010_Verse/listenable.md": "---\nname: listenable\nslug: versedotorg/verse/listenable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/listenable\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# listenable function 🟦【S级·核心】\n\n> A parametric interface combining awaitable and subscribable.\n> 参数化**接口**：组合了 awaitable（可等待）与 subscribable（可订阅）。\n\n`using { /Verse.org/Verse }`\n\n```verse\nlistenable<public>(payload:any):listenable(payload)\n```\n\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n（此函数是参数化类型：它返回的是类或接口，而不是值或对象实例。）\n\n## Parameters\n\nlistenable takes the following parameters:（listenable 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| payload | any | 订阅回调接收的载荷类型。 |\n\n### Generated Interface\n\nlistenable returns the parametric interface `listenable(payload)`.（listenable 返回参数化接口 listenable(payload)。）\n\n## Attributes, Specifiers, and Effects\n\n`listenable<public>(payload:any):listenable(payload)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Fortnite.com/Devices }\n\n# 订阅按钮设备的交互事件（设备事件都是现成的 listenable）\nMyDevice := class(creative_device):\n\n    @editable\n    MyButton : button_device = button_device{}\n\n    OnBegin<override>()<suspends>:void =\n        MyButton.InteractedWithEvent.Subscribe(OnButtonPressed)\n\n    OnButtonPressed(Agent:agent):void =\n        Print(\"按钮被按下\")\n```\n\n## 补充说明\n\n- listenable 与 [event(t) class](event_t.md) 的分工：listenable 面向\"持续广播、多方订阅\"（设备事件、玩家进出），event 面向\"脚本内部一次性等待\"。\n- 订阅回调是类成员函数；订阅时机通常在 OnBegin 中完成，避免漏事件。\n", "01_Verse.org/010_Verse/listenable-1.md": "---\nname: listenable\nslug: versedotorg/verse/listenable-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/listenable-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# listenable function（无载荷）🟦【S级·核心】\n\n> A parameterless interface combining awaitable and subscribable.\n> 无参数接口：组合了 awaitable（可等待）与 subscribable（可订阅），载荷类型由上下文推断。\n\n`using { /Verse.org/Verse }`\n\n```verse\nlistenable<public>():listenable(payload)\n```\n\n## Parameters\n\nlistenable does not take any parameters.（listenable 不接受任何参数。）\n\n## Attributes, Specifiers, and Effects\n\n`listenable<public>():listenable(payload)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Verse }\n\nPing:listenable() = listenable(){}\n```\n\n## 补充说明\n\n- 用法与 [listenable function](listenable.md) 完全一致，仅构造写法不同。\n", "01_Verse.org/010_Verse/localize.md": "---\nname: Localize\nslug: versedotorg/verse/localize\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/localize\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Localize 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/localize.html -->\n", "01_Verse.org/010_Verse/join.md": "---\nname: Join\nslug: versedotorg/verse/join\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/join\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Join 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/join.html -->\n", "01_Verse.org/010_Verse/clamp.md": "---\nname: Clamp\nslug: versedotorg/verse/clamp\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/clamp\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Clamp 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/clamp.html -->\n", "01_Verse.org/010_Verse/clamp-1.md": "---\nname: Clamp\nslug: versedotorg/verse/clamp-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/clamp-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Clamp 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/clamp-1.html -->\n", "01_Verse.org/010_Verse/min.md": "---\nname: Min\nslug: versedotorg/verse/min\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/min\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Min 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/min.html -->\n", "01_Verse.org/010_Verse/max.md": "---\nname: Max\nslug: versedotorg/verse/max\nurl: https:/ nt 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/light_component.html -->\n", "01_Verse.org/040_SceneGraph/mesh_component.md": "---\nname: mesh_component\nslug: versedotorg/scenegraph/mesh_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/mesh_component\nkind: class\nmodule: /Verse.org\ngrade: S\ndepth: full\nstatus: placeholder\n---\n\n# mesh_component 🟦【S级·核心】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/mesh_component.html -->\n", "01_Verse.org/040_SceneGraph/particle_system_component.md": "---\nname: particle_system_component\nslug: versedotorg/scenegraph/particle_system_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/particle_system_component\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# particle_system_component 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/particle_system_component.html -->\n", "01_Verse.org/040_SceneGraph/possessable_component.md": "---\nname: possessable_component\nslug: versedotorg/scenegraph/possessable_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/possessable_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# possessable_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/possessable_component.html -->\n", "01_Verse.org/040_SceneGraph/rect_light_component.md": "---\nname: rect_light_component\nslug: versedotorg/scenegraph/rect_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/rect_light_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# rect_light_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/rect_light_component.html -->\n", "01_Verse.org/040_SceneGraph/sound_component.md": "---\nname: sound_component\nslug: versedotorg/scenegraph/sound_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/sound_component\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# sound_component 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/sound_component.html -->\n", "01_Verse.org/040_SceneGraph/sphere_light_component.md": "---\nname: sphere_light_component\nslug: versedotorg/scenegraph/sphere_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/sphere_light_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# sphere_light_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/sphere_light_component.html -->\n", "01_Verse.org/040_SceneGraph/spot_light_component.md": "---\nname: spot_light_component\nslug: versedotorg/scenegraph/spot_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/spot_light_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# spot_light_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/spot_light_component.html -->\n", "01_Verse.org/040_SceneGraph/float_range.md": "---\nname: float_range\nslug: versedotorg/scenegraph/float_range\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/float_range\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# float_range 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/float_range.html -->\n", "01_Verse.org/040_SceneGraph/component.md": "---\nname: component\nslug: versedotorg/scenegraph/component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/component\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# component class 🟦【S级·核心】\n\n> Base class for authoring logic and data in the SceneGraph. Using components you can author re-usable building blocks of logic and data which can then be added to entities in the scene.\n> 在 SceneGraph 中编写逻辑与数据的基类。通过组件，你可以创作可复用的逻辑与数据构件，然后把它们添加到场景中的实体上。\n>\n> Components are a very low level building block which can be used in many ways. For example:\n> 组件是非常底层的构件，用法很多，例如：\n>\n> - Exposing engine level concepts like mesh or sound\n>   暴露网格、声音等引擎级概念\n> - Adding gameplay capabilities like damage or interaction\n>   添加伤害、交互等玩法能力\n> - Storing an inventory for a character in the game\n>   为游戏中的角色存储物品栏\n>\n> As components are generic there is no specific way that they must be used. It is up to the needs of your experience if you use one big game component or if you break up logic into many small components.\n> 组件是通用的，没有强制的使用方式。用一个大的\"游戏组件\"还是把逻辑拆成许多小组件，由你的体验需求决定。\n\nClasses deriving from component must also specify `<final_super>` to be added to entities. This ensures the class will always derive directly from component. Further subclassing of the initial derived component is allowed and does not require specifying `<final_super>` on the derived classes.\n派生自 component 的类还必须指定 `<final_super>` 才能被添加到实体。这保证该类永远直接派生自 component。在最初派生的组件之上继续派生子类是允许的，且不需要再标 `<final_super>`。\n\nOnly one instance of a component from each subclass group can be added to an entity at a time. For example, given this group of components, only one light_component can exist on a single entity. To create multiple lights you should use multiple entities.\n`light_component := class(component){} capsule_light_component := class(light_component){} directional_light_component := class(light_component){} spot_light_component := class(light_component){} sphere_light_component := class(light_component){} rect_light_component := class(light_component){}`\n同一子类组中的组件，同一时刻在一个实体上只能有一个实例。例如上面这组组件里，一个实体上只能存在一个 light_component；要创建多盏灯应该使用多个实体。\n\n**Component Lifetime** — Components move through a series of lifetime functions as they are added to entities, added to the scene, and begin running in the simulation. Components should override these methods to perform setup and run their simulation. As a component shuts down it will then move through shutdown version of these functions, giving users the opportunity to clean up any retained state on the component before it is disposed. Lifetime Methods: OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene\n**组件生命周期** —— 组件被添加到实体、加入场景、开始在模拟中运行时，会经过一系列生命周期函数。组件应重写这些方法来完成初始化并运行自己的模拟。组件关闭时会按相反的关停版本走一遍，让你有机会在组件被销毁前清理保留状态。生命周期方法：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\nThis class has both data members and functions.（此类兼有数据成员和函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，可在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回**同一个**实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/SceneGraph }\nusing { /Verse.org/Simulation }\n\n# 自定义组件：每秒数一拍（节拍器示例）\nbeat_component<final_super> := class(component):\n    var Beat:int = 0\n\n    OnSimulate<override>()<suspends>:void =\n        loop:\n            Sleep(1.0)\n            set Beat += 1\n            Print(\"♪ {Beat}\")\n```\n\n## 补充说明\n\n- 派生组件必须加 `<final_super>` 才能挂到实体上（官方导语明示）——这是新组件类最常见的编译错误来源。\n- 生命周期固定顺序：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene；帧回调走 TickEvents。\n- 相关页面：[entity class](entity.md)、[transform_component class](transform_component.md)、[tick_events class](tick_events.md)。\n", "01_Verse.org/040_SceneGraph/entity.md": "---\nname: entity\nslug: versedotorg/scenegraph/entity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# entity class 🟦【S级·核心】\n\n> Entities are the base object in the SceneGraph.\n> 实体是 SceneGraph 的基础对象。\n>\n> - Objects in experiences are constructed of one or more entities.\n>   体验中的对象由一个或多个实体构成。\n> - Entities are hierarchical. You can query your parent using GetParent and add child entities using AddEntities.\n>   实体是有层级的：可用 GetParent 查询父实体、用 AddEntities 添加子实体。\n> - Behavior is added to entities through components. You can add new components using AddComponents.\n>   行为通过组件（component）添加：用 AddComponents 添加新组件。\n> - The structure and content of entities is dynamic and can be changed at any time through your experience.\n>   实体的结构和内容是动态的，可在体验运行中的任意时刻改变。\n\n**Deriving from entity** — In the SceneGraph system a class that derives from entity is also known as a prefab. Prefabs are useful when you want to spawn/re-use a collection of entities and components many times within your game. Primarily prefabs are authored through the editor, with their Verse classes generated as part of the build into the projects Assets.digest.verse file.\n**派生自 entity** —— 在 SceneGraph 体系中，派生自 entity 的类也被称为预制体（prefab）。当你想在游戏中多次生成/复用一组实体和组件时，预制体非常有用。预制体主要在编辑器中创作，其 Verse 类会在构建时生成到项目的 Assets.digest.verse 文件里。\n\nWhile you can create base prefabs for common game object types like a vehicle or character, we highly recommended that you do not add code directly to the entity class, and instead keep logic in components. Keeping logic and data in components allows you to restructure your prefabs throughout production of your experience, without needing to massively refactor your class structure.\n虽然你可以为载具、角色等常见对象类型创建基础预制体，但官方强烈建议**不要直接在 entity 类里写代码**，而是把逻辑放在组件里。把逻辑和数据放进组件，你在体验制作全程中重构预制体时，就不必大改类结构。\n\n`using { /Verse.org/SceneGraph }`\n\n## Exposed Interfaces\n\nThis class exposes the following interfaces:（此类暴露以下接口：）\n\n| Name | Description |\n|---|---|\n| has_tags | 表示\"可变标签集合\"的接口。 |\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| GetParent | 返回此实体的父实体。父实体掌控其子实体与组件的生命周期——实体从场景移除时，其所有子实体和组件也会一并移除。当前没有父实体时此方法失败。 |\n| RemoveFromParent | 把此实体从父实体移除，用于将实体移出场景。该实体及其子级上的组件会依次走 OnEndSimulation → OnRemovingFromScene。之后可用 NewParent.AddEntities 再加回。 |\n| AddEntities | 把给定的实体添加为子实体。若子实体已有父实体，会先从原父实体移除再加入新父。加入的子实体会沿各自的生命周期方法推进，直到与新父实体的状态一致。 |\n| GetEntities | 返回此实体下属、可从调用方上下文访问的子实体。只取直接子实体；要跨多层查询请改用 Find* 系列查询方法。 |\n| GetComponent | 若 component_type 类型的子组件存在且可从调用方上下文访问，则成功并返回该组件。注意：在 AddedToScene 或 BeginSimulation 阶段调用时，会确保返回的组件已达到对应阶段。若不存在或不可访问则失败。 |\n| GetComponents | 返回此实体下属、可从调用方上下文访问的子组件。 |\n| AddComponents | 把给定的组件添加到实体。若某组件不允许加到该实体，则跳过。注意：在 AddedToScene 或 BeginSimulation 阶段调用时，会确保被加组件已达到对应阶段。组件按以下规则添加：所有组件加入实体的子列表；若该实体在场景中，所有组件的 OnAddedToScene 被调用；若该实体正在模拟，所有组件的 OnBeginSimulation 被调用。 |\n| SendUp | 向此实体发送场景事件并沿层级向上传播：先在本实体的每个组件上调用 SendDown/OnReceive，再对父实体调用 SendUp。任一环节消费该事件即停止传播。有参与者消费则返回 true。 |\n| SendDown | 向此实体发送场景事件并沿层级向下传播：先在本实体的每个组件上调用 SendDown/OnReceive，再对每个子实体调用 SendDown。任一环节消费该事件即停止传播。有参与者消费则返回 true。 |\n| AddTag | 向此实体添加一个标签实例，返回与该实例唯一关联的 tag_key。 |\n| RemoveTag | 移除与 tag_key 关联的标签实例；移除成功则成功，否则失败。 |\n| RemoveAllTags | 移除 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_types 中任何类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| ContainsTag | 若容器中找到至少一个 tag_type 类型的标签则成功，否则失败。 |\n| ContainsAllTags | 若 tag_types 中有任一类型在容器中找不到则失败，否则成功。注意 tag_types 为空时此调用成功。 |\n| ContainsAnyTag | 若 tag_types 中至少一个类型在容器中找到则成功，否则失败。注意 tag_types 为空时此调用失败。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/SceneGraph }\n\n# 运行时搭一个\"灯杆\"：实体 + 变换组件 + 聚光灯组件\nBuildLamp(Parent:entity):void =\n    Pole := entity{}\n    Pole.AddComponents(array{transform_component{}, spot_light_component{}})\n    Parent.AddEntities(array{Pole})\n```\n\n## 补充说明\n\n- 官方明确：逻辑写进组件、entity 只当容器/预制体壳；组件一旦挂上不能换父，要移动就 RemoveFromParent 后重挂。\n- 场景事件的向上/向下传播靠 SendUp/SendDown，组件侧在 OnReceive 里响应。\n- 相关页面：[component class](component.md)、[transform_component class](transform_component.md)、[agent class](../100_Simulation/agent.md)。\n", "01_Verse.org/040_SceneGraph/entity_prefab.md": "---\nname: entity_prefab\nslug: versedotorg/scenegraph/entity_prefab\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity_prefab\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# entity_prefab 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/entity_prefab.html -->\n", "01_Verse.org/040_SceneGraph/icon_component.md": "---\nname: icon_component\nslug: versedotorg/scenegraph/icon_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/icon_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# icon_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/icon_component.html -->\n", "01_Verse.org/040_SceneGraph/entity_origin.md": "---\nname: entity_orig n---\n\n# change_stack_size_result ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/change_stack_size_result.html -->\n", "01_Verse.org/040_SceneGraph/change_max_stack_size_result.md": "---\nname: change_max_stack_size_result\nslug: versedotorg/scenegraph/change_max_stack_size_result\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/change_max_stack_size_result\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# change_max_stack_size_result ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/change_max_stack_size_result.html -->\n", "01_Verse.org/040_SceneGraph/basic_stackable_component.md": "---\nname: basic_stackable_component\nslug: versedotorg/scenegraph/basic_stackable_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/basic_stackable_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# basic_stackable_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/basic_stackable_component.html -->\n", "01_Verse.org/040_SceneGraph/tick_events.md": "---\nname: tick_events\nslug: versedotorg/scenegraph/tick_events\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/tick_events\nkind: class\nmodule: /Verse.org\ngrade: S\ndepth: full\nstatus: placeholder\n---\n\n# tick_events 🟦【S级·核心】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/tick_events.html -->\n", "01_Verse.org/040_SceneGraph/transform_component.md": "---\nname: transform_component\nslug: versedotorg/scenegraph/transform_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/transform_component\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# transform_component class 🟦【S级·核心】\n\n> Stores the transforms for an entity, which are used to position the entity.\n> 存储实体的变换（transform），用于确定实体的位置。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\nThis class is derived from `component`.（本类派生自 component；component 的完整官方描述与生命周期说明见 [component class](component.md)。）\n\n## Members\n\nThis class has both data members and functions.（此类兼有数据成员和函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| GlobalTransform | ?transform | 实体当前的世界（全局参照）变换。构造时设置的任何值都会被基于 LocalTransform 的计算结果覆盖。 |\n| LocalTransform | ?transform | 相对父实体/原点的局部变换。 |\n| Origin | ??origin | 相对默认父实体的替代原点。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，可在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回**同一个**实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/SceneGraph }\nusing { /Verse.org/SpatialMath }\n\n# 读取局部变换：两个 ?transform 字段都是可失败读取\nGetPos(TC:transform_component):void =\n    if (T := TC.LocalTransform?):\n        Print(\"位置 Forward 分量 = {T.Position.Forward}\")\n```\n\n## 补充说明\n\n- 本页函数表**没有** Set 位置/旋转类函数——变换通过 `LocalTransform` 等数据成员读写；`GlobalTransform` 是计算结果，构造时赋值会被覆盖（官方 Data 表明示）。\n- `LocalTransform`/`GlobalTransform`/`Origin` 均为可失败读取（`?`/`??` 类型），必须写在失败上下文里。\n- 相关页面：[component class](component.md)、[vector3 struct](../130_SpatialMath/vector3.md)、[rotation struct](../130_SpatialMath/rotation.md)。\n", "01_Verse.org/040_SceneGraph/execution_listenable.md": "---\nname: execution_listenable\nslug: versedotorg/scenegraph/execution_listenable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/execution_listenable\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# execution_listenable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/execution_listenable.html -->\n", "01_Verse.org/040_SceneGraph/has_camera_modifier.md": "---\nname: has_camera_modifier\nslug: versedotorg/scenegraph/has_camera_modifier\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/has_camera_modifier\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# has_camera_modifier 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/has_camera_modifier.html -->\n", "01_Verse.org/040_SceneGraph/easeable.md": "---\nname: easeable\nslug: versedotorg/scenegraph/easeable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/easeable\nkind: interface\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# easeable ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/easeable.html -->\n", "01_Verse.org/040_SceneGraph/scene_event.md": "---\nname: scene_event\nslug: versedotorg/scenegraph/scene_event\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/scene_event\nkind: interface\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# scene_event ⬜【C级·参考】\n\n<
