<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse API 中文注解</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1d2130;--fg:#dfe3ee;--dim:#8b91a7;--acc:#4da3ff;--line:#262b3a;
--s:#4da3ff;--a:#37c98b;--b:#e8c34a;--c:#6b7280}
*{box-sizing:border-box}body{margin:0;font:15px/1.65 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#app{display:grid;grid-template-columns:330px 1fr;height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#side header{padding:14px 14px 10px}
#side h1{font-size:15px;margin:0 0 10px}
#search{width:100%;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;outline:none}
#grades{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gbtn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:4px 10px;border-radius:20px;font-size:12.5px;user-select:none}
.gbtn.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
#tree{flex:1;overflow:auto;padding:8px 6px 30px}
#tree ul{list-style:none;margin:0;padding-left:14px}
#tree>ul{padding-left:6px}
#tree li{margin:1px 0}
#tree .d>span.t{font-weight:600}
#tree a{color:var(--fg);text-decoration:none;display:block;padding:3px 8px;border-radius:6px;cursor:pointer}
#tree a:hover{background:var(--panel2)}
#tree a.cur{background:#24304a;color:#fff}
#tree a .g{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
.gS{background:var(--s)}.gA{background:var(--a)}.gB{background:var(--b)}.gC{background:var(--c)}
.pend{color:var(--dim);font-size:11px;margin-left:5px}
#main{overflow:auto;position:relative}
#content{max-width:900px;margin:0 auto;padding:34px 40px 90px}
#content h1{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:10px}
#content h2{font-size:20px;margin-top:34px}
#content code{background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:13px;font-family:Consolas,monospace}
#content pre{background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:10px;overflow:auto}
#content pre code{border:none;background:none;padding:0;font-size:13.5px;line-height:1.55}
#content blockquote{margin:0;padding:6px 14px;border-left:3px solid var(--acc);color:var(--dim);background:var(--panel2);border-radius:0 8px 8px 0}
#content table{border-collapse:collapse;margin:14px 0;width:100%}
#content th,#content td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:14px}
#content th{background:var(--panel2)}
#content a{color:var(--acc);text-decoration:none}
#content a:hover{text-decoration:underline}
#nav{position:fixed;bottom:0;left:330px;right:0;display:flex;justify-content:space-between;padding:10px 40px;background:linear-gradient(transparent,var(--bg) 40%)}
#nav a{color:var(--acc);cursor:pointer;background:var(--panel2);border:1px solid var(--line);padding:6px 14px;border-radius:8px}
.pending-box{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--dim);margin:20px 0;text-align:center}
@media(max-width:900px){#app{grid-template-columns:1fr}#side{display:none}#nav{left:0}}
</style>
</head>
<body>

    <header><h1>Verse API 中文注解</h1><input id="search" placeholder="搜索 API 名称…"></header>
    <div id="grades"></div>
    <nav id="tree"></nav>
  </div>
  <div id="main"><article id="content"></article></div>
</div>

<script id="md-data" type="application/json">{"Intro.md": "# Verse API 中文注解资料库\n\n> **本资料库基于 [Epic 官方 Verse API Reference](https://dev.epicgames.com/documentation/fortnite/verse-api) 生成**（快照版本：API 42.10，抓取日期 2026-09-13），在官网结构之上增加了中文注解、示例代码与 S/A/B/C 重要程度分级。\n\n## 这是什么\n\n学习 Epic Games 的 Verse 语言时，官方 API 文档是英文的、按字母序排列、缺少\"该不该学\"的指引。本资料库按官网原本的 **模块层级与页面顺序** 重新组织，并为每个 API 提供：\n\n- 🇨🇳 **中文注解**——翻译官方描述，补充\"这是什么/何时用/常见坑\"\n- 💻 **可运行示例**——每个重要 API 配最小可用代码\n- 🎚️ **重要程度分级**——S 核心 / A 常用 / B 进阶 / C 参考，多选过滤见下方\"分级索引\"\n\n## 收录范围\n\n| 顶层模块 | 收录情况 |\n|---|---|\n| Verse.org | **全部 16 个子模块**（语言核心＋SceneGraph＋Simulation 等） |\n| UnrealEngine.com | **全部 11 个子模块**（含 Temporary 下的 UI/Curves/Diagnostics/SpatialMath） |\n| Fortnite.com | 精选 **5 个**：AI、Animation、Characters、Vehicles、UI（依据\"可能迁移至 UE6\"判断）；Devices 提供**纯索引页** |\n\n收录判断依据与逐模块说明见 [使用说明](使用说明.md)。\n\n## 分级与索引\n\n| 徽标 | 级别 | 说明 | 快速入口 |\n|---|---|---|---|\n| 🟦 | S 核心 | 几乎每个项目必用 | [S 级索引](90_分级索引/S索引.md) |\n| 🟩 | A 常用 | 多数项目会用 | [A 级索引](90_分级索引/A索引.md) |\n| 🟨 | B 进阶 | 特定场景使用 | [B 级索引](90_分级索引/B索引.md) |\n| ⬜ | C 参考 | 极少用、按需查询 | [C 级索引](90_分级索引/C索引.md) |\n\n## 在线浏览\n\n- **GitBook（推荐阅读）**：本仓库导入 GitBook 后在线查看，左侧边栏即完整层级。\n- **交互式页面**：仓库内的 `index.html` 是单文件交互版（双击本地即可打开，或部署到 GitHub Pages），支持**左侧层级树＋分级多选过滤＋搜索**。\n- **官方原文对照**：每个页面的 frontmatter 都有 `url` 字段指向官网原始页面。\n\n## 生成与维护\n\n结构清单见 [MANIFEST](MANIFEST.md)，写作规范见 [STYLE_GUIDE](STYLE_GUIDE.md)，各模块生成进度见 [PROGRESS](PROGRESS.md)。所有页面基于 `sources/` 目录中保存的官方页面快照生成，避免臆造 API。\n", "00_语言基础/_overview.md": "---\nname: 语言基础\nslug: (补充章节)\nurl: \nkind: module\nmodule: /补充\ngrade: S\ndepth: brief\nstatus: placeholder\n---\n\n# 语言基础〔补充·非官网镜像〕\n\n<!-- 待生成 -->\n", "00_语言基础/failure.md": "---\nname: 可失败表达式与failure\nslug: (补充)语言基础.failure\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\nsupplement: true\n---\n\n# 可失败表达式与 failure 🟦【S级·核心】〔补充·非官网镜像〕\n\n> Verse 用\"失败\"代替\"异常/空指针\"：任何操作都可能成功或失败，失败不崩溃，只是\"这条路不通\"。\n> 本页为语言机制补充，官网 API Reference 无对应单页（各 API 页标注 `<decides>` 即为可失败）。\n\n## 这是什么\n\n这是 Verse 最独特、最重要的机制。带 `<decides>` 效果的函数/运算符是\"可失败\"的：调用它**必须**处在\"失败上下文\"里。失败上下文里的表达式从上到下尝试，**任何一个失败，整块代码跳过**（不是报错），程序继续走后面的路。\n\n常见的失败上下文写法：\n\n| 写法 | 说明 |\n|---|---|\n| `if (Expr)` | 表达式成功 → 执行块内代码；失败 → else/跳过 |\n| `for (X : Arr)` | 遍历也算失败上下文 |\n| `F[]` | 用 `[]` 调用可失败函数（无参 failable） |\n| `A and B`, `not A` | 逻辑组合，短路求值 |\n| `X := Expr` | 定义语句本身可失败（Expr 失败则不定义） |\n\n## 最小示例\n\n```verse\nScore(Name:string):void =\n    if:\n        P := Players[Name]        # 1. 查到玩家才继续\n        S := Scores[P]            # 2. 有分数才继续（任意一步失败 → 整块跳过）\n        S > 10                    # 3. 条件判断也是可失败表达式\n    then:\n        Print(\"{Name} 是高手\")\n\n# 多个初始化挤一行也行：\nif (A := Arr[0], B := Map[A] or 0, B > 0) { Print(\"ok\") }\n```\n\n## 与\"错误处理\"的思维差异\n\n- 传统语言：先写快乐路径，再 try/catch 兜底。\n- Verse：把\"可能失败\"写进类型里（`<decides>`），调用方**被迫**处理失败——要么分支，要么 `or 默认值`，要么继续往上失败。编译器保证你漏不掉。\n\n## 常用模式\n\n| 模式 | 写法 |\n|---|---|\n| 取值兜底 | `V := M[K] or 默认` |\n| agent 转 player | `if (P := player[Agent]) {…}` |\n| 链式安全取值 | `if (C := Obj.GetComponent[], P := C.Position[]) {…}` |\n| 断言已知安全 | 确定不会失败时可用 `X:calc` 上下文断言（慎用，失败会中断程序） |\n\n## 何时用 / 何时不用\n\n- 用：一切可能不成立的读取/查询/比较。\n- 不用：不要为了\"绕开失败\"而把逻辑写成嵌套 if 泥球——善用 `or 默认值` 与提前返回。\n\n## 常见坑\n\n- 可失败函数用 `()` 调用会编译错误，无参 failable 必须写 `[]`（如 `GetTeam[]`）。\n- 失败上下文里 `set` 变量后若整块失败，**回滚**该块内的修改（事务性）——这正是 `<decides>` 的设计，注意副作用函数别放进失败块。\n\n## 相关页面\n\n- [option——可选值](option.md)\n- [array——数组](array.md)\n- [operator'=](../01_Verse.org/010_Verse/operatorequals.md) —— 最常见的可失败运算符\n", "00_语言基础/string.md": "---\nname: string——字符串\nslug: (补充)语言基础.string\nurl:\nkind: class\nmodule: /语言基础\ngrade: A\ndepth: full\nstatus: done\nsupplement: true\n---\n\n# string——字符串 🟩【A级·常用】〔补充·非官网镜像〕\n\n> 字符串是 UTF-8 文本的内建类型；官网 API Reference 无单设页面，本页为学习补充。\n\n## 这是什么\n\n双引号字面量 `\"...\"` 即字符串。要点：\n\n- **插值**：`\"分数: {Score}\"` 花括号内嵌任意表达式，是最常用输出手段。\n- **连接**：`A + B` 拼接；重复拼接考虑 `Join`。\n- 与 `[]char`（字符数组）互转：`ToUtf8[]`/`FromUtf8[]` 是可失败转换（官方 Print 的参数类型就是 `[]char`）。\n\n## 最小示例\n\n```verse\nName:string = \"世界\"\nMsg := \"你好, {Name}! {1 + 2}\"      # 你好, 世界! 3\nJoined := Join(array{\"a\", \"b\", \"c\"}, \"-\")   # a-b-c（Join 在 /Verse.org/Verse）\n```\n\n## 何时用 / 何时不用\n\n- 用：日志、UI 文案（正式 UI 文案用 [message](../01_Verse.org/010_Verse/message.md) 做本地化）。\n- 不用：大量拼接/高频修改的文本——每次拼接都生成新串。\n\n## 常见坑\n\n- 插值只认 `{表达式}`；想输出字面花括号需转义写法。\n- 中文等多字节字符按\"字符\"而非\"字节\"处理时，注意与 `[]char` 转换的可失败性。\n\n## 相关页面\n\n- [Print](../01_Verse.org/010_Verse/print.md)\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/map.md": "---\nname: map——映射\nslug: (补充)语言基础.map\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\nsupplement: true\n---\n\n# map——映射 🟦【S级·核心】〔补充·非官网镜像〕\n\n> 映射是\"键 → 值\"的内建关联容器，官网 API Reference 无单设页面，本页为学习补充。\n> 类型写作 `[K]V`（如 `[string]int`），字面量写作 `map{\"a\" => 1, \"b\" => 2}`。\n\n## 这是什么\n\n映射按**键**存取值，就像字典。三个要点：\n\n1. **取值可失败**：`M[K]` 在键不存在时失败，必须放在失败上下文里。\n2. **不可变**：和数组一样，\"修改\"是生成新映射再 `set` 回去；`ConcatenateMaps` 可合并。\n3. **键需可比较**：常用 int/string/player 等作键；配合 `weak_map` 可以用对象当键（见 session 页的全局变量模式）。\n\n## 最小示例\n\n```verse\nScores:[string]int = map{\"Anna\" => 3, \"Ben\" => 7}\n\nAddPoint(Name:string):void =\n    Old := Scores[Name] or 0                     # 不存在则 0\n    if (set Scores = ConcatenateMaps(Scores, map{Name => Old + 1})) {}\n    # 单键更新也可以直接: if (set Scores[Name] = Old + 1) {}\n\nLookup(Name:string):string =\n    \"{Name} 的分数: {Scores[Name] or 0}\"\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `M[K]` | 取键对应的值 | 缺键失败 |\n| `M[K] = V` | （在 `set` 中）设置/更新键 | — |\n| `ConcatenateMaps(A, B)` | 合并两个映射（B 优先） | 否 |\n| `for (K -> V : M)` | 遍历键值对 | — |\n| `weak_map[K, V]` | 键为\"弱引用对象\"的映射（可存 player/session 等） | — |\n\n## 何时用 / 何时不用\n\n- 用：按 ID/名字/玩家查数据——记分板、配置表、`weak_map[player]` 状态。\n- 不用：只需顺序遍历的集合用数组；需要\"每回合清空的全局表\"配 session 用。\n\n## 常见坑\n\n- `set M[K] = V` 对不存在的键是**新增**还是失败取决于写法——统一用 `or 默认值` 先读后写的模式最稳。\n- 遍历顺序不保证与你插入的顺序一致。\n\n## 相关页面\n\n- [array——数组](array.md)\n- [session](../01_Verse.org/100_Simulation/session.md) —— weak_map 全局变量标准用法\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/logic_void.md": "---\nname: logic与void\nslug: (补充)语言基础.logic_void\nurl:\nkind: class\nmodule: /语言基础\ngrade: B\ndepth: brief\nstatus: done\nsupplement: true\n---\n\n# logic 与 void 🟨【B级·进阶】〔补充·非官网镜像〕\n\n> 两个基础类型：logic 是\"真/假\"，void 是\"无返回值\"；官网 API Reference 无单设页面。\n\n## 这是什么\n\n- `logic`：只有 `true` / `false`。注意它**与失败上下文不同**——`logic` 是值，失败是\"路不通\"。API 里很多状态查询返回 logic（如 `IsCrouching()`），而\"可失败查询\"（`IsCrouching[]`）走失败分支，两者别混。\n- `void`：函数不返回值时的返回类型，如 `Sleep(1.0):void`。\n\n## 最小示例\n\n```verse\nIsReady:logic = true\nif (IsReady?):      # logic 可用 ? 转为可失败判断\n    Print(\"ready\")\n```\n\n## 常见坑\n\n- `logic` 参与失败上下文要写 `If?`；直接 `if (IsReady)` 不合法。\n- \"返回 logic 的函数\"与\"`<decides>` 可失败函数\"在 API 页签名一眼可辨：后者带 `<decides>`。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n", "00_语言基础/option.md": "---\nname: option——可选值\nslug: (补充)语言基础.option\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\nsupplement: true\n---\n\n# option——可选值 🟦【S级·核心】〔补充·非官网镜像〕\n\n> option 表示\"可能有一个值，也可能没有\"，官网 API Reference 无单设页面，本页为学习补充。\n> 类型写作 `?T`（如 `?int`），有值字面量 `option{7}`，空值 `false`。\n\n## 这是什么\n\n`?T` 解决\"这个值可能不存在\"的问题——比返回 -1 之类的哨兵值干净得多。它和失败上下文深度绑定：**取出 option 里的值本身就是一个可失败操作**（`Opt?`），于是\"有值就继续、没值就走别路\"成了一行代码。\n\n## 最小示例\n\n```verse\nvar Nickname:?string = option{\"Alice\"}\nset Nickname = false            # 清空\n\nShow():void =\n    if (Name := Nickname?):     # 有值 → Name 是 string；无值 → 走 else\n        Print(\"昵称 {Name}\")\n    else:\n        Print(\"没有昵称\")\n\nDefault():string =\n    Nickname? or \"无名氏\"        # 取值失败给默认\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `Opt?` | 取出值 | 空则失败 |\n| `Opt? or 默认` | 取值失败用默认 | 否 |\n| `option{V}` / `false` | 构造有值/空 | — |\n| `Opt = 值判断` | `if (Opt = option{7})` 比较 | 可失败 |\n\n## 何时用 / 何时不用\n\n- 用：查询可能无结果（map 里没有、玩家没设置昵称）；API 返回\"可能空\"的字段。\n- 不用：值一定存在时别用 option，多一层失败上下文徒增噪音。\n\n## 常见坑\n\n- `?T` 的空值写作 `false`，不是 `null`/`none`——第一次见非常反直觉，记住即可。\n- `Opt?` 之后变量类型是 `T`（脱掉了 `?`），可以直接当普通值用。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n- [array——数组](array.md)\n", "00_语言基础/array.md": "---\nname: array——数组\nslug: (补充)语言基础.array\nurl:\nkind: class\nmodule: /语言基础\ngrade: S\ndepth: full\nstatus: done\nsupplement: true\n---\n\n# array——数组 🟦【S级·核心】〔补充·非官网镜像〕\n\n> 数组是 Verse 内建的有序集合类型，官网 API Reference 没有为它单设页面（属于语言内建），本页为学习补充。\n> 类型写作 `T[]`（如 `int[]`），字面量写作 `array{1, 2, 3}`。\n\n## 这是什么\n\n数组存放一组**同类型、有序**的值。三个要点：\n\n1. **不可变长度**：Verse 数组创建后长度固定，没有 `Add`/`Remove`；\"增删\"靠生成新数组（`Arr + array{X}`、`Arr.RemoveLast[]` 等可失败操作）。\n2. **索引可失败**：`Arr[I]` 在 I 越界时**失败**而不是崩溃——必须放在失败上下文里用。\n3. **值类型拷贝语义**：赋值/传参是拷贝，修改副本不影响原数组。\n\n## 最小示例\n\n```verse\nArr:int[] := array{10, 20, 30}          # 定义\nFirst:int = Arr[0]                      # 已知不越界时可这样断言\nfor (I := 0..Arr.Length - 1, V := Arr[I]):   # 安全遍历（带索引）\n    Print(\"{I} = {V}\")\nfor (V : Arr):                          # 不需要索引时更简洁\n    Print(\"{V}\")\nBigger:int[] = Arr + array{40}          # 新数组 = 旧 + 追加\nMaybe := Arr[5] or -1                   # 越界兜底：失败时给默认值\n```\n\n## 常用操作\n\n| 写法 | 说明 | 失败? |\n|---|---|---|\n| `Arr[I]` | 取第 I 个元素（0 起） | 越界则失败 |\n| `Arr.Length` | 元素个数 | 否 |\n| `A + B` | 两个数组连接成新数组 | 否 |\n| `Arr.RemoveLast[]` | 去掉末尾元素的新数组（failable，`[]` 调用） | 空数组失败 |\n| `for (V : Arr)` | 遍历 | — |\n\n## 何时用 / 何时不用\n\n- 用：固定一批同类对象（所有玩家、所有生成点、一串节拍时间）。\n- 不用：需要频繁增删的动态集合——考虑 `map` 或重新设计为\"每帧重建数组\"。\n\n## 常见坑\n\n- **越界是失败不是错误**：`Arr[Arr.Length]` 永远失败，配合 `or 默认值` 或 `if` 处理。\n- 数组没有\"原地修改\"，`set Arr += array{X}` 实际是整体替换变量。\n- `Arr[0]` 在失败上下文之外会编译报错，别图省事裸写。\n\n## 相关页面\n\n- [map——映射](map.md)\n- [可失败表达式与failure](failure.md)\n- [option——可选值](option.md)\n", "00_语言基础/tuple_subtype.md": "---\nname: 元组与子类型\nslug: (补充)语言基础.tuple_subtype\nurl:\nkind: class\nmodule: /语言基础\ngrade: B\ndepth: brief\nstatus: done\nsupplement: true\n---\n\n# 元组与子类型 🟨【B级·进阶】〔补充·非官网镜像〕\n\n> 元组把几个值打包成一个；子类型 `subtype` 描述\"某类型的子集\"。官网 API Reference 无单设页面。\n\n## 这是什么\n\n- **元组**：`(A, B)` 类型写作 `tuple(A, B)`，事件载荷常见（如 fort_character 的蹲起事件回传 `(角色, 是否蹲)`）。\n- **子类型**：`where` 子句约束类型参数，如 `t:comparable` 表示\"任何可比较类型\"——这是泛型 API（Min/Max、event(t)）的基础。\n\n## 最小示例\n\n```verse\nPair := (1, \"one\")                  # tuple(int, string)\nN:int = Pair(0)                     # 按位置取分量\nM := event(tuple(agent, logic))     # 元组作事件载荷\n```\n\n## 常见坑\n\n- 元组按位置而非名字取值，分量多时可读性骤降——三个以上考虑 class。\n\n## 相关页面\n\n- [event(t)](../01_Verse.org/010_Verse/event_t_.md)\n", "00_语言基础/int.md": "---\nname: 数值类型 int/float/rational\nslug: (补充)语言基础.int\nurl:\nkind: class\nmodule: /语言基础\ngrade: A\ndepth: brief\nstatus: done\nsupplement: true\n---\n\n# 数值类型 int / float / rational 🟩【A级·常用】〔补充·非官网镜像〕\n\n> Verse 的三种数值类型；官网 API Reference 无单设页面，本页为学习补充。\n\n## 这是什么\n\n| 类型 | 写法 | 用途 | 注意 |\n|---|---|---|---|\n| `int` | `42` | 计数、索引、分数 | 除法 `/` 是**可失败**的整除（除数为 0 失败）；取模用 `Mod` |\n| `float` | `3.14`、`1.0e-3` | 时间、坐标、比例 | 与 int 不隐式互转；`Int[]`/`Float[]` 显式转换且可失败 |\n| `rational` | `Rational(1, 3)` | 精确分数（音频/节拍场景） | 避免浮点误差，音乐类玩法可用 |\n\n## 最小示例\n\n```verse\nHalf := 1.0 / 2.0              # 0.5\nQ := Quotient(7, 2)            # 3（整数商）\nR := Mod(7, 2)                 # 1（余数）\nF := Float[3] or 0.0           # int→float 可失败转换 + 兜底\n```\n\n## 常见坑\n\n- `7 / 2` 是整数除法（=3）；想得 3.5 要写 `7.0 / 2.0`。\n- float 精度有限，节拍累加建议用 rational 或\"目标时刻 + GetSimulationElapsedTime\"比较。\n\n## 相关页面\n\n- [可失败表达式与failure](failure.md)\n- [Verse 数学函数族](../01_Verse.org/010_Verse/_overview.md)\n", "01_Verse.org/_overview.md": "---\nname: Verse.org\nslug: versedotorg\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg\nkind: module\nmodule: /Verse.org\ngrade: S\ndepth: brief\nstatus: placeholder\n---\n\n# Verse.org 🟦【S级·核心】\n\n<!-- 待生成 -->\n", "01_Verse.org/010_Verse/_overview.md": "---\nname: Verse\nslug: versedotorg/verse\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse\nkind: module\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Verse 🟨【B级·进阶】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "01_Verse.org/010_Verse/classifiable_subset_element_type.md": "---\nname: classifiable_subset(element_type)\nslug: versedotorg/verse/classifiable_subset/classifiable_subset(element_type)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/classifiable_subset/classifiable_subset(element_type)\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# classifiable_subset(element_type) ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/classifiable_subset/classifiable_subset(element_type).html -->\n", "01_Verse.org/010_Verse/diagnostic.md": "---\nname: diagnostic\nslug: versedotorg/verse/diagnostic\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/diagnostic\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# diagnostic 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/diagnostic.html -->\n", "01_Verse.org/010_Verse/event_t.md": "---\nname: event(t)\nslug: versedotorg/verse/event/event(t)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event/event(t)\nkind: class\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# event(t) 🟦【S级·核心】\n\n> Signaling events with payloads of type t.\n> 带类型 t 载荷的\"信号事件\"：一端触发（Signal），一端等待（Await）或订阅（Subscribe）。\n\n## 这是什么\n\n`event(t)` 是 Verse 异步协作的核心原语，理解成\"类型化信箱\"：\n\n- **Signal(值)**：投递一个载荷，唤醒所有等待者，**不阻塞**调用方。\n- **Await()**：阻塞当前协程直到下一次 Signal，返回载荷；只能在 `<suspends>` 上下文用。\n- **Subscribe(对象)**：注册一个成员函数持续接收信号（实现 subscribable 接口）。\n- **Reset()**：清空状态。\n\n事件是\"一次性信使\"：`Await` 只拿**下一次** Signal 的值，没有\"积压回放\"。持续监听变化请配 listenable（设备事件都是 listenable）。\n\n## 签名\n\n```verse\nevent(t:any)<public> := class<concrete>(subscribable(t), signalable(t)):\n    Await<public>()<suspends>:t          # 等待下一次信号并返回载荷\n    Signal<public>(x:t):void             # 触发事件（广播载荷）\n    Reset<public>():void                 # 重置内部状态\n```\n\n构造用参数化函数：`MyEvent := event(int){}`（见 [event](event.md) 构造页）。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Verse.org/Simulation }\n\nCounter := class:\n    Tick:event(int) = event(int){}       # 建一个 int 载荷事件\n    var Count:int = 0\n\n    Bump():void =\n        set Count += 1\n        Tick.Signal(Count)               # 广播\n\n    Run()<suspends>:void =\n        N := Tick.Await()                # 挂起等待，Signal 一到就醒\n        Print(\"第 {N} 次计数\")\n```\n\n## 常用成员\n\n| 成员 | 签名 | 说明 | 级别 |\n|---|---|---|---|\n| `Signal` | `(x:t):void` | 触发，广播载荷 | 🟦 S |\n| `Await` | `()<suspends>:t` | 等下一次信号，返回载荷 | 🟦 S |\n| `Subscribe` | 来自 subscribable | 持续订阅（成员函数回调） | 🟩 A |\n| `Reset` | `():void` | 清空 | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：脚本内部\"这里发生了，请那边继续\"的协作；一次性的状态通知；配 `race` 做超时（`Await` 与 `Sleep(5.0)` 竞速）。\n- 不用：与设备/玩家系统交互——那些是 listenable（Subscribe 模式），不是自建 event。\n\n## 常见坑\n\n- `Await` 丢历史：Signal 发生时若无人等待，载荷不会被记住。要先有等待者。\n- `Signal` 不会等待处理者完成——广播后立刻返回。\n- 类里声明事件字段要带构造：`Tick:event(int) = event(int){}`，缺了 `{}` 是空引用错误。\n\n## 相关页面\n\n- [event 构造函数](event.md)\n- [listenable](listenable.md) —— 设备事件的订阅模型\n- [Sleep](../100_Simulation/sleep.md) —— 配 race 做超时\n", "01_Verse.org/010_Verse/locale.md": "---\nname: locale\nslug: versedotorg/verse/locale\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/locale\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# locale 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/locale.html -->\n", "01_Verse.org/010_Verse/message.md": "---\nname: message\nslug: versedotorg/verse/message\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/message\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# message 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/message.html -->\n", "01_Verse.org/010_Verse/modifier_stack_t.md": "---\nname: modifier_stack(t)\nslug: versedotorg/verse/modifier_stack/modifier_stack(t)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/modifier_stack/modifier_stack(t)\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# modifier_stack(t) ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/modifier_stack/modifier_stack(t).html -->\n", "01_Verse.org/010_Verse/cancelable.md": "---\nname: cancelable\nslug: versedotorg/verse/cancelable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/cancelable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# cancelable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/cancelable.html -->\n", "01_Verse.org/010_Verse/disposable.md": "---\nname: disposable\nslug: versedotorg/verse/disposable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/disposable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# disposable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/disposable.html -->\n", "01_Verse.org/010_Verse/enableable.md": "---\nname: enableable\nslug: versedotorg/verse/enableable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/enableable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# enableable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/enableable.html -->\n", "01_Verse.org/010_Verse/invalidatable.md": "---\nname: invalidatable\nslug: versedotorg/verse/invalidatable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/invalidatable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# invalidatable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/invalidatable.html -->\n", "01_Verse.org/010_Verse/showable.md": "---\nname: showable\nslug: versedotorg/verse/showable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/showable\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# showable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/showable.html -->\n", "01_Verse.org/010_Verse/operatorequals.md": "---\nname: operator'='\nslug: versedotorg/verse/operatorequals\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorequals\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# operator'='（相等比较）🟦【S级·核心】\n\n> 比较 Lhs 与 Rhs 是否相等；相等则成功（返回 Lhs），不相等则失败。\n> 这是把\"相等性\"接入 Verse 失败机制的运算符——签名里的 `<decides>` 是关键。\n\n## 签名\n\n```verse\noperator'='(Lhs:t, Rhs:comparable)<decides>:t where t:comparable\n```\n\n对应的不等运算符 [operator'&lt;&gt;](operatorlessgreater.md) 语义相反。\n\n## 这是什么\n\n`A = B` 在 Verse 里不是\"赋值\"而是**可失败的相等判断**（赋值是 `set`）。它可以：\n\n1. 出现在失败上下文的条件位：`if (X = 5) {…}` 等价于传统 `if (X == 5)`。\n2. **兼作取值**：`if (Y := X = 5)`——相等时 Y 被绑定为 X，一条语句完成判断＋取值。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Verse }\n\nCheck(HP:int):void =\n    if (HP = 0):\n        Print(\"角色倒下\")\n    if (Best := HP = 100):      # 相等时 Best = 100\n        Print(\"满血 {Best}\")\n\nUnequal(HP:int):void =\n    if (HP <> 0):               # 不等：不相等则成功\n        Print(\"还活着\")\n```\n\n## 何时用 / 何时不用\n\n- 用：一切相等/不等判断；想在判断的同时拿值时用 `:= X = Rhs` 形式。\n- 不用：赋值请用 `set X = V`（语句，不是可失败表达式）。\n\n## 常见坑\n\n- 来自其他语言的肌肉记忆：`=` 判断、`:=` 定义、`set … =` 赋值，三者各司其职，写错位置直接编译错误。\n- 参与比较的类型需满足 `comparable`；自定义 class 要可比较需满足相应接口。\n\n## 相关页面\n\n- [可失败表达式与failure](../../00_语言基础/failure.md)\n- [operator'&lt;&gt;](operatorlessgreater.md)\n", "01_Verse.org/010_Verse/operatorlessgreater.md": "---\nname: operator'<>'\nslug: versedotorg/verse/operatorlessgreater\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorlessgreater\nkind: function\nmodule: /Verse.org\ngrade: S\ndepth: full\nstatus: placeholder\n---\n\n# operator'<>' 🟦【S级·核心】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorlessgreater.html -->\n", "01_Verse.org/010_Verse/prefixminus.md": "---\nname: prefix'-'\nslug: versedotorg/verse/prefixminus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/prefixminus\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# prefix'-' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/prefixminus.html -->\n", "01_Verse.org/010_Verse/operatorplus.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus.html -->\n", "01_Verse.org/010_Verse/operatorminus.md": "---\nname: operator'-'\nslug: versedotorg/verse/operatorminus\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorminus\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'-' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorminus.html -->\n", "01_Verse.org/010_Verse/operatorstar.md": "---\nname: operator'*'\nslug: versedotorg/verse/operatorstar\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorstar\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'*' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorstar.html -->\n", "01_Verse.org/010_Verse/operatorslash.md": "---\nname: operator'/'\nslug: versedotorg/verse/operatorslash\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorslash\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'/' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorslash.html -->\n", "01_Verse.org/010_Verse/operatorplusequals.md": "---\nname: operator'+='\nslug: versedotorg/verse/operatorplusequals\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/ map\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/fitsinplayermap\nkind: function\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# FitsInPlayerMap ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/fitsinplayermap.html -->\n", "01_Verse.org/010_Verse/print.md": "---\nname: Print\nslug: versedotorg/verse/print\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Print 🟦【S级·核心】\n\n> Writes Message to a dedicated Print log while displaying it in Color.\n> 把消息写入专用的 Print 日志，并以指定颜色显示出来。\n\n## 签名\n\n```verse\nPrint<public><native>(Message:[]char, Duration:float, Color:color)<transacts>:void\n```\n\n另有两个重载（各占一页）：`Message:message`（[print-1](print-1.md)）与 `Message:diagnostic`（[print-2](print-2.md)）。\n\n## 这是什么\n\nVerse 里最常用的调试/反馈手段。消息显示在游戏画面的 Print 日志（UEFN 内按 `~` 或输出窗口查看）。参数 `Duration` 控制显示时长，`Color` 控制颜色（配合 `/Verse.org/Colors` 的常量，如 `NamedColors.Red`）。\n\n字符串字面量会自动转成 `[]char`，所以 `Print(\"hello\")` 直接可用；格式化用字符串插值 `\"分数: {Score}\"`。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Verse.org/Colors }\nusing { /Verse.org/Colors/NamedColors }\n\nScore := 42\nPrint(\"分数: {Score}\")                                   # 普通输出\nPrint(\"出错了!\", Duration := 5.0, Color := NamedColors.Red)  # 红字显示 5 秒\n```\n\n## 何时用 / 何时不用\n\n- 用：调试、学习、临时反馈。\n- 不用：面向玩家的正式 UI 文案——用 widget/message；成体系日志用 `/UnrealEngine.com/Temporary/Diagnostics` 的 log。\n\n## 常见坑\n\n- Print 本身在开发版 UI 才可见，发行给玩家后看不到——别用它做玩法提示。\n- 高频循环里狂 Print 会拖慢性能，调试完记得删。\n\n## 相关页面\n\n- [print-1](print-1.md) / [print-2](print-2.md) —— message / diagnostic 重载\n- [string——字符串](../../00_语言基础/string.md) —— 插值语法\n- [NamedColors](../120_Colors/_overview.md) —— 颜色常量\n", "01_Verse.org/010_Verse/print-1.md": "---\nname: Print (message 重载)\nslug: versedotorg/verse/print-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Print (message 重载) 🟦【S级·核心】\n\n> Writes Message to a dedicated Print log while displaying it in Color.\n> Print 的 message 版本：可打印**可本地化**的 message 对象。\n\n## 签名\n\n```verse\nPrint<public><native>(Message:message, Duration:float, Color:color)<transacts>:void\n```\n\n## 这是什么\n\n与 [print](print.md) 行为一致，区别是参数类型为 [message](message.md)——本地化文本对象（`Localize` 构造）。当你想调试\"玩家实际看到的本地化文本\"时用它。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Verse }\n\nGreeting:message = Localize(\"hello.key\", [\"Name\"], array[\"World\"])\nPrint(Greeting)\n```\n\n## 相关页面\n\n- [Print](print.md) —— 主版本\n- [message](message.md)\n", "01_Verse.org/010_Verse/print-2.md": "---\nname: Print (diagnostic 重载)\nslug: versedotorg/verse/print-2\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/print-2\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# Print (diagnostic 重载) 🟦【S级·核心】\n\n> Writes Message to a dedicated Print log while displaying it in Color.\n> Print 的 diagnostic 版本：可直接打印 [diagnostic](diagnostic.md) 对象。\n\n## 签名\n\n```verse\nPrint<public>(Message:diagnostic, Duration:float, Color:color)<transacts>:void\n```\n\n## 这是什么\n\n与 [Print](print.md) 行为一致，接受 diagnostic（通常配合 `ToDiagnostic` 或诊断管道使用）。日常调试用主版本即可。\n\n## 相关页面\n\n- [Print](print.md)\n- [diagnostic](diagnostic.md)\n", "01_Verse.org/010_Verse/concatenate.md": "---\nname: Concatenate\nslug: versedotorg/verse/concatenate\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/concatenate\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Concatenate 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/concatenate.html -->\n", "01_Verse.org/010_Verse/classifiable_subset.md": "---\nname: classifiable_subset\nslug: versedotorg/verse/classifiable_subset\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/classifiable_subset\nkind: function\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# classifiable_subset ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/classifiable_subset.html -->\n", "01_Verse.org/010_Verse/makeclassifiablesubset.md": "---\nname: MakeClassifiableSubset\nslug: versedotorg/verse/makeclassifiablesubset\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/makeclassifiablesubset\nkind: function\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# MakeClassifiableSubset ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/makeclassifiablesubset.html -->\n", "01_Verse.org/010_Verse/operatorplus-3.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-3\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-3\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus-3.html -->\n", "01_Verse.org/010_Verse/operatorplus-4.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-4\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-4\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus-4.html -->\n", "01_Verse.org/010_Verse/operatorplus-5.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-5\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-5\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus-5.html -->\n", "01_Verse.org/010_Verse/operatorplus-6.md": "---\nname: operator'+'\nslug: versedotorg/verse/operatorplus-6\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/operatorplus-6\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# operator'+' 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/operatorplus-6.html -->\n", "01_Verse.org/010_Verse/todiagnostic.md": "---\nname: ToDiagnostic\nslug: versedotorg/verse/todiagnostic\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/todiagnostic\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# ToDiagnostic 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/todiagnostic.html -->\n", "01_Verse.org/010_Verse/err.md": "---\nname: Err\nslug: versedotorg/verse/err\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/err\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Err 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/err.html -->\n", "01_Verse.org/010_Verse/event.md": "---\nname: event(t) 构造函数\nslug: versedotorg/verse/event\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# event(t) 构造函数 🟦【S级·核心】\n\n> event<public>(t:any):event(t) —— 参数化构造：按载荷类型创建事件实例。\n> 官方说明：This function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n\n## 签名\n\n```verse\nevent<public>(t:any):event(t)\n```\n\n## 这是什么\n\n`event(t)` 类没有直接字面量构造，统一走这个构造函数：`event(int){}` 得到\"int 载荷事件\"，`event(tuple(agent, logic))` 得到复合载荷事件。类型参数决定 [event(t)](event_t.md) 的载荷类型。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Verse }\n\nGate:event(logic) = event(logic){}     # logic 载荷\nDoorOpen:event() = event(){?}          # 无载荷版本见 event-1\n```\n\n## 相关页面\n\n- [event(t) 类](event_t.md) —— Signal/Await 用法\n- [event-1](event-1.md) —— 无载荷构造\n", "01_Verse.org/010_Verse/event-1.md": "---\nname: event() 构造函数（无载荷）\nslug: versedotorg/verse/event-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# event() 构造函数（无载荷）🟦【S级·核心】\n\n> event<public>():event(t) —— 不指定载荷类型的构造重载，由上下文推断 t。\n> 无载荷事件只关心\"发生了\"这个事实，`Await()` 返回值忽略即可。\n\n## 签名\n\n```verse\nevent<public>():event(t)\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Verse }\n\nKickoff:event() = event(){}\n\nWaitAndGo()<suspends>:void =\n    Kickoff.Await()      # 不关心载荷，只等信号\n    Print(\"GO!\")\n```\n\n## 相关页面\n\n- [event(t) 类](event_t.md)\n- [event 构造函数](event.md)\n", "01_Verse.org/010_Verse/ceil-1.md": "---\nname: Ceil\nslug: versedotorg/verse/ceil-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/ceil-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Ceil 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/ceil-1.html -->\n", "01_Verse.org/010_Verse/floor-1.md": "---\nname: Floor\nslug: versedotorg/verse/floor-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/floor-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Floor 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/floor-1.html -->\n", "01_Verse.org/010_Verse/round.md": "---\nname: Round\nslug: versedotorg/verse/round\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/round\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Round 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/round.html -->\n", "01_Verse.org/010_Verse/int.md": "---\nname: Int\nslug: versedotorg/verse/int\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/int\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Int 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/int.html -->\n", "01_Verse.org/010_Verse/tostring.md": "---\nname: ToString\nslug: versedotorg/verse/tostring\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/tostring\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# ToString 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/tostring.html -->\n", "01_Verse.org/010_Verse/getsecondssinceepoch.md": "---\nname: GetSecondsSinceEpoch\nslug: versedotorg/verse/getsecondssinceepoch\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/getsecondssinceepoch\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# GetSecondsSinceEpoch 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/getsecondssinceepoch.html -->\n", "01_Verse.org/010_Verse/tostring-1.md": "---\nname: ToString\nslug: versedotorg/verse/tostring-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/tostring-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# ToString 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/tostring-1.html -->\n", "01_Verse.org/010_Verse/listenable.md": "---\nname: listenable(payload) 构造\nslug: versedotorg/verse/listenable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/listenable\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: full\nstatus: done\n---\n\n# listenable(payload) 构造 🟦【S级·核心】\n\n> listenable<public>(payload:any):listenable(payload) —— 参数化构造：创建可被多方持续订阅的广播事件。\n> 官方说明：This function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n\n## 这是什么\n\n`listenable` 是\"持续广播\"的事件源，与 [event](event_t.md) 的\"一次性等待\"相对：\n\n- **Subscribe(处理器)**：注册回调，之后**每次**触发都会收到，直到 Unsubscribe。\n- **Signal**：一般由系统/内部触发——设备事件（如 `TriggerDevice.InteractedWithEvent`）就是现成的 listenable，你的代码通常只做 Subscribe。\n- 处理器是**类的成员函数**，第一个参数自动传入订阅者实例，后续参数接载荷。\n\n## 签名\n\n```verse\nlistenable<public>(payload:any):listenable(payload)\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Verse }\nusing { /Fortnite.com/Devices }\n\n# 订阅按钮设备的交互事件（listenable 的典型用法）\nMyDevice := class(creative_device):\n\n    @editable\n    MyButton : button_device = button_device{}\n\n    OnBegin<override>()<suspends>:void =\n        MyButton.InteractedWithEvent.Subscribe(OnButtonPressed)\n\n    OnButtonPressed(Agent:agent):void =\n        Print(\"{Agent} 按下了按钮\")\n```\n\n## 常用成员\n\n| 成员 | 说明 | 级别 |\n|---|---|---|\n| `Subscribe(Obj.函数)` | 持续订阅；返回 cancelable 句柄可退订 | 🟦 S |\n| `Unsubscribe(句柄)` | 取消订阅 | 🟩 A |\n| `Signal(载荷)` | 手动触发（自建 listenable 时） | 🟩 A |\n\n## 何时用 / 何时不用\n\n- 用：响应设备事件、玩家进出对局、回合开始结束——一切\"系统推给你\"的消息。\n- 不用：脚本内部一次性握手用 event 更轻。\n\n## 常见坑\n\n- 订阅回调是**类成员函数**，写在类里；函数体不能 `<suspends>`（想异步处理就在回调里 `spawn`）。\n- 订阅时机要在 `OnBegin` 里完成，晚了会漏事件。\n\n## 相关页面\n\n- [listenable-1](listenable-1.md) —— 无载荷构造\n- [event(t) 类](event_t.md)\n- [creative_device](../../../03_Fortnite.com/070_Devices/creative_device.md) —— 订阅设备事件的主战场\n", "01_Verse.org/010_Verse/listenable-1.md": "---\nname: listenable() 构造（无载荷）\nslug: versedotorg/verse/listenable-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/listenable-1\nkind: function\nmodule: /Verse.org/Verse\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# listenable() 构造（无载荷）🟦【S级·核心】\n\n> listenable<public>():listenable(payload) —— 由上下文推断载荷类型的构造重载。\n> 用法与 [listenable(payload)](listenable.md) 完全一致，仅构造写法不同：\n\n```verse\nPing:listenable() = listenable(){}\n```\n\n## 相关页面\n\n- [listenable 构造](listenable.md) —— Subscribe 用法与示例\n", "01_Verse.org/010_Verse/localize.md": "---\nname: Localize\nslug: versedotorg/verse/localize\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/localize\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Localize 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/localize.html -->\n", "01_Verse.org/010_Verse/join.md": "---\nname: Join\nslug: versedotorg/verse/join\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/join\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Join 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/join.html -->\n", "01_Verse.org/010_Verse/clamp.md": "---\nname: Clamp\nslug: versedotorg/verse/clamp\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/clamp\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Clamp 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/clamp.html -->\n", "01_Verse.org/010_Verse/clamp-1.md": "---\nname: Clamp\nslug: versedotorg/verse/clamp-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/clamp-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Clamp 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/clamp-1.html -->\n", "01_Verse.org/010_Verse/min.md": "---\nname: Min\nslug: versedotorg/verse/min\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/min\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Min 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/min.html -->\n", "01_Verse.org/010_Verse/max.md": "---\nname: Max\nslug: versedotorg/verse/max\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/max\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Max 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/verse/max.html -->\n", "01_Verse.org/010_Verse/min-1.md": "---\nname: Min\nslug: versedotorg/verse/min-1\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/min-1\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# Min 🟩【A级· mentation/fortnite/verse-api/versedotorg/scenegraph/sphere_light_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# sphere_light_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/sphere_light_component.html -->\n", "01_Verse.org/040_SceneGraph/spot_light_component.md": "---\nname: spot_light_component\nslug: versedotorg/scenegraph/spot_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/spot_light_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# spot_light_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/spot_light_component.html -->\n", "01_Verse.org/040_SceneGraph/float_range.md": "---\nname: float_range\nslug: versedotorg/scenegraph/float_range\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/float_range\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# float_range 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/float_range.html -->\n", "01_Verse.org/040_SceneGraph/component.md": "---\nname: component\nslug: versedotorg/scenegraph/component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/component\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# component 🟦【S级·核心】\n\n> Base class for authoring logic and data in the SceneGraph.\n> SceneGraph 中编写逻辑与数据的基类——实体的一切\"行为\"都挂在组件上。\n\n## 这是什么\n\n组件是 SceneGraph 的\"能力插件\"：[entity](entity.md) 只是节点，功能（变换、网格、灯、音效、你写的玩法逻辑）全是组件。写自定义组件 = 继承 `component`，重写生命周期函数：\n\n| 生命周期 | 时机（官方保证顺序） |\n|---|---|\n| `OnAddedToScene` | 挂进场景后；此后可查询场景中的组件 |\n| `OnBeginSimulation` | 开始模拟；适合注册 Tick 回调 |\n| `OnSimulate` | 可挂起（`<suspends>`）的常驻逻辑写这里 |\n| `OnEndSimulation` / `OnRemovingFromScene` | 收尾 |\n\n## 签名\n\n```verse\ncomponent<public><native> := class<native>:\n    # Data\n    Entity<public>:entity              # 父实体（构造时指定，不可更换）\n    TickEvents<public>:?tick_events    # 帧回调注册器\n    # 生命周期（节选）\n    OnAddedToScene<public>()<suspends>:void\n    OnBeginSimulation<public>():void\n    OnSimulate<public>()<suspends>:void\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/SceneGraph }\nusing { /Verse.org/Simulation }\n\n# 自定义组件：每秒数一拍（节拍器示例）\nbeat_component := class(component):\n    var Beat:int = 0\n\n    OnSimulate<override>()<suspends>:void =\n        loop:\n            Sleep(1.0)\n            set Beat += 1\n            Print(\"♪ {Beat}\")\n```\n\n## 常用成员\n\n| 成员 | 说明 | 级别 |\n|---|---|---|\n| `Entity` | 所属实体（组件不能换父） | 🟦 S |\n| `TickEvents` | 注册每帧/定时回调 | 🟩 A |\n| 生命周期四件套 | 见上表 | 🟦 S |\n\n## 何时用 / 何时不用\n\n- 用：一切新写法的玩法逻辑——把逻辑做成组件挂到实体上。\n- 不用：老式 creative_device 脚本（仍完全可用）；同一份逻辑别两套混写。\n\n## 常见坑\n\n- 生命周期是**固定顺序**：OnAddedToScene → OnBeginSimulation → OnSimulate；别在 OnAddedToScene 里做需要\"场景已模拟\"的查询。\n- 组件的 `Entity` 是构造时定死的，\"移动组件\"要拆下重挂。\n\n## 相关页面\n\n- [entity](entity.md)\n- [transform_component](transform_component.md)\n- [tick_events](tick_events.md)\n", "01_Verse.org/040_SceneGraph/entity.md": "---\nname: entity\nslug: versedotorg/scenegraph/entity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# entity 🟦【S级·核心】\n\n> Entities are the base object in the SceneGraph. Objects in experiences are constructed of one or more entities.\n> 实体是 SceneGraph 的基础对象——体验中的一切由一个或多个实体构成。\n\n## 这是什么\n\nSceneGraph 是 Epic 新一代场景对象模型（也是\"迁移进 Verse.org\"的那套体系），`entity` 是它的\"空壳节点\"：\n\n- **有层级**：父实体管理子实体的生命周期（父被移除，子全移除）；`GetParent`/`AddEntities`/`RemoveFromParent` 维护这棵树。\n- **能力靠组件**：行为/数据通过挂 [component](component.md)（如 [transform_component](transform_component.md)、mesh_component）添加，`AddComponents`/`GetComponent` 增查。\n- **动态**：运行时随时增删子实体与组件。\n- 继承 entity 的自定义类就是**预制体（prefab）**——官方建议通过编辑器生成，不要手写派生代码。\n\n## 签名\n\n```verse\nentity<public><native> := class<native>:\n    # 核心函数（官方摘录）\n    GetParent<public>()<transacts><decides>:entity        # 取父实体（无父则失败）\n    AddEntities<public>(Entities:[]entity):void           # 添加子实体\n    RemoveFromParent<public>():void                       # 从父实体移除\n    GetEntities<public>()<transacts>:[]entity             # 直接子实体\n    GetComponent<public>()<transacts><decides>:component_type  # 按类型取组件\n    AddComponents<public>(Components:[]component):void    # 添加组件\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/SceneGraph }\n\n# 运行时搭一个\"灯杆\"：实体 + 变换 + 光源组件\nBuildLamp(Parent:entity):void =\n    Pole := entity{}\n    Pole.AddComponents(array{transform_component{}, spot_light_component{}})\n    Parent.AddEntities(array{Pole})\n```\n\n## 常用成员\n\n| 成员 | 说明 | 级别 |\n|---|---|---|\n| `GetParent[]` | 取父（可失败） | 🟦 S |\n| `AddEntities` / `RemoveFromParent` | 维护层级 | 🟦 S |\n| `AddComponents` / `GetComponent[]` | 挂载/查询组件 | 🟦 S |\n| `GetEntities` | 遍历直接子实体 | 🟩 A |\n| `Find*` 查询族 | 多层查找（官方另有 Find 系列方法） | 🟩 A |\n\n## 何时用 / 何时不用\n\n- 用：新项目/新玩法的场景对象组织——这是官方面向未来的模型。\n- 不用：维护旧项目里 island 上的 creative_prop 时，两者并用即可，别强行互转。\n\n## 常见坑\n\n- 官方明言\"不要直接往 entity 派生类里写代码\"——逻辑写在 component 里，entity 只当容器/预制体。\n- 组件一旦挂上**不能换父**；要移动就 RemoveFromParent 后重新挂。\n\n## 相关页面\n\n- [component](component.md) —— 行为的载体\n- [transform_component](transform_component.md) —— 位置/旋转/缩放\n- [agent](../100_Simulation/agent.md) —— agent/player 也继承自 entity\n", "01_Verse.org/040_SceneGraph/entity_prefab.md": "---\nname: entity_prefab\nslug: versedotorg/scenegraph/entity_prefab\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity_prefab\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# entity_prefab 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/entity_prefab.html -->\n", "01_Verse.org/040_SceneGraph/icon_component.md": "---\nname: icon_component\nslug: versedotorg/scenegraph/icon_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/icon_component\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# icon_component 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/icon_component.html -->\n", "01_Verse.org/040_SceneGraph/entity_origin.md": "---\nname: entity_origin\nslug: versedotorg/scenegraph/entity_origin\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity_origin\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# entity_origin 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/entity_origin.html -->\n", "01_Verse.org/040_SceneGraph/rarity.md": "---\nname: rarity\nslug: versedotorg/scenegraph/rarity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/rarity\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# rarity 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/rarity.html -->\n", "01_Verse.org/040_SceneGraph/common_rarity.md": "---\nname: common_rarity\nslug: versedotorg/scenegraph/common_rarity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/common_rarity\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# common_rarity 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/common_rarity.html -->\n", "01_Verse.org/040_SceneGraph/uncommon_rarity.md": "---\nname: uncommon_rarity\nslug: versedotorg/scenegraph/uncommon_rarity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/uncommon_rarity\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# uncommon_rarity 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/uncommon_rarity.html -->\n", "01_Verse.org/040_SceneGraph/rare_rarity.md": "---\nname: rare_rarity\nslug: versedotorg/scenegraph/rare_rarity\nurl: https://dev.epicgames.com/documentation n/fortnite/verse-api/versedotorg/scenegraph/transform_component\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# transform_component 🟦【S级·核心】\n\n> Component holding the position/rotation/scale state of an entity.\n> 保存实体\"在哪、朝哪、多大\"的组件——移动任何 SceneGraph 对象都要经过它。\n\n## 这是什么\n\n[entity](entity.md) 本身没有位置概念；挂上 `transform_component` 后才有。它维护：\n\n- `LocalTransform`：相对父实体的局部变换（构造时可给初值）。\n- `GlobalTransform`：世界坐标系的最终变换（由父链计算得出，构造时设置的值会被计算结果覆盖）。\n\n变换类型是 `/Verse.org/SpatialMath` 的 [transform](../130_SpatialMath/rotation.md)（位置＋旋转＋缩放三合一）。读写局部变换、读取全局变换是移动/摆放物体的日常操作。\n\n## 签名\n\n```verse\ntransform_component<public><native> := class<native>(component):\n    GlobalTransform<public>:?transform   # 世界变换（只读语义：由父链计算）\n    LocalTransform<public>:?transform    # 局部变换（相对父实体）\n    IsInScene<public>()<transacts><decides>:logic\n    IsSimulating<public>()<transacts><decides>:logic\n    # 继承自 component 的生命周期函数同样可用\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/SceneGraph }\nusing { /Verse.org/SpatialMath }\nusing { /Verse.org/Simulation }\n\n# 让实体每帧上升一点（悬浮效果）\nFloatUp(TC:transform_component)<suspends>:void =\n    loop:\n        if (T := TC.LocalTransform?):\n            Up := T.Position + vector3{Up := 2.0}   # 每帧 +2 单位\n            TC.SetLocalPosition(Up)                  # 以实际 API 名为准\n        Sleep(0.0)\n```\n\n## 常用成员\n\n| 成员 | 说明 | 级别 |\n|---|---|---|\n| `LocalTransform` / `GlobalTransform` | 读变换（`?` 可失败取出） | 🟦 S |\n| `SetLocalPosition` / `SetLocalRotation` 等设置函数 | 改局部变换（以官方页函数表为准） | 🟦 S |\n| `IsInScene[]` / `IsSimulating[]` | 状态断言（可失败） | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：任何\"移动/摆放/缩放 SceneGraph 对象\"的需求。\n- 不用：临时算坐标却不落盘——直接用 SpatialMath 计算，不必动组件。\n\n## 常见坑\n\n- `GlobalTransform` 是**计算结果**，构造时写的初值会被覆盖；要摆放请设 `LocalTransform`。\n- 两个 `?transform` 字段都是可失败读取，失败上下文别忘了。\n\n## 相关页面\n\n- [entity](entity.md) / [component](component.md)\n- [vector3](../130_SpatialMath/vector3.md) / [rotation](../130_SpatialMath/rotation.md)\n", "01_Verse.org/040_SceneGraph/execution_listenable.md": "---\nname: execution_listenable\nslug: versedotorg/scenegraph/execution_listenable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/execution_listenable\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# execution_listenable 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/execution_listenable.html -->\n", "01_Verse.org/040_SceneGraph/has_camera_modifier.md": "---\nname: has_camera_modifier\nslug: versedotorg/scenegraph/has_camera_modifier\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/has_camera_modifier\nkind: interface\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# has_camera_modifier 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/has_camera_modifier.html -->\n", "01_Verse.org/040_SceneGraph/easeable.md": "---\nname: easeable\nslug: versedotorg/scenegraph/easeable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/easeable\nkind: interface\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# easeable ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/easeable.html -->\n", "01_Verse.org/040_SceneGraph/scene_event.md": "---\nname: scene_event\nslug: versedotorg/scenegraph/scene_event\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/scene_event\nkind: interface\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# scene_event ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/scene_event.html -->\n", "01_Verse.org/040_SceneGraph/origin.md": "---\nname: origin\nslug: versedotorg/scenegraph/origin\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/origin\nkind: interface\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# origin ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sou
