_info)\nslug: versedotorg/agentgroup/agent_group/agent_group(member_info)\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/agent_group/agent_group(member_info)\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# agent_group(member_info) 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/agent_group/agent_group(member_info).html -->\n", "01_Verse.org/090_AgentGroup/add_member_error.md": "---\nname: add_member_error\nslug: versedotorg/agentgroup/add_member_error\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/add_member_error\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# add_member_error ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/add_member_error.html -->\n", "01_Verse.org/090_AgentGroup/remove_member_error.md": "---\nname: remove_member_error\nslug: versedotorg/agentgroup/remove_member_error\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/remove_member_error\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# remove_member_error ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/remove_member_error.html -->\n", "01_Verse.org/090_AgentGroup/member_info_interface.md": "---\nname: member_info_interface\nslug: versedotorg/agentgroup/member_info_interface\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/member_info_interface\nkind: interface\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# member_info_interface ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/member_info_interface.html -->\n", "01_Verse.org/090_AgentGroup/agent_group_interface.md": "---\nname: agent_group_interface\nslug: versedotorg/agentgroup/agent_group_interface\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/agent_group_interface\nkind: function\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# agent_group_interface ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/agent_group_interface.html -->\n", "01_Verse.org/090_AgentGroup/agent_group.md": "---\nname: agent_group\nslug: versedotorg/agentgroup/agent_group\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/agent_group\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# agent_group 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/agent_group.html -->\n", "01_Verse.org/100_Simulation/_overview.md": "---\nname: Simulation\nslug: versedotorg/simulation\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation\nkind: module\nmodule: /Verse.org\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# Simulation module 🟦【S级·核心】\n\n> Verse path: `/Verse.org` · Module import path: `/Verse.org/Simulation`\n> 对局世界的基本概念模块：谁在对局里（agent/player）、怎么分组（team）、这是哪一局（session），以及 Sleep、editable_\\* 等基础函数。\n\n`using { /Verse.org/Simulation }`\n\n- Verse.org\n- Simulation [Tags](010_Tags/_overview.md)\n\n## Classes and Structs\n\n| Name | Description |\n|---|---|\n| [agent](agent.md) | 对局参与者的抽象（真人玩家或 AI 单位）。 |\n| [player](player.md) | 对局中的真人玩家，agent 的子类。 |\n| [session](session.md) | 每回合一个实例的类型；用 GetSession 获取当前实例，可配合 weak_map 实现全局变量。注意：未来可能改为每局一个实例，勿依赖回合级行为。 |\n| [team](team.md) | 表示对局中的一支队伍。 |\n\n## Functions\n\n| Name | Description |\n|---|---|\n| [editable_slider](editable_slider.md) | 参数化类型构造器：生成详情面板滑条类。 |\n| [editable_number](editable_number.md) | 参数化类型构造器：生成详情面板数字输入类。 |\n| [editable_vector_slider](editable_vector_slider.md) | 参数化类型构造器：生成详情面板三维向量滑条类。 |\n| [editable_vector_number](editable_vector_number.md) | 参数化类型构造器：生成详情面板三维向量数字输入类。 |\n| [GetSession](getsession.md) | 返回当前回合对应的 session 实例；可配合 weak_map 实现全局变量。 |\n| [Sleep](sleep.md) | 暂停指定秒数后恢复；0 等下一帧、Inf 永久等待（仅取消时返回）、负值立即完成不让出。 |\n| [GetSimulationElapsedTime](getsimulationelapsedtime.md) | 获取世界开始模拟以来经过的秒数。 |\n\n## Enumerations\n\n| Name | Description |\n|---|---|\n| [session_environment](session_environment.md) | 指明当前对局环境类型（Edit / Private / Live）。 |\n\n## 补充说明\n\n- 写任何 Verse 玩法逻辑几乎都要 `using { /Verse.org/Simulation }`——它提供参与者、队伍、时间与编辑器控件的基本类型。\n- agent/player 继承自 SceneGraph 的 entity，因此也拥有实体与标签两族函数（详见各自页面）。\n- 相关页面：[Verse.org module](../_overview.md)、[entity class](../040_SceneGraph/entity.md)。\n", "01_Verse.org/100_Simulation/agent.md": "---\nname: agent\nslug: versedotorg/simulation/agent\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/agent\nkind: class\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# agent class 🟦【S级·核心】\n\n（本页官网无导语描述；agent 是\"对局参与者\"的抽象——真人玩家或 AI 单位。）\n\n`using { /Verse.org/Simulation }`\n\n## Inheritance Hierarchy\n\nThis class is derived from `entity`.（本类派生自 entity。）\n\n| Name | Description |\n|---|---|\n| entity | 实体是 SceneGraph 的基础对象。体验中的对象由一个或多个实体构成。实体是有层级的：可用 `GetParent` 查询父实体、用 `AddEntities` 添加子实体。行为通过组件（component）添加：用 `AddComponents` 添加新组件。实体的结构和内容是动态的，可在体验运行中的任意时刻改变。 **派生自 entity** 在 SceneGraph 体系中，派生自 entity 的类也被称为预制体（prefab）。当你想在游戏中多次生成/复用一组实体和组件时，预制体非常有用。预制体主要在编辑器中创作，其 Verse 类会在构建时生成到项目的 Assets.digest.verse 文件里。虽然你可以为载具、角色等常见对象类型创建基础预制体，但官方强烈建议**不要直接在 entity 类里写代码**，而是把逻辑放在组件里。把逻辑和数据放进组件，你在体验制作全程中重构预制体时，就不必大改类结构。 |\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| AddComponents | 把给定的组件添加到实体。若某组件不允许加到该实体，则跳过。注意：在 AddedToScene 或 BeginSimulation 阶段调用时，会确保被加组件已达到对应阶段。组件按以下规则添加：所有组件加入实体的子列表；若该实体在场景中，所有组件的 OnAddedToScene 被调用；若该实体正在模拟，所有组件的 OnBeginSimulation 被调用。 |\n| AddEntities | 把给定的实体添加为子实体。若子实体已有父实体，会先从原父实体移除再加入新父。加入的子实体会沿各自的生命周期方法推进，直到与新父实体的状态一致。 |\n| AddTag | 向此实体添加一个标签实例，返回与该实例唯一关联的 tag_key。 |\n| ContainsAllTags | 若 tag_types 中有任一类型在容器中找不到则失败，否则成功。注意 tag_types 为空时此调用成功。 |\n| ContainsAnyTag | 若 tag_types 中至少一个类型在容器中找到则成功，否则失败。注意 tag_types 为空时此调用失败。 |\n| ContainsTag | 若容器中找到至少一个 tag_type 类型的标签则成功，否则失败。 |\n| GetComponent | 若 component_type 类型的子组件存在且可从调用方上下文访问，则成功并返回该组件。注意：在 AddedToScene 或 BeginSimulation 阶段调用时，会确保返回的组件已达到对应阶段。若不存在或不可访问则失败。 |\n| GetComponents | 返回此实体下属、可从调用方上下文访问的子组件。 |\n| GetEntities | 返回此实体下属、可从调用方上下文访问的子实体。只取直接子实体；要跨多层查询请改用 Find* 系列查询方法。 |\n| GetParent | 返回此实体的父实体。父实体掌控其子实体与组件的生命周期——实体从场景移除时，其所有子实体和组件也会一并移除。当前没有父实体时此方法失败。 |\n| RemoveAllTags | 移除 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_types 中任何类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveFromParent | 把此实体从父实体移除，用于将实体移出场景。该实体及其子级上的组件会依次走 OnEndSimulation → OnRemovingFromScene。之后可用 NewParent.AddEntities 再加回。 |\n| RemoveTag | 移除与 tag_key 关联的标签实例；移除成功则成功，否则失败。 |\n| SendDown | 向此实体发送场景事件并沿层级向下传播：先在本实体的每个组件上调用 SendDown/OnReceive，再对每个子实体调用 SendDown。任一环节消费该事件即停止传播。有参与者消费则返回 true。 |\n| SendUp | 向此实体发送场景事件并沿层级向上传播：先在本实体的每个组件上调用 SendDown/OnReceive，再对父实体调用 SendUp。任一环节消费该事件即停止传播。有参与者消费则返回 true。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# 设备事件拿到 agent 后，识别出真人玩家\nHandleAgent(A:agent):void =\n    if (P := player[A]):        # 可失败转换：agent → player\n        Print(\"是真人玩家\")\n    else:\n        Print(\"AI 参与者\")\n```\n\n## 补充说明\n\n- agent 本页无自有成员——它全部继承自 entity（场景操作＋标签操作两族）。日常玩法代码通常只把 agent 当\"参与者通行证\"用。\n- `agent` ≠ 角色身体：世界里的身体是 fort_character（见 Fortnite.com/Characters），两者要分清。\n- 相关页面：[player class](player.md)、[entity class](../040_SceneGraph/entity.md)、[team class](team.md)。\n", "01_Verse.org/100_Simulation/player.md": "---\nname: player\nslug: versedotorg/simulation/player\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/player\nkind: class\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# player class 🟦【S级·核心】\n\n（本页官网无导语描述；player 表示对局中的真人玩家，是 agent 的子类。）\n\n`using { /Verse.org/Simulation }`\n\n## Inheritance Hierarchy\n\nThis class is derived from the following hierarchy, starting with `entity`:（本类派生自以下层级，起点为 entity：）\n\n| Name | Description |\n|---|---|\n| entity | 实体是 SceneGraph 的基础对象。体验中的对象由一个或多个实体构成。实体是有层级的：可用 `GetParent` 查询父实体、用 `AddEntities` 添加子实体。行为通过组件（component）添加：用 `AddComponents` 添加新组件。实体的结构和内容是动态的，可在体验运行中的任意时刻改变。 **派生自 entity** 在 SceneGraph 体系中，派生自 entity 的类也被称为预制体（prefab）。当你想在游戏中多次生成/复用一组实体和组件时，预制体非常有用。预制体主要在编辑器中创作，其 Verse 类会在构建时生成到项目的 Assets.digest.verse 文件里。虽然你可以为载具、角色等常见对象类型创建基础预制体，但官方强烈建议**不要直接在 entity 类里写代码**，而是把逻辑放在组件里。把逻辑和数据放进组件，你在体验制作全程中重构预制体时，就不必大改类结构。 |\n| agent | （agent 的官方页面无描述。） |\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| AddComponents | 把给定的组件添加到实体。若某组件不允许加到该实体，则跳过。注意：在 AddedToScene 或 BeginSimulation 阶段调用时，会确保被加组件已达到对应阶段。组件按以下规则添加：所有组件加入实体的子列表；若该实体在场景中，所有组件的 OnAddedToScene 被调用；若该实体正在模拟，所有组件的 OnBeginSimulation 被调用。 |\n| AddEntities | 把给定的实体添加为子实体。若子实体已有父实体，会先从原父实体移除再加入新父。加入的子实体会沿各自的生命周期方法推进，直到与新父实体的状态一致。 |\n| AddTag | 向此实体添加一个标签实例，返回与该实例唯一关联的 tag_key。 |\n| ContainsAllTags | 若 tag_types 中有任一类型在容器中找不到则失败，否则成功。注意 tag_types 为空时此调用成功。 |\n| ContainsAnyTag | 若 tag_types 中至少一个类型在容器中找到则成功，否则失败。注意 tag_types 为空时此调用失败。 |\n| ContainsTag | 若容器中找到至少一个 tag_type 类型的标签则成功，否则失败。 |\n| GetComponent | 若 component_type 类型的子组件存在且可从调用方上下文访问，则成功并返回该组件。注意：在 AddedToScene 或 BeginSimulation 阶段调用时，会确保返回的组件已达到对应阶段。若不存在或不可访问则失败。 |\n| GetComponents | 返回此实体下属、可从调用方上下文访问的子组件。 |\n| GetEntities | 返回此实体下属、可从调用方上下文访问的子实体。只取直接子实体；要跨多层查询请改用 Find* 系列查询方法。 |\n| GetParent | 返回此实体的父实体。父实体掌控其子实体与组件的生命周期——实体从场景移除时，其所有子实体和组件也会一并移除。当前没有父实体时此方法失败。 |\n| IsActive | 当此 player 可以用作模块级 `var` `weak_map` 的键时成功。这对应相应玩家已加入游戏且尚未离开。当此方法失败时，把该 player 用作模块级 var weak_map 的键会导致运行时错误。 |\n| RemoveAllTags | 移除 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_types 中任何类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveFromParent | 把此实体从父实体移除，用于将实体移出场景。该实体及其子级上的组件会依次走 OnEndSimulation → OnRemovingFromScene。之后可用 NewParent.AddEntities 再加回。 |\n| RemoveTag | 移除与 tag_key 关联的标签实例；移除成功则成功，否则失败。 |\n| SendDown | 向此实体发送场景事件并沿层级向下传播：先在本实体的每个组件上调用 SendDown/OnReceive，再对每个子实体调用 SendDown。任一环节消费该事件即停止传播。有参与者消费则返回 true。 |\n| SendUp | 向此实体发送场景事件并沿层级向上传播：先在本实体的每个组件上调用 SendDown/OnReceive，再对父实体调用 SendUp。任一环节消费该事件即停止传播。有参与者消费则返回 true。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# 对局开始：遍历全部玩家打招呼；从 agent 安全转 player\nOnBegin<override>()<suspends>:void =\n    for (P : GetPlayspace().GetPlayers()):\n        Print(\"欢迎！\")\n        Sleep(0.2)\n\nHandleAgent(A:agent):void =\n    if (P := player[A]):\n        Print(\"真人玩家\")\n```\n\n## 补充说明\n\n- `player[Agent]` 是可失败转换，必须写在失败上下文里；AI 参与者转换会失败。\n- **IsActive[] 是 player 相对 agent 唯一新增的函数**：把 player 存进模块级 weak_map 前先判断它，可避免\"玩家已退出仍作键\"的运行时错误。\n- 玩家专属能力分布在其他模块：角色身体 fort_character（Characters）、玩家 UI player_ui（Temporary/UI）等。\n- 相关页面：[agent class](agent.md)、[session class](session.md)、[fort_character interface](../../../03_Fortnite.com/130_Characters/fort_character.md)。\n", "01_Verse.org/100_Simulation/session.md": "---\nname: session\nslug: versedotorg/simulation/session\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/session\nkind: class\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# session class 🟩【A级·常用】\n\n> Type for which there is a single instance per round. Use `GetSession` to get the current round's session instance. May be used with `weak_map` to implement global variables. Note: may be changed in a future release to a single instance per game. Round-local behavior should not be relied upon.\n> 每一回合只存在一个实例的类型。用 `GetSession` 获取当前回合的 session 实例。可配合 `weak_map` 实现全局变量。注意：未来版本可能改为\"每局游戏一个实例\"，请勿依赖其回合级行为。\n\n`using { /Verse.org/Simulation }`\n\n## Members\n\nThis class has no members.（此类没有成员。）\n\n## Attributes, Specifiers, and Effects\n\n`session<public><epic_internal> := class<epic_internal>` —— 标签：public / epic_internal，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# \"全局变量\"标准写法：session 作 weak_map 的 key\nvar GlobalScore:weak_map[session, int] = map{}\n\nAddScore(Points:int):void =\n    S := GetSession()\n    Current := GlobalScore[S] or 0\n    if (set GlobalScore[S] = Current + Points) {}\n```\n\n## 补充说明\n\n- Verse 没有传统\"全局变量\"，session ＋ `weak_map` 是官方给出的替代方案。\n- 官方明示回合级行为可能变化——需要\"每回合重置\"就显式重置，别靠换实例。\n- 相关页面：[GetSession function](getsession.md)、[session_environment enumeration](session_environment.md)、[weak_map function](../010_Verse/weak_map.md)。\n", "01_Verse.org/100_Simulation/team.md": "---\nname: team\nslug: versedotorg/simulation/team\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/team\nkind: class\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# team class 🟩【A级·常用】\n\n> team represents a team in the experience.\n> team 表示对局中的一支队伍。\n\n`using { /Verse.org/Simulation }`\n\n## Members\n\nThis class has no members.（此类没有成员。）\n\n## Attributes, Specifiers, and Effects\n\n`team<public><epic_internal> := class<epic_internal>` —— 标签：public / epic_internal，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Fortnite.com/Game }   # GetPlayspace / GetTeams 所在\n\n# 两名参与者是否同队（取队伍是可失败操作）\nSameTeam(A:agent, B:agent):logic =\n    TA := A.GetTeam[]\n    TB := B.GetTeam[]\n    TA = TB\n```\n\n## 补充说明\n\n- `team` 自身零成员，价值在于作为\"队伍身份\"被其他 API 接收/返回（如 `GetTeam[]`、`GetPlayspace().GetTeams()`）。\n- 队伍的划分由对局设置决定，Verse 侧只读：没有\"创建/解散队伍\"的 API。\n- 相关页面：[agent class](agent.md)、[player class](player.md)。\n", "01_Verse.org/100_Simulation/editable_slider.md": "---\nname: editable_slider\nslug: versedotorg/simulation/editable_slider\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/editable_slider\nkind: function\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# editable_slider function 🟦【S级·核心】\n\n> （本页官网无导语描述。）\n> editable_slider 是参数化类型构造器：按给定的数字类型 t 生成一个\"编辑器详情面板滑条\"类。\n\n`using { /Verse.org/Simulation }`\n\n```verse\neditable_slider<public>(t:any):\n```\n\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n（此函数是参数化类型：它返回的是类或接口，而不是值或对象实例。）\n\n## Parameters\n\neditable_slider takes the following parameters:（editable_slider 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| t | any | 滑条的数值类型，常用 `int` 或 `float`。 |\n\n## Attributes, Specifiers, and Effects\n\n`editable_slider<public>(t:any)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Fortnite.com/Devices }\n\nmusic_device := class(creative_device):\n\n    @editable\n    Volume : editable_slider = editable_slider{Default := 0.8, Min := 0.0, Max := 1.0}\n\n    OnBegin<override>()<suspends>:void =\n        Print(\"音量 = {Volume.GetCurrentValue()}\")\n```\n\n## 补充说明\n\n- 与 [editable_number function](editable_number.md) 同构，仅面板外观为滑条，适合连续量；离散档位建议用枚举型 editable。\n- 返回类的成员（`GetCurrentValue()` 等）以 UEFN 编辑器内提示与官方创作文档为准。\n", "01_Verse.org/100_Simulation/editable_number.md": "---\nname: editable_number\nslug: versedotorg/simulation/editable_number\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/editable_number\nkind: function\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# editable_number function 🟦【S级·核心】\n\n> （本页官网无导语描述。）\n> editable_number 是参数化类型构造器：按给定的数字类型 t 生成一个\"编辑器详情面板数字输入\"类。\n\n`using { /Verse.org/Simulation }`\n\n```verse\neditable_number<public>(t:any):\n```\n\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n（此函数是参数化类型：它返回的是类或接口，而不是值或对象实例。）\n\n## Parameters\n\neditable_number takes the following parameters:（editable_number 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| t | any | 输入框的数字类型，常用 `int` 或 `float`。 |\n\n## Attributes, Specifiers, and Effects\n\n`editable_number<public>(t:any)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Fortnite.com/Devices }\n\n# 可调\"节拍间隔\"的自定义设备：详情面板出现数字输入框\nbeat_device := class(creative_device):\n\n    @editable\n    Interval : editable_number = editable_number{Default := 0.5, Min := 0.1, Max := 5.0}\n\n    OnBegin<override>()<suspends>:void =\n        N := Interval.GetCurrentValue()   # 取面板当前值（float）\n        Print(\"节拍间隔 = {N}\")\n```\n\n## 补充说明\n\n- API Reference 本页只定义构造器本身；返回的类暴露的成员（如 `GetCurrentValue()`、`Default/Min/Max` 属性）以 UEFN 编辑器内提示与官方创作文档为准，本页不罗列。\n- 必须在类成员上添加 `@editable` 特性，详情面板才会显示该控件。\n- 同族：[editable_slider function](editable_slider.md)（滑条）、[editable_vector_number function](editable_vector_number.md)、[editable_vector_slider function](editable_vector_slider.md)。\n", "01_Verse.org/100_Simulation/editable_vector_slider.md": "---\nname: editable_vector_slider\nslug: versedotorg/simulation/editable_vector_slider\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/editable_vector_slider\nkind: function\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# editable_vector_slider function 🟩【A级·常用】\n\n> （本页官网无导语描述。）\n> editable_vector_slider 是参数化类型构造器：按给定数字类型 t 生成一个\"编辑器详情面板三维向量滑条\"类（X/Y/Z 三条滑条）。\n\n`using { /Verse.org/Simulation }`\n\n```verse\neditable_vector_slider<public>(t:any):\n```\n\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n（此函数是参数化类型：它返回的是类或接口，而不是值或对象实例。）\n\n## Parameters\n\neditable_vector_slider takes the following parameters:（editable_vector_slider 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| t | any | 各分量的数字类型，常用 `int` 或 `float`。 |\n\n## Attributes, Specifiers, and Effects\n\n`editable_vector_slider<public>(t:any)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Verse.org/SpatialMath }\n\nwind := class(creative_device):\n\n    @editable\n    Strength : editable_vector_slider = editable_vector_slider{Default := vector3{Up := 1.0}}\n\n    OnBegin<override>()<suspends>:void =\n        Print(\"风力向量 = {Strength.GetCurrentValue()}\")\n```\n\n## 补充说明\n\n- 与 [editable_vector_number function](editable_vector_number.md) 同构，滑条外观适合\"拖出感觉\"的连续向量参数。\n", "01_Verse.org/100_Simulation/editable_vector_number.md": "---\nname: editable_vector_number\nslug: versedotorg/simulation/editable_vector_number\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/editable_vector_number\nkind: function\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# editable_vector_number function 🟩【A级·常用】\n\n> （本页官网无导语描述。）\n> editable_vector_number 是参数化类型构造器：按给定数字类型 t 生成一个\"编辑器详情面板三维向量数字输入\"类（X/Y/Z 三个输入框）。\n\n`using { /Verse.org/Simulation }`\n\n```verse\neditable_vector_number<public>(t:any):\n```\n\nThis function is a parametric type, meaning it returns a class or interface rather than a value or object instance.\n（此函数是参数化类型：它返回的是类或接口，而不是值或对象实例。）\n\n## Parameters\n\neditable_vector_number takes the following parameters:（editable_vector_number 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| t | any | 各分量的数字类型，常用 `int` 或 `float`。 |\n\n## Attributes, Specifiers, and Effects\n\n`editable_vector_number<public>(t:any)` —— 标签：public，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Verse.org/SpatialMath }\n\nmover := class(creative_device):\n\n    @editable\n    Offset : editable_vector_number = editable_vector_number{Default := vector3{Up := 100.0}}\n\n    OnBegin<override>()<suspends>:void =\n        V := Offset.GetCurrentValue()   # t=float 时返回 vector3\n        Print(\"向上偏移 {V.Up}\")\n```\n\n## 补充说明\n\n- 取值返回 [vector3 struct](../130_SpatialMath/vector3.md)（注意其分量名为 Left/Up/Forward）。\n- 三个数含义独立时（如\"血量/护盾/能量\"）拆成多个 [editable_number function](editable_number.md) 更清晰。\n", "01_Verse.org/100_Simulation/getsession.md": "---\nname: GetSession\nslug: versedotorg/simulation/getsession\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/getsession\nkind: function\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# GetSession function 🟩【A级·常用】\n\n> Returns the session corresponding to the current round. The result can be used with `weak_map` to implement global variables. Note: may be changed in a future release to return a single instance per game. Round-local behavior should not be relied upon.\n> 返回当前回合对应的 session 实例。结果可配合 `weak_map` 实现全局变量。注意：未来版本可能改为\"每局游戏返回一个实例\"，请勿依赖其回合级行为。\n\n`using { /Verse.org/Simulation }`\n\n```verse\nGetSession<public><native>():session\n```\n\n## Parameters\n\nGetSession does not take any parameters.（GetSession 不接受任何参数。）\n\n## Attributes, Specifiers, and Effects\n\n`GetSession<public><native>():session` —— 标签：public / native，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\n\nvar Visited:weak_map[session, logic] = map{}\n\nMarkVisited():void =\n    if (set Visited[GetSession()] = true) {}\n\nWasVisited():logic =\n    Visited[GetSession()] or false\n```\n\n## 补充说明\n\n- `session` 类没有公开构造方式，全局唯一实例只能从这里拿；它最重要的用法是当 `weak_map` 的 key 存\"整局共享\"的状态。\n- 相关页面：[session class](session.md)。\n", "01_Verse.org/100_Simulation/sleep.md": "---\nname: Sleep\nslug: versedotorg/simulation/sleep\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/sleep\nkind: function\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Sleep function 🟦【S级·核心】\n\n> Waits specified number of seconds and then resumes. If `Seconds = 0.0` then it waits until next tick/frame/update. If `Seconds = Inf` then it waits forever and only calls back if canceled - such as via `race`. If `Seconds < 0.0` then it completes immediately and does not yield to other async expressions.\n> 暂停指定的秒数后恢复执行。`Seconds = 0.0` 时等到下一帧（tick）才继续；`Seconds = Inf` 时永远等待，只有被取消（例如通过 `race`）才会返回；`Seconds < 0.0` 时立即完成，且不让出执行权给其他异步表达式。\n>\n> Waiting until the next update (0.0) is especially useful in a loop of a coroutine that needs to do some work every update and this yields to other coroutines so that it doesn't hog a processor's resources. Waiting forever (Inf) will have any expression that follows never be evaluated. Occasionally it is desirable to have a task never complete such as the last expression in a `race` subtask where the task must never win the race though it still may be canceled earlier. Immediately completing (less than 0) is useful when you want programmatic control over whether an expression yields or not.\n> 「等到下一帧更新（0.0）」特别适合需要每帧做一点事的协程循环——它会把执行权让给其他协程，避免独占处理器资源。「永远等待（Inf）」会让其后的表达式永远不被求值；偶尔你正需要某个任务永不完成，比如 `race` 里放在最后的陪跑分支——它绝不能赢，但仍可被提前取消。「立即完成（小于 0）」适合想自己控制表达式是否让出执行权的场合。\n\n`using { /Verse.org/Simulation }`\n\n```verse\nSleep<public><native>(Seconds:float)<transacts><suspends><no_rollback>:void\n```\n\n## Parameters\n\nSleep takes the following parameters.（Sleep 接受以下参数：）\n\n| Name | Type | Description |\n|---|---|---|\n| Seconds | float | 要等待的秒数。 |\n\n## Attributes, Specifiers, and Effects\n\n`Sleep<public><native>(Seconds:float)<transacts><suspends><no_rollback>` —— 标签：public / native / transacts / suspends / no_rollback，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# 每 0.5 秒打印一次节拍，共 8 拍（节奏游戏的\"节拍器\"雏形）\nCountdown()<suspends>:void =\n    for (Beat := 0..7):\n        Sleep(0.5)\n        Print(\"♪ 第 {Beat} 拍\")\n\n# 每帧做一次事：Sleep(0.0) 让出执行权，避免死循环卡死\nEveryFrame()<suspends>:void =\n    loop:\n        DoWork()\n        Sleep(0.0)\n```\n\n## 补充说明\n\n- 只能在 `<suspends>` 上下文中调用；普通函数里写 `Sleep` 会直接编译错误。\n- `Sleep(0.0)` 与 `Sleep(0.001)` 语义不同：前者是\"下一帧\"，后者是真实计时等待。\n- 官方说明明确了四种取值的行为（0 / Inf / 负数 / 正数），这是罕见的写得这么全的标准库函数——按表使用即可。\n- 相关页面：[GetSimulationElapsedTime](getsimulationelapsedtime.md)（拿世界时间做调度）、[event(t) class](../010_Verse/event_t.md)（事件驱动的另一种等待）。\n", "01_Verse.org/100_Simulation/getsimulationelapsedtime.md": "---\nname: GetSimulationElapsedTime\nslug: versedotorg/simulation/getsimulationelapsedtime\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/getsimulationelapsedtime\nkind: function\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# GetSimulationElapsedTime function 🟩【A级·常用】\n\n> Get the seconds that have elapsed since the world began simulating\n> 获取世界开始模拟以来经过的秒数。\n\n`using { /Verse.org/Simulation }`\n\n```verse\nGetSimulationElapsedTime<public><native>()<transacts>:float\n```\n\n## Parameters\n\nGetSimulationElapsedTime does not take any parameters.（GetSimulationElapsedTime 不接受任何参数。）\n\n## Attributes, Specifiers, and Effects\n\n`GetSimulationElapsedTime<public><native>()<transacts>:float` —— 标签：public / native / transacts，语义见 [Specifiers 与 Effects 对照](../../_Specifiers与Effects.md)。\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# 时钟驱动的节拍调度：每 0.5 秒一拍，不受循环体耗时影响\nvar NextBeat:float = 0.0\nBeatLoop()<suspends>:void =\n    loop:\n        Now := GetSimulationElapsedTime()\n        if (Now >= NextBeat):\n            PlayBeat()\n            set NextBeat += 0.5\n        Sleep(0.0)\n```\n\n## 补充说明\n\n- 这是\"世界模拟时间\"（单调增长的秒数），不是现实墙钟；UTC 时间戳请用 [GetSecondsSinceEpoch function](../010_Verse/getsecondssinceepoch.md)。\n- 做\"到点做事\"的调度器时，比较世界时间比 `Sleep(固定值)` 更抗抖动（循环体耗时不影响节拍间隔）。\n- 相关页面：[Sleep function](sleep.md)。\n", "01_Verse.org/100_Simulation/session_environment.md": "---\nname: session_environment\nslug: versedotorg/simulation/session_environment\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/session_environment\nkind: enum\nmodule: /Verse.org/Simulation\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# session_environment enumeration 🟨【B级·进阶】\n\n> Specifies what type of environment the current session is in.\n> 指明当前对局处于什么类型的环境。\n\n`using { /Verse.org/Simulation }`\n\n## Enumerators\n\nThe session_environment enumeration includes the following enumerators:（session_environment 枚举包含以下枚举值：）\n\n| Name | Description |\n|---|---|\n| Edit | 当前对局处于体验的 Edit（编辑）环境，例如在 UEFN 内启动的会话。 |\n| Private | 当前对局处于体验的 Private（私人）环境，例如试玩测试局。 |\n| Live | 当前对局处于体验的 Live（线上）环境。 |\n\n## 补充说明\n\n- 与 [session class](session.md) 配合判断\"代码正跑在哪种环境\"，可对编辑测试与正式上线走不同逻辑。\n", "01_Verse.org/100_Simulation/010_Tags/_overview.md": "---\nname: Tags\nslug: versedotorg/simulation/tags\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags\nkind: module\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: brief\nstatus: done\n---\n\n# Tags module 🟩【A级·常用】\n\n> Verse path: `/Verse.org/Simulation` · Module import path: `/Verse.org/Simulation/Tags`\n> 通用标签系统：给对象打上层级标签（如 `A.1` 属于 `A`），按标签查询、过滤、分组。\n\n`using { /Verse.org/Simulation/Tags }`\n\n- Verse.org\n- Simulation\n- Tags\n\n## Classes and Structs\n\n| Name | Description |\n|---|---|\n| [tag](tag.md) | 用于给对象打标签的基础类型，以便按层级评估对象的分类。 |\n| [tag_key](tag_key.md) | 向实现了 has_tags 接口的容器添加标签的返回值，用于从同一容器中选择性移除该实例。 |\n| [tag_search_criteria](tag_search_criteria.md) | 高级标签搜索条件。 |\n\n## Interfaces\n\n| Name | Description |\n|---|---|\n| [has_tags](has_tags.md) | 表示\"可变标签集合\"的接口。 |\n| [tag_view](tag_view.md) | 表示\"可查询标签集合\"的接口。 |\n\n## Enumerations\n\n| Name | Description |\n|---|---|\n| [tag_search_sort_type](tag_search_sort_type.md) | （官网无描述。） |\n\n## 补充说明\n\n- 标签匹配是**层级向下**的：查询父标签会命中子标签（`{\"A.1\"}.Has(\"A\")` 为真，反之不然），规则见 [tag_view interface](tag_view.md)。\n- 实现了 [has_tags interface](has_tags.md) 的对象才能打标；entity/agent/player 等已自带整套标签函数。\n", "01_Verse.org/100_Simulation/010_Tags/tag.md": "---\nname: tag\nslug: versedotorg/simulation/tags/tag\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag\nkind: class\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: full\nstatus: done\n---\n\n# tag class 🟩【A级·常用】\n\n> A base type used for tagging objects in order to hierarchically evaluate an objects classification.\n> 用于给对象打标签的基础类型，以便按层级评估对象的分类。\n\n`using { /Verse.org/Simulation/Tags }`\n\n## Members\n\nThis class has no members.（此类没有成员。）\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n\n# tag 实例本身无字段；层级语义由使用方的 API 约定\nEnemyTag:tag = tag{}\n```\n\n## 补充说明\n\n- 标签的\"值/层级\"由使用标签系统的具体 API 决定；本页类型只是分类标识。\n- 打标与查询走 [has_tags interface](has_tags.md)；层级匹配规则见 [tag_view interface](tag_view.md)。\n", "01_Verse.org/100_Simulation/010_Tags/tag_key.md": "---\nname: tag_key\nslug: versedotorg/simulation/tags/tag_key\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag_key\nkind: struct\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: full\nstatus: done\n---\n\n# tag_key struct 🟩【A级·常用】\n\n> A tag_key is the return value from adding a tag to a container implementing the has_tags interface, and is used to selectively remove such an instance from the same container.\n> tag_key 是向实现了 has_tags 接口的容器添加标签后的返回值，用于从同一容器中**选择性地移除**那一个标签实例。\n\n`using { /Verse.org/Simulation/Tags }`\n\n## Members\n\nThis struct has no members.（此结构体没有成员。）\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n\n# 保存 AddTag 返回的 key，之后精确撤销那一次打标\nStamp(Obj:has_tags):tag_key =\n    Obj.AddTag(TempTag)\n```\n\n## 补充说明\n\n- 同一对象打了三个同类型标签就有三个不同的 tag_key；按类型整体清除用 [has_tags interface](has_tags.md) 的 RemoveAllTags 即可，无需保存 key。\n- 相关页面：[tag class](tag.md)。\n", "01_Verse.org/100_Simulation/010_Tags/tag_search_criteria.md": "---\nname: tag_search_criteria\nslug: versedotorg/simulation/tags/tag_search_criteria\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag_search_criteria\nkind: class\nmodule: /Verse.org/Simulation/Tags\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# tag_search_criteria class 🟨【B级·进阶】\n\n> Advanced tag search criteria\n> 高级标签搜索条件。\n\n`using { /Verse.org/Simulation/Tags }`\n\n## Members\n\nThis class has data members, but no functions.（此类只有数据成员，没有函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| RequiredTags | []tag | 对象必须携带的标签。 |\n| PreferredTags | []tag | 未指定必须标签时才使用的标签；它们被视为\"任一满足即可\"。 |\n| ExclusionTags | []tag | 对象**不得**携带的标签；带这些标签的条目都会被搜索排除。 |\n| SortType | tag_search_sort_type | 请求按标签排序结果的开关。 |\n\n## 补充说明\n\n- 排序方式枚举见 [tag_search_sort_type enumeration](tag_search_sort_type.md)。\n", "01_Verse.org/100_Simulation/010_Tags/has_tags.md": "---\nname: has_tags\nslug: versedotorg/simulation/tags/has_tags\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/has_tags\nkind: interface\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: full\nstatus: done\n---\n\n# has_tags interface 🟩【A级·常用】\n\n> An interface representing a mutable collection of tags.\n> 表示\"可变标签集合\"的接口：实现了它的对象即可打标、查标、摘标。\n\n`using { /Verse.org/Simulation/Tags }`\n\n## Members\n\nThis interface has functions, but no data members.（此接口只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| AddTag | 向此容器添加一个标签实例，返回与该实例唯一关联的 tag_key。 |\n| RemoveTag | 移除与 tag_key 关联的标签实例；移除了实例则成功，否则失败。 |\n| RemoveAllTags | 移除 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_types 中任何类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| ContainsTag | 若容器中找到至少一个 tag_type 类型的标签则成功，否则失败。 |\n| ContainsAllTags | 若 tag_types 中有任一类型在容器中找不到则失败，否则成功。注意 tag_types 为空时此调用成功。 |\n| ContainsAnyTag | 若 tag_types 中至少一个类型在容器中找到则成功，否则失败。注意 tag_types 为空时此调用失败。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n\nUnlock(Obj:has_tags):void =\n    if (Obj.ContainsTag[LockTag]):\n        Obj.RemoveAllTags[LockTag]   # 摘掉\"上锁\"标签\n```\n\n## 补充说明\n\n- `Contains*` 是可失败查询（`<decides>`），必须写在失败上下文里。\n- 精确移除某一次打标：用 AddTag 返回的 [tag_key struct](tag_key.md) 调 RemoveTag。\n- 相关页面：[tag class](tag.md)、[tag_view interface](tag_view.md)。\n", "01_Verse.org/100_Simulation/010_Tags/tag_view.md": "---\nname: tag_view\nslug: versedotorg/simulation/tags/tag_view\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag_view\nkind: interface\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: full\nstatus: done\n---\n\n# tag_view interface 🟩【A级·常用】\n\n> A queryable collection of tags.\n> 表示\"可查询标签集合\"的接口：提供带层级匹配规则的只读查询。\n\n`using { /Verse.org/Simulation/Tags }`\n\n## Members\n\nThis interface has functions, but no data members.（此接口只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| Has | 判断 TagToCheck 是否存在于此容器中，同时会向上匹配父标签：`{\"A.1\"}.Has(\"A\")` 返回 True；`{\"A\"}.Has(\"A.1\")` 返回 False。若 TagToCheck 无效则恒返回 False。 |\n| HasAny | 检查此容器是否包含指定容器中的**任意一个**标签，同样向上匹配父标签：`{\"A.1\"}.HasAny({\"A\",\"B\"})` 返回 True；`{\"A\"}.HasAny({\"A.1\",\"B\"})` 返回 False。若 InTags 为空/无效则恒返回 False。 |\n| HasAll | 检查此容器是否包含指定容器中的**全部**标签，同样向上匹配父标签：`{\"A.1\",\"B.1\"}.HasAll({\"A\",\"B\"})` 返回 True；`{\"A\",\"B\"}.HasAll({\"A.1\",\"B.1\"})` 返回 False。若 InTags 为空/无效则恒返回 True，因为没有任何失败的检查。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n\nIsHostile(View:tag_view):logic =\n    View.Has(EnemyTag)   # \"Enemy.Ranged\" 也会命中 \"Enemy\"\n```\n\n## 补充说明\n\n- 层级规则一句话：**查父命中子，查子不命中父**；空集合时 HasAny=false、HasAll=true。\n- 相关页面：[has_tags interface](has_tags.md)、[tag class](tag.md)。\n", "01_Verse.org/100_Simulation/010_Tags/tag_search_sort_type.md": "---\nname: tag_search_sort_type\nslug: versedotorg/simulation/tags/tag_search_sort_type\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag_search_sort_type\nkind: enum\nmodule: /Verse.org/Simulation/Tags\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# tag_search_sort_type enumeration ⬜【C级·参考】\n\n`using { /Verse.org/Simulation/Tags }`\n\n## Enumerators\n\n| Name | Description |\n|---|---|\n| Unsorted | （官网无描述。） |\n| Sorted | （官网无描述。） |\n", "01_Verse.org/110_Assets/_overview.md": "---\nname: Assets\nslug: versedotorg/assets\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets\nkind: module\nmodule: /Verse.org\ngrade: A\ndepth: brief\nstatus: placeholder\n---\n\n# Assets 🟩【A级·常用】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "01_Verse.org/110_Assets/animation_sequence.md": "---\nname: animation_sequence\nslug: versedotorg/assets/animation_sequence\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/animation_sequence\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# animation_sequence 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/assets/animation_sequence.html -->\n", "01_Verse.org/110_Assets/material.md": "---\nname: material\nslug: versedotorg/assets/material\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/material\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# material 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/assets/material.html -->\n", "01_Verse.org/110_Assets/particle_system.md": "---\nname: particle_system\nslug: versedotorg/assets/particle_system\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/particle_system\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# particle_system 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/assets/particle_system.html -->\n", "01_Verse.org/110_Assets/mesh.md": "---\nname: mesh\nslug: versedotorg/assets/mesh\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/mesh\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# mesh 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/assets/mesh.html -->\n", "01_Verse.org/110_Assets/sound_wave.md": "---\nname: sound_wave\nslug: versedotorg/assets/so es(0.0, 90.0, 0.0)   # Pitch=0, Yaw=90°, Roll=0\n\nHalfTurn():rotation =\n    Slerp(IdentityRotation(), FaceEast(), 0.5)     # 中间朝向（球面插值）\n```\n\n## 补充说明\n\n- 常用工厂函数（均在 SpatialMath 模块）：MakeRotationFromEulerDegrees / MakeRotationFromEulerRadians / MakeRotationFromYawPitchRollDegrees、IdentityRotation、Slerp、MakeShortestRotationBetween、AngularDistanceDegrees 等。\n- 度/弧度是两套函数（…Degrees / …Radians），工程内统一用 Degrees 可避免混用错误。\n- 相关页面：[vector3 struct](vector3.md)、[transform_component class](../040_SceneGraph/transform_component.md)。\n", "01_Verse.org/130_SpatialMath/transform.md": "---\nname: transform\nslug: versedotorg/spatialmath/transform\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath/transform\nkind: class\nmodule: /Verse.org\ngrade: S\ndepth: full\nstatus: placeholder\n---\n\n# transform 🟦【S级·核心】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/spatialmath/transform.html -->\n", "01_Verse.org/130_SpatialMath/vector3.md": "---\nname: vector3\nslug: versedotorg/spatialmath/vector3\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath/vector3\nkind: struct\nmodule: /Verse.org/SpatialMath\ngrade: S\ndepth: full\nstatus: done\n---\n\n# vector3 struct 🟦【S级·核心】\n\n> 3-dimensional vector with float components.\n> 带浮点分量的三维向量。\n\n`using { /Verse.org/SpatialMath }`\n\n## Members\n\nThis struct has data members, but no functions.（此结构体只有数据成员，没有函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| Left | float | 此向量的 Left（原 -Y）分量。 |\n| Up | float | 此向量的 Up（原 Z）分量。 |\n| Forward | float | 此向量的 Forward（原 X）分量。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/SpatialMath }\n\nOrigin := vector3{Left := 0.0, Up := 0.0, Forward := 0.0}\nTarget := vector3{Forward := 100.0, Up := 50.0}\nShifted := Target + vector3{Up := 2.0}   # 向上平移 2 单位\n```\n\n## 补充说明\n\n- **分量名是 Left/Up/Forward**，不是 X/Y/Z——官方标注了与旧坐标轴的对应关系（Forward=旧 X、Left=旧 -Y、Up=旧 Z），读旧代码时按此翻译。\n- struct 为值拷贝语义：`B := A` 后改 B 不影响 A。\n- 距离/点积/插值等运算是 Spa com/temporary/ui/player_ui\nkind: class\nmodule: /UnrealEngine.com/Temporary/UI\ngrade: S\ndepth: full\nstatus: done\n---\n\n# player_ui class 🟦【S级·核心】\n\n（本页官网无导语描述；player_ui 是每个玩家一块的 UI 根画布——往指定玩家屏幕上加/拆控件。通过 [GetPlayerUI function](getplayerui.md) 获取。）\n\n`using { /UnrealEngine.com/Temporary/UI }`\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| AddWidget | 使用默认 player_ui_slot 配置，把 Widget 添加到此 player_ui。 |\n| AddWidget | 使用 Slot 配置，把 Widget 添加到此 player_ui。 |\n| RemoveWidget | 把 Widget 从此 player_ui 移除。 |\n| SetFocus | 把使用者的焦点设置到该 Widget。目标 Widget 必须可聚焦（focusable），否则无效果。若在 AddWidget 之前调用 SetFocus，则 AddWidget 之后该控件会获得焦点——除非在那之前又有别的 SetFocus 调用。 |\n\n## Attributes, Specifiers, and Effects\n\n（类成员函数各自的签名与效果见官网对应成员页；本页无统一标注。）\n\n## 示例\n\n```verse\nusing { /UnrealEngine.com/Temporary/UI }\nusing { /Verse.org/Simulation }\n\n# 给玩家屏幕挂一个控件\nGreet(P:player, W:widget):void =\n    if (UI := GetPlayerUI[P]):\n        UI.AddWidget(W)\n```\n\n## 补充说明\n\n- `GetPlayerUI` 是可失败调用（玩家 UI 未必就绪），务必写在失败上下文里。\n- 控件树与布局容器见 [widget class](widget.md)、[canvas class](canvas.md)、[stack_box class](stack_box.md)、[overlay class](overlay.md)。\n", "02_UnrealEngine.com/050_Temporary/010_UI/widget.md": "---\nname: widget\nslug: unrealenginedotcom/temporary/ui/widget\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/widget\nkind: class\nmodule: /UnrealEngine.com/Temporary/UI\ngrade: S\ndepth: full\nstatus: done\n---\n\n# widget class 🟦【S级·核心】\n\n（本页官网无导语描述；widget 是一切 UI 控件的基类——canvas、按钮、文本等都派生自它。）\n\n`using { /UnrealEngine.com/Temporary/UI }`\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| SetVisibility | 显示或隐藏该 widget，而不把它从所在 player_ui 中移除。详见 widget_visibility。 |\n| GetVisibility | 返回当前 widget_visibility 状态。 |\n| SetEnabled | 启用或禁用玩家与此 widget 的交互。 |\n| IsEnabled | 若此 widget 可被玩家交互修改则返回 true。 |\n| GetParentWidget | 返回该 widget 的父 widget。若它不在 player_ui 中或自身就是根 widget（无父）则失败。 |\n| GetRootWidget | 返回当初把该 widget 加进 player_ui 的根 widget。根 widget 返回它自己。若该 widget 不在 player_ui 中则失败。 |\n\n## Attributes, Specifiers, and Effects\n\n（类成员函数各自的签名与效果见官网对应成员页；本页无统一标注。）\n\n## 示例\n\n```verse\nusing { /UnrealEngine.com/Temporary/UI }\n\nTogglePanel(Panel:widget, Show:logic):void =\n    Panel.SetEnabled(Show)\n    Panel.SetVisibility(if (Show?) then widget_visibility.Visible else widget_visibility.Hidden)\n```\n\n## 补充说明\n\n- `Hidden` 只是看不见，控件仍挂在 player_ui 上；真正移除要用 player_ui 的 RemoveWidget。\n- 具体控件子类：布局（[canvas class](canvas.md) / [stack_box class](stack_box.md) / [overlay class](overlay.md)）、内容（text_block、color_block…）、交互（button 族、[slider_regular class](../../../03_Fortnite.com/010_UI/slider_regular.md)）。\n", "02_UnrealEngine.com/050_Temporary/010_UI/player_ui_slot.md": "---\nname: player_ui_slot\nslug: unrealenginedotcom/temporary/ui/player_ui_slot\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/player_ui_slot\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# player_ui_slot 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/player_ui_slot.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/widget_message.md": "---\nname: widget_message\nslug: unrealenginedotcom/temporary/ui/widget_message\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/widget_message\nkind: class\nmodule: /UnrealEngine.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# widget_message 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/widget_message.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/anchors.md": "---\nname: anchors\nslug: unrealenginedotcom/temporary/ui/anchors\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/anchors\nkind /devices/vehicle_spawner_armored_transport_device.html -->\n", "03_Fortnite.com/070_Devices/supply_drop_spawner_device.md": "---\nname: supply_drop_spawner_device\nslug: fortnitedotcom/devices/supply_drop_spawner_device\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/devices/supply_drop_spawner_device\nkind: class\nmodule: /Fortnite.com\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# supply_drop_spawner_device ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/devices/supply_drop_spawner_device.html -->\n", "03_Fortnite.com/070_Devices/creative_device.md": "---\nname: creative_device\nslug: fortnitedotcom/devices/creative_device\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/devices/creative_device\nkind: class\nmodule: /Fortnite.com/Devices\ngrade: S\ndepth: full\nstatus: done\n---\n\n# creative_device class 🟦【S级·核心】\n\n> Inherit from this to create a custom creative device. Inherited classes will appear in the UEFN content browser the next time Verse compiles. Instances of your derived creative_device can then be placed in the island by dragging them from the content browser into the scene.\n> 继承此类来创建自定义创意设备。Verse 下次编译后，派生类会出现在 UEFN 内容浏览器中；把派生的 creative_device 实例从内容浏览器拖入场景，即可摆放到岛屿上。\n\n`using { /Fortnite.com/Devices }`\n\n## Exposed Interfaces\n\nThis class exposes the following interfaces:（此类暴露以下接口：）\n\n| Name | Description |\n|---|---|\n| creative_object_interface | （官网无描述。） |\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| OnBegin | 重写以在游戏体验开始时添加自定义逻辑。 |\n| OnEnd | 重写以在游戏体验结束时添加自定义逻辑。在 OnEnd 内 spawn 的协程可能永远不会执行。 |\n| GetTransform | 返回 creative_device 的变换，单位为厘米（cm）。 |\n| TeleportTo | 将 creative_device 瞬移到指定的 Position 与 Rotation。 |\n| TeleportTo | 将 creative_device 瞬移到 Transform 指定的位置，同时相应地应用旋转与缩放。 |\n| MoveTo | 在指定的秒数内把 creative_device 移动到指定的 Position 与 Rotation。若设备当前正在播放动画，动画会被停止并进入 AnimationNotSet 状态。 |\n| MoveTo | 在指定的秒数内把 creative_device 移动到指定的 Transform。若设备当前正在播放动画，动画会被停止并进入 AnimationNotSet 状态。 |\n| GetGlobalTransform | 获取此设备的全局变换。 |\n| SetGlobalTransform | 设置此设备的全局变换。 |\n| TeleportTo | 将 creative_device 瞬移到 Transform 指定的位置，同时相应地应用旋转与缩放。 |\n| MoveTo | 在指定的秒数内把 creative_device 移动到指定的 Transform。若设备当前正在播放动画，动画会被停止并进入 AnimationNotSet 状态。 |\n| Show | 在世界中显示此设备。 |\n| Hide | 在世界中隐藏此设备。 |\n\n## 示例\n\n```verse\nusing { /Fortnite.com/Devices }\nusing { /Verse.org/Simulation }\n\n# 最小可运行脚本骨架：每个项目的起点\nhello_device := class(creative_device):\n\n    @editable\n    MyButton : button_device = button_device{}\n\n    OnBegin<override>()<suspends>:void =\n        Print(\"设备已启动\")\n        MyButton.InteractedWithEvent.Subscribe(OnPress)\n\n    OnPress(Agent:agent):void =\n        Print(\"按钮被按下\")\n```\n\n## 补充说明\n\n- 每个自制脚本的第一个类：继承 creative_device 后，Verse 编译即出现在内容浏览器，拖入场景生效。\n- `OnBegin<override>()<suspends>` 是一切入口；OnEnd 里 spawn 的协程官方明示可能不执行，收尾逻辑要同步完成。\n- `@editable` 字段用于在详情面板连线其他设备/控件（控件类型族见 [editable_number function](../../01_Verse.org/100_Simulation/editable_number.md)）。\n- 表中 TeleportTo/MoveTo 各出现多次，是官网对不同参数形态分别建页所致（对应多份成员页）。\n", "03_Fortnite.com/070_Devices/creative_device_base.md": "---\nname: creative_device_base\nslug: fortnitedotcom/devices/creative_device_base\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/devices/creative_device_base\nkind: class\nmodule: /Fortnite.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# creative_device_base 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/devices/creative_device_base.html -->\n", "03_Fortnite.com/070_Devices/creative_device_asset.md": "---\nname: creative_device_asset\nslug: fortnitedotcom/devices/creative_device_asset\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/devices/creative_device_asset\nkind: class\nmodule: /Fortnite.com\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# creative_device_asset ⬜【C级·参考】\n\n<!-- 待生成（阶 nite.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# play_animation_result 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/animation/playanimation/play_animation_result.html -->\n", "03_Fortnite.com/110_Animation/010_PlayAnimation/play_animation_state.md": "---\nname: play_animation_state\nslug: fortnitedotcom/animation/playanimation/play_animation_state\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/animation/playanimation/play_animation_state\nkind: enum\nmodule: /Fortnite.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# play_animation_state 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/animation/playanimation/play_animation_state.html -->\n", "03_Fortnite.com/130_Characters/_overview.md": "---\nname: Characters\nslug: fortnitedotcom/characters\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters\nkind: module\nmodule: /Fortnite.com\ngrade: S\ndepth: brief\nstatus: placeholder\n---\n\n# Characters 🟦【S级·核心】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "03_Fortnite.com/130_Characters/stasis_args.md": "---\nname: stasis_args\nslug: fortnitedotcom/characters/stasis_args\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters/stasis_args\nkind: class\nmodule: /Fortnite.com\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# stasis_args ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/characters/stasis_args.html -->\n", "03_Fortnite.com/130_Characters/fort_character.md": "---\nname: fort_character\nslug: fortnitedotcom/characters/fort_character\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters/fort_character\nkind: interface\nmodule: /Fortnite.com/Characters\ngrade: S\ndepth: full\nstatus: done\n---\n\n# fort_character interface 🟦【S级·核心】\n\n> Main API implemented by Fortnite characters.\n> 由堡垒之夜角色实现的主 API——玩家/AI 在世界中的\"角色身体\"。\n\n`using { /Fortnite.com/Characters }`\n\n## Exposed Interfaces\n\nThis interface exposes the following interfaces:（此接口暴露以下接口：）\n\n| Name | Description |\n|---|---|\n| positional | 由对象实现，允许读取位置信息。 |\n| healable | 由可被治疗的堡垒之夜对象实现。 |\n| healthful | 由拥有生命状态、可被淘汰的堡垒之夜对象实现。 |\n| damageable | 由可被伤害的堡垒之夜对象实现。 |\n| shieldable | 由拥有护盾的堡垒之夜对象实现。护盾是一种保护机制：先承受伤害，生命值保持不变。 |\n| game_action_instigator | 由发起游戏动作（如伤害、治疗）的堡垒之夜对象实现，例如玩家或 agent。事件监听器常用它计算玩家伤害积分。 |\n| game_action_causer | 由可作为游戏动作事件（如伤害、治疗）载体传递的堡垒之夜对象实现，例如玩家、载具或武器。监听器常用它传递\"什么武器造成了伤害\"等附加信息，供任务系统或玩法逻辑使用。 |\n\n## Members\n\nThis interface has functions, but no data members.（此接口只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| GetAgent | 返回与此 fort_character 关联的 agent。与需要 agent 引用的 API 交互时使用。 |\n| EliminatedEvent | 此 fort_character 被淘汰出对局时触发。 |\n| GetViewRotation | 返回此 fort_character 视线/瞄准指向的旋转。 |\n| GetViewLocation | 返回此 fort_character 视线/瞄准发出的位置。 |\n| JumpedEvent | 此 fort_character 跳跃时触发。返回以该 fort_character 为载荷的 listenable。 |\n| CrouchedEvent | 此 fort_character 改变蹲伏状态时触发。发送元组载荷：0——改变蹲伏状态的 fort_character；1——正在蹲伏为 true，否则 false。 |\n| SprintedEvent | 此 fort_character 改变冲刺状态时触发。发送元组载荷：0——改变冲刺状态的 fort_character；1——正在冲刺为 true，已停止冲刺为 false。 |\n| IsActive | 若此 fort_character 在世界中且未被淘汰则成功。若此判断失败，大多数 fort_character 操作都会静默失败。想处理这些失败情况就先测 IsActive，而不是放任静默失败。 |\n| IsDownButNotOut | 若此 fort_character 处于\"倒地未淘汰\"（Down But Not Out）状态则成功。该状态下角色倒地，但在一段时间内仍可被队友扶起。 |\n| IsCrouching | 若此 fort_character 正在蹲伏则成功。 |\n| IsOnGround | 若此 fort_character 站在地面上则成功。 |\n| IsInAir | 若此 fort_character 处于空中则成功。 |\n| IsInWater | 若此 fort_character 位于水体体积内则成功。 |\n| IsFalling | 若此 fort_character 处于下落移动状态则成功。 |\n| IsGliding | 若此 fort_character 处于滑翔移动状态则成功。 |\n| IsFlying | 若此 fort_character 处于飞行移动状态则成功。 |\n| PutInStasis | 将此 fort_character 置入凝固（stasis）状态，按 Args 阻止特定类型的移动。 |\n| ReleaseFromStasis | 将此 fort_character 从凝固状态释放。 |\n| Show | 将此 fort_character 的可见性设为可见。 |\n| Hide | 将此 fort_character 的可见性设为不可见。 |\n| SetVulnerability | 控制此 fort_character 是否可被伤害。 |\n| IsVulnerable | 若此 fort_character 可被伤害则成功；不可被伤害则失败。 |\n| TeleportTo | 将此 fort_character 传送到给定 Position，并应用 Rotation 的 yaw 与 pitch。若指定位置在有效对局空间之外或角色无法容纳等情形，则失败。 |\n| GetEntity | 返回与此 fort_character 关联的 entity。与需要 entity 引用的 API 交互时使用。 |\n| GetLinearVelocity | 返回 fort_character 的线速度（米/秒）。 |\n| SetLinearVelocity | 设置 fort_character 的线速度（米/秒）。物理被禁用时无效果。 |\n| ApplyLinearImpulse | 对 fort_character 施加线冲量（单位：牛顿·秒）。物理被禁用时无效果。 |\n| GetMass | 返回 fort_character 的质量（千克）。 |\n| ApplyForce | 对 fort_character 施加力（单位：牛顿）。物理被禁用时无效果。 |\n\n## 示例\n\n```verse\nusing { /Fortnite.com/Characters }\nusing { /Verse.org/Simulation }\n\n# 等待某个角色被淘汰；动作前先做 IsActive 检查\nWatch(Agent:agent)<suspends>:void =\n    if (FC := Agent.GetFortCharacter[]):\n        if (FC.IsActive[]):\n            Print(\"在场上\")\n        FC.EliminatedEvent().Await()\n        Print(\"被淘汰了\")\n```\n\n## 补充说明\n\n- 本页**没有** Damage/Heal 函数——伤害/治疗/生命/护盾能力在 Exposed Interfaces 列出的 damageable / healable / healthful / shieldable 接口上（见官网对应接口页）。\n- 获取方式：`Agent.GetFortCharacter[]`（可失败）；动作前先 `IsActive[]`，否则失败是静默的（官方原话提醒）。\n- 跳/蹲/冲刺事件带元组载荷，配合 [listenable function](../../01_Verse.org/010_Verse/listenable.md) 的 Subscribe 使用。\n", "03_Fortnite.com/180_Vehicles/_overview.md": "---\nname: Vehicles\nslug: fortnitedotcom/vehicles\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/vehicles\nkind: module\nmodule: /Fortnite.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Vehicles 🟨【B级·进阶】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "03_Fortnite.com/180_Vehicles/fort_vehicle_seat.md": "---\nname: fort_vehicle_seat\nslug: fortnitedotcom/vehicles/fort_vehicle_seat\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/vehicles/fort_vehicle_seat\nkind: class\nmodule: /Fortnite.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# fort_vehicle_seat 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/vehicles/fort_vehicle_seat.html -->\n", "03_Fortnite.com/180_Vehicles/fort_vehicle.md": "---\nname: fort_vehicle\nslug: fortnitedotcom/vehicl te.com/130_Characters/fort_character.md | fort_character | interface | S | full | [官网](https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters/fort_character) |\n| 03_Fortnite.com/180_Vehicles/fort_vehicle_seat.md | fort_vehicle_seat | class | B | brief | [官网](https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/vehicles/fort_vehicle_seat) |\n| 03_Fortnite.com/180_Vehicles/fort_vehicle.md | fort_vehicle | interface | B | brief | [官网](https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/vehicles/fort_vehicle) |\n", "STYLE_GUIDE.md": "# STYLE_GUIDE.md —— 注解风格规范（阶段2执行合同 · v2 官网对齐版）\n\n> 本文件是全库唯一写作标准，阶段2每生成/修改一个页面都必须遵守。v2 依据用户验收反馈重写：**页面结构完全对齐官网**。\n> 数据来源三级：`tools/_extracted/`（官网页面结构化 Markdown，写作主素材）→ `sources/`（原始 HTML，存疑时仲裁）→ `manifest.json`（结构/官方标题/分级/URL）。\n> 铁律1：**一切 API 事实以快照为准，禁止凭记忆补写。**\n> 铁律2：**命名一律用官网正式标题**（manifest 的 `title` 字段，即官网 H1，如 `component class`、`Sleep function`、`Simulation module`）。\n> 铁律3：**full 级页面的官网段落与表格必须逐行完整，一行不许省。**\n\n---\n\n## 1. 目录与文件约定\n\n```\nverse-api-zh/\n├── 00_语言基础/          语言内建类型与表达式（官网无对应页）。章节与页面均不加任何\n│                          \"补充/镜像\"类标注，写法与官网页一致\n├── 01_Verse.org/ 02_UnrealEngine.com/ 03_Fortnite.com/   官网三大模块树\n│     └── NNN_模块名/      编号=官网出现顺序×10；模块总览页 _overview.md 对应官网模块页\n├── 90_分级索引/          S/A/B/C 四级快速索引\n├── _Specifiers与Effects.md  公共说明附录（官网每页重复的标准表格统一译一次）\n├── _overview.md          每个模块文件夹内的模块总览页（对应官网 \"XXX module\" 页）\n└── 成员页.md             文件名 = 官方 slug 末段（非法字符→_，尾部 _ 去除）\n```\n\n- **文件名**用 slug 末段（`print.md`、`print-1.md`、`operatorminus.md`），**显示名/侧栏名/H1 一律用官网正式标题**（含类型后缀）：H1 写 `# component class 🟦`，侧栏条目、SUMMARY、相关链接文字同。\n- **模块页表格内成员用裸名**（官网模块页表格即如此：`component`），点入后页面标题才是 `component class`。\n- **无链接 data 条目**（官网表格无独立页，如 CollisionProfiles 常量、Input/UI 按键映射）：不建文件，写进父模块 `_overview.md` 的成员表格（裸名＋〔无独立页面〕注记）。\n- 官网标注为空的模块（Native、Predicts、Conversations…）：`_overview.md` 写明\"官方标注：此模块当前为空\"，状态 done，不脑补。\n\n## 2. 分级与详略（分级已在 MANIFEST 定死，不得改判）\n\n| 级别 | 徽标 | depth | 页面构成 |\n|---|---|---|---|\n| S 核心 | 🟦 | full | 官网全部段落＋完整表格（Description 全译）＋末尾追加 示例/补充说明 |\n| A 常用 | 🟩 | full | 同 S |\n| B 进阶 | 🟨 | brief | 官网段落结构保留，Description 可摘译压缩；**无追加示例/补充说明**（最多一句提示） |\n| C 参考 | ⬜ | oneliner | 标题＋官网描述一句话中译 |\n\n- Devices 模块约定：全部设备类 C 级（一句话索引）；例外：`creative_device`（S）、`creative_device_base`/`creative_object`/`creative_prop`/`creative_object_interface`（A）。\n- 模块总览页 `_overview.md` 对应官网模块页：官网有的段落/表格全译（成员表完整），可追加一小段\"本模块怎么读\"。\n\n## 3. full 页模板（S/A 级）——官网结构在前，追加内容在后\n\n以 `component class` 为例的骨架（**顺序不可调换、段落不可删**）：\n\n```markdown\n# component class 🟦【S级·核心】\n\n> Base class for authoring logic and data in the SceneGraph. …\n> （官网首段完整英中对照：原文一段、中文翻译一段。官网导语有 N 段就译 N 段，全文完整。）\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\nThis class has both data members and functions.（官网原文＋中译）\n\n### Data\n| Data Member Name | 类型 | 描述 |\n|---|---|---|\n| Entity | entity | （官网 Description 中译，逐行完整） |\n| TickEvents | ?tick_events | … |\n\n### Functions\n| Function Name | 描述 |\n|---|---|\n| OnAddedToScene | … |\n| …（官网表的每一行都必须在） |\n\n## Parameters（官网有则保留，全译）\n## Enumerators / Exposed Interfaces / Inheritance Hierarchy（官网有则保留，全译）\n\n## Attributes, Specifiers, and Effects\n`Sleep<public><native>(Seconds:float)<transacts><suspends><no_rollback>` —— 标签：public / native / transacts / suspends / no_rollback\n（语义不逐条复述，链接 [_Specifiers与Effects](_Specifiers与Effects.md)）\n\n────────── 以下为追加内容，必须放在官网内容全部结束之后 ──────────\n\n## 示例\n```verse\n# 可运行示例，1~2 个\n```\n\n## 补充说明\n（便于理解的注解：何时用、与谁配合、常见坑。3~8 条，无依据不写。）\n```\n\n- 追加内容**不得**插进官网段落之间；官网没有的标题不得出现在官网区域。\n- 官网导语里的代码片段/列表/生命周期图示原样保留结构并翻译。\n- **表格行数 = 提取件行数**（tools/_extracted/ 对应文件），缺行即错误。\n\n## 4. brief（B 级）与 oneliner（C 级）模板\n\n- brief：同上结构，但 Description 摘译（保留关键句），无 `## 示例`/`## 补充说明`，结尾最多一行\"→ 详见官方页\"。\n- oneliner：`# 官网标题 ⬜【C级·参考】` ＋ 官网描述一句话中译。正文 ≤10 行。\n\n## 5. 术语表（正文必须统一；代码标识符一律不译）\n\n| 英文 | 中文 | 备注 |\n|---|---|---|\n| agent | 代理 | 首次出现写「代理（agent）」 |\n| player / team / session / round | 玩家 / 队伍 / 对局 / 回合 | |\n| device | 设备 | |\n| widget | 控件 | |\n| entity / component | 实体 / 组件 | |\n| prefab | 预制体 | |\n| mesh / texture / material | 网格 / 贴图 / 材质 | |\n| spawn | 生成 | |\n| failable / failure context | 可失败表达式 / 失败上下文 | |\n| suspends | 可挂起 | 效果说明符 `<suspends>` 保留原文 |\n| listens / listenable | 监听 / listenable（不译） | |\n| quest / inventory | 任务 / 物品栏 | |\n| HUD | HUD（不译） | |\n\n其余名词：能意译就意译并首现标英文；拿不准就保留英文。\n\n## 6. 翻译与写作规则\n\n1. **代码、类型名、函数名、参数名、报错原文一律不翻译。**\n2. 官网导语：英文原文一段＋中文翻译一段，成对出现；表格 Description 直接中译（不保留英文行）。\n3. 示例代码注释用中文，代码符合 §7 语法小抄。\n4. 语气面向\"会一点编程、初次接触 Verse\"；用\"你\"；不堆形容词。\n5. 「补充说明」只在有依据时写（官网页面明示、签名可推出、或官方论坛已知行为），不臆造。\n6. 相关页面链接（追加区内）2~4 条，链接文字用官网标题。\n\n## 7. Verse 语法小抄（写示例必须遵守）\n\n```verse\n# 定义与赋值\nX:int := 5          # 定义常量\nvar Y:int := 0\nset Y = 3\n\n# 数组 / 映射 / 选项\nArr:int[] := array{1, 2, 3}\nM:[string]int := map{\"a\" => 1}\nOpt:?int := option{7}\nif (V := Arr[0], W := Opt?) {}   # 失败上下文：任意一处失败则整块跳过\n\n# 类与效果说明符\nMyClass<public> := class<concrete>(BaseClass):\n    @editable Slider : editable_number = editable_number{Default := 0.5}\n\n# 异步\nSleep(0.5)                       # 仅 <suspends> 上下文\nspawn{ Body() }\nBranch().race(Body(), Other())\n\n# 事件\nE:event(int) = event(int){}\nE.Signal(3)                      # 触发\nN := E.Await()                   # <suspends> 等待一次\nE.Subscribe(Obj)                 # 持续订阅\n```\n\n## 8. 每页自查清单\n\n1. 标题/侧栏名 = manifest `title`（官网 H1）；frontmatter 七字段齐全，grade/depth 与 MANIFEST 一致。\n2. 段落顺序与官网提取件一致；官网区域无自创标题。\n3. Data/Functions 表逐行完整（行数=提取件），Description 已译。\n4. 签名、参数与快照一致；Specifiers 段只列标签行＋附录链接。\n5. 追加内容（示例/补充说明）在官网内容之后。\n6. 示例符合 §7；代码标识符未翻译。\n7. C 级正文 ≤10 行；B 级无追加区。\n8. 术语与 §5 一致；status 置 `done`。\n\n## 9. 常见错误（随批次追加）\n\n- **凭旧版记忆写 API**：Sleep 在 /Verse.org/Simulation；fort_character 是 interface（伤害/治疗在 damageable/healable 等接口）；vector3 分量是 Left/Up/Forward。以 _extracted/ 为准。\n- **漏表行**：官网 member 表常有 10+ 函数（如 entity、component），漏 GetComponents、RemoveFromEntity 之类即违反铁律3。\n- **同名多页**：官网 slug 后缀消歧（print/print-1/print-2），每页各写各的重载，别合并。\n- **无链接 data 条目**：并入父模块 _overview 表格，不建文件。\n- **空模块**：Native、Predicts、Conversations 等只写 _overview 一段话。\n- **给官网内容区加自创标题**（如\"这是什么\"）：禁止，追加区只能在官网内容结束后。\n\n## 10. 交付流程（阶段2每个批次）\n\n1. 读 `PROGRESS.md` 取下一个未完成模块 → 对照 `MANIFEST.md` 的 grade/depth → 逐页打开 `tools/_extracted/<slug>.md`（结构化官网内容）→ 按 §3/§4 模板成文。\n2. 完成后跑 `python tools/build_site.py` → 更新 PROGRESS.md。\n3. 抽查反馈不返工原文，追加到 §9。\n", "PROGRESS.md": "# PROGRESS —— 生成进度\n\n> 状态: ☐ 未开始 / ◐ 部分完成 / ☑ 已生成待审 / ✓✓ 已审核通过。阶段2完成一个模块就把 ☐ 改 ☑。\n> 总计约 1027 个模块文件夹。00_语言基础（8页）与 90_分级索引 由脚本生成/阶段1完成。\n\n\n- ☐ 01_Verse.org/010_Verse（约137页）\n- ☐ 01_Verse.org/020_Native（约1页）\n- ☐ 01_Verse.org/030_Chat（约8页）\n- ☐ 01_Verse.org/040_SceneGraph（约110页）\n- ☐ 01_Verse.org/050_Progression（约9页）\n- ☐ 01_Verse.org/060_Timeline（约4页）\n- ☐ 01_Verse.org/070_Presentation（约3页）\n- ☐ 01_Verse.org/080_Input（约36页）\n- ☐ 01_Verse.org/090_AgentGroup（约7页）\n- ☐ 01_Verse.org/100_Simulation（约20页）\n- ☐ 01_Verse.org/110_Assets（约11页）\n- ☐ 01_Verse.org/120_Colors（约169页）\n- ☐ 01_Verse.org/130_SpatialMath（约42页）\n- ☐ 01_Verse.org/140_Random（约4页）\n- ☐ 01_Verse.org/150_Predicts（约1页）\n- ☐ 01_Verse.org/160_Concurrency（约5页）\n- ☐ 02_UnrealEngine.com/010_Conversations（约1页）\n- ☐ 02_UnrealEngine.com/020_Progression（约9页）\n- ☐ 02_UnrealEngine.com/030_Itemization（约19页）\n- ☐ 02_UnrealEngine.com/040_WebAPI（约6页）\n- ☐ 02_UnrealEngine.com/050_Temporary（约42页）\n- ☐ 02_UnrealEngine.com/060_Social（约2页）\n- ☐ 02_UnrealEngine.com/070_JSON（约3页）\n- ☐ 02_UnrealEngine.com/080_BasicShapes（约6页）\n- ☐ 02_UnrealEngine.com/090_Abilities（约10页）\n- ☐ 02_UnrealEngine.com/100_ControlInput（约5页）\n- ☐ 02_UnrealEngine.com/110_Assets（约3页）\n- ☐ 03_Fortnite.com/010_UI（约48页）\n- ☐ 03_Fortnite.com/060_AI（约29页）\n- ☐ 03_Fortnite.com/070_Devices（约265页）\n- ☐ 03_Fortnite.com/110_Animation（约6页）\n- ☐ 03_Fortnite.com/130_Characters（约3页）\n- ☐ 03_Fortnite.com/180_Vehicles（约3页）\n\n## 阶段1产出\n\n- [x] 抓取与解析（sources/ + manifest.json）\n- [x] STYLE_GUIDE.md / MANIFEST.md / PROGRESS.md / 目录骨架\n- [x] 样板模块：01_Verse.org/100_Simulation（20页全注解）\n- [x] S级旗舰页 24 页（语言基础8 + Verse核心9 + SceneGraph3 + SpatialMath2 + UI3 + fort_character + creative_device，含 00_语言基础 总览）\n- [x] 仓库脚手架（.gitbook.yaml/Intro/README/.nojekyll）与 build_site.py（SUMMARY 859行 + index.html 755KB，浏览器实测过滤/搜索/树/上下页通过）\n", "_Specifiers与Effects.md": "---\nname: Specifiers 与 Effects 对照\nslug: (附录)specifiers\nurl: https://dev.epicgames.com/documentation/fortnite/specifiers-and-attributes-in-verse\nkind: module\nmodule: /附录\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# Specifiers 与 Effects 对照\n\n> 官网每个 API 页的「Attributes, Specifiers, and Effects」章节都重复同一批标准定义。本页把这些公共表格**完整翻译一次**，各 API 页只标注自己携带的标签，语义一律链接到这里。\n> 下方全部定义译自官网 API 页面内嵌的标准表格（收集自本库 831 页快照的并集）。\n\n## Specifiers（说明符，写在 `<` `>` 中修饰标识符）\n\n| Specifier | 官方含义（中译） |\n|---|---|\n| `<public>` | 该标识符全局可访问。可用于模块、类、接口、结构体、枚举、方法与数据。 |\n| `<native>` | 表示元素的实现细节由 C++ 完成。带 native 的 Verse 定义会自动生成 C++ 定义供引擎侧填充实现。可用于类、接口、枚举、方法与数据。 |\n| `<native_callable>` | 表示该实例方法既是 native（C++ 实现），又可从 Verse 调用。 |\n\n## Effects（效果，写在函数签名 `<` `>` 中声明行为契约）\n\n| Effect | 官方含义（中译） |\n|---|---|\n| `<transacts>` | 表示函数执行的任何动作都可回滚。任何对可变变量（`var`）的写入都要求此效果。若把 transacts 加到实际不可回滚的函数上，编译器会提示（native 函数不做此检查）。 |\n| `<decides>` | 表示该函数**可以失败**：调用它必须处于失败上下文（`if`/`or`/`not` 等），失败时整块表达式跳过而不报错。 |\n| `<suspends>` | 表示该函数是异步的：为函数体创建异步上下文，内部可调用 Sleep、Await 等挂起操作。 |\n| `<no_rollback>` | 未指定排他效果时的默认效果。表示函数执行的动作**不可撤销**，因此不能用于失败上下文。此效果不可手动指定。 |\n| `<reads>` | 表示相同输入不保证产生相同写入/结果（读取外部可变状态）。 |\n| `<predicts>` | 官网标准表中该条目描述为空（参见官方 Specifiers Page）。 |\n\n## 签名里还会见到的其他标签\n\n`<concrete>`、`<abstract>`、`<final>`、`<final_super>`、`<internal>`、`<epic_internal>` 等出现在类/接口定义的签名中（如 `agent := class<epic_internal>(entity)`）。它们的完整官方定义见官网 [Specifiers Page](https://dev.epicgames.com/documentation/fortnite/specifiers-and-attributes-in-verse)；在本库各页的「Attributes, Specifiers, and Effects」小节只列标签不重复释义。\n\n## 相关页面\n\n- [语言基础](00_语言基础/_overview.md) —— failure/option 等机制与本页 `<decides>` 直接相关\n"}</script>
<script>
const TREE=JSON.parse(document.getElementById('tree-data').textContent);
const MD=JSON.parse(document.getElementById('md-data').textContent);
const $=s=>document.querySelector(s);
let active=null, flat=[];

// ---------- 树展开 ----------
(function flatten(n,depth){n._depth=depth;flat.push(n);(n.children||[]).forEach(c=>flatten(c,depth+1));})(TREE,0);
const byPath=new Map();flat.forEach(n=>{if(n.path)byPath.set(n.path,n)});

// ---------- 渲染侧栏 ----------
function renderGrades(){
  const box=$('#grades');box.innerHTML='';
  for(const g of ['S','A','B','C']){
    const b=document.createElement('span');b.className='gbtn'+(state.grades.has(g)?' on':'');
    b.textContent=g+' '+({S:'核心',A:'常用',B:'进阶',C:'参考'}[g]);
    b.onclick=()=>{state.grades.has(g)?state.grades.delete(g):state.grades.add(g);renderAll()};box.appendChild(b);
  }
}
const state={q:'',grades:new Set()};

function match(n){
  if(state.q && !n.title.toLowerCase().includes(state.q))return false;
  if(state.grades.size===0)return true;
  if(!state.grades.size)return true;
  const g=n.grade||'';
  if(n.children)return n.children.some(match)||state.grades.has(g)&&g!=='';
  return state.grades.has(g);
}
function nodeHtml(n){
  const kids=(n.children||[]).filter(match);
  if(!match(n))return '';
  let cls=n.children?'d':'leaf';
  let g=n.grade?`<span class="g g${n.grade}"></span>`:'';
  let pend=(n.status==='placeholder')?'<span class="pend">待生成</span>':'';
  let inner=g+htmlEsc(n.title)+pend;
  let s=`<li class="${cls}">`;
  s+=n.children?`<span class="t">${inner}</span>`:`<a data-p="${n.path}" class="${active===n.path?'cur':''}">${inner}</a>`;
  if(kids.length)s+='<ul>'+kids.map(nodeHtml).join('')+'</ul>';
  return s+'</li>';
}
function renderTree(){
  const kids=(TREE.children||[]).filter(match);
  $('#tree').innerHTML='<ul>'+kids.map(nodeHtml).join('')+'</ul>';
  $('#tree').querySelectorAll('li.d>span.t').forEach(sp=>sp.onclick=()=>sp.parentElement.classList.toggle('closed'));
  $('#tree').querySelectorAll('a').forEach(a=>a.onclick=()=>show(a.dataset.p));
}
function renderAll(){renderGrades();renderTree()}

// ---------- 极简 Markdown 渲染 ----------
function htmlEsc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function esc(s){return htmlEsc(s)}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,p)=>{
    if(p.endsWith('.md'))return `<a data-p="${p}" href="javascript:void(0)">${t}</a>`;
    return `<a href="${p}" target="_blank">${t}</a>`});
  return s;
}
function md2html(md){
  const lines=md.split('\n');let out=[],i=0,inCode=false,code=[],list=null,tbl=null,quote=null;
  const flushList=()=>{if(list){out.push(`<ul>${list.map(x=>'<li>'+x+'</li>').join('')}</ul>`);list=null}};
  const flushTbl=()=>{if(tbl){let h='';tbl.forEach((r,ri)=>{const t=ri===0?'th':'td';h+='<tr>'+r.map(c=>`<${t}>${inline(c)}</${t}>`).join('')+'</tr>'});out.push(`<table>${h}</table>`);tbl=null}};
  const flushQ=()=>{if(quote){out.push('<blockquote>'+quote.map(x=>inline(x)).join('<br>')+'</blockquote>');quote=null}};
  for(;i<lines.length;i++){
    const L=lines[i];
    if(L.startsWith('```')){flushList();flushTbl();flushQ();
      if(inCode){out.push('<pre><code>'+code.join('\n')+'</code></pre>');code=[];inCode=false}
      else inCode=true;continue}
    if(inCode){code.push(L);continue}
    if(!L.trim()){flushList();flushTbl();flushQ();continue}
    if(L.startsWith('|')){const cells=L.split('|').slice(1,-1).map(x=>x.trim());
      if(cells.every(c=>/^-+$/.test(c)))continue;flushList();flushQ();tbl=tbl||[];tbl.push(cells);continue}
    if(L.startsWith('# ')){flushList();flushTbl();flushQ();out.push('<h1>'+inline(L.slice(2))+'</h1>');continue}
    if(L.startsWith('## ')){flushList();flushTbl();flushQ();out.push('<h2>'+inline(L.slice(3))+'</h2>');continue}
    if(L.startsWith('### ')){flushList();flushTbl();flushQ();out.push('<h3>'+inline(L.slice(4))+'</h3>');continue}
    if(/^>\s*$/.test(L)){flushList();flushTbl();flushQ();continue}
    if(L.startsWith('> ')){flushList();flushTbl();quote=quote||[];quote.push(L.slice(2).replace(/^- /,'• '));continue}
    if(/^[-*] /.test(L)){flushTbl();flushQ();list=list||[];list.push(inline(L.slice(2)));continue}
    if(/^\d+\. /.test(L)){flushTbl();flushQ();list=list||[];list.push(inline(L.replace(/^\d+\. /,'')));continue}
    if(L.startsWith('---')){flushList();flushTbl();flushQ();out.push('<hr>');continue}
    flushList();flushTbl();flushQ();out.push('<p>'+inline(L)+'</p>');
  }
  flushList();flushTbl();flushQ();
  if(inCode)out.push('<pre><code>'+code.join('\n')+'</code></pre>');
  return out.join('\n');
}

// ---------- 内容与导航 ----------
const leaves=flat.filter(n=>n.children===null||n.children&&n.children.length===0&&false);
const order=flat.filter(n=>!n.children&&n.path&&MD[n.path]);
function show(path){
  active=path;
  const n=byPath.get(path)||{};
  let body=MD[path]||'';
  const isPending=/status: placeholder/.test(body.split('---')[1]||'')||n.status==='placeholder';
  let htmlOut=md2html(body);
  if(isPending)htmlOut+='<div class="pending-box">⏳ 本页在阶段1为占位页，正文将由批量生成阶段填充。<br>官方原文快照已保存在仓库 sources/ 目录。</div>';
  htmlOut=htmlOut.replace(/status: placeholder\n?/g,'');
  $('#content').innerHTML=htmlOut;
  $('#content').querySelectorAll('a[data-p]').forEach(a=>a.onclick=()=>show(a.getAttribute('data-p')));
  $('#content').scrollTop=0;document.querySelector('#main').scrollTop=0;
  renderTree();
}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
function step(d){
  const i=order.findIndex(n=>n.path===active);
  const j=Math.min(order.length-1,Math.max(0,(i<0?0:i)+d));
  if(order[j])show(order[j].path);
}
$('#search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();renderTree()};

// frontmatter 剥离
for(const k in MD){MD[k]=MD[k].replace(/^---\n[\s\S]*?\n---\n?/,'')}
renderAll();show('Intro.md');
</script>
</body>
