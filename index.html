r_info).html -->\n", "01_Verse.org/090_AgentGroup/add_member_error.md": "---\nname: add_member_error\nslug: versedotorg/agentgroup/add_member_error\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/add_member_error\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# add_member_error ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/add_member_error.html -->\n", "01_Verse.org/090_AgentGroup/remove_member_error.md": "---\nname: remove_member_error\nslug: versedotorg/agentgroup/remove_member_error\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/remove_member_error\nkind: class\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# remove_member_error ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/remove_member_error.html -->\n", "01_Verse.org/090_AgentGroup/member_info_interface.md": "---\nname: member_info_interface\nslug: versedotorg/agentgroup/member_info_interface\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/member_info_interface\nkind: interface\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# member_info_interface ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/member_info_interface.html -->\n", "01_Verse.org/090_AgentGroup/agent_group_interface.md": "---\nname: agent_group_interface\nslug: versedotorg/agentgroup/agent_group_interface\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/agent_group_interface\nkind: function\nmodule: /Verse.org\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# agent_group_interface ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/agent_group_interface.html -->\n", "01_Verse.org/090_AgentGroup/agent_group.md": "---\nname: agent_group\nslug: versedotorg/agentgroup/agent_group\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/agentgroup/agent_group\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# agent_group 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/agentgroup/agent_group.html -->\n", "01_Verse.org/100_Simulation/_overview.md": "---\nname: Simulation\nslug: versedotorg/simulation\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation\nkind: module\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: brief\nstatus: done\n---\n\n# Simulation 🟦【S级·核心】\n\n> 官网对本模块无单独描述；本页为模块总览。\n> Simulation 模块提供\"对局世界\"的基本概念：谁在对局里（agent/player）、怎么分组（team）、这是哪一局（session），以及控制执行节奏的 Sleep 等函数。\n\n## 这是什么\n\n写任何 Verse 玩法逻辑都绕不开这个模块：\n\n- **[agent](agent.md)**（S）——\"参与者\"的抽象：可能是真人玩家，也可能是 AI 单位。大多数设备事件回传的是 agent，先判别再转成 player。\n- **[player](player.md)**（S）——真人玩家，继承自 agent；查状态、给道具最终都要落到具体 player 上。\n- **[team](team.md)**（A）——队伍，对局中的分组单位。\n- **[session](session.md)**（A）——每回合一个实例的全局对象，常配合 `weak_map` 实现\"全局变量\"。\n- **[Sleep](sleep.md)**（S）——暂停当前协程若干秒，几乎每个异步玩法都要用。\n- **[editable_\\*](editable_number.md)**（S/A）——把脚本参数暴露到 UEFN 详情面板的数字/滑条控件，写自定义设备必备。\n\n子模块 [Tags](010_Tags/_overview.md) 提供通用标签系统（打标、查询、过滤）。\n\n## 使用前提\n\n```verse\nusing { /Verse.org/Simulation }\n```\n\n## 成员一览\n\n| 成员 | 类型 | 一句话 | 级别 |\n|---|---|---|---|\n| [agent](agent.md) | 类 | 参与者的抽象基类（玩家或 AI） | 🟦 S |\n| [player](player.md) | 类 | 真人玩家，继承 agent | 🟦 S |\n| [team](team.md) | 类 | 队伍 | 🟩 A |\n| [session](session.md) | 类 | 每回合一个实例的全局对象 | 🟩 A |\n| [Sleep](sleep.md) | 函数 | 暂停当前协程若干秒 | 🟦 S |\n| [GetSession](getsession.md) | 函数 | 取当前回合的 session | 🟩 A |\n| [GetSimulationElapsedTime](getsimulationelapsedtime.md) | 函数 | 世界开始模拟以来经过的秒数 | 🟩 A |\n| [editable_slider](editable_slider.md) | 参数化类 | 详情面板滑条 | 🟦 S |\n| [editable_number](editable_number.md) | 参数化类 | 详情面板数字输入 | 🟦 S |\n| [editable_vector_slider](editable_vector_slider.md) | 参数化类 | 三维向量滑条 | 🟩 A |\n| [editable_vector_number](editable_vector_number.md) | 参数化类 | 三维向量数字输入 | 🟩 A |\n| [session_environment](session_environment.md) | 枚举 | 对局环境：编辑/私人/线上 | 🟨 B |\n\n## 相关页面\n\n- [Verse.org 总览](../_overview.md) —— 语言核心与模块地图\n- [entity](../040_SceneGraph/entity.md) —— agent/player 的 SceneGraph 基类\n- [Tags 子模块](010_Tags/_overview.md)\n", "01_Verse.org/100_Simulation/agent.md": "---\nname: agent\nslug: versedotorg/simulation/agent\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/agent\nkind: class\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# agent 🟦【S级·核心】\n\n> Agent is the abstract representation of a participant in an experience: a player or an AI agent.\n> agent 是\"对局参与者\"的抽象表示——可以是真人玩家，也可以是 AI 单位。\n\n## 这是什么\n\n设备事件回传的\"是谁触发了按钮\"、排行榜里的\"是谁\"、物品栏的\"是谁的\"——这些\"谁\"的类型都是 `agent`。它是**抽象基类**：真人玩家是它的子类 [player](player.md)，AI 单位同样继承它。你的函数通常**接收 agent**（宽进），内部再判断/转换成 player 或做 agent 级操作（严用）。\n\n在当前版本的 SceneGraph 体系里，agent 继承自 [entity](../040_SceneGraph/entity.md)，因此也拥有实体层的组件管理函数（AddComponents 等），但多数玩法代码只用\"它代表一个参与者\"这一身份。\n\n## 签名\n\n```verse\nagent<public><epic_internal> := class<epic_internal>(entity):\n    # 官方未公开任何自有成员；作为类型标识使用\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# 设备事件拿到 agent 后，识别出真人玩家\nOnAgentJoined(Agent:agent):void =\n    if (P := player[Agent]):\n        Print(\"玩家 {P.GetPlayerUI? } 加入\")   # player 才有玩家级操作\n    else:\n        Print(\"AI 参与者加入\")\n```\n\n## 常用成员\n\nagent 自身几乎无成员，价值在\"作为参与者的通行证\"被各类 API 接收。常用配套函数（模块级）：\n\n| 函数 | 形式 | 说明 | 级别 |\n|---|---|---|---|\n| `player[Agent]` | 可失败转换 | 把 agent 尝试转为 player，失败则走失败分支 | 🟦 S |\n| `GetPlayspace().GetPlayers()` | 常配 | 取全部玩家（Fortnite.com/Game） | 🟩 A |\n| 继承自 entity | `AddEntities` / `AddComponents` / `GetParent` | SceneGraph 实体操作 | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：任何\"对每个参与者做事\"的场合——发奖励、记分、事件回调参数类型。\n- 不用：需要真人专属信息（角色血量、UI）时直接转成 player；不要把 agent 当成具体角色对象用。\n\n## 常见坑\n\n- `agent` ≠ 角色（character）：agent 是\"参与者\"，角色是 player 在世界里的身体（如 fort_character）。两者要分清。\n- 从设备事件拿到的 agent 未必是真人，转 player 必须走失败分支（`if (P := player[Agent])`）。\n\n## 相关页面\n\n- [player](player.md) —— 唯一的常用子类\n- [entity](../040_SceneGraph/entity.md) —— SceneGraph 基类\n- [team](team.md) —— 参与者的分组\n", "01_Verse.org/100_Simulation/player.md": "---\nname: player\nslug: versedotorg/simulation/player\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/player\nkind: class\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# player 🟦【S级·核心】\n\n> A human participant in an experience. This class is derived from agent.\n> 对局里的真人玩家，是 agent 的子类。\n\n## 这是什么\n\n`player` 代表一个坐在屏幕前的真人。凡是\"针对这个人\"的操作——查分数、发道具、开 UI、传送、绑定角色——最终都要落到 player 上。从设备事件拿到的 [agent](agent.md) 用可失败转换 `player[Agent]` 变成 player；反过来 player 可以隐式当 agent 用。\n\n它继承自 [entity](../040_SceneGraph/entity.md)（SceneGraph），所以也带实体层函数，但玩法代码里最常用的还是\"作为玩家身份\"参与各类 API。与 player 强相关的进阶能力（角色、背包、进度）分布在其他模块：fort_character（角色身体）、inventory_component（物品栏）、quest（任务）。\n\n## 签名\n\n```verse\nplayer<public><epic_internal> := class<epic_internal>(agent):\n    # 官方未公开自有数据成员；作为\"真人玩家\"标识与各类 API 的入口类型\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# 对局开始：给每个玩家发一次欢迎（遍历所有玩家）\nOnBegin<override>()<suspends>:void =\n    for (P : GetPlayspace().GetPlayers()):\n        Print(\"欢迎，玩家！\")\n        Sleep(0.2)\n\n# 从 agent 安全转 player\nHandleAgent(A:agent):void =\n    if (P := player[A]):\n        Print(\"是真人玩家\")\n```\n\n## 常用成员\n\n| 名称 | 形式 | 说明 | 级别 |\n|---|---|---|---|\n| `player[Agent]` | 可失败转换 | agent → player | 🟦 S |\n| `GetPlayspace().GetPlayers()` | 常配 | 当前全部玩家列表 | 🟩 A |\n| `P.GetPlayerUI()` | 常配 | 拿玩家 UI 入口（Temporary/UI） | 🟦 S |\n| 继承自 entity | `AddEntities` 等 | SceneGraph 实体操作 | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：需要\"这个人\"的场合——计分、奖励、UI、按玩家存状态（weak_map[player]）。\n- 不用：AI 单位也要参与的同一段逻辑，请把参数写成 agent，内部再分流。\n\n## 常见坑\n\n- 玩家中途退出后，player 引用失效；跨回合长期持有的逻辑要做有效性判断。\n- `player[X]` 是可失败转换，必须写在失败上下文（`if`/`for`）里，不能裸调用。\n\n## 相关页面\n\n- [agent](agent.md) —— 父类，参数尽量用宽类型\n- [session](session.md) —— 配合 weak_map 按玩家存\"全局变量\"\n- [fort_character](../../../03_Fortnite.com/050_Characters/fort_character.md) —— 玩家在世界中的角色身体\n", "01_Verse.org/100_Simulation/session.md": "---\nname: session\nslug: versedotorg/simulation/session\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/session\nkind: class\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# session 🟩【A级·常用】\n\n> Type for which there is a single instance per round. Use GetSession to get the current round's session instance.\n> 每一回合只存在一个实例的类型。用 GetSession 取当前回合的实例。\n\n## 这是什么\n\nVerse 没有\"全局变量\"这个概念，但 `session` ＋ `weak_map` 是官方给出的替代方案：`session` 保证每回合只有一个实例，把它当 weak_map 的 key，就能存\"整局共享\"的数据——比分、配置、世界状态。官方注明：未来可能改为\"每局游戏一个实例\"，不要依赖\"每回合重置\"的行为。\n\n## 签名\n\n```verse\nsession<public><epic_internal> := class<epic_internal>:\n    # 无自有成员；作为唯一 key 使用\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# \"全局变量\"标准写法\nvar GlobalScoreMap:weak_map[session, int] = map{}\n\nAddGlobalScore(Points:int):void =\n    S := GetSession()\n    Current := GlobalScoreMap[S] or 0     # 取不到就用 0\n    if (set GlobalScoreMap[S] = Current + Points) {}\n```\n\n## 常用成员\n\n| 名称 | 形式 | 说明 | 级别 |\n|---|---|---|---|\n| `GetSession()` | 模块函数 | 取当前 session 实例 | 🟩 A |\n| `weak_map[session, T]` | 组合用法 | session 作 key 存全局数据 | 🟩 A |\n| [session_environment](session_environment.md) | 枚举 | 判断当前是编辑/私人/线上环境 | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：跨设备/跨脚本共享状态、模块级计分板、配置单例。\n- 不用：只和单个玩家有关的数据——用 `weak_map[player, T]` 更贴切；每帧变化的大量数据别往全局塞。\n\n## 常见坑\n\n- 官方明示**回合级行为可能变化**，别把\"回合结束自动清空\"当保证，需要重置就显式重置。\n- `weak_map` 的键是弱引用，取值是可失败操作，统一用 `Map[Key] or 默认值` 的写法最稳。\n\n## 相关页面\n\n- [GetSession](getsession.md) —— 拿实例\n- [session_environment](session_environment.md)\n- [Verse 核心的 weak_map](../010_Verse/weak_map.md)\n", "01_Verse.org/100_Simulation/team.md": "---\nname: team\nslug: versedotorg/simulation/team\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/team\nkind: class\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# team 🟩【A级·常用】\n\n> team represents a team in the experience.\n> team 表示对局中的一支队伍。\n\n## 这是什么\n\n`team` 是\"队伍\"的抽象标识。它自身没有成员，作用是作为身份被其他 API 接收/返回：拿某玩家所在队伍、比较两个玩家是否同队、按队伍分组处理。队伍的实际划分与设置通常由对局设置/设备完成，Verse 里只做查询与判断。\n\n## 签名\n\n```verse\nteam<public><epic_internal> := class<epic_internal>:\n    # 无自有成员\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Fortnite.com/Game }   # GetPlayspace / GetTeams 所在\n\n# 两名玩家是否同队\nSameTeam(A:agent, B:agent):logic =\n    TA := A.GetTeam[]   # 可失败：取不到则失败\n    TB := B.GetTeam[]\n    TA = TB             # 队伍实例相等比较\n```\n\n## 常用成员\n\n| 名称 | 形式 | 说明 | 级别 |\n|---|---|---|---|\n| `Agent.GetTeam[]` | 可失败扩展 | 取参与者所在队伍 | 🟩 A |\n| `GetPlayspace().GetTeams()` | 常配 | 对局全部队伍 | 🟩 A |\n\n## 何时用 / 何时不用\n\n- 用：分队玩法、队伍计分、判断敌我。\n- 不用：想\"创建/解散队伍\"——队伍结构由对局设置决定，Verse 只读。\n\n## 常见坑\n\n- 取队伍一律是可失败操作（`GetTeam[]`），要写在失败上下文里。\n- 队伍数量因对局设置而异，别假设只有两队。\n\n## 相关页面\n\n- [agent](agent.md) / [player](player.md) —— 队伍的成员\n- [session](session.md) —— 按队伍存全局数据\n", "01_Verse.org/100_Simulation/editable_slider.md": "---\nname: editable_slider\nslug: versedotorg/simulation/editable_slider\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/editable_slider\nkind: class\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# editable_slider 🟦【S级·核心】\n\n> Parametric type that exposes a slider in the editor's Details panel.\n> 参数化类型：在详情面板上暴露一个滑条（拖动取值的数字控件）。\n\n## 签名\n\n```verse\neditable_slider<public>(t:any) := class<concrete>(editable_object):\n    # 参数 t 常用 int 或 float\n```\n\n## 这是什么\n\n[editable_number](editable_number.md) 的滑条版：面板上显示为可拖动滑条，适合\"在连续范围内调感觉\"的参数——音量、角度、速度、透明度。声明方式与读取函数完全同 editable_number，只是外观与交互不同。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Fortnite.com/Devices }\n\nmusic_device := class(creative_device):\n\n    @editable\n    Volume : editable_slider = editable_slider{Default := 0.8, Min := 0.0, Max := 1.0}\n\n    OnBegin<override>()<suspends>:void =\n        Print(\"音量 = {Volume.GetCurrentValue()}\")\n```\n\n## 常用成员\n\n| 成员 | 签名 | 说明 | 级别 |\n|---|---|---|---|\n| `GetCurrentValue` | `():t` | 取滑条当前值 | 🟦 S |\n| `Default` / `Min` / `Max` | 属性 | 默认值与滑条范围 | 🟦 S |\n\n## 何时用 / 何时不用\n\n- 用：连续量、需要\"试着拖\"的参数。\n- 不用：离散选项（3 种模式、5 档难度）——那应该用枚举型 editable 或下拉。\n\n## 常见坑\n\n- 滑条精度受面板显示位数影响，要求精确整数时用 editable_number(int)。\n\n## 相关页面\n\n- [editable_number](editable_number.md) —— 数字输入版\n- [editable_vector_slider](editable_vector_slider.md)\n", "01_Verse.org/100_Simulation/editable_number.md": "---\nname: editable_number\nslug: versedotorg/simulation/editable_number\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/editable_number\nkind: class\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# editable_number 🟦【S级·核心】\n\n> Parametric type that exposes a numeric field in the editor's Details panel.\n> 参数化类型：在 UEFN 详情面板上暴露一个可编辑的数字输入框。\n\n## 签名\n\n```verse\neditable_number<public>(t:any) := class<concrete>(editable_object):\n    # 参数 t 决定数字类型，常用 int 或 float\n```\n\n## 这是什么\n\n写\"自定义设备\"的核心模式：把类成员声明成 `@editable` 的 `editable_number`，编辑器右侧详情面板就会出现一个数字框，关卡作者不写代码就能调这个值。`t` 填 `int` 就是整数框，填 `float` 就是小数框。\n\n配套读取函数 `GetCurrentValue()`（返回 t 类型）取用户填的值。同一族的还有 [editable_slider](editable_slider.md)（滑条）、[editable_vector_number](editable_vector_number.md)/[editable_vector_slider](editable_vector_slider.md)（三维向量）。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Fortnite.com/Devices }\n\n# 一个可调\"节拍间隔\"的自定义设备\nbeat_device := class(creative_device):\n\n    @editable\n    Interval : editable_number = editable_number{Default := 0.5, Min := 0.1, Max := 5.0}\n\n    var BeatClock : beat_clock = beat_clock{}\n\n    OnBegin<override>()<suspends>:void =\n        IntervalNumber := Interval.GetCurrentValue()   # float\n        Print(\"节拍间隔 = {IntervalNumber}\")\n```\n\n## 常用成员\n\n| 成员 | 签名 | 说明 | 级别 |\n|---|---|---|---|\n| `GetCurrentValue` | `():t` | 取详情面板当前值 | 🟦 S |\n| `Default` / `Min` / `Max` | 属性 | 声明处设置默认值与范围 | 🟦 S |\n\n## 何时用 / 何时不用\n\n- 用：任何想让别人\"不写代码就能调\"的参数：数量、间隔、概率、阈值。\n- 不用：运行中要变的值——editable 是\"关卡作者在编辑器里调\"的入口，运行时请用 `var`。\n\n## 常见坑\n\n- 忘写 `@editable` 特性，面板上就不会出现这个字段。\n- `Min/Max` 只约束面板输入，代码里仍要防范越界值。\n\n## 相关页面\n\n- [editable_slider](editable_slider.md) —— 同族滑条版\n- [creative_device](../../../03_Fortnite.com/070_Devices/creative_device.md) —— editable 的宿主基类\n", "01_Verse.org/100_Simulation/editable_vector_slider.md": "---\nname: editable_vector_slider\nslug: versedotorg/simulation/editable_vector_slider\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/editable_vector_slider\nkind: class\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# editable_vector_slider 🟩【A级·常用】\n\n> Parametric type that exposes three sliders (X/Y/Z) in the Details panel.\n> 参数化类型：详情面板上暴露 X/Y/Z 三条滑条。\n\n## 签名\n\n```verse\neditable_vector_slider<public>(t:any) := class<concrete>(editable_object):\n    # 参数 t 常用 int 或 float\n```\n\n## 这是什么\n\n[editable_vector_number](editable_vector_number.md) 的滑条版：三个分量各一条滑条，适合在范围内\"拖出感觉\"的向量参数（如风向强度、颜色分量配合使用时）。用法与读取函数与 editable_vector_number 完全一致。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Verse.org/SpatialMath }\n\nwind := class(creative_device):\n\n    @editable\n    Strength : editable_vector_slider = editable_vector_slider{Default := vector3{Up := 1.0}}\n\n    OnBegin<override>()<suspends>:void =\n        Print(\"风力向量 = {Strength.GetCurrentValue()}\")\n```\n\n## 常用成员\n\n| 成员 | 签名 | 说明 | 级别 |\n|---|---|---|---|\n| `GetCurrentValue` | `():vector3` | 取当前向量 | 🟩 A |\n| `Default` / `Min` / `Max` | 属性 | 默认值与滑条范围 | 🟩 A |\n\n## 何时用 / 何时不用\n\n- 用：连续可调的三维量。\n- 不用：需要精确键入的坐标——用 editable_vector_number。\n\n## 相关页面\n\n- [editable_vector_number](editable_vector_number.md)\n- [editable_slider](editable_slider.md)\n", "01_Verse.org/100_Simulation/editable_vector_number.md": "---\nname: editable_vector_number\nslug: versedotorg/simulation/editable_vector_number\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/editable_vector_number\nkind: class\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# editable_vector_number 🟩【A级·常用】\n\n> Parametric type that exposes a 3-component vector field in the Details panel.\n> 参数化类型：在详情面板暴露一个三维向量输入（X/Y/Z 三个数字框）。\n\n## 签名\n\n```verse\neditable_vector_number<public>(t:any) := class<concrete>(editable_object):\n    # 参数 t 常用 int 或 float\n```\n\n## 这是什么\n\n[editable_number](editable_number.md) 的三维版：一次编辑三个分量，常用于\"偏移量\"\"缩放\"\"速度方向\"这类向量参数。读取 `GetCurrentValue()` 返回 [vector3](../130_SpatialMath/vector3.md)（t 为 float 时）。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\nusing { /Verse.org/SpatialMath }\n\nmover := class(creative_device):\n\n    @editable\n    Offset : editable_vector_number = editable_vector_number{Default := vector3{Up := 100.0}}\n\n    OnBegin<override>()<suspends>:void =\n        V := Offset.GetCurrentValue()\n        Print(\"向上偏移 {V.Up}\")\n```\n\n## 常用成员\n\n| 成员 | 签名 | 说明 | 级别 |\n|---|---|---|---|\n| `GetCurrentValue` | `():vector3` | 取当前向量（t=float 时） | 🟩 A |\n| `Default` / `Min` / `Max` | 属性 | 默认值与范围（按分量生效） | 🟩 A |\n\n## 何时用 / 何时不用\n\n- 用：位置偏移、方向、比例等成组出现的三个数。\n- 不用：三个数含义独立（比如\"血量/护盾/能量\"）——拆成三个 editable_number 语义更清楚。\n\n## 常见坑\n\n- `t=int` 时各分量取整，做精确位移请用 float。\n\n## 相关页面\n\n- [editable_vector_slider](editable_vector_slider.md)\n- [vector3](../130_SpatialMath/vector3.md)\n", "01_Verse.org/100_Simulation/getsession.md": "---\nname: GetSession\nslug: versedotorg/simulation/getsession\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/getsession\nkind: function\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# GetSession 🟩【A级·常用】\n\n> Returns the session corresponding to the current round.\n> 返回当前回合对应的 session 实例。\n\n## 签名\n\n```verse\nGetSession<public><native>():session<transacts>\n```\n\n## 这是什么\n\n`session` 类没有公开构造方式，全局唯一的实例就靠这个函数拿。它最重要的用法不是\"用 session 做什么\"，而是\"**用 session 当 key**\"：配合 `weak_map[session, T]` 实现跨脚本的全局状态。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\n\nvar Visited:weak_map[session, logic] = map{}\n\nMarkVisited():void =\n    if (set Visited[GetSession()] = true) {}\n\nWasVisited():logic =\n    Visited[GetSession()] or false\n```\n\n## 何时用 / 何时不用\n\n- 用：需要全局单例 key 的每一处；判断\"这局\"级别的状态。\n- 不用：它不提供回合信息本身（如剩余时间），那是 round 设置/设备的事。\n\n## 常见坑\n\n- 官方注明未来可能变为\"每局一个实例\"，不要依赖\"每回合换实例\"来自动清状态。\n\n## 相关页面\n\n- [session](session.md) —— 类型本体与标准用法\n- [GetSimulationElapsedTime](getsimulationelapsedtime.md)\n", "01_Verse.org/100_Simulation/sleep.md": "---\nname: Sleep\nslug: versedotorg/simulation/sleep\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/sleep\nkind: function\nmodule: /Verse.org/Simulation\ngrade: S\ndepth: full\nstatus: done\n---\n\n# Sleep 🟦【S级·核心】\n\n> Waits specified number of seconds and then resumes.\n> 暂停当前协程指定秒数，然后从暂停处继续执行。\n\n## 签名\n\n```verse\nSleep<public><native>(Seconds:float)<transacts><suspends><no_rollback>:void\n```\n\n## 这是什么\n\nSleep 是 Verse 里\"等待\"的基本手段。它只暂停**当前这条协程**，不影响其他协程和对局本身的运行。任何被标记 `<suspends>` 的函数（比如 `OnBegin<override>()<suspends>`）里都可以直接调用。倒计时、间隔刷怪、节拍等待、让子弹飞一会儿——都从它开始。\n\n参数 `Seconds` 有三个特殊值，官方明确定义了不同行为：\n\n| 取值 | 行为 |\n|---|---|\n| `Seconds > 0` | 等待指定秒数后继续 |\n| `Seconds = 0.0` | 等到**下一帧**（tick）才继续，并把执行权让给其他协程 |\n| `Seconds = Inf` | 永远等待，只有被 `race` 等机制取消时才会返回 |\n| `Seconds < 0` | 立即完成，且**不让出**执行权给其他协程 |\n\n## 最小示例\n\n```verse\n# 每 0.5 秒打印一次节拍，共 8 拍（节奏游戏的\"节拍器\"雏形）\nCountdown()<suspends>:void =\n    for (Beat := 0..7):\n        Sleep(0.5)\n        Print(\"♪ 第 {Beat} 拍\")\n\n# 每帧做一次事：Sleep(0.0) 让出执行权，避免死循环卡死对局\nEveryFrame()<suspends>:void =\n    loop:\n        DoWork()\n        Sleep(0.0)   # 等到下一帧再继续\n```\n\n## 何时用 / 何时不用\n\n- 用：协程内的定时等待、节流、等待下一帧、制造\"永不结束\"的守卫任务（`Sleep(Inf)` 常放在 `race` 的陪跑分支里）。\n- 不用：需要\"到点自动回调\"而不想占住一条协程时，用 [event](../010_Verse/event.md) 的 `Await()` 或 listenable 的 `Subscribe()` 更合适。\n\n## 常见坑\n\n- 只能在 `<suspends>` 上下文里调用；在普通函数里写 `Sleep` 会直接编译错误。\n- `Sleep(0.0)` 和 `Sleep(0.001)` 不同：前者是\"下一帧\"，后者是真实计时等待。\n- 循环里忘写 `Sleep` 会把协程跑成死循环，冻结该协程所在的执行流。\n\n## 相关页面\n\n- [GetSimulationElapsedTime](getsimulationelapsedtime.md) —— 拿\"世界时间\"做计时\n- [event](../010_Verse/event.md) —— 事件驱动的另一种等待方式\n- [agent](agent.md) —— 常与 Sleep 组成\"对每个玩家轮流做什么\"的循环\n", "01_Verse.org/100_Simulation/getsimulationelapsedtime.md": "---\nname: GetSimulationElapsedTime\nslug: versedotorg/simulation/getsimulationelapsedtime\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/getsimulationelapsedtime\nkind: function\nmodule: /Verse.org/Simulation\ngrade: A\ndepth: full\nstatus: done\n---\n\n# GetSimulationElapsedTime 🟩【A级·常用】\n\n> Get the seconds that have elapsed since the world began simulating.\n> 获取世界开始模拟以来经过的秒数（世界时间）。\n\n## 签名\n\n```verse\nGetSimulationElapsedTime<public><native>():float<transacts>\n```\n\n## 这是什么\n\n返回一个不断增长的秒数（世界时钟）。和 `Sleep(t)` 配合可以做\"每次循环剩余多少秒\"的节流，和上一帧时间差分可以算帧间隔——做音乐同步、按时间驱动的玩法（比如节拍调度）时它是你的基准钟。\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation }\n\n# 按 0.5 秒一拍调度，不受循环体耗时影响（时钟驱动而非\"睡够\"驱动）\nvar NextBeat:float = 0.0\nBeatLoop()<suspends>:void =\n    loop:\n        Now := GetSimulationElapsedTime()\n        if (Now >= NextBeat):\n            PlayBeat()\n            set NextBeat += 0.5\n        Sleep(0.0)   # 下一帧再来\n```\n\n## 何时用 / 何时不用\n\n- 用：计时基准、帧间隔计算、时间驱动的调度器。\n- 不用：想\"等一段时间\"直接用 [Sleep](sleep.md)，不要写 `loop + 比较` 模拟 Sleep。\n\n## 常见坑\n\n- 它是\"世界模拟时间\"，不是现实墙钟；对局暂停/未开始时的行为以实际表现为准，别拿它当 UTC 时间（那是 [GetSecondsSinceEpoch](../010_Verse/getsecondssinceepoch.md)）。\n\n## 相关页面\n\n- [Sleep](sleep.md)\n- [GetSession](getsession.md)\n", "01_Verse.org/100_Simulation/session_environment.md": "---\nname: session_environment\nslug: versedotorg/simulation/session_environment\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/session_environment\nkind: enum\nmodule: /Verse.org/Simulation\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# session_environment 🟨【B级·进阶】\n\n> Specifies what type of environment the current session is in.\n> 指明当前对局处于什么环境（编辑 / 私人 / 线上）。\n\n## 这是什么\n\n配合 [session](session.md) 判断\"现在这段代码跑在哪\"：编辑器里试玩、私人测试局、正式上线局，可以走不同逻辑（比如只在正式局里上报数据）。\n\n## 签名\n\n```verse\nsession_environment<public><native> := enum:\n    Edit     # 编辑环境（如 UEFN 内启动的会话）\n    Private  # 私人环境（如试玩测试局）\n    Live     # 线上正式环境\n```\n\n## 最小示例\n\n```verse\nif (SessionInfo := GetSession().GetSessionEnvironment?):\n    Print(\"当前环境: {SessionInfo}\")\n```\n\n## 相关页面\n\n- [session](session.md)\n", "01_Verse.org/100_Simulation/010_Tags/_overview.md": "---\nname: Tags\nslug: versedotorg/simulation/tags\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags\nkind: module\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: brief\nstatus: done\n---\n\n# Tags（标签系统）🟩【A级·常用】\n\n> 官网对本子模块无单独描述；本页为模块总览。\n> Tags 提供一个通用\"标签\"系统：给对象打上字符串层级标签（如 `Door.Locked`），之后按标签查询、过滤、分组。\n\n## 这是什么\n\n标签是层级式的：`\"A.1\"` 被视为 `\"A\"` 的子标签，查询父标签会命中子标签（`{\"A.1\"}.Has(\"A\")` 为真，反之不然）。给实体/组件实现 [has_tags](has_tags.md) 接口后即可打标与查询；[tag_view](tag_view.md) 提供只读查询视图；[tag_search_criteria](tag_search_criteria.md) 描述\"按什么条件搜\"。\n\n## 使用前提\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n```\n\n## 成员一览\n\n| 成员 | 类型 | 一句话 | 级别 |\n|---|---|---|---|\n| [tag](tag.md) | 类 | 标签类型本体 | 🟩 A |\n| [tag_key](tag_key.md) | 类 | 一次打标返回的句柄，用于精确移除 | 🟩 A |\n| [has_tags](has_tags.md) | 接口 | \"可以打标\"的能力契约 | 🟩 A |\n| [tag_view](tag_view.md) | 类 | 只读查询视图（Has/HasAny/HasAll） | 🟩 A |\n| [tag_search_criteria](tag_search_criteria.md) | 类 | 搜索条件描述 | 🟨 B |\n| [tag_search_sort_type](tag_search_sort_type.md) | 枚举 | 搜索结果排序方式 | ⬜ C |\n\n## 相关页面\n\n- [Simulation 总览](../_overview.md)\n", "01_Verse.org/100_Simulation/010_Tags/tag.md": "---\nname: tag\nslug: versedotorg/simulation/tags/tag\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag\nkind: class\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: full\nstatus: done\n---\n\n# tag 🟩【A级·常用】\n\n> tag is a classification that can be added to objects to identify, filter, or group them.\n> tag 是一种可加到对象上的\"分类标记\"，用于识别、过滤、分组对象。\n\n## 这是什么\n\n`tag` 是标签系统的类型本体。标签值为层级字符串：`\"Enemy.Ranged\"` 属于 `\"Enemy\"`。它通常以 `tag{}` 实例配合 [has_tags](has_tags.md) 接口使用：先 AddTag 打标，再用 [tag_view](tag_view.md) 或搜索接口按标签找对象。\n\n## 签名\n\n```verse\ntag<public> := class<concrete>:\n    # 标签实例；层级语义由字符串值决定\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n\nvar Tags:weak_map[session, tag] = map{}\n\nMakeEnemyTag():tag =\n    tag{}   # 具体标签值由使用场景的 API 决定\n```\n\n## 何时用 / 何时不用\n\n- 用：给一批对象做\"逻辑分组\"，之后按组批量操作。\n- 不用：对象已能用引用直接访问时，不必绕道标签。\n\n## 常见坑\n\n- 标签匹配是**层级向下**的：父标签查询命中子标签，子标签查询不命中父标签。\n\n## 相关页面\n\n- [has_tags](has_tags.md) —— 打标/查询入口\n- [tag_view](tag_view.md) —— 查询视图\n", "01_Verse.org/100_Simulation/010_Tags/tag_key.md": "---\nname: tag_key\nslug: versedotorg/simulation/tags/tag_key\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag_key\nkind: class\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: full\nstatus: done\n---\n\n# tag_key 🟩【A级·常用】\n\n> A key returned by AddTag that uniquely identifies one added tag instance.\n> AddTag 返回的句柄，唯一标识\"某一次打的标签\"，用于精确移除。\n\n## 这是什么\n\n每次调用 `AddTag` 都会返回一个 `tag_key`。同一对象打了三个同类型标签就有三个不同的 key。想摘掉**其中某一个**（而不是按类型全清）时，把对应的 key 传给 `RemoveTag`。它本身没有成员，是一个\"取牌凭证\"。\n\n## 签名\n\n```verse\ntag_key<public><native> := class<native>:\n    # 无自有成员\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n\nvar MyKeys:[]tag_key = array{}\n\nStamp(Obj:has_tags):void =\n    Key := Obj.AddTag(TempTag)\n    set MyKeys += array{Key}     # 留着 key，之后可精确撤销\n\nUnstamp(Obj:has_tags):void =\n    for (K : MyKeys):\n        Obj.RemoveTag(K)\n```\n\n## 何时用 / 何时不用\n\n- 用：需要\"撤销某一次打标\"的场合（临时状态标记）。\n- 不用：只想按类型整体清空时直接 `RemoveAllTags[TagType]`，不必保存 key。\n\n## 相关页面\n\n- [has_tags](has_tags.md) —— AddTag/RemoveTag\n- [tag](tag.md)\n", "01_Verse.org/100_Simulation/010_Tags/tag_search_criteria.md": "---\nname: tag_search_criteria\nslug: versedotorg/simulation/tags/tag_search_criteria\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag_search_criteria\nkind: class\nmodule: /Verse.org/Simulation/Tags\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# tag_search_criteria 🟨【B级·进阶】\n\n> Describes the criteria used when searching for tagged objects.\n> 描述\"按标签搜索对象\"时的条件（搜什么、怎么匹配）。\n\n## 这是什么\n\n配合标签搜索接口使用：声明要找的标签、匹配方式（层级/精确）等条件，交给搜索调用返回符合的对象集合。一般与 [tag_search_sort_type](tag_search_sort_type.md) 一起构成一次完整搜索请求。\n\n## 签名\n\n```verse\ntag_search_criteria<public><native> := class<native>:\n```\n\n## 相关页面\n\n- [tag](tag.md)\n- [has_tags](has_tags.md)\n", "01_Verse.org/100_Simulation/010_Tags/has_tags.md": "---\nname: has_tags\nslug: versedotorg/simulation/tags/has_tags\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/has_tags\nkind: interface\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: full\nstatus: done\n---\n\n# has_tags 🟩【A级·常用】\n\n> Interface for containers that can hold tag instances.\n> \"可持有标签\"的接口：实现了它的对象就能打标、查标、摘标。\n\n## 这是什么\n\n这是标签系统的能力契约：只要对象实现了 `has_tags`，就能对它调用下面这组函数。SceneGraph 的实体/组件体系中的可标签对象都实现了它。`AddTag` 返回 [tag_key](tag_key.md)，想精确摘掉某一次打的标就留着这个 key。\n\n## 签名\n\n```verse\nhas_tags<public><native> := interface<native>:\n```\n\n## 常用成员（函数）\n\n| 函数 | 说明（官方描述编译） | 级别 |\n|---|---|---|\n| `AddTag(Tag)` | 加一个标签实例，返回唯一 tag_key | 🟩 A |\n| `RemoveTag(Key)` | 按 tag_key 摘标；摘掉成功否则失败 | 🟩 A |\n| `RemoveAllTags[TagType]` | 摘掉该类型的全部标签 | 🟩 A |\n| `RemoveAllTagsExcept[TagType]` | 摘掉除指定类型外的全部标签（有两个重载：单类型/类型数组） | 🟨 B |\n| `ContainsTag[TagType]` | 是否含至少一个该类型标签（可失败） | 🟩 A |\n| `ContainsAllTags[TagTypes]` | 是否全部包含（空数组视为成功） | 🟩 A |\n| `ContainsAnyTag[TagTypes]` | 是否包含任一（空数组视为失败） | 🟩 A |\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n\nUnlock(Obj:has_tags):void =\n    if (Obj.ContainsTag[LockTag]):\n        Obj.RemoveAllTags[LockTag]   # 摘掉\"上锁\"标签\n```\n\n## 常见坑\n\n- `Contains*` 是可失败查询，要写在 `if` 等失败上下文里。\n- 精确移除某次打标用 `RemoveTag(AddTag 返回的 key)`；按类型清用 `RemoveAllTags`。\n\n## 相关页面\n\n- [tag](tag.md) / [tag_key](tag_key.md)\n- [tag_view](tag_view.md) —— 只读查询视图\n", "01_Verse.org/100_Simulation/010_Tags/tag_view.md": "---\nname: tag_view\nslug: versedotorg/simulation/tags/tag_view\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag_view\nkind: class\nmodule: /Verse.org/Simulation/Tags\ngrade: A\ndepth: full\nstatus: done\n---\n\n# tag_view 🟩【A级·常用】\n\n> A read-only view for checking tags, with hierarchical matching.\n> 标签的只读查询视图，支持层级匹配。\n\n## 这是什么\n\n`tag_view` 把一组标签包装成\"只读查询对象\"，提供 `Has / HasAny / HasAll` 三个判断函数。与 `has_tags` 的 `Contains*` 相比，它显式支持**父标签命中子标签**的层级规则，官方文档直接给出了判定示例。\n\n## 签名\n\n```verse\ntag_view<public><native> := class<native>:\n```\n\n## 常用成员\n\n| 函数 | 语义（官方示例编译） | 级别 |\n|---|---|---|\n| `Has(TagToCheck)` | `{\"A.1\"}.Has(\"A\")` → true；`{\"A\"}.Has(\"A.1\")` → false；无效参数恒 false | 🟩 A |\n| `HasAny(InTags)` | 任一命中即真；`InTags` 为空恒 false | 🟩 A |\n| `HasAll(InTags)` | 全部命中才真；`InTags` 为空恒 true | 🟩 A |\n\n## 最小示例\n\n```verse\nusing { /Verse.org/Simulation/Tags }\n\nIsHostile(View:tag_view):logic =\n    View.Has(EnemyTag)     # \"Enemy.Ranged\" 也会命中 \"Enemy\"\n```\n\n## 相关页面\n\n- [has_tags](has_tags.md)\n- [tag](tag.md)\n", "01_Verse.org/100_Simulation/010_Tags/tag_search_sort_type.md": "---\nname: tag_search_sort_type\nslug: versedotorg/simulation/tags/tag_search_sort_type\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/simulation/tags/tag_search_sort_type\nkind: enum\nmodule: /Verse.org/Simulation/Tags\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# tag_search_sort_type ⬜【C级·参考】\n\n> Specifies how tag search results are ordered.\n> 指定标签搜索结果的排序方式；配合 [tag_search_criteria](tag_search_criteria.md) 使用。\n", "01_Verse.org/110_Assets/_overview.md": "---\nname: Assets\nslug: versedotorg/assets\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets\nkind: module\nmodule: /Verse.org\ngrade: A\ndepth: brief\nstatus: placeholder\n---\n\n# Assets 🟩【A级·常用】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "01_Verse.org/110_Assets/animation_sequence.md": "---\nname: animation_sequence\nslug: versedotorg/assets/animation_sequence\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/animation_sequence\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# animation_sequence 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/assets/animation_sequence.html -->\n", "01_Verse.org/110_Assets/material.md": "---\nname: material\nslug: versedotorg/assets/material\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/material\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# material 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/assets/material.html -->\n", "01_Verse.org/110_Assets/particle_system.md": "---\nname: particle_system\nslug: versedotorg/assets/particle_system\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/particle_system\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# particle_system 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/assets/particle_system.html -->\n", "01_Verse.org/110_Assets/mesh.md": "---\nname: mesh\nslug: versedotorg/assets/mesh\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/mesh\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# mesh 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/assets/mesh.html -->\n", "01_Verse.org/110_Assets/sound_wave.md": "---\nname: sound_wave\nslug: versedotorg/assets/sound_wave\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/assets/sound_wave\nkind: class\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: place : placeholder\n---\n\n# MakeColorAlpha 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/colors/makecoloralpha.html -->\n", "01_Verse.org/120_Colors/over.md": "---\nname: Over\nslug: versedotorg/colors/over\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/colors/over\nkind: function\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Over 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/colors/over.html -->\n", "01_Verse.org/120_Colors/010_NamedColors/_overview.md": "---\nname: NamedColors\nslug: versedotorg/colors/namedcolors\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/colors/namedcolors\nkind: module\nmodule: /Verse.org\ngrade: C\ndepth: brief\nstatus: placeholder\n---\n\n# NamedColors ⬜【C级·参考】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "01_Verse.org/130_SpatialMath/_overview.md": "---\nname: SpatialMath\nslug: versedotorg/spatialmath\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath\nkind: module\nmodule: /Verse.org\ngrade: A\ndepth: brief\nstatus: placeholder\n---\n\n# SpatialMath 🟩【A级·常用】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "01_Verse.org/130_SpatialMath/rotation.md": "---\nname: rotation\nslug: versedotorg/spatialmath/rotation\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath/rotation\nkind: class\nmodule: /Verse.org/SpatialMath\ngrade: S\ndepth: full\nstatus: done\n---\n\n# rotation 🟦【S级·核心】\n\n> 三维旋转（四元数表示的 struct）；实体\"朝向\"的统一类型。\n\n## 这是什么\n\n`rotation` 表示空间中的旋转。它是无公开分量的 struct——**全部通过模块级工厂函数构造**，不直接操纵内部数据：\n\n- 按欧拉角：`MakeRotationFromEulerDegrees(Pitch, Yaw, Roll)`（以及 Radians/FromYawPitchRoll 变体）\n- 朝向某方向：配合 vector3 使用 `MakeShortestRotationBetween`\n- 单位旋转：`IdentityRotation()`\n\n组合与插值：`A * B` 依次施加旋转，`Slerp` 球面插值（平滑转身）。与 [vector3](vector3.md) 相乘可旋转一个向量。\n\n## 签名\n\n```verse\nrotation<public><native> := struct:\n    # 无公开数据成员；经工厂函数构造\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/SpatialMath }\n\nFaceEast():rotation =\n    MakeRotationFromEulerDegrees(0.0, 90.0, 0.0)   # Pitch=0, Yaw=90°, Roll=0\n\nHalfTurn():rotation =\n    Slerp(IdentityRotation(), FaceEast(), 0.5)     # 中间朝向\n```\n\n## 常用配套函数\n\n| 函数 | 说明 | 级别 |\n|---|---|---|\n| `MakeRotationFromEulerDegrees(P,Y,R)` | 最常用构造 | 🟦 S |\n| `IdentityRotation()` | 单位旋转 | 🟦 S |\n| `MakeRotationFromYawPitchRollDegrees` | 仅 yaw/pitch/roll 的变体 | 🟩 A |\n| `Slerp(A, B, t)` | 球面插值 | 🟨 B |\n| `MakeShortestRotationBetween` | 最短转向 | 🟨 B |\n| `AngularDistanceDegrees` | 夹角 | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：设置实体朝向、相机转向、转向插值动画。\n- 不用：只有位置没有朝向的改动用 vector3 就够。\n\n## 常见坑\n\n- 欧拉角单位分 Degrees/Radians 两套函数，混用是常见错误源——工程内统一用 Degrees。\n- 旋转组合 `A * B` 的先后顺序有语义（先 B 后 A），直觉不确定时小步验证。\n\n## 相关页面\n\n- [vector3](vector3.md)\n- [transform](rotation.md) 同族：transform = 位置＋旋转＋缩放（见 SpatialMath 总览）\n", "01_Verse.org/130_SpatialMath/transform.md": "---\nname: transform\nslug: versedotorg/spatialmath/transform\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath/transform\nkind: class\nmodule: /Verse.org\ngrade: S\ndepth: full\nstatus: placeholder\n---\n\n# transform 🟦【S级·核心】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/spatialmath/transform.html -->\n", "01_Verse.org/130_SpatialMath/vector3.md": "---\nname: vector3\nslug: versedotorg/spatialmath/vector3\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath/vector3\nkind: class\nmodule: /Verse.org/SpatialMath\ngrade: S\ndepth: full\nstatus: done\n---\n\n# vector3 🟦【S级·核心】\n\n> 三维向量：位置、方向、偏移的统一表示。\n\n## 这是什么\n\n所有 3D 空间计算的基本单位。**当前版本的分量名是 Left / Up / Forward**（官方标注由旧坐标轴 -Y/Z/X 更名而来）——这是和旧教程/旧代码最大的差异点，老代码里的 `.X/.Y/.Z` 要按语义映射成 `Left/Up/Forward`。\n\n向量是 struct（值拷贝语义），支持 `+ - * /` 运算符与一组模块级函数（距离、点积、叉积、插值等，见 SpatialMath 总览）。\n\n## 签名\n\n```verse\nvector3<public><native> := struct:\n    Left<float>       # 左方向分量（旧 -Y）\n    Up<float>         # 上方向分量（旧 Z）\n    Forward<float>    # 前方向分量（旧 X）\n```\n\n## 最小示例\n\n```verse\nusing { /Verse.org/SpatialMath }\n\nOrigin := vector3{Left := 0.0, Up := 0.0, Forward := 0.0}\nTarget := vector3{Forward := 100.0, Up := 50.0}\n\nDist := Distance(Origin, Target)        # 模块级函数\nShifted := Target + vector3{Up := 2.0}  # 向上平移 2 单位\n```\n\n## 常用成员 / 配套函数\n\n| 名称 | 说明 | 级别 |\n|---|---|---|\n| `Left` / `Up` / `Forward` | 三分量 | 🟦 S |\n| `Distance` / `DistanceSquared` | 两点距离 | 🟩 A |\n| `DotProduct` / `CrossProduct` | 点积/叉积 | 🟩 A |\n| `Lerp` | 线性插值（平滑移动常用） | 🟩 A |\n| `operator'+' '-' '*'` | 向量运算符 | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：坐标、方向、速度、偏移量。\n- 不用：纯 2D 界面布局——UI 用自己的对齐系统，别拿向量硬算。\n\n## 常见坑\n\n- **分量名不是 X/Y/Z**；看到老代码 `.X` 要翻译成 `.Forward`（语义对应，不是位置对应）。\n- struct 拷贝语义：`B := A` 后改 `B.Up` 不影响 A。\n\n## 相关页面\n\n- [rotation](rotation.md)\n- [transform_component](../040_SceneGraph/transform_component.md) —— 向量的消费方\n", "01_Verse.org/130_SpatialMath/makerotationradians.md": "---\nname: MakeRotationRadians\nslug: versedotorg/spatialmath/makerotationradians\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath/makerotationradians\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# MakeRotationRadians 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/spatialmath/makerotationradians.html -->\n", "01_Verse.org/130_SpatialMath/makerotationdegrees.md": "---\nname: MakeRotationDegrees\nslug: versedotorg/spatialmath/makerotationdegrees\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath/makerotationdegrees\nkind: function\nmodule: /Verse.org\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# MakeRotationDegrees 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/spatialmath/makerotationdegrees.html -->\n", "01_Verse.org/130_SpatialMath/makerotationfromyawpitchrollradians.md": "---\nname: MakeRotationFromYawPitchRollRadians\nslug: versedotorg/spatialmath/makerotationfromyawpitchrollradians\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/spatialmath/makerotationfromyawpitchro om\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# client 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/webapi/client.html -->\n", "02_UnrealEngine.com/040_WebAPI/response.md": "---\nname: response\nslug: unrealenginedotcom/webapi/response\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/webapi/response\nkind: class\nmodule: /UnrealEngine.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# response 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/webapi/response.html -->\n", "02_UnrealEngine.com/040_WebAPI/body_response.md": "---\nname: body_response\nslug: unrealenginedotcom/webapi/body_response\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/webapi/body_response\nkind: class\nmodule: /UnrealEngine.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# body_response 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/webapi/body_response.html -->\n", "02_UnrealEngine.com/040_WebAPI/makeclient.md": "---\nname: MakeClient\nslug: unrealenginedotcom/webapi/makeclient\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/webapi/makeclient\nkind: function\nmodule: /UnrealEngine.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# MakeClient 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/webapi/makeclient.html -->\n", "02_UnrealEngine.com/050_Temporary/_overview.md": "---\nname: Temporary\nslug: unrealenginedotcom/temporary\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary\nkind: module\nmodule: /UnrealEngine.com\ngrade: A\ndepth: brief\nstatus: placeholder\n---\n\n# Temporary 🟩【A级·常用】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "02_UnrealEngine.com/050_Temporary/sortby.md": "---\nname: SortBy\nslug: unrealenginedotcom/temporary/sortby\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/sortby\nkind: function\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# SortBy 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/sortby.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/_overview.md": "---\nname: UI\nslug: unrealenginedotcom/temporary/ui\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui\nkind: module\nmodule: /UnrealEngine.com\ngrade: S\ndepth: brief\nstatus: placeholder\n---\n\n# UI 🟦【S级·核心】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/player_ui.md": "---\nname: player_ui\nslug: unrealenginedotcom/temporary/ui/player_ui\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/player_ui\nkind: class\nmodule: /UnrealEngine.com/Temporary/UI\ngrade: S\ndepth: full\nstatus: done\n---\n\n# player_ui 🟦【S级·核心】\n\n> Per-player UI root: add/remove widgets on a specific player's screen.\n> 每个玩家一块的 UI 根画布：往指定玩家的屏幕上加控件、拆控件。\n\n## 这是什么\n\n Temporary/UI 的入口类。每个 [player](../../../01_Verse.org/100_Simulation/player.md) 对应一个 `player_ui` 实例，通过 [GetPlayerUI](getplayerui.md) 获取。它管理两件事：\n\n- **挂载**：`AddWidget(控件)` 把 [widget](widget.md)（canvas/stack_box/button/text…）摆上屏，可选 [player_ui_slot](player_ui_slot.md) 配置；`RemoveWidget` 摘下。\n- **焦点**：`SetFocus` 把键盘/手柄焦点交给某控件（需 focusable）。\n\n注意模块前缀 `Temporary`：这是\"过渡期 UI\"，官方已在 Verse.org 侧推进 Presentation/SceneGraph 体系；但当前版本它仍是写 UI 的主力 API。\n\n## 签名\n\n```verse\nplayer_ui<public><native> := class<native>:\n    AddWidget<public>(Widget:widget)<transacts>:void\n    AddWidget<public>(Widget:widget, Slot:player_ui_slot)<transacts>:void\n    RemoveWidget<public>(Widget:widget)<transacts>:void\n    SetFocus<public>(Widget:widget)<transacts>:void\n```\n\n## 最小示例\n\n```verse\nusing { /UnrealEngine.com/Temporary/UI }\nusing { /Verse.org/Simulation }\n\n# 玩家加入时给他屏幕上挂一个文本控件\nGreet(P:player):void =\n    UI := GetPlayerUI[P]           # 可失败：取玩家 UI\n    NewWidget := widget{}\n    UI.AddWidget(NewWidget)\n```\n\n## 常用成员\n\n| 成员 | 说明 | 级别 |\n|---|---|---|\n| `AddWidget` | 上屏（默认 slot 或自定义 slot 两个重载） | 🟦 S |\n| `RemoveWidget` | 下屏 | 🟦 S |\n| `SetFocus` | 交焦点给控件 | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：记分板、倒计时、商店面板——一切\"画在玩家屏幕上\"的东西。\n- 不用：HUD 提示文字这类简单场景可直接用 hud_message_device；Temporary/UI 控件间搭配见 widget 族。\n\n## 常见坑\n\n- `GetPlayerUI` 是可失败调用（玩家可能还没就绪），务必写失败分支。\n- AddWidget 前构造好的控件树要在**添加前**配置好层级；对已上屏控件的父子改动行为以实测为准。\n\n## 相关页面\n\n- [GetPlayerUI](getplayerui.md) —— 获取实例\n- [widget](widget.md) —— 控件基类\n- [canvas](canvas.md) / [stack_box](stack_box.md) —— 布局容器\n", "02_UnrealEngine.com/050_Temporary/010_UI/widget.md": "---\nname: widget\nslug: unrealenginedotcom/temporary/ui/widget\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/widget\nkind: class\nmodule: /UnrealEngine.com/Temporary/UI\ngrade: S\ndepth: full\nstatus: done\n---\n\n# widget 🟦【S级·核心】\n\n> Base class for all UI widgets.\n> 一切 UI 控件的基类——canvas、按钮、文本……都继承它。\n\n## 这是什么\n\n`widget` 定义了所有控件的公共能力，核心是\"可见性\"与\"可交互性\"：\n\n- `SetVisibility` / `GetVisibility`：显示/隐藏（枚举 [widget_visibility](widget_visibility.md)），**隐藏不等于移除**——控件仍挂在 player_ui 上。\n- `SetEnabled` / `IsEnabled`：允许/禁止玩家交互（按钮变灰）。\n- `GetParentWidget` / `GetRootWidget`：查询控件树位置（不在树上则失败）。\n\n具体长相由子类决定：布局容器（[canvas](canvas.md)、[stack_box](stack_box.md)、[overlay](overlay.md)）、内容（text_block、color_block…）、交互（[button](button.md) 族、[slider_regular](../../../../03_Fortnite.com/010_UI/slider_regular.md)）。\n\n## 签名\n\n```verse\nwidget<public><native> := class<native>:\n    SetVisibility<public>(Visibility:widget_visibility)<transacts>:void\n    GetVisibility<public>()<transacts>:widget_visibility\n    SetEnabled<public>(InEnabled:logic)<transacts>:void\n    IsEnabled<public>()<transacts>:logic\n    GetParentWidget<public>()<transacts><decides>:widget\n    GetRootWidget<public>()<transacts><decides>:widget\n```\n\n## 最小示例\n\n```verse\nusing { /UnrealEngine.com/Temporary/UI }\n\nTogglePanel(Panel:widget, Show:logic):void =\n    Panel.SetEnabled(Show)\n    Panel.SetVisibility(if (Show?) then widget_visibility.Visible else widget_visibility.Hidden)\n```\n\n## 常用成员\n\n| 成员 | 说明 | 级别 |\n|---|---|---|\n| `SetVisibility` / `GetVisibility` | 显隐控制（Hidden≠移除） | 🟦 S |\n| `SetEnabled` / `IsEnabled` | 交互开关 | 🟩 A |\n| `GetRootWidget[]` | 取根控件（可失败） | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：作为成员类型统一持有控件；写\"接收任意控件\"的工具函数。\n- 不用：直接实例化基类没意义——用具体子类。\n\n## 常见坑\n\n- `Hidden` 只是看不见，仍占 slot；真正拿掉要 `RemoveWidget`。\n- 子类构造参数（如文本内容）在构造处设置，widget 基类只管公共行为。\n\n## 相关页面\n\n- [player_ui](player_ui.md) / [GetPlayerUI](getplayerui.md)\n- [canvas](canvas.md) / [stack_box](stack_box.md) / [overlay](overlay.md)\n", "02_UnrealEngine.com/050_Temporary/010_UI/player_ui_slot.md": "---\nname: player_ui_slot\nslug: unrealenginedotcom/temporary/ui/player_ui_slot\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/player_ui_slot\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# player_ui_slot 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/player_ui_slot.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/widget_message.md": "---\nname: widget_message\nslug: unrealenginedotcom/temporary/ui/widget_message\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/widget_message\nkind: class\nmodule: /UnrealEngine.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# widget_message 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/widget_message.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/anchors.md": "---\nname: anchors\nslug: unrealenginedotcom/temporary/ui/anchors\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/anchors\nkind: class\nmodule: /UnrealEngine.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# anchors 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/anchors.html -->\n", "02_UnrealEngine.com/050_Tem \n# canvas_slot 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/canvas_slot.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/color_block.md": "---\nname: color_block\nslug: unrealenginedotcom/temporary/ui/color_block\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/color_block\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# color_block 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/color_block.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/texture_block.md": "---\nname: texture_block\nslug: unrealenginedotcom/temporary/ui/texture_block\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/texture_block\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# texture_block 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/texture_block.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/material_block.md": "---\nname: material_block\nslug: unrealenginedotcom/temporary/ui/material_block\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/material_block\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# material_block 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/material_block.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/overlay.md": "---\nname: overlay\nslug: unrealenginedotcom/temporary/ui/overlay\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/overlay\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# overlay 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/overlay.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/overlay_slot.md": "---\nname: overlay_slot\nslug: unrealenginedotcom/temporary/ui/overlay_slot\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/overlay_slot\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# overlay_slot 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/overlay_slot.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/stack_box.md": "---\nname: stack_box\nslug: unrealenginedotcom/temporary/ui/stack_box\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/stack_box\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# stack_box 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/stack_box.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/stack_box_slot.md": "---\nname: stack_box_slot\nslug: unrealenginedotcom/temporary/ui/stack_box_slot\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/stack_box_slot\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# stack_box_slot 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/stack_box_slot.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/text_base.md": "---\nname: text_base\nslug: unrealenginedotcom/temporary/ui/text_base\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/text_base\nkind: class\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# text_base 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/text_base.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/getplayerui.md": "---\nname: GetPlayerUI\nslug: unrealenginedotcom/temporary/ui/getplayerui\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/getplayerui\nkind: function\nmodule: /UnrealEngine.com/Temporary/UI\ngrade: S\ndepth: full\nstatus: done\n---\n\n# GetPlayerUI 🟦【S级·核心】\n\n> Returns the player_ui for the given player.\n> 取指定玩家的 [player_ui](player_ui.md) 实例——所有 UI 操作的第一步。\n\n## 签名\n\n```verse\nGetPlayerUI<public><native>(Player:player)<transacts><decides>:player_ui\n```\n\n## 这是什么\n\n`<decides>` 说明它是**可失败**的：玩家 UI 尚未就绪时失败。所以标准写法是失败上下文＋`[]` 调用。拿到实例后 `AddWidget/RemoveWidget` 管理该玩家屏幕上的控件。\n\n## 最小示例\n\n```verse\nusing { /UnrealEngine.com/Temporary/UI }\nusing { /Verse.org/Simulation }\n\nShowScore(P:player, W:widget):void =\n    if (UI := GetPlayerUI[P]):\n        UI.AddWidget(W)          # 失败则静默跳过\n```\n\n## 何时用 / 何时不用\n\n- 用：每个玩家首次交互/每局开始时获取并缓存；事件回调里按需获取。\n- 不用：缓存引用后玩家退出会失效——长生命周期脚本建议每事件现取。\n\n## 常见坑\n\n- 无参或对 agent 调用都编译不过——参数必须先转成 player。\n- 失败分支别忽略：UI 未就绪时静默失败会让\"为什么没显示\"很难排查，必要时在 else 里 Print 一条。\n\n## 相关页面\n\n- [player_ui](player_ui.md)\n- [widget](widget.md)\n", "02_UnrealEngine.com/050_Temporary/010_UI/makecanvasslot.md": "---\nname: MakeCanvasSlot\nslug: unrealenginedotcom/temporary/ui/makecanvasslot\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/makecanvasslot\nkind: function\nmodule: /UnrealEngine.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# MakeCanvasSlot 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/makecanvasslot.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/ui_input_mode.md": "---\nname: ui_input_mode\nslug: unrealenginedotcom/temporary/ui/ui_input_mode\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/unrealenginedotcom/temporary/ui/ui_input_mode\nkind: enum\nmodule: /UnrealEngine.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# ui_input_mode 🟨【B级·进阶】\n\n<!-- 待生成（阶段2）。官方快照: sources/unrealenginedotcom/temporary/ui/ui_input_mode.html -->\n", "02_UnrealEngine.com/050_Temporary/010_UI/widget_visibility.md": "---\nname: widget_visibility\nslug: unrealenginedotcom/temporary/ui/widget_visibility\nurl: https://dev.epicgames.com/documentation/fortnite/ve ortnite.com\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# supply_drop_spawner_device ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/devices/supply_drop_spawner_device.html -->\n", "03_Fortnite.com/070_Devices/creative_device.md": "---\nname: creative_device\nslug: fortnitedotcom/devices/creative_device\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/devices/creative_device\nkind: class\nmodule: /Fortnite.com/Devices\ngrade: S\ndepth: full\nstatus: done\n---\n\n# creative_device 🟦【S级·核心】\n\n> The base class for every Verse-authored script you place on the island.\n> 所有自制脚本设备的基类——你在 UEFN 里写的每个 `@editable` 脚本都继承它。\n\n## 这是什么\n\nVerse 脚本要以\"设备\"形态放进岛屿，类必须继承 `creative_device`。它提供：\n\n- **入口生命周期**：`OnBegin`（体验开始时调用，可挂起，初始化/订阅/启动循环都写这里）、`OnEnd`（体验结束时；官方特别注明：**在 OnEnd 里 spawn 的协程可能永远不会执行**）。\n- **空间操作**：`GetTransform`（设备摆放位置，单位厘米）、`TeleportTo`（瞬移，两个重载）、`MoveTo`（在指定秒数内平滑移动）。\n- 实现了 `creative_object_interface`（作为创意对象的通用能力）。\n\n与其他设备（button_device 等）的区别：creative_device 是**你自己的代码的容器**，其它设备是系统提供的功能件，两者通过 `@editable` 引用互相连线。\n\n## 签名\n\n```verse\ncreative_device<public> := class<concrete>(creative_device_base):\n    OnBegin<public>()<suspends>:void          # override 入口\n    OnEnd<public>():void                      # override 出口\n    GetTransform<public>():transform          # 摆放变换（cm 单位）\n    TeleportTo<public>(Position:vector3, Rotation:rotation):void\n    TeleportTo<public>(Transform:transform):void\n    MoveTo<public>(Position:vector3, Rotation:rotation, Time:float):void\n```\n\n## 最小示例\n\n```verse\nusing { /Fortnite.com/Devices }\nusing { /Verse.org/Simulation }\n\n# 最小可运行脚本骨架：每个项目的起点\nhello_device := class(creative_device):\n\n    @editable\n    MyButton : button_device = button_device{}    # 在编辑器里连线\n\n    OnBegin<override>()<suspends>:void =\n        Print(\"设备已启动\")\n        MyButton.InteractedWithEvent.Subscribe(OnPress)\n\n    OnPress(Agent:agent):void =\n        Print(\"按钮被按下\")\n```\n\n## 常用成员\n\n| 成员 | 说明 | 级别 |\n|---|---|---|\n| `OnBegin<override>()<suspends>` | 一切的入口 | 🟦 S |\n| `OnEnd<override>()` | 收尾（协程可能不执行！） | 🟩 A |\n| `TeleportTo` / `MoveTo` | 移动设备本体 | 🟨 B |\n| `GetTransform` | 读摆放位置 | 🟨 B |\n\n## 何时用 / 何时不用\n\n- 用：任何自定义逻辑的第一个类。\n- 不用：一个设备能干的就别拆五个——设备数量有上限，但逻辑内聚优先。\n\n## 常见坑\n\n- 忘写 `OnBegin<override>()` 里的 `<suspends>` 会无法 Sleep/订阅异步流程。\n- 类里 `@editable` 的字段必须是 devices 模块的具体类型（或 editable_\\*），写成泛型/接口面板不显示。\n- OnEnd 中 spawn 的协程官方明言可能不执行——收尾逻辑要同步完成。\n\n## 相关页面\n\n- [editable_number](../../01_Verse.org/100_Simulation/editable_number.md) —— 参数暴露\n- [listenable](../../01_Verse.org/010_Verse/listenable.md) —— 订阅设备事件\n- [Sleep](../../01_Verse.org/100_Simulation/sleep.md)\n", "03_Fortnite.com/070_Devices/creative_device_base.md": "---\nname: creative_device_base\nslug: fortnitedotcom/devices/creative_device_base\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/devices/creative_device_base\nkind: class\nmodule: /Fortnite.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# creative_device_base 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/devices/creative_device_base.html -->\n", "03_Fortnite.com/070_Devices/creative_device_asset.md": "---\nname: creative_device_asset\nslug: fortnitedotcom/devices/creative_device_asset\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/devices/creative_device_asset\nkind: class\nmodule: /Fortnite.com\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# creative_device_asset ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/devices/creative_device_asset.html -->\n", "03_Fortnite.com/070_Devices/creative_object.md": "---\nname: creative_object\nslug: fortnitedotcom/devices/creative_object\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/devices/creative_object\nkind: class\nmodule: /Fortnite.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# creative_object 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/devices/crea /play_animation_state\nkind: enum\nmodule: /Fortnite.com\ngrade: A\ndepth: full\nstatus: placeholder\n---\n\n# play_animation_state 🟩【A级·常用】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/animation/playanimation/play_animation_state.html -->\n", "03_Fortnite.com/130_Characters/_overview.md": "---\nname: Characters\nslug: fortnitedotcom/characters\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters\nkind: module\nmodule: /Fortnite.com\ngrade: S\ndepth: brief\nstatus: placeholder\n---\n\n# Characters 🟦【S级·核心】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "03_Fortnite.com/130_Characters/stasis_args.md": "---\nname: stasis_args\nslug: fortnitedotcom/characters/stasis_args\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters/stasis_args\nkind: class\nmodule: /Fortnite.com\ngrade: C\ndepth: oneliner\nstatus: placeholder\n---\n\n# stasis_args ⬜【C级·参考】\n\n<!-- 待生成（阶段2）。官方快照: sources/fortnitedotcom/characters/stasis_args.html -->\n", "03_Fortnite.com/130_Characters/fort_character.md": "---\nname: fort_character\nslug: fortnitedotcom/characters/fort_character\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters/fort_character\nkind: interface\nmodule: /Fortnite.com/Characters\ngrade: S\ndepth: full\nstatus: done\n---\n\n# fort_character 🟦【S级·核心】\n\n> Represents the physical character body of a player (or NPC) in the world.\n> 玩家（或 NPC）在世界中的\"角色身体\"——移动、跳跃、淘汰、生命值都发生在它身上。\n\n## 这是什么\n\n[agent](../../01_Verse.org/100_Simulation/agent.md)/[player](../../01_Verse.org/100_Simulation/player.md) 是\"参与者身份\"，`fort_character` 才是**世界里的那具身体**。它是**接口**（不是类），由角色对象实现。获取方式是从 agent/player 可失败转换：`Agent.GetFortCharacter[]`。\n\n它通过一组能力接口暴露功能，这决定了\"哪些操作要去哪个接口找\"：\n\n| 暴露接口 | 提供什么 |\n|---|---|\n| `positional` | 读位置信息 |\n| `healthful` | 生命状态与淘汰 |\n| `healable` / `damageable` | 治疗 / 受击 |\n| `shieldable` | 护盾状态 |\n| `game_action_instigator` | 伤害/治疗等游戏动作的发起者信息 |\n\n**注意**：本版本中\"扣血/加血\"等操作分散在上述接口（官方页各接口章节），fort_character 页面本身不提供 Damage/Heal 函数——使用前按接口查找，勿凭旧教程硬写。\n\n## 签名\n\n```verse\nfort_character<public><native> := interface<native>(positional, healable, healthful,\n                                                  damageable, shieldable,\n                                                  game_action_instigator):\n```\n\n## 最小示例\n\n```verse\nusing { /Fortnite.com/Characters }\nusing { /Verse.org/Simulation }\n\nWatchPlayer(Agent:agent)<suspends>:void =\n    if (FC := Agent.GetFortCharacter[]):\n        if (FC.IsActive[]):\n            Print(\"角色在场上\")\n        FC.EliminatedEvent().Await()      # 挂起等待该角色被淘汰\n        Print(\"被淘汰了\")\n```\n\n## 常用成员（官方页验证）\n\n| 成员 | 说明 | 级别 |\n|---|---|---|\n| `Agent.GetFortCharacter[]` | agent → 角色（可失败） | 🟦 S |\n| `IsActive[]` | 在场且未被淘汰（可失败/断言） | 🟦 S |\n| `EliminatedEvent()` | 淘汰事件（listenable） | 🟦 S |\n| `GetViewLocation` / `GetViewRotation` | 视线位置/朝向 | 🟩 A |\n| `JumpedEvent` / `CrouchedEvent` / `SprintedEvent` | 跳/蹲/冲刺事件（带载荷） | 🟩 A |\n| `IsCrouching` / `IsOnGround` / `IsInAir` / `IsDownButNotOut` | 状态断言 | 🟩 A |\n| `GetAgent` | 反查 agent | 🟩 A |\n\n## 何时用 / 何时不用\n\n- 用：动作玩法——跟随跳跃/蹲/冲刺做节奏判定、淘汰计数、位置玩法。\n- 不用：只是发道具/传送这类\"对参与者\"的操作，用 player/设备即可，不必绕到身体层。\n\n## 常见坑\n\n- 角色可能不存在（玩家未生成/已退出）：`GetFortCharacter[]` 与 `IsActive[]` 两道失败检查别省。\n- 事件回调里拿到的角色引用在淘汰后失效，长流程要做存在性检查。\n\n## 相关页面\n\n- [player](../../01_Verse.org/100_Simulation/player.md)\n- [listenable](../../01_Verse.org/010_Verse/listenable.md) —— 事件订阅模式\n", "03_Fortnite.com/180_Vehicles/_overview.md": "---\nname: Vehicles\nslug: fortnitedotcom/vehicles\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/vehicles\nkind: module\nmodule: /Fortnite.com\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# Vehicles 🟨【B级·进阶】\n\n<!-- 模块总览，待生成（阶段2） -->\n", "03_Fortnite.com/180_Vehicles/fort_vehicle_seat.md": "---\nname: fort_vehicle_seat\nslug: fortnitedotcom/vehicles/fort_vehicle_seat\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/vehi (https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/animation/playanimation/play_animation_state) |\n| 03_Fortnite.com/130_Characters/stasis_args.md | stasis_args | class | C | oneliner | [官网](https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters/stasis_args) |\n| 03_Fortnite.com/130_Characters/fort_character.md | fort_character | interface | S | full | [官网](https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/characters/fort_character) |\n| 03_Fortnite.com/180_Vehicles/fort_vehicle_seat.md | fort_vehicle_seat | class | B | brief | [官网](https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/vehicles/fort_vehicle_seat) |\n| 03_Fortnite.com/180_Vehicles/fort_vehicle.md | fort_vehicle | interface | B | brief | [官网](https://dev.epicgames.com/documentation/fortnite/verse-api/fortnitedotcom/vehicles/fort_vehicle) |\n", "STYLE_GUIDE.md": "# STYLE_GUIDE.md —— 注解风格规范（阶段2执行合同）\n\n> 本文件是全库唯一写作标准。阶段2每生成/修改一个页面都必须遵守。\n> 数据来源：`manifest.json`（结构、分级、URL）＋ `sources/`（官方页面原文快照）。\n> 铁律：**一切 API 事实以 `sources/` 快照为准，禁止凭记忆补写**。\n\n---\n\n## 1. 目录与文件约定\n\n```\nverse-api-zh/\n├── 00_语言基础/          【补充章节】语言内建类型与表达式，官网 API Reference 无对应页，\n│                          每页 frontmatter 标 supplement: true，正文标注〔补充·非官网镜像〕\n├── 01_Verse.org/         下辖 NNN_模块名/ 文件夹，编号=官网出现顺序×10（10,20,30…留空隙）\n├── 02_UnrealEngine.com/\n├── 03_Fortnite.com/\n├── 90_分级索引/          由 build_site.py 生成：S索引.md / A索引.md / B索引.md / C索引.md\n├── _overview.md          每个模块文件夹内的模块总览页（下划线开头，排序置顶）\n└── 成员页.md             文件名 = 官方 slug 末段（非法字符→_），显示名写在 frontmatter.name\n```\n\n- 文件名一律用 **slug 末段**（含官网消歧后缀 `-1`/`-2`），如 `print.md`、`print-1.md`、`operatorminus.md`；显示名（`Print`、`operator'-'`）写在 frontmatter 与 H1。\n- **无链接 data 条目**（官网表格里无独立页，如 CollisionProfiles 常量、Input/UI 按键映射、AI/movement_types）不建文件，写进父模块 `_overview.md` 的成员表格，行内标注〔无独立页面〕。\n- 官网标注为空的模块（Native、Predicts、Conversations 等）：只保留 `_overview.md`，正文写明\"官方标注：此模块当前为空\"，状态 done。\n\n## 2. 分级与详略（分级已在 MANIFEST 定死，不得改判）\n\n| 级别 | 徽标 | 含义 | 详略档位 depth |\n|---|---|---|---|\n| S 核心 | 🟦 | 几乎每个项目必用 / 迁移价值最高 | `full` 逐成员完整注解 |\n| A 常用 | 🟩 | 多数项目会用 | `full` 逐成员完整注解 |\n| B 进阶 | 🟨 | 特定场景才用 | `brief` 类级简注＋成员表 |\n| C 参考 | ⬜ | 极少用/纯查询 | `oneliner` 一句话 |\n\n- Devices 模块约定：全部设备类 C 级（一句话索引）；**例外**：`creative_device`（S，旗舰页）、`creative_device_base`/`creative_object`/`creative_prop`/`creative_object_interface`（A）——它们是脚本基类与对象操作入口，不属于\"设备\"。\n- 模块总览页 `_overview.md` 一律 `brief`；grade 取该模块最高成员级。\n\n## 3. 页面模板\n\n### 3.1 frontmatter（每页必备，七字段）\n\n```yaml\n---\nname: event(t)                                        # 官方显示名，原样保留\nslug: versedotorg/verse/event/event(t)                # 官网相对路径\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/verse/event/event(t)\nkind: class            # class|interface|enum|function|data|module\nmodule: /Verse.org/Verse\ngrade: S               # S|A|B|C（与 MANIFEST 一致）\ndepth: full            # full|brief|oneliner\nstatus: done           # placeholder|draft|done|reviewed\n---\n```\n\n### 3.2 full 模板（S/A 级，类/接口）\n\n```markdown\n# event(t) 🟦【S级·核心】\n\n> 官方英文原句（从 sources/ 页面复制第一句描述）。\n> 中文翻译。\n\n## 这是什么\n2~5 句：作用、什么场合用、和哪些类型配合。面向\"会一点编程但不了解 Verse\"的读者。\n\n## 签名\n```verse\nevent(t)<public> := class<concrete>:\n    # 成员签名逐行照抄 sources/\n```\n\n## 最小示例\n```verse\n# 中文注释说明意图\n```\n\n## 常用成员\n| 成员 | 签名/形式 | 说明 | 级别 |\n|---|---|---|---|\n\n## 何时用 / 何时不用\n## 常见坑\n## 相关页面\n- [player](../20_Simulation/player.md) —— 一句话说明关系\n```\n\n- **函数页**把「签名」放最前：```verse 函数名(参数:类型):返回类型``` ＋ effect 说明（如 `<suspends>`），无成员表。\n- **枚举页**成员表列出全部枚举值＋一句话。\n- **data 页**（常量）一句话＋值的类型说明。\n\n### 3.3 brief 模板（B 级）\n`# 名称 🟨【B级·进阶】` → 官方原句＋翻译 → 「这是什么」1~3 句 → 签名 → 成员表（可不带示例）。\n\n### 3.4 oneliner 模板（C 级）\n`# 名称 ⬜【C级·参考】` → 官方原句＋中文一句话。**正文（除 frontmatter/H1）不超过 10 行。**\n\n## 4. 术语表（正文必须统一；代码标识符一律不译）\n\n| 英文 | 中文 | 备注 |\n|---|---|---|\n| agent | 代理 | 玩家的抽象，首次出现写「代理（agent）」 |\n| player | 玩家 | |\n| team | 队伍 | |\n| session | 对局 | |\n| round | 回合 | |\n| device | 设备 | |\n| widget | 控件 | |\n| entity / component | 实体 / 组件 | SceneGraph |\n| prefab | 预制体 | |\n| mesh / texture / material | 网格 / 贴图 / 材质 | |\n| spawn | 生成 | |\n| failable / failure context | 可失败表达式 / 失败上下文 | |\n| suspends | 可挂起 | 效果说明符 `<suspends>` 保留原文 |\n| listens / listenable | 监听 / listenable（不译） | |\n| quest | 任务 | |\n| inventory | 物品栏 | |\n| HUD | HUD | 不译 |\n\n其余名词：能意译就意译并首现标英文；拿不准就保留英文原文。\n\n## 5. 翻译与写作规则\n\n1. **代码、类型名、函数名、参数名、报错信息原文一律不翻译。**\n2. 每页保留官方描述首句英文原文（`>` 引用块），紧跟中文翻译；官方无描述时按页面内容自写，不加原文块。\n3. 示例代码注释用中文；代码本身符合 §6 语法小抄。\n4. 语气：面向\"会一点编程、初次接触 Verse\"的读者；少用\"您\"，用\"你\"；不堆形容词。\n5. 「常见坑」只在确有依据时写（官方页明示、或语义从签名可推出），不臆造。\n6. 相关页面用相对链接，2~4 条即可。\n\n## 6. Verse 语法小抄（写示例必须遵守）\n\n```verse\n# 定义与赋值\nX:int := 5          # 定义常量\nvar Y:int := 0\nset Y = 3\n\n# 数组 / 映射 / 选项\nArr:int[] := array{1, 2, 3}\nM:[string]int := map{\"a\" => 1}\nOpt:?int := option{7}\nif (V := Arr[0], W := Opt?) {}   # 失败上下文：任意一处失败则整块跳过\n\n# 类与效果说明符\nMyClass<public> := class<concrete>(BaseClass):\n    @editable Slider : editable_number = editable_number{}   # 设备详情面板可调参数\n    Handle<local_scope>:cancelable = event{}                 # 示意\n\n# 异步\nSleep(0.5)                       # 仅 <suspends> 上下文可用\nspawn{ Body() }                  # 新协程\nBranch().race(Body(), Other())   # 并发与竞速\n\n# 事件\nE:event(signal_types) := event{}\nE.Signal(A)                      # 触发\nE.Await()                        # <suspends> 等待一次\nE.Subscribe(Obj)                 # 持续订阅（类成员函数处理）\n\n# for / loop\nfor (I := 0 .. 9, Item := Arr[I]) {}\nloop:\n    if (Done?) { break }\n```\n\n## 7. 每页自查清单（完成后逐项过）\n\n1. frontmatter 七字段齐全，grade/depth 与 MANIFEST.md 一致。\n2. 签名、成员、参数与 `sources/<slug>.html` 一致（对照原文，不是凭印象）。\n3. 官方原句引用与原文相同；无描述页不硬造原文块。\n4. 示例符合 §6；代码标识符未翻译。\n5. 相关链接相对路径有效（相对本文件位置）。\n6. C 级正文 ≤10 行；B 级无成员表时不超过 30 行。\n7. 术语与 §4 一致。\n8. status 置为 `done`。\n\n## 8. 常见错误（阶段2随时追加到此处）\n\n- **凭旧版本记忆写 API**：Sleep 在 `/Verse.org/Simulation`（不在 Verse 核心模块）；`fort_character` 是 interface 不是 class；SceneGraph 实体模型已升入 `/Verse.org`。一切以 sources/ 快照为准。\n- **同名多页**：官网用 slug 后缀消歧（`print`/`print-1`/`print-2`），每页各写各的重载，文件名用 slug，别合并。\n- **无链接 data 条目**：写进父模块 `_overview.md` 表格，不建文件、不进分级索引。\n- **空模块**：Native、Predicts、Conversations、Temporary/SpatialMath、Fortnite.com/Input(部分) 官方标注为空或无内容页——只写 `_overview.md` 一段话，不要脑补成员。\n\n## 9. 交付流程（阶段2每个批次）\n\n1. 读 `PROGRESS.md` 取下一个未完成模块 → 读 `STYLE_GUIDE.md`（本文件）→ 按 MANIFEST 的 grade/depth 逐页生成。\n2. 完成后跑 `python tools/build_site.py`（重建 SUMMARY/index.html）→ 更新 PROGRESS.md 状态。\n3. 抽查反馈不返工原文，追加到 §8。\n", "PROGRESS.md": "# PROGRESS —— 生成进度\n\n> 状态: ☐ 未开始 / ◐ 部分完成 / ☑ 已生成待审 / ✓✓ 已审核通过。阶段2完成一个模块就把 ☐ 改 ☑。\n> 总计约 1027 个模块文件夹。00_语言基础（8页）与 90_分级索引 由脚本生成/阶段1完成。\n\n\n- ☐ 01_Verse.org/010_Verse（约137页）\n- ☐ 01_Verse.org/020_Native（约1页）\n- ☐ 01_Verse.org/030_Chat（约8页）\n- ☐ 01_Verse.org/040_SceneGraph（约110页）\n- ☐ 01_Verse.org/050_Progression（约9页）\n- ☐ 01_Verse.org/060_Timeline（约4页）\n- ☐ 01_Verse.org/070_Presentation（约3页）\n- ☐ 01_Verse.org/080_Input（约36页）\n- ☐ 01_Verse.org/090_AgentGroup（约7页）\n- ☐ 01_Verse.org/100_Simulation（约20页）\n- ☐ 01_Verse.org/110_Assets（约11页）\n- ☐ 01_Verse.org/120_Colors（约169页）\n- ☐ 01_Verse.org/130_SpatialMath（约42页）\n- ☐ 01_Verse.org/140_Random（约4页）\n- ☐ 01_Verse.org/150_Predicts（约1页）\n- ☐ 01_Verse.org/160_Concurrency（约5页）\n- ☐ 02_UnrealEngine.com/010_Conversations（约1页）\n- ☐ 02_UnrealEngine.com/020_Progression（约9页）\n- ☐ 02_UnrealEngine.com/030_Itemization（约19页）\n- ☐ 02_UnrealEngine.com/040_WebAPI（约6页）\n- ☐ 02_UnrealEngine.com/050_Temporary（约42页）\n- ☐ 02_UnrealEngine.com/060_Social（约2页）\n- ☐ 02_UnrealEngine.com/070_JSON（约3页）\n- ☐ 02_UnrealEngine.com/080_BasicShapes（约6页）\n- ☐ 02_UnrealEngine.com/090_Abilities（约10页）\n- ☐ 02_UnrealEngine.com/100_ControlInput（约5页）\n- ☐ 02_UnrealEngine.com/110_Assets（约3页）\n- ☐ 03_Fortnite.com/010_UI（约48页）\n- ☐ 03_Fortnite.com/060_AI（约29页）\n- ☐ 03_Fortnite.com/070_Devices（约265页）\n- ☐ 03_Fortnite.com/110_Animation（约6页）\n- ☐ 03_Fortnite.com/130_Characters（约3页）\n- ☐ 03_Fortnite.com/180_Vehicles（约3页）\n\n## 阶段1产出\n\n- [x] 抓取与解析（sources/ + manifest.json）\n- [x] STYLE_GUIDE.md / MANIFEST.md / PROGRESS.md / 目录骨架\n- [ ] 样板模块：01_Verse.org/100_Simulation\n- [ ] S级旗舰页（见 MANIFEST 中 S 级核心条目）\n- [ ] 仓库脚手架（.gitbook.yaml/Intro/README/.nojekyll）与 build_site.py\n"}</script>
<script>
const TREE=JSON.parse(document.getElementById('tree-data').textContent);
const MD=JSON.parse(document.getElementById('md-data').textContent);
const $=s=>document.querySelector(s);
let active=null, flat=[];

// ---------- 树展开 ----------
(function flatten(n,depth){n._depth=depth;flat.push(n);(n.children||[]).forEach(c=>flatten(c,depth+1));})(TREE,0);
const byPath=new Map();flat.forEach(n=>{if(n.path)byPath.set(n.path,n)});

// ---------- 渲染侧栏 ----------
function renderGrades(){
  const box=$('#grades');box.innerHTML='';
  for(const g of ['S','A','B','C']){
    const b=document.createElement('span');b.className='gbtn'+(state.grades.has(g)?' on':'');
    b.textContent=g+' '+({S:'核心',A:'常用',B:'进阶',C:'参考'}[g]);
    b.onclick=()=>{state.grades.has(g)?state.grades.delete(g):state.grades.add(g);renderAll()};box.appendChild(b);
  }
}
const state={q:'',grades:new Set()};

function match(n){
  if(state.q && !n.title.toLowerCase().includes(state.q))return false;
  if(state.grades.size===0)return true;
  if(!state.grades.size)return true;
  const g=n.grade||'';
  if(n.children)return n.children.some(match)||state.grades.has(g)&&g!=='';
  return state.grades.has(g);
}
function nodeHtml(n){
  const kids=(n.children||[]).filter(match);
  if(!match(n))return '';
  let cls=n.children?'d':'leaf';
  let g=n.grade?`<span class="g g${n.grade}"></span>`:'';
  let pend=(n.status==='placeholder')?'<span class="pend">待生成</span>':'';
  let inner=g+htmlEsc(n.title)+pend;
  let s=`<li class="${cls}">`;
  s+=n.children?`<span class="t">${inner}</span>`:`<a data-p="${n.path}" class="${active===n.path?'cur':''}">${inner}</a>`;
  if(kids.length)s+='<ul>'+kids.map(nodeHtml).join('')+'</ul>';
  return s+'</li>';
}
function renderTree(){
  const kids=(TREE.children||[]).filter(match);
  $('#tree').innerHTML='<ul>'+kids.map(nodeHtml).join('')+'</ul>';
  $('#tree').querySelectorAll('a').forEach(a=>a.onclick=()=>show(a.dataset.p));
}
function renderAll(){renderGrades();renderTree()}

// ---------- 极简 Markdown 渲染 ----------
function htmlEsc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function esc(s){return htmlEsc(s)}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,p)=>{
    if(p.endsWith('.md'))return `<a data-p="${p}" href="javascript:void(0)">${t}</a>`;
    return `<a href="${p}" target="_blank">${t}</a>`});
  return s;
}
function md2html(md){
  const lines=md.split('\n');let out=[],i=0,inCode=false,code=[],list=null,tbl=null,quote=null;
  const flushList=()=>{if(list){out.push(`<ul>${list.map(x=>'<li>'+x+'</li>').join('')}</ul>`);list=null}};
  const flushTbl=()=>{if(tbl){let h='';tbl.forEach((r,ri)=>{const t=ri===0?'th':'td';h+='<tr>'+r.map(c=>`<${t}>${inline(c)}</${t}>`).join('')+'</tr>'});out.push(`<table>${h}</table>`);tbl=null}};
  const flushQ=()=>{if(quote){out.push('<blockquote>'+quote.map(x=>inline(x)).join('<br>')+'</blockquote>');quote=null}};
  for(;i<lines.length;i++){
    const L=lines[i];
    if(L.startsWith('```')){flushList();flushTbl();flushQ();
      if(inCode){out.push('<pre><code>'+code.join('\n')+'</code></pre>');code=[];inCode=false}
      else inCode=true;continue}
    if(inCode){code.push(L);continue}
    if(/^\s*$/.test(L)){flushList();flushTbl();flushQ();continue}
    if(L.startsWith('|')){const cells=L.split('|').slice(1,-1).map(x=>x.trim());
      if(cells.every(c=>/^-+$/.test(c)))continue;flushList();flushQ();tbl=tbl||[];tbl.push(cells);continue}
    if(L.startsWith('# ')){flushList();flushTbl();flushQ();out.push('<h1>'+inline(L.slice(2))+'</h1>');continue}
    if(L.startsWith('## ')){flushList();flushTbl();flushQ();out.push('<h2>'+inline(L.slice(3))+'</h2>');continue}
    if(L.startsWith('### ')){flushList();flushTbl();flushQ();out.push('<h3>'+inline(L.slice(4))+'</h3>');continue}
    if(L.startsWith('> ')){flushList();flushTbl();quote=quote||[];quote.push(L.slice(2));continue}
    if(/^[-*] /.test(L)){flushTbl();flushQ();list=list||[];list.push(inline(L.slice(2)));continue}
    if(/^\d+\. /.test(L)){flushTbl();flushQ();list=list||[];list.push(inline(L.replace(/^\d+\. /,'')));continue}
    if(L.startsWith('---')){flushList();flushTbl();flushQ();out.push('<hr>');continue}
    flushList();flushTbl();flushQ();out.push('<p>'+inline(L)+'</p>');
  }
  flushList();flushTbl();flushQ();
  if(inCode)out.push('<pre><code>'+code.join('\n')+'</code></pre>');
  return out.join('\n');
}

// ---------- 内容与导航 ----------
const leaves=flat.filter(n=>n.children===null||n.children&&n.children.length===0&&false);
const order=flat.filter(n=>!n.children&&n.path&&MD[n.path]);
function show(path){
  active=path;
  const n=byPath.get(path)||{};
  let body=MD[path]||'';
  const isPending=/status: placeholder/.test(body.split('---')[1]||'')||n.status==='placeholder';
  let htmlOut=md2html(body);
  if(isPending)htmlOut+='<div class="pending-box">⏳ 本页在阶段1为占位页，正文将由批量生成阶段填充。<br>官方原文快照已保存在仓库 sources/ 目录。</div>';
  htmlOut=htmlOut.replace(/status: placeholder\n?/g,'');
  $('#content').innerHTML=htmlOut;
  $('#content').querySelectorAll('a[data-p]').forEach(a=>a.onclick=()=>show(a.getAttribute('data-p')));
  $('#content').scrollTop=0;document.querySelector('#main').scrollTop=0;
  renderTree();
}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
function step(d){
  const i=order.findIndex(n=>n.path===active);
  const j=Math.min(order.length-1,Math.max(0,(i<0?0:i)+d));
  if(order[j])show(order[j].path);
}
$('#search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();renderTree()};

// frontmatter 剥离
for(const k in MD){MD[k]=MD[k].replace(/^---\n[\s\S]*?\n---\n?/,'')}
renderAll();show('Intro.md');
</script>
</body>
</html>
