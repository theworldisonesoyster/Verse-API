\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/play_skeletal_animation_result.md": "---\nname: play_skeletal_animation_result\nslug: versedotorg/scenegraph/play_skeletal_animation_result\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/play_skeletal_animation_result\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# play_skeletal_animation_result struct <C>\n\n播放骨骼动画的结果。\n", "01_Verse.org/040_SceneGraph/skeleton.md": "---\nname: skeleton\nslug: versedotorg/scenegraph/skeleton\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/skeleton\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: A\ndepth: full\nstatus: done\n---\n\n# skeleton class <A>\n\n> Skeletons are collections of bones & sets/chains\n> 骨架（skeleton）是骨骼与骨骼组/链（sets/chains）的集合。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/easing_window.md": "---\nname: easing_window\nslug: versedotorg/scenegraph/easing_window\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/easing_window\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# easing_window <B>\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/easing_window.html -->\n", "01_Verse.org/040_SceneGraph/capsule_light_component.md": "---\nname: capsule_light_component\nslug: versedotorg/scenegraph/capsule_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/capsule_light_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# capsule_light_component class <B>\n\n> A capsule_light_component emits light in all directions into the scene from a capsule shaped source with a specified radius and length. A radius and length of 0 makes it a point light. You can use these to simulate any kind of light sources that emit in all directions and need an elongated source shape, such as a long light bulb.\n> 胶囊灯：从指定半径与长度的胶囊形光源向场景四周发光；半径与长度为 0 时等效于点光源。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| light_component | SceneGraph 中灯光组件的基类。依赖：实体上的 transform_component 决定灯的位置。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| AttenuationRadius | ??float | 灯光可见影响范围的边界。这种钳制并不符合物理，但对性能非常重要——灯越大开销越高。光衰减基于平方反比定律；在衰减半径末端有额外的平滑因子把光贡献淡出到 0，避免硬截断。 |\n| CastShadows | ?logic | 此灯是否投射阴影。 |\n| ColorFilter | ?color | 设置灯的滤色颜色：相当于放在光源前的彩色滤镜。注意这会改变灯的有效强度。取值范围 0~1（归一化）。 |\n| DiffuseScale | ?float | 漫反射系数。除 1.0 外的值都不符合物理；0.0 表示此灯无漫反射贡献。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| Intensity | ?float | 以国际单位坎德拉（Candela）设置可见光发光强度。在 ColorFilter 之前指定（滤镜会在强度计算后乘到各颜色分量上，可能改变灯的有效强度）。 |\n| SourceLength | ?float | 胶囊光源沿局部 Z 轴的长度（厘米）。注意：光源形状若与投射阴影的几何相交，可能产生阴影瑕疵。 |\n| SourceRadius | ?float | 胶囊光源绕局部 Z 轴的半径（厘米）。注意：光源形状与投射阴影的几何相交可能产生阴影瑕疵。 |\n| SpecularScale | ?float | 高光系数。可用于艺术化地去除高光（模拟偏振滤镜或修图）。除 1.0 外都不符合物理；0.0 表示此灯无高光贡献。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| Disable | 禁用此灯的渲染。 |\n| Enable | 启用此灯的渲染。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/collision_channel.md": "---\nname: collision_channel\nslug: versedotorg/scenegraph/collision_channel\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_channel\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_channel class <B>\n\n> Every volume has a collision channel as part of its collision_profile. It is used to determine how two volumes interact. See collision_profile.\n> 碰撞通道：每个体积都在其 collision_profile 中带有碰撞通道，用于决定两个体积如何交互。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/collision_profile.md": "---\nname: collision_profile\nslug: versedotorg/scenegraph/collision_profile\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_profile\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_profile class <B>\n\n> A collision profile determines how a volume interacts with other volumes for Overlap queries, Sweep queries, and physics simulation. When two volumes are being tested to see how they interact, the algorithm looks like this: GetInteraction(A:collision_profile, B:collision_profile):collision_interaction = InteractionA = B.GetChannelInteraction(A.Channel) InteractionB = A.GetChannelInteraction(B.Channel) return Min(InteractionA, InteractionB)\n> 碰撞轮廓：决定体积在 Overlap 查询、Sweep 查询与物理模拟中如何与其他体积交互。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Channel | collision_channel | 所属对象的碰撞通道。 |\n| GetChannelInteraction | (collision_channel):collision_interaction | 所属对象应如何与其他对象交互。GetChannelInteraction 是把 collision_channel 映射为 collision_interaction 的函数，可用一串 if 实现。例如放行相机通道、阻塞其余：BlockAllIgnoreCamera(Channel:collision_channel):collision_interaction = if (CollisionChannels.camera[Channel]): return collision_interaction.Ignore；return collision_interaction.Block。然后 MyProfile:collision_profile = MakeCollisionProfile(CollisionChannels.dynamic, BlockAllIgnoreCamera)。 |\n", "01_Verse.org/040_SceneGraph/overlap_hit.md": "---\nname: overlap_hit\nslug: versedotorg/scenegraph/overlap_hit\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/overlap_hit\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# overlap_hit struct <B>\n\n> The results of an overlap query. See entity.FindOverlapHits(). We will get one overlap_hit for each intersection of any volume in SourceVolumes with any other volume.\n> Overlap 查询的结果：SourceVolumes 中任一体积与其他体积的每个相交各产生一个 overlap_hit。见 entity.FindOverlapHits()。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| SourceComponent | ?component | 来源组件与体积（查询输入）。对复合输入（如实体层级），这是层级中参与查询的组件/体积；SourceTransform 是本次 Overlap 测试所用 SourceVolume 的变换。对球体等单体积输入，体积与变换即查询输入本身，component 为 false。 |\n| SourceVolume | collision_volume | 来源体积（查询输入） |\n| SourceGlobalTransform | transform | 来源体积变换 |\n| TargetComponent | component | 被 SourceVolume 命中的组件 |\n| TargetVolume | collision_element | 被 SourceVolume 命中的体积 |\n", "01_Verse.org/040_SceneGraph/sweep_hit.md": "---\nname: sweep_hit\nslug: versedotorg/scenegraph/sweep_hit\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/sweep_hit\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# sweep_hit struct <B>\n\n> The results of a sweep query. See entity.FindSweepHits(). We will get one sweep_hit for each intersection of any volume in SourceVolumes with any other volume.\n> Sweep 查询的结果：每个相交产生一个 sweep_hit。见 entity.FindSweepHits()。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| SourceComponent | ?component | 来源组件与体积（查询输入）。对复合输入（如实体层级），这是层级中参与查询的组件/体积；SourceGlobalTransform 是扫掠开始时 SourceVolume 的变换。对球体等单体积输入，体积与变换即查询输入本身，component 为 false。 |\n| SourceVolume | collision_volume | 来源体积（查询输入）。 |\n| SourceStartGlobalTransform | transform | 扫掠开始时来源体积的变换。 |\n| SourceHitTranslation | vector3 | SourceVolume 触到 TargetVolume 时的世界位移（相对 SourceStartGlobalTransform）。 |\n| SourceHitDistance | float | 扫掠路径上 SourceVolume 触到 TargetVolume 处的距离。 |\n| TargetComponent | component | 被 SourceVolume 命中的组件。 |\n| TargetVolume | collision_element | 被 SourceVolume 命中的体积。 |\n| ContactPosition | vector3 | SourceVolume 与 TargetVolume 的接触点。 |\n| ContactNormal | vector3 | HitPosition 处 TargetVolume 的法线。 |\n| ContactFaceNormal | vector3 | 若 TargetVolume 是多边形物体（网格、凸包等）且接触点位于边或顶点上，此值为共享该边/顶点的面中最相对的面法线；否则与 HitNormal 相同。 |\n", "01_Verse.org/040_SceneGraph/collision_volume.md": "---\nname: collision_volume\nslug: versedotorg/scenegraph/collision_volume\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_volume\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_volume class <B>\n\n> Collision Volumes represent the collision shapes of meshes. They can be detected by Overlap and Sweep queries and generate collisions in the physics simulation.\n> 碰撞体积：表示网格的碰撞形状，可被 Overlap/Sweep 查询检测，并在物理模拟中产生碰撞。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Collidable | ?logic | 启用/禁用此体积的碰撞。 |\n| Queryable | ?logic | 启用/禁用对此体积的空间查询。 |\n\n### Functions\n| Function Name | Description |\n| GetLocalTransform | 获取此体积在所有者空间（通常是实体上的组件）中的变换。 |\n| SetLocalTransform | 设置此体积在所有者空间中的变换。 |\n", "01_Verse.org/040_SceneGraph/collision_element.md": "---\nname: collision_element\nslug: versedotorg/scenegraph/collision_element\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_element\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_element class <B>\n\n> Base class for collision_volumes that consist of a single volume with a single collision_profile and collision_material for the whole volume. This covers most volume types used in queries and physics, except compound types like a mesh. A query will always return an element rather than a general volume. For example when colliding with a mesh, the element will be a collision_triangle, which is a collision_element and has a single material, rather than a collision_triangle_mesh, which is not an element and has a material palette.\n> 由单一体积＋单一 collision_profile 与 collision_material 构成的碰撞体积基类，覆盖大多数体积类型。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| collision_volume | 碰撞体积：表示网格的碰撞形状，可被 Overlap/Sweep 查询检测，并在物理模拟中产生碰撞。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Collidable | ?logic | 启用/禁用此体积的碰撞。 |\n| CollisionProfile | ?collision_profile | 此体积的碰撞轮廓。 |\n| Queryable | ?logic | 启用/禁用对此体积的空间查询。 |\n\n### Functions\n| Function Name | Description |\n| GetLocalTransform | 获取此体积在所有者空间（通常是实体上的组件）中的变换。 |\n| SetLocalTransform | 设置此体积在所有者空间中的变换。 |\n", "01_Verse.org/040_SceneGraph/collision_capsule.md": "---\nname: collision_capsule\nslug: versedotorg/scenegraph/collision_capsule\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_capsule\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_capsule class <B>\n\n> A collision capsule aligned along the Z axis.\n> 沿 Z 轴对齐的碰撞胶囊体。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| collision_volume | 碰撞体积：表示网格的碰撞形状，可被 Overlap/Sweep 查询检测，并在物理模拟中产生碰撞。 |\n| collision_element | 由单一体积构成的碰撞体积基类：整个体积共用单一 collision_profile 与 collision_material。它覆盖查询与物理中使用的大多数体积类型，但不含网格等复合类型。查询总是返回 element 而非一般体积：例如与网格碰撞时，返回的元素是 collision_triangle（属于 collision_element，有单一材质），而不是 collision_triangle_mesh（非 element，带材质调色板）。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Collidable | ?logic | 启用/禁用此体积的碰撞。 |\n| CollisionProfile | ?collision_profile | 此体积的碰撞轮廓。 |\n| Length | ?float | 胶囊圆柱段的长度（两个端帽中心之间的距离）。 |\n| Queryable | ?logic | 启用/禁用对此体积的空间查询。 |\n| Radius | ?float | 胶囊半径。 |\n\n### Functions\n| Function Name | Description |\n| GetLocalTransform | 获取此体积在所有者空间（通常是实体上的组件）中的变换。 |\n| SetLocalTransform | 设置此体积在所有者空间中的变换。 |\n", "01_Verse.org/040_SceneGraph/collision_sphere.md": "---\nname: collision_sphere\nslug: versedotorg/scenegraph/collision_sphere\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_sphere\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_sphere class <B>\n\n> A collision sphere.\n> 碰撞球体。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| collision_volume | 碰撞体积：表示网格的碰撞形状，可被 Overlap/Sweep 查询检测，并在物理模拟中产生碰撞。 |\n| collision_element | 由单一体积构成的碰撞体积基类：整个体积共用单一 collision_profile 与 collision_material。它覆盖查询与物理中使用的大多数体积类型，但不含网格等复合类型。查询总是返回 element 而非一般体积：例如与网格碰撞时，返回的元素是 collision_triangle（属于 collision_element，有单一材质），而不是 collision_triangle_mesh（非 element，带材质调色板）。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Collidable | ?logic | 启用/禁用此体积的碰撞。 |\n| CollisionProfile | ?collision_profile | 此体积的碰撞轮廓。 |\n| Queryable | ?logic | 启用/禁用对此体积的空间查询。 |\n| Radius | ?float | 球体半径。 |\n\n### Functions\n| Function Name | Description |\n| GetLocalTransform | 获取此体积在所有者空间（通常是实体上的组件）中的变换。 |\n| SetLocalTransform | 设置此体积在所有者空间中的变换。 |\n", "01_Verse.org/040_SceneGraph/collision_point.md": "---\nname: collision_point\nslug: versedotorg/scenegraph/collision_point\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_point\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_point class <B>\n\n> A collision point.\n> 碰撞点。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| collision_volume | 碰撞体积：表示网格的碰撞形状，可被 Overlap/Sweep 查询检测，并在物理模拟中产生碰撞。 |\n| collision_element | 由单一体积构成的碰撞体积基类：整个体积共用单一 collision_profile 与 collision_material。它覆盖查询与物理中使用的大多数体积类型，但不含网格等复合类型。查询总是返回 element 而非一般体积：例如与网格碰撞时，返回的元素是 collision_triangle（属于 collision_element，有单一材质），而不是 collision_triangle_mesh（非 element，带材质调色板）。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Collidable | ?logic | 启用/禁用此体积的碰撞。 |\n| CollisionProfile | ?collision_profile | 此体积的碰撞轮廓。 |\n| Queryable | ?logic | 启用/禁用对此体积的空间查询。 |\n\n### Functions\n| Function Name | Description |\n| GetLocalTransform | 获取此体积在所有者空间（通常是实体上的组件）中的变换。 |\n| SetLocalTransform | 设置此体积在所有者空间中的变换。 |\n", "01_Verse.org/040_SceneGraph/collision_box.md": "---\nname: collision_box\nslug: versedotorg/scenegraph/collision_box\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_box\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_box class <B>\n\n> An axis-aligned collision box.\n> 轴对齐碰撞盒。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| collision_volume | 碰撞体积：表示网格的碰撞形状，可被 Overlap/Sweep 查询检测，并在物理模拟中产生碰撞。 |\n| collision_element | 由单一体积构成的碰撞体积基类：整个体积共用单一 collision_profile 与 collision_material。它覆盖查询与物理中使用的大多数体积类型，但不含网格等复合类型。查询总是返回 element 而非一般体积：例如与网格碰撞时，返回的元素是 collision_triangle（属于 collision_element，有单一材质），而不是 collision_triangle_mesh（非 element，带材质调色板）。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Collidable | ?logic | 启用/禁用此体积的碰撞。 |\n| CollisionProfile | ?collision_profile | 此体积的碰撞轮廓。 |\n| Extents | ?vector3 |  |\n| Queryable | ?logic | 启用/禁用对此体积的空间查询。 |\n\n### Functions\n| Function Name | Description |\n| GetLocalTransform | 获取此体积在所有者空间（通常是实体上的组件）中的变换。 |\n| SetLocalTransform | 设置此体积在所有者空间中的变换。 |\n", "01_Verse.org/040_SceneGraph/directional_light_component.md": "---\nname: directional_light_component\nslug: versedotorg/scenegraph/directional_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/directional_light_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# directional_light_component class <B>\n\n> A directional_light_component simulates light that is being emitted from a source that is infinitely far away. This means that all shadows cast by this light will be parallel, making this the ideal choice for simulating sunlight.\n> 方向光：模拟来自无限远处的光源，投射的阴影相互平行。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| light_component | SceneGraph 中灯光组件的基类。依赖：实体上的 transform_component 决定灯的位置。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| CastShadows | ?logic | 此灯是否投射阴影。 |\n| ColorFilter | ?color | 设置灯的滤色颜色：相当于放在光源前的彩色滤镜。注意这会改变灯的有效强度。取值范围 0~1（归一化）。 |\n| DiffuseScale | ?float | 漫反射系数。除 1.0 外的值都不符合物理；0.0 表示此灯无漫反射贡献。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| Illuminance | ?float | 照射到表面的光强度，单位勒克斯（Lux，流明/平方米）。 |\n| SourceAngleDegrees | ?float | 光源张角（度），亦称角直径。默认 0.5357，即太阳的张角。 |\n| SpecularScale | ?float | 高光系数。可用于艺术化地去除高光（模拟偏振滤镜或修图）。除 1.0 外都不符合物理；0.0 表示此灯无高光贡献。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| Disable | 禁用此灯的渲染。 |\n| Enable | 启用此灯的渲染。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/light_component.md": "---\nname: light_component\nslug: versedotorg/scenegraph/light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/light_component\nkind: class\nmodule: /Verse. |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/mesh_component.md": "---\nname: mesh_component\nslug: versedotorg/scenegraph/mesh_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/mesh_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# mesh_component class <S>\n\n> Used to render a mesh at the location of this entity. A mesh is a set of polygons that can be used to represent shapes in the world such as:\n> - foliage and terrain decorations\n> - movers (for example, doors and lifts)\n> - procedurally created buildings\n> Dependencies:\n> - transform_component on the entity positions the mesh.\n> 在实体位置渲染网格。网格是一组多边形，可用于表现世界中的形状，如植被、地形装饰、建筑与道具等。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n\n\n## Exposed Interfaces\n\n此\u0001 暴露以下接口：\n| Name | Description |\n| enableable | 由「实例可被启用/禁用」的类实现。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Collidable | ?logic | 启用/禁用此网格的碰撞。启用后网格可能在物理模拟中发生碰撞。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| EntityEnteredEvent | unknown | 每 tick 开始时，当其他实体首次与该实体重叠时触发。 |\n| EntityExitedEvent | unknown | 每 tick 开始时，当其他实体不再与该实体重叠时触发。 |\n| Queryable | ?logic | 启用/禁用对此网格的空间查询。禁用后 EntityEnteredEvent/EntityExitedEvent 也会失效。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n| Visible | ?logic | 启用/禁用此网格的可见性。 |\n\n### Functions\n| Function Name | Description |\n| Disable | 禁用此网格的渲染。 |\n| Enable | 启用此网格的渲染。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/particle_system_component.md": "---\nname: particle_system_component\nslug: versedotorg/scenegraph/particle_system_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/particle_system_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: A\ndepth: full\nstatus: done\n---\n\n# particle_system_component class <A>\n\n> Used to spawn a particle_system at the location of this entity. The particle_system will simulate while the particle_system_component is in the scene.\n> Dependencies:\n> - transform_component on the entity positions the particle_system.\n> 在实体位置生成 particle_system；组件在场景中期间粒子系统持续模拟。依赖：实体上的 transform_component。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n\n\n## Exposed Interfaces\n\n此\u0001 暴露以下接口：\n| Name | Description |\n| enableable | 由「实例可被启用/禁用」的类实现。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| AutoPlay | ?logic | 控制粒子系统组件是在加入场景时自动播放模拟，还是在从禁用变为启用时播放。 |\n| Enabled | ?logic | 控制粒子系统组件是否以启用状态开始。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| Disable | 禁用此粒子系统的模拟与渲染。 |\n| Enable | 启用此粒子系统的模拟与渲染。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| Play |  |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| Stop |  |\n", "01_Verse.org/040_SceneGraph/possessable_component.md": "---\nname: possessable_component\nslug: versedotorg/scenegraph/possessable_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/possessable_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# possessable_component class <B>\n\n> Marks an entity that can be possessed by an agent.\n> 标记可被代理（agent）附身（possess）的实体。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Agent | ??agent | 此实体当前被哪个代理附身。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation |  |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/rect_light_component.md": "---\nname: rect_light_component\nslug: versedotorg/scenegraph/rect_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/rect_light_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# rect_light_component class <B>\n\n> A rect_light_component emits light into the scene from a rectangular plane with a specified width and height. You can use these to simulate any kind of light sources that have rectangular areas, such as televisions or monitor screens, overhead lighting fixtures, or wall sconces.\n> 矩形面光灯：从指定宽高的矩形平面向场景发光，可用于模拟各类面光源。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| light_component | SceneGraph 中灯光组件的基类。依赖：实体上的 transform_component 决定灯的位置。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| AttenuationRadius | ??float | 灯光可见影响范围的边界（厘米）。这种钳制不符合物理但对性能很重要——灯越大开销越高。光衰减基于平方反比；衰减半径末端有平滑因子把光贡献淡出到 0，避免硬截断。 |\n| BarnDoorAngleDegrees | ?float | 矩形光源上挡光板（barn door）的角度（度），钳制在 0.0~90.0。 |\n| BarnDoorLength | ?float | 矩形光源挡光板的长度（厘米）。 |\n| CastShadows | ?logic | 此灯是否投射阴影。 |\n| ColorFilter | ?color | 设置灯的滤色颜色：相当于放在光源前的彩色滤镜。注意这会改变灯的有效强度。取值范围 0~1（归一化）。 |\n| DiffuseScale | ?float | 漫反射系数。除 1.0 外的值都不符合物理；0.0 表示此灯无漫反射贡献。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| Intensity | ?float | 以国际单位坎德拉（Candela）设置可见光发光强度。在 ColorFilter 之前指定（滤镜会在强度计算后乘到各颜色分量上，可能改变灯的有效强度）。 |\n| SourceHeight | ?float | 矩形光源的高度（厘米）。注意：光源形状与投射阴影的几何相交可能产生阴影瑕疵。 |\n| SourceWidth | ?float | 矩形光源的宽度（厘米）。注意：光源形状与投射阴影的几何相交可能产生阴影瑕疵。 |\n| SpecularScale | ?float | 高光系数。可用于艺术化地去除高光（模拟偏振滤镜或修图）。除 1.0 外都不符合物理；0.0 表示此灯无高光贡献。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| Disable | 禁用此灯的渲染。 |\n| Enable | 启用此灯的渲染。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/sound_component.md": "--- 模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| Play | 播放音效资产。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| Stop | 停止音效资产。 |\n", "01_Verse.org/040_SceneGraph/sphere_light_component.md": "---\nname: sphere_light_component\nslug: versedotorg/scenegraph/sphere_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/sphere_light_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# sphere_light_component class <B>\n\n> A sphere_light_component emits light in all directions into the scene from a spherical source shape with a specified radius. A radius of 0 makes it a point light. You can use these to simulate any kind of light sources that emit in all directions, such as a light bulb.\n> 球形灯：从指定半径的球形光源向四周发光；半径为 0 时为点光源。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| light_component | SceneGraph 中灯光组件的基类。依赖：实体上的 transform_component 决定灯的位置。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| AttenuationRadius | ??float | 灯光可见影响范围的边界（厘米）。这种钳制不符合物理但对性能很重要——灯越大开销越高。光衰减基于平方反比；衰减半径末端有平滑因子把光贡献淡出到 0，避免硬截断。 |\n| CastShadows | ?logic | 此灯是否投射阴影。 |\n| ColorFilter | ?color | 设置灯的滤色颜色：相当于放在光源前的彩色滤镜。注意这会改变灯的有效强度。取值范围 0~1（归一化）。 |\n| DiffuseScale | ?float | 漫反射系数。除 1.0 外的值都不符合物理；0.0 表示此灯无漫反射贡献。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| Intensity | ?float | 以国际单位坎德拉（Candela）设置可见光发光强度。在 ColorFilter 之前指定（滤镜会在强度计算后乘到各颜色分量上，可能改变灯的有效强度）。 |\n| SourceRadius | ?float | 光源形状的半径（厘米）。注意：光源形状与投射阴影的几何相交可能产生阴影瑕疵。 |\n| SpecularScale | ?float | 高光系数。可用于艺术化地去除高光（模拟偏振滤镜或修图）。除 1.0 外都不符合物理；0.0 表示此灯无高光贡献。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| Disable | 禁用此灯的渲染。 |\n| Enable | 启用此灯的渲染。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/spot_light_component.md": "---\nname: spot_light_component\nslug: versedotorg/scenegraph/spot_light_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/spot_light_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# spot_light_component class <B>\n\n> A spot_light_component emits light from a single point in a cone shape. The shape of the light is defined by two cones: the InnerConeAngleDegrees and OuterConeAngleDegrees. Within the InnerConeAngleDegrees the light achieves full brightness. As you go from the extent of the inner radius to the extents of the OuterConeAngleDegrees a falloff takes place, creating a penumbra, or softening around the spot_light_component's disc of illumination. The Radius of the light defines the length of the cones. More simply, this will work like a flash light or stage can light.\n> 聚光灯：从单点按锥形发光；锥形由内锥角（InnerConeAngleDegrees）与外锥角（OuterConeAngleDegrees）定义。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n| light_component | SceneGraph 中灯光组件的基类。依赖：实体上的 transform_component 决定灯的位置。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| AttenuationRadius | ??float | 灯光可见影响范围的边界（厘米）。这种钳制不符合物理但对性能很重要——灯越大开销越高。光衰减基于平方反比；衰减半径末端有平滑因子把光贡献淡出到 0，避免硬截断。 |\n| CastShadows | ?logic | 此灯是否投射阴影。 |\n| ColorFilter | ?color | 设置灯的滤色颜色：相当于放在光源前的彩色滤镜。注意这会改变灯的有效强度。取值范围 0~1（归一化）。 |\n| DiffuseScale | ?float | 漫反射系数。除 1.0 外的值都不符合物理；0.0 表示此灯无漫反射贡献。 |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| InnerConeAngleDegrees | ?float | 灯的内锥角（度），钳制在 0.0~80.0。 |\n| Intensity | ?float | 以国际单位坎德拉（Candela）设置可见光发光强度。在 ColorFilter 之前指定（滤镜会在强度计算后乘到各颜色分量上，可能改变灯的有效强度）。 |\n| OuterConeAngleDegrees | ?float | 灯的外锥角（度），钳制在 1.0~80.0。 |\n| SourceRadius | ?float | 光源形状的半径（厘米）。注意：光源形状与投射阴影的几何相交可能产生阴影瑕疵。 |\n| SpecularScale | ?float | 高光系数。可用于艺术化地去除高光（模拟偏振滤镜或修图）。除 1.0 外都不符合物理；0.0 表示此灯无高光贡献。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| Disable | 禁用此灯的渲染。 |\n| Enable | 启用此灯的渲染。 |\n| IsEnabled | 组件处于启用状态则成功，禁用则失败。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/float_range.md": "---\nname: float_range\nslug: versedotorg/scenegraph/float_range\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/float_range\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# float_range struct <B>\n\n> A range with a minimum and maximum value. For a value to fall inside of this range, the min value must be less than or equal to the max value.\n> 带最小值与最大值的范围；值要落在范围内须满足 min ≤ max。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Minimum | float |  |\n| Maximum | float |  |\n", "01_Verse.org/040_SceneGraph/component.md": "---\nname: component\nslug: versedotorg/scenegraph/component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/component\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# component class <S>\n\n> Base class for authoring logic and data in the SceneGraph. Using components you can author re-usable building blocks of logic and data which can then be added to entities in the scene.\n> 在 SceneGraph 中编写逻辑与数据的基类。通过组件，你可以创作可复用的逻辑与数据构件，然后把它们添加到场景中的实体上。\n>\n> Components are a very low level building block which can be used in many ways. For example:\n> 组件是非常底层的构件，用法很多，例如：\n>\n> - Exposing engine level concepts like mesh or sound\n>   暴露网格、声音等引擎级概念\n> - Adding gameplay capabilities like damage or interaction\n>   添加伤害、交互等玩法能力\n> - Storing an inventory for a character in the game\n>   为游戏中的角色存储物品栏\n>\n> As components are generic there is no specific way that they must be used. It is up to the needs of your experience if you use one big game component or if you break up logic into many small components.\n> 组件是通用的，没有强制的使用方式。用一个大的\"游戏组件\"还是把逻辑拆成许多小组件，由你的体验需求决定。\n\nClasses deriving from component must also specify `<final_super>` to be added to entities. This ensures the class will always derive directly from component. Further subclassing of the initial derived component is allowed and does not require specifying `<final_super>` on the derived classes.\n派生自 component 的类还必须指定 `<final_super>` 才能被添加到实体。这保证该类永远直接派生自 component。在最初派生的组件之上继续派生子类是允许的，且不需要再标 `<final_super>`。\n\nOnly one instance of a component from each subclass group can be added to an entity at a time. For example, given this group of components, only one light_component can exist on a single entity. To create multiple lights you should use multiple entities.\n`light_component := class(component){} capsule_light_component := class(light_component){} directional_light_component := class(light_component){} spot_light_component := class(light_component){} sphere_light_component := class(light_component){} rect_light_component := class(light_component){}`\n同一子类组中的组件，同一时刻在一个实体上只能有一个实例。例如上面这组组件里，一个实体上只能存在一个 light_component；要创建多盏灯应该使用多个实体。\n\n**Component Lifetime** — Components move through a series of lifetime functions as they are added to entities, added to the scene, and begin running in the simulation. Components should override these methods to perform setup and run their simulation. As a component shuts down it will then move through shutdown version of these functions, giving users the opportunity to clean up any retained state on the component before it is disposed. Lifetime Methods: OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene\n**组件生命周期** —— 组件被添加到实体、加入场景、开始在模拟中运行时，会经过一系列生命周期函数。组件应重写这些方法来完成初始化并运行自己的模拟。组件关闭时会按相反的关停版本走一遍，让你有机会在组件被销毁前清理保留状态。生命周期方法：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\nThis class has both data members and functions.（此类兼有数据成员和函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，可在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回**同一个**实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/SceneGraph }\nusing { /Verse.org/Simulation }\n\n# 自定义组件：每秒数一拍（节拍器示例）\nbeat_component<final_super> := class(component):\n    var Beat:int = 0\n\n    OnSimulate<override>()<suspends>:void =\n        loop:\n            Sleep(1.0)\n            set Beat += 1\n            Print(\"♪ {Beat}\")\n```\n\n## 补充说明\n\n- 派生组件必须加 `<final_super>` 才能挂到实体上（官方导语明示）——这是新组件类最常见的编译错误来源。\n- 生命周期固定顺序：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene；帧回调走 TickEvents。\n- 相关页面：[entity class](entity.md)、[transform_component class](transform_component.md)、[tick_events class](tick_events.md)。\n", "01_Verse.org/040_SceneGraph/entity.md": "---\nname: entity\nslug: versedotorg/scenegraph/entity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# entity class <S>\n\n> Entities are the base object in the SceneGraph.\n> 实体是 SceneGraph 的基础对象。\n>\n> - Objects in experiences are constructed of one or more entities.\n>   体验中的对象由一个或多个实体构成。\n> - Entities are hierarchical. You can query your parent using GetParent and add child entities using AddEntities.\n>   实体是有层级的：可用 GetParent 查询父实体、用 AddEntities 添加子实体。\n> - Behavior is added to entities through components. You can add new components using AddComponents.\n>   行为通过组件（component）添加：用 AddComponents 添加新组件。\n> - The structure and content of entities is dynamic and can be changed at any time through your experience.\n>   实体的结构和内容是动态的，可在体验运行中的任意时刻改变。\n\n**Deriving from entity** — In the SceneGraph system a class that derives from entity is also known as a prefab. Prefabs are useful when you want to spawn/re-use a collection of entities and components many times within your game. Primarily prefabs are authored through the editor, with their Verse classes generated as part of the build into the projects Assets.digest.verse file.\n**派生自 entity** —— 在 SceneGraph 体系中，派生自 entity 的类也被称为预制体（prefab）。当你想在游戏中多次生成/复用一组实体和组件时，预制体非常有用。预制体主要在编辑器中创作，其 Verse 类会在构建时生成到项目的 Assets.digest.verse 文件里。\n\nWhile you can create base prefabs for common game object types like a vehicle or character, we highly recommended that you do not add code directly to the entity class, and instead keep logic in components. Keeping logic and data in components allows you to restructure your prefabs throughout production of your experience, without needing to massively refactor your class structure.\n虽然你可以为载具、角色等常见对象类型创建基础预制体，但官方强烈建议**不要直接在 entity 类里写代码**，而是把逻辑放在组件里。把逻辑和数据放进组件，你在体验制作全程中重构预制体时，就不必大改类结构。\n\n`using { /Verse.org/SceneGraph }`\n\n## Exposed Interfaces\n\nThis class exposes the following interfaces:（此类暴露以下接口：）\n\n| Name | Description |\n|---|---|\n| has_tags | 表示\"可变标签集合\"的接口。 |\n\n## Members\n\nThis class has functions, but no data members.（此类只有函数，没有数据成员。）\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| GetParent | 返回此实体的父实体。父实体掌控其子实体与组件的生命周期——实体从场景移除时，其所有子实体和组件也会一并移除。当前没有父实体时此方法失败。 |\n| RemoveFromParent | 把此实体从父实体移除，用于将实体移出场景。该实体及其子级上的组件会依次走 OnEndSimulation → OnRemovingFromScene。之后可用 NewParent.AddEntities 再加回。 |\n| AddEntities | 把给定的实体添加为子实体。若子实体已有父实体，会先从原父实体移除再加入新父。加入的子实体会沿各自的生命周期方法推进，直到与新父实体的状态一致。 |\n| GetEntities | 返回此实体下属、可从调用方上下文访问的子实体。只取直接子实体；要跨多层查询请改用 Find* 系列查询方法。 |\n| GetComponent | 若 component_type 类型的子组件存在且可从调用方上下文访问，则成功并返回该组件。注意：在 AddedToScene 或 BeginSimulation 阶段调用时，会确保返回的组件已达到对应阶段。若不存在或不可访问则失败。 |\n| GetComponents | 返回此实体下属、可从调用方上下文访问的子组件。 |\n| AddComponents | 把给定的组件添加到实体。若某组件不允许加到该实体，则跳过。注意：在 AddedToScene 或 BeginSimulation 阶段调用时，会确保被加组件已达到对应阶段。组件按以下规则添加：所有组件加入实体的子列表；若该实体在场景中，所有组件的 OnAddedToScene 被调用；若该实体正在模拟，所有组件的 OnBeginSimulation 被调用。 |\n| SendUp | 向此实体发送场景事件并沿层级向上传播：先在本实体的每个组件上调用 SendDown/OnReceive，再对父实体调用 SendUp。任一环节消费该事件即停止传播。有参与者消费则返回 true。 |\n| SendDown | 向此实体发送场景事件并沿层级向下传播：先在本实体的每个组件上调用 SendDown/OnReceive，再对每个子实体调用 SendDown。任一环节消费该事件即停止传播。有参与者消费则返回 true。 |\n| AddTag | 向此实体添加一个标签实例，返回与该实例唯一关联的 tag_key。 |\n| RemoveTag | 移除与 tag_key 关联的标签实例；移除成功则成功，否则失败。 |\n| RemoveAllTags | 移除 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_type 类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| RemoveAllTagsExcept | 移除不属于 tag_types 中任何类型的全部标签实例；至少移除一个则成功，否则失败。 |\n| ContainsTag | 若容器中找到至少一个 tag_type 类型的标签则成功，否则失败。 |\n| ContainsAllTags | 若 tag_types 中有任一类型在容器中找不到则失败，否则成功。注意 tag_types 为空时此调用成功。 |\n| ContainsAnyTag | 若 tag_types 中至少一个类型在容器中找到则成功，否则失败。注意 tag_types 为空时此调用失败。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/SceneGraph }\n\n# 运行时搭一个\"灯杆\"：实体 + 变换组件 + 聚光灯组件\nBuildLamp(Parent:entity):void =\n    Pole := entity{}\n    Pole.AddComponents(array{transform_component{}, spot_light_component{}})\n    Parent.AddEntities(array{Pole})\n```\n\n## 补充说明\n\n- 官方明确：逻辑写进组件、entity 只当容器/预制体壳；组件一旦挂上不能换父，要移动就 RemoveFromParent 后重挂。\n- 场景事件的向上/向下传播靠 SendUp/SendDown，组件侧在 OnReceive 里响应。\n- 相关页面：[component class](component.md)、[transform_component class](transform_component.md)、[agent class](../100_Simulation/agent.md)。\n", "01_Verse.org/040_SceneGraph/entity_prefab.md": "---\nname: entity_prefab\nslug: versedotorg/scenegraph/entity_prefab\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity_prefab\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: A\ndepth: full\nstatus: done\n---\n\n# entity_prefab class <A>\n\n> Reference type to editor defined prefab. Only generated digest code should reference this type.\n> 编辑器定义的预制体（prefab）的引用类型；只有生成的 digest 代码才应引用此类型。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/icon_component.md": "---\nname: icon_component\nslug: versedotorg/scenegraph/icon_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/icon_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# icon_component class <B>\n\n> Component that holds an icon for an entity.\n> 保存实体图标的组件。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n\n\n## Exposed Interfaces\n\n此\u0001 暴露以下接口：\n| Name | Description |\n| has_icon | 提供图标的接口。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| Icon | ?texture |  |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation |  |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation |  |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/entity_origin.md": "---\nname: entity_origin\nslug: versedotorg/scenegraph/entity_origin\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity_origin\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# entity_origin class <B>\n\n> class to provide alternative origin to the 'transform_component' as an entity\n> 为实体提供替代原点（默认为 transform_component）的类。\n\n`using { /Verse.org/SceneGraph }`\n\n## Exposed Interfaces\n\n此\u0001 暴露以下接口：\n| Name | Description |\n| origin | 为实体提供替代原点的接口（默认原点为其父实体），见 transform_component。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Entity | entity |  |\n\n### Functions\n| Function Name | Description |\n| GetTransform |  |\n", "01_Verse.org/040_SceneGraph/rarity.md": "---\nname: rarity\nslug: versedotorg/scenegraph/rarity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/rarity\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# rarity class <B>\n\n> Rarity may be used by gameplay and presentation systems to classify and rank things.\n> 稀有度：供玩法与表现系统对事物进行分类与分级。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Color | color |  |\n", "01_Verse.org/040_SceneGraph/common_rarity.md": "---\nname: common_rarity\nslug: versedotorg/scenegraph/common_rarity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/common_rarity\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# common_rarity class <B>\n\n稀有度：常见（Common）。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| rarity | 稀有度：供玩法与表现系统对事物进行分类与分级。 |\n\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Color | color |  |\n", "01_Verse.or cription |\n| Color | color |  |\n| Color | color |  |\n| Color | color |  |\n| Color | color |  |\n", "01_Verse.org/040_SceneGraph/legendary_rarity.md": "---\nname: legendary_rarity\nslug: versedotorg/scenegraph/legendary_rarity\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/legendary_rarity\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# legendary_rarity class <B>\n\n稀有度：传说（Legendary）。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自以下层级，起点为 \u0001：\n| Name | Description |\n| rarity | 稀有度：供玩法与表现系统对事物进行分类与分级。 |\n| common_rarity |  |\n| uncommon_rarity |  |\n| rare_rarity |  |\n| epic_rarity |  |\n\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Color | color |  |\n| Color | color |  |\n| Color | color |  |\n| Color | color |  |\n| Color | color |  |\n", "01_Verse.org/040_SceneGraph/rarity_component.md": "---\nname: rarity_component\nslug: versedotorg/scenegraph/rarity_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/rarity_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# rarity_component class <B>\n\n> Component that denotes the rarity of an entity.\n> 标注实体稀有度的组件。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| Rarity | ?rarity | 此实体的稀有度；一个实体只能有一个稀有度。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation |  |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation |  |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n", "01_Verse.org/040_SceneGraph/stackable_component.md": "---\nname: stackable_component\nslug: versedotorg/scenegraph/stackable_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/stackable_component\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# stackable_component class <B>\n\n> A component that when attached to an entity allows for it to merge or 'stack' with other entities with compatible components.\n> 挂到实体后，允许其与具有兼容组件的其他实体合并（堆叠）的组件。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\n此类派生自 \u0001。\n| Name | Description |\n| component | 在 SceneGraph 中编写逻辑与数据的基类。通过组件可创作可复用的逻辑与数据构件并添加到场景中的实体上。组件是非常底层的构件：可暴露网格/声音等引擎概念、添加伤害/交互等玩法能力、存储物品栏；用一个大组件还是拆成多个小组件由体验需求决定。派生自 component 的类必须指定 <final_super> 才能添加到实体；同一子类组在同一实体上只能有一个实例。生命周期：OnAddedToScene → OnBeginSimulation → OnSimulate → OnEndSimulation → OnRemovingFromScene。 |\n\n\n## Members\n\n兼有数据成员和函数。\n\n### Data\n| Data Member Name | Type | Description |\n| ChangeMaxStackSizeEvent | unknown |  |\n| ChangeStackSizeEvent | unknown |  |\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| MaxStackSize | ??int | 此组件可容纳的最大数量；未设置则不限。 |\n| StackSize | ?int | 此实体当前堆叠的数量。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| CanMergeInto | 若此实体可合并进目标实体则成功；与自己合并恒失败。注意合并检查应当双向进行！ |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| MergeInto | 尝试把此实体合并进指定实体；无法合并则失败。指定 TargetAmount 时只合并该数量（默认合并整叠）；数量无效则失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation |  |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation |  |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| SetMaxStackSize | 设置此组件的最大堆叠数。NewMaxStackSize 为 false 表示不限；ClampStackSize 为 true 时会把当前堆叠数钳制到新上限。 |\n| SetStackSize | 设置此组件的堆叠数。给定值无效（负数或超过 MaxStackSize）时堆叠数不变。 |\n| Split |  |\n", "01_Verse.org/040_SceneGraph/change_stack_size_result.md": "---\nna 其他实体合并、或被拆分为新实例时使用的预制体。 |\n| StackSize | ?int | 此实体当前堆叠的数量。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n| Function Name | Description |\n| CanMergeInto | 若此实体可合并进目标实体则成功；与自己合并恒失败。 |\n| CanMergeInto | 若此实体可合并进目标实体则成功；与自己合并恒失败。注意合并检查应当双向进行！ |\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| MergeInto | 尝试把此实体合并进指定实体；无法合并则失败。指定 TargetAmount 时只合并该数量（默认合并整叠）；数量无效则失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation |  |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation |  |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回同一个实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n| SetMaxStackSize | 设置此组件的最大堆叠数。NewMaxStackSize 为 false 表示不限；ClampStackSize 为 true 时会把当前堆叠数钳制到新上限。 |\n| SetStackSize | 设置此组件的堆叠数。给定值无效（负数或超过 MaxStackSize）时堆叠数不变。 |\n| Split |  |\n| Split |  |\n", "01_Verse.org/040_SceneGraph/tick_events.md": "---\nname: tick_events\nslug: versedotorg/scenegraph/tick_events\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/tick_events\nkind: class\nmodule: /Verse.org\ngrade: S\ndepth: full\nstatus: placeholder\n---\n\n# tick_events <S>\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/tick_events.html -->\n", "01_Verse.org/040_SceneGraph/transform_component.md": "---\nname: transform_component\nslug: versedotorg/scenegraph/transform_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/transform_component\nkind: class\nmodule: /Verse.org/SceneGraph\ngrade: S\ndepth: full\nstatus: done\n---\n\n# transform_component class <S>\n\n> Stores the transforms for an entity, which are used to position the entity.\n> 存储实体的变换（transform），用于确定实体的位置。\n\n`using { /Verse.org/SceneGraph }`\n\n## Inheritance Hierarchy\n\nThis class is derived from `component`.（本类派生自 component；component 的完整官方描述与生命周期说明见 [component class](component.md)。）\n\n## Members\n\nThis class has both data members and functions.（此类兼有数据成员和函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| Entity | entity | 此组件的父实体。组件构造时必须提供父实体指针；组件不能在父实体之间移动。 |\n| GlobalTransform | ?transform | 实体当前的世界（全局参照）变换。构造时设置的任何值都会被基于 LocalTransform 的计算结果覆盖。 |\n| LocalTransform | ?transform | 相对父实体/原点的局部变换。 |\n| Origin | ??origin | 相对默认父实体的替代原点。 |\n| TickEvents | ?tick_events | 设置 TickEvents.PrePhysics 与 TickEvents.PostPhysics 回调，可在对象物理更新前/后接收逐帧更新。 |\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| IsInScene | 若组件当前在场景中则成功。OnAddedToScene 调用后成功；OnRemovingFromScene 调用后失败。 |\n| IsSimulating | 若组件当前正在模拟则成功。OnBeginSimulation 调用后成功；OnEndSimulation 调用后失败。 |\n| OnAddedToScene | 当组件通过挂到 simulation 实体（或已在场景中的其他实体）之下而被加入场景时调用。该阶段完成后，查询场景中的组件才是有效的。 |\n| OnBeginSimulation | 当组件在场景中开始模拟时调用。用它设置 TickEvent 回调或其他必须保证立即完成的初始化。OnAddedToScene 保证先于 OnBeginSimulation 运行。 |\n| OnEndSimulation | 当组件在场景中结束模拟时调用。体验重置或父实体被移出场景时组件的模拟即结束。缓存的 TickEvents cancelable 应在 OnEndSimulation 中取消；OnSimulate 任务会在 OnEndSimulation 被调用前取消。只有已调用过 OnBeginSimulation 的组件才会收到 OnEndSimulation。 |\n| OnReceive | 响应场景事件。返回 true 表示消费该事件并阻止向下一个实体继续传播。 |\n| OnRemovingFromScene | 当组件即将被移出场景时调用。父实体被移出场景时其上的组件随之移除。只有已调用过 OnAddedToScene 的组件才会收到 OnRemovingFromScene。 |\n| OnSimulate | 当组件在场景中开始模拟时调用。用它为组件添加异步/可挂起的更新逻辑。OnBeginSimulation 保证先于 OnSimulate 运行；OnSimulate 会在 OnEndSimulation 之前被取消。 |\n| RemoveFromEntity | 把组件从实体上移除。被移除的组件会离开场景，且之后只能加回**同一个**实体。流程经过 OnEndSimulation → OnRemovingFromScene。 |\n| SendDown | 向此组件发送场景事件，触发 OnReceive。有参与者消费该事件则返回 true。 |\n\n## 示例\n\n```verse\nusing { /Verse.org/SceneGraph }\nusing { /Verse.org/SpatialMath }\n\n# 读取局部变换：两个 ?transform 字段都是可失败读取\nGetPos(TC:transform_component):void =\n    if (T := TC.LocalTransform?):\n        Print(\"位置 Forward 分量 = {T.Position.Forward}\")\n```\n\n## 补充说明\n\n- 本页函数表**没有** Set 位置/旋转类函数——变换通过 `LocalTransform` 等数据成员读写；`GlobalTransform` 是计算结果，构造时赋值会被覆盖（官方 Data 表明示）。\n- `LocalTransform`/`GlobalTransform`/`Origin` 均为可失败读取（`?`/`??` 类型），必须写在失败上下文里。\n- 相关页面：[component class](component.md)、[vector3 struct](../130_SpatialMath/vector3.md)、[rotation struct](../130_SpatialMath/rotation.md)。\n", "01_Verse.org/040_SceneGraph/execution_listenable.md": "---\nname: execution_listenable\nslug: versedotorg/scenegraph/execution_listenable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/execution_listenable\nkind: class\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# execution_listenable class <B>\n\n> Verse path: /Verse.org/SceneGraph Users to subscribe to, or await on, a DeltaTime based callback from one of the phases in a component's TickEvents object.\n> 订阅或等待组件 TickEvents 各阶段的 DeltaTime 回调。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n没有成员。\n", "01_Verse.org/040_SceneGraph/has_camera_modifier.md": "---\nname: has_camera_modifier\nslug: versedotorg/scenegraph/has_camera_modifier\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/has_camera_modifier\nkind: interface\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# has_camera_modifier interface <B>\n\n> Interface for classes that own a camera modifier stack.\n> 拥有相机修饰符栈的类实现的接口。\n\n`using { /Verse.org/SceneGraph }`\n\n## Members\n\n只有数据成员，没有函数。\n\n### Data\n| Data Member Name | Type | Description |\n| CameraModifiers | unknown |  |\n", "01_Verse.org/040_SceneGraph/easeable.md": "---\nname: easeable\nslug: versedotorg/scenegraph/easeable\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/easeable\nkind: interface\nmodule: /Verse.org/scenegraph\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# easeable interface <C>\n\n用于触发缓动行为的接口。\n", "01_Verse.org/040_SceneGraph/scene_event.md": "---\nname: scene_event\nslug: versedotorg/scenegraph/scene_event\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/scene_event\nkind: interface\nmodule: /Verse.org/scenegraph\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# scene_event interface <C>\n\n可通过场景图发送的事件。\n", "01_Verse.org/040_SceneGraph/origin.md": "---\nname: origin\nslug: versedotorg/scenegraph/origin\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/origin\nkind: interface\nmodule: /Verse.org/scenegraph\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# origin interface <C>\n\n为实体提供替代原点的接口（默认原点为其父实体），见 transform_component。\n", "01_Verse.org/040_SceneGraph/has_merge_rules.md": "---\nname: has_merge_rules\nslug: versedotorg/scenegraph/has_merge_rules\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/has_merge_rules\nkind: interface\nmodule: /Verse.org/scenegraph\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# has_merge_rules interface <C>\n\n想参与实体可合并性检查的组件实现的「合并规则」接口。\n", "01_Verse.org/040_SceneGraph/camera_projection_mode.md": "---\nname: camera_projection_mode\nslug: versedotorg/scenegraph/camera_projection_mode\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/camera_projection_mode\nkind: enum\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# camera_projection_mode enumeration <B>\n\n相机投影模式（正交/透视等）。\n\n`using { /Verse.org/SceneGraph }`\n\n## Enumerators\n\nThe camera_projection_mode 枚举包含以下枚举值：\n| Name | Description |\n| Perspective |  |\n| Orthographic |  |\n", "01_Verse.org/040_SceneGraph/camera_transition_initial_orientation.md": "---\nname: camera_transition_initial_orientation\nslug: versedotorg/scenegraph/camera_transition_initial_orientation\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/camera_transition_initial_orientation\nkind: enum\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# camera_transition_initial_orientation enumeration <B>\n\n> Controls how a camera mode transitions to another\n> 控制相机模式过渡时的初始朝向。\n\n`using { /Verse.org/SceneGraph }`\n\n## Enumerators\n\nThe camera_transition_initial_orientation 枚举包含以下枚举值：\n| Name | Description |\n| PreviousYawPitch |  |\n| PreviousAbsoluteTarget |  |\n| PreviousRelativeTarget |  |\n", "01_Verse.org/040_SceneGraph/entity_streaming_policy.md": "---\nname: entity_streaming_policy\nslug: versedotorg/scenegraph/entity_streaming_policy\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/entity_streaming_policy\nkind: enum\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# entity_streaming_policy enumeration <B>\n\n> Verse path: /Verse.org/SceneGraph Entity client streaming modes\n> 实体的客户端流送模式。\n\n`using { /Verse.org/SceneGraph }`\n\n## Enumerators\n\nThe entity_streaming_policy 枚举包含以下枚举值：\n| Name | Description |\n| Spatial | 实体会被空间化加载。 |\n| NonSpatial | 实体会被非空间化加载。 |\n| Persistent | 实体总是加载。 |\n", "01_Verse.org/040_SceneGraph/children_streaming_policy.md": "---\nname: children_streaming_policy\nslug: versedotorg/scenegraph/children_streaming_policy\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/children_streaming_policy\nkind: enum\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# children_streaming_policy enumeration <B>\n\n> Child entities client streaming modes\n> 子实体的客户端流送模式。\n\n`using { /Verse.org/SceneGraph }`\n\n## Enumerators\n\nThe children_streaming_policy 枚举包含以下枚举值：\n| Name | Description |\n| Atomic | 子实体随父实体原子化加载。 |\n| Discrete | 子实体独立于父实体加载。 |\n", "01_Verse.org/040_SceneGraph/collision_interaction.md": "---\nname: collision_interaction\nslug: versedotorg/scenegraph/collision_interaction\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collision_interaction\nkind: enum\nmodule: /Verse.org/scenegraph\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# collision_interaction enumeration <B>\n\n> Specifies how a collision volume pair should interact. See collision_profile.\n> 指定一对碰撞体积应如何交互，见 collision_profile。\n\n`using { /Verse.org/SceneGraph }`\n\n## Enumerators\n\nThe collision_interaction 枚举包含以下枚举值：\n| Name | Description |\n| Ignore | 该配对不会被 Overlap/Sweep 查询检测到，也不会在物理模拟中碰撞。 |\n| Overlap | 该配对会被 Overlap/Sweep 查询检测到，但不会在物理模拟中碰撞。 |\n| Block | 该配对会被 Overlap/Sweep 查询检测到，并在物理模拟中碰撞。 |\n", "01_Verse.org/040_SceneGraph/010_CollisionChannels/_overview.md": "---\nname: CollisionChannels\nslug: versedotorg/scenegraph/collisionchannels\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collisionchannels\nkind: module\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# CollisionChannels <B>\n\n<!-- 模块总览，待生成（阶段2） -->\n", "01_Verse.org/040_SceneGraph/010_CollisionChannels/stationary.md": "---\nname: stationary\nslug: versedotorg/scenegraph/collisionchannels/stationary\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/scenegraph/collisionchannels/stationary\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# stationary <B>\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/scenegraph/collisionchannels/stationary.html -->\n", "01_Verse.org/040_SceneGraph/010_CollisionChannels/dynamic.md": "---\nname: dynamic\nslug: vers _Verse.org/050_Progression/agent_quest_participant.md": "---\nname: agent_quest_participant\nslug: versedotorg/progression/agent_quest_participant\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/progression/agent_quest_participant\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: placeholder\n---\n\n# agent_quest_participant <B>\n\n<!-- 待生成（阶段2）。官方快照: sources/versedotorg/progression/agent_quest_participant.html -->\n", "01_Verse.org/060_Timeline/_overview.md": "---\nname: Timeline module\nslug: versedotorg/timeline\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/timeline\nkind: module\nmodule: /versedotorg\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# Timeline module <B>\n\n时间线元素：把「时间点」或「时间区间」加入时间轴，驱动按时间发生的玩法。\n\n## Classes and Structs\n\n| Name | Description |\n|---|---|\n| [timeline_element](timeline_element.md) | 可加入时间线的元素的抽象定义，见 timeline_element_point 与 timeline_element_span。 |\n| [timeline_element_point](timeline_element_point.md) | 占据单个时间点的时间线元素。 |\n| [timeline_element_span](timeline_element_span.md) | 跨越一段时间范围的时间线元素。 |\n", "01_Verse.org/060_Timeline/timeline_element.md": "---\nname: timeline_element\nslug: versedotorg/timeline/timeline_element\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/timeline/timeline_element\nkind: class\nmodule: /Verse.org/timeline\ngrade: B\ndepth: brief\nstatus: done\n---\n\n# timeline_element class <B>\n\n> Abstract definition of any element that can be added to a timeline.See timeline_element_point and timeline_element_span.\n> 可加入时间线的元素的抽象定义，见 timeline_element_point 与 timeline_element_span。\n\n`using { /Verse.org/Timeline }`\n\n## Exposed Interfaces\n\n此\u0001 暴露以下接口：\n| Name | Description |\n| cancelable | 由「允许用户取消操作」的类实现：调用 subscribable.Subscribe 传回调会返回一个 cancelable 对象，对其调用 Cancel 即可取消订阅。 |\n\n\n## Members\n\n没有成员。\n", "01_Verse.org/060_Timeline/timeline_element_point.md": "---\nname: timeline_element_point\nslug: versedotorg/timeline/timeline_element_point\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/timeline/timeline_element_point\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: done\n---\n\n> A timeline element that occupies a single point in time.\n> 占据单个时间点的时间线元素。\n\n`using { /Verse.org/Timeline }`\n\n## Inheritance Hierarchy\n\nThis class is derived from `timeline_element`.（此类派生自 timeline_element——可加入时间线的元素的抽象定义，见 timeline_element_point 与 timeline_element_span。）\n\n## Members\n\nThis class has both data members and functions.（此类兼有数据成员和函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| Time | ?float | 此时间点的时间。可为 ±Inf；NaN 永远不会被更新或查询。 |\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| SetTime | 设置此时间点的时间。 |\n\n## 补充说明\n\n- 与 [timeline_element_span class](timeline_element_span.md)（区间元素）相对；两者都派生自 [timeline_element class](timeline_element.md)。\n", "01_Verse.org/060_Timeline/timeline_element_span.md": "---\nname: timeline_element_span\nslug: versedotorg/timeline/timeline_element_span\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/timeline/timeline_element_span\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth: brief\nstatus: done\n---\n\n> A timeline element that spans a range of time.\n> 跨越一段时间范围的时间线元素。\n\n`using { /Verse.org/Timeline }`\n\n## Inheritance Hierarchy\n\nThis class is derived from `timeline_element`.（此类派生自 timeline_element——可加入时间线的元素的抽象定义。）\n\n## Members\n\nThis class has both data members and functions.（此类兼有数据成员和函数。）\n\n### Data\n\n| Data Member Name | Type | Description |\n|---|---|---|\n| BeginTime | ?float | 区间开始的时间。默认 0.0；须非 NaN 且 ≤ EndTime 才会被更新或查询；可为 ±Inf。 |\n| EndTime | ?float | 区间结束的时间。默认 Inf；须非 NaN 且 ≥ BeginTime 才会被更新或查询；可为 ±Inf。 |\n\n### Functions\n\n| Function Name | Description |\n|---|---|\n| SetRange | 通过赋值起止时间来修改时间线的范围。 |\n\n## 相关页面\n\n- [timeline_element_point class](timeline_element_point.md) / [timeline_element class](timeline_element.md)\n", "01_Verse.org/070_Presentation/_overview.md": "---\nname: Presentation module\nslug: versedotorg/presentation\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/presentation\nkind: module\nmodule: /versedotorg\ngrade: C\ndepth: brief\nstatus: done\n---\n\n# Presentation module <C>\n\n实体展示信息：为实体提供名称/描述等呈现细节。\n\n## Classes and Structs\n\n| Name | Description |\n|---|---|\n| [description_component](description_component.md) | 保存实体呈现细节（如名称与描述）的组件。 |\n\n## Interfaces\n\n| Name | Description |\n|---|---|\n| [has_description](has_description.md) | 提供描述性名称或文本的接口。 |\n", "01_Verse.org/070_Presentation/description_component.md": "---\nname: description_component\nslug: versedotorg/presentation/description_component\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/presentation/description_component\nkind: class\nmodule: /Verse.org/presentation\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# description_component class <C>\n\n保存实体呈现细节（如名称与描述）的组件。\n", "01_Verse.org/070_Presentation/has_description.md": "---\nname: has_description\nslug: versedotorg/presentation/has_description\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/presentation/has_description\nkind: interface\nmodule: /Verse.org/presentation\ngrade: C\ndepth: oneliner\nstatus: done\n---\n\n# has_description interface <C>\n\n提供描述性名称或文本的接口。\n", "01_Verse.org/080_Input/_overview.md": "---\nname: Input\nslug: versedotorg/input\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/input\nkind: module\nmodule: /Verse.org\ngrade: A\ndepth: brief\nstatus: placeholder\n---\n\n# Input <A>\n\n<!-- 模块总览，待生成（阶段2） -->\n", "01_Verse.org/080_Input/available_input_devices.md": "---\nname: available_input_devices\nslug: versedotorg/input/available_input_devices\nurl: https://dev.epicgames.com/documentation/fortnite/verse-api/versedotorg/input/available_input_devices\nkind: class\nmodule: /Verse.org\ngrade: B\ndepth:
